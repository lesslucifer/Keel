    today: "No Bash sandbox: the launcher starts it with --setting-sources local and a --settings holding only hooks (scripts/router-worker.sh, watchdog mode). Tools SendMessage and CronCreate only; the guard with watchdog_to admits only CronCreate of the */5 tick and a SendMessage to its router. Its facts hook runs the launcher unsandboxed and checks each worktree's .git link before any git there (linked_ok)."
