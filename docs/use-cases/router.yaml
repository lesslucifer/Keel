# Keel use cases: the router. Data only, no page (DEC-69). Contract level: trigger, expected, failure.
# Ids are never reused. Index: use-cases-index.yaml.
title: "the router"
about: >-
  The standard itself is the `keel-router` skill (`skills/keel-router/`); this file holds only the contract. Why
  the router is shaped this way: decisions/router.html (DEC-30 – DEC-37, DEC-39, DEC-42 – DEC-46, DEC-48,
  DEC-55, DEC-56, DEC-58, DEC-61 – DEC-63).
areas:
  - area: UC-ROUTE
    title: "routing"
    use-cases:
      - id: UC-ROUTE-1
        title: "the router coordinates, the owner acts"
        trigger: >-
          A router session coordinating worker sessions on a Keel project.
        expected: >-
          It verifies workers' claims against the repo, stages the owner's commands (sign-off, merge, push, tag) for the
          owner to run, and never signs (`keel mr`), merges or pushes for the owner. In the turn it stages an owner
          action it arms a read-only watch for it in the background (Keel: `scripts/router-watch.sh
          commit|signed|merged|pushed|tagged <args>`, DEC-30), so it learns the action landed
          without the owner saying "done". The watch checks at once and then polls until the state holds. It wakes the
          router with one event line plus what landed: the commits with their `Reviewed-By`, the landed paths against
          the staged set (`COMMITTED-PARTIAL` when one is missing), the `mr` note, and whether a merge was `no-ff` or
          `ff`. Otherwise it ends with `REWRITTEN`, `DELETED`, `TAGGED-MISMATCH`, `TIMEOUT` (before the 2 h background
          ceiling; the router re-arms) or `UNREACHABLE`. Detail lines are untrusted data. On GitHub (Keel) the router
          bot also acts for it: `scripts/router-gh.sh push` pushes a `wu/` or `epic/` branch (never `main` or a tag)
          once a WU tip carries its `test/v1` note or an epic passes the range walk, `pr-open` opens a draft pull
          request into the branch's epic or `main`, `pr-ready` marks it ready and asks the owner for a review, `post`
          posts a file a worker wrote, `sync` brings a merge made on GitHub back to the local epic branch, and `issue`
          keeps the epic's tracking issue (DEC-61). Its GitHub watch kinds, `scripts/router-gh-watch.sh
          review|comment|merged|checks`, wake it on a commander's review, comment, merge or finished checks
          (UC-ROUTE-7). The git watch kinds stay for the local flow. It talks to its workers by `SendMessage` to a named
          session, both ways (DEC-42): a worker is a long-running background session that reports to the router by
          message when it finishes, takes a follow-up task as the router's next message, and stays alive until the
          router closes it (`stop`, DEC-44); a watchdog worker messages the router every 5 minutes with one sentence per
          live worker, done and stuck first (DEC-45), so the router itself runs no loop or timer. At the moment of
          action it runs the skill's short checklists (`references/checklists.md`): START before the first tool call of
          a session, WAKE on every wake, DISPATCH before every spawn or send, each row naming its trigger and what
          skipping it cost. Read tools serve dispatch, verification and relaying, never deriving the substance, and
          never a document a worker was just sent to read. A turn never closes with a live worker and no wake armed, and
          a call denied since the last message is named with its exact command, never retried and never handed to a
          worker. Tests: `tests/suite/router.rs` `watch_*`; `tests/suite/init.rs`
          `router_ships_the_moment_of_action_checklists` (the three lists, their triggers, and a row for each of the
          four failures the DSH guard plugin will enforce); the guard's `SendMessage` tests on the captured real
          payloads; delivery between real sessions is live evidence only (W7). On GitHub: The router skills arm the
          GitHub watches and the bot's shapes (W2). Only the owner merges: GitHub merges a WU's or epic's pull request
          on his approval (auto-merge under `[github] merge_on_approve`), and he merges a task's pull request himself;
          the router and its workers never merge a pull request and never approve one. The router learns a merge from
          `router-gh-watch.sh merged` and brings it back with `router-gh.sh sync <epic/E|main|wu/E/slug>`; a WU branch
          with commits of its own prints `state=diverged`, moves nothing, and its worker merges the fetched ref. Tasks
          (DEC-67): when a piece of a WU waits on something outside the worker's hands, the router starts a worker on
          `wu/<E>/<wu>_<task>` (`router-worker.sh worktree add` cuts it off the WU branch); the bot pushes it with no
          notes, opens its pull request into the WU branch only and never turns on auto-merge for it. The router acts on
          a task's MERGED only when it names a commander and the synced sha equals the merge's; otherwise it stops and
          tells the owner. Conflicts: `router-gh-watch.sh conflict <n>` wakes the router once GitHub says an open pull
          request cannot merge; the router sends it to the branch's worker, who merges the target in (never a rebase),
          re-gates a WU and has the bot push. When a review did not pass, the router tells the owner plainly; his
          approval decides (UC-MR-3). Tests: `tests/suite/router_gh.rs`, `tests/suite/router_gh_watch.rs`,
          `tests/suite/router.rs`.
        failure: >-
          The router runs `keel mr` itself, merges or pushes; or relays a worker claim it did not check; or a watch
          fires before the owner acted, misses a partial commit or an `ff` merge, or polls past its timeout; or a router
          that cannot message a live worker or receive its reply; or a router that polls or sleeps instead of waiting
          for messages; or a router that reads a plan, a config or a backlog row to do a running worker's job, closes a
          turn with a live worker and nothing armed, or leaves a denied call unnamed; or the router bot pushes `main`, a
          tag, or a WU tip with no test note of its own, or opens a pull request for a branch it did not push.
      - id: UC-ROUTE-2
        title: "epic branch first"
        trigger: >-
          A router starts a new epic.
        expected: >-
          Its first action, before any plan doc or WU, is creating `<epic_prefix><id>` from the current main tip in a
          worktree of its own (prefixes from `.keel/config.toml` `[branches]`; Keel: the router runs
          `scripts/router-worker.sh worktree add epic/<id>`, DEC-46). No worker pushes: the router stages `git push -u
          origin <epic branch>` for the owner and arms the `pushed` watch; plan work starts once the branch exists
          locally. All plan and WU work lands there; WUs branch as `<wu_prefix><id>/<slug>` and merge back `--no-ff`;
          main receives only the closed epic (DEC-12).
        failure: >-
          A plan drafted before the branch exists; a worker pushing; any WU or T3 doc of an unclosed epic reaching main;
          an epic retrofitted onto its branch afterwards.
      - id: UC-ROUTE-3
        title: "substance comes from workers"
        trigger: >-
          The router relays or publishes something substantive: a "done" claim, doc prose, a comment reply.
        expected: >-
          It traces to a worker that derived it from the current code, tests or artifacts. Worker briefs are dispatch
          mechanics, not substance: the router writes them itself (DEC-32), never pasting untrusted report text into
          one.
        failure: >-
          The router drafts content for a worker to paste, or a mechanics-only worker posts content.
      - id: UC-ROUTE-4
        title: "the router skill ships complete"
        trigger: >-
          `keel init` in any repo.
        expected: >-
          Writes `.claude/skills/keel-router/` (SKILL.md and every reference it names, no orphan: brief skeleton,
          commands, review checklists, lessons, messages, worker ops, project-router template) byte-identical to the
          embedded copy, plus the `project-router` template. The shipped skill carries no Trawler-only token outside
          lineage and no Keel-only state (its branches, commits, launcher path); every `keel` command it names exists.
          Enforcement and the launcher are not shipped: a project commits its own (DEC-30). Test: `tests/suite/init.rs`
          `router_skill_is_complete`, `embedding_is_complete_and_prefixed`.
        failure: >-
          A named reference missing or an orphan shipped; a stale Keel fact or Trawler token in an adopter's copy.
      - id: UC-ROUTE-5
        title: "worker modes, each with a full recipe"
        trigger: >-
          The router needs a worker.
        expected: >-
          Native background sessions (`claude --bg`) through the project's launcher are the standard (DEC-44): spawn,
          report, follow-up and retire recipes in the skill's `worker-ops.md`. In-session `Agent` subagents only where
          the project does not enforce the router posture. Keel's launcher `scripts/router-worker.sh` has these modes
          (DEC-46). `spawn`: validated arguments, a fixed prompt and flags, `--agent worker` always; it refuses the
          router's own checkout and the main checkout, a non-`.md`, symlinked or out-of-dir brief, an unregistered
          worktree, a worktree without `.claude/agents/worker.md` (naming the fix) or on a detached HEAD, a name `claude
          agents --json` already lists, and a name whose launch holds `.router/runs/.lock-<name>`; it starts the worker
          with `--setting-sources project,local`, `--strict-mcp-config` and Claude Code's Bash sandbox in `--settings`
          (writes: the worktree but its `.git` link and settings files, the git dir but its config and hooks, and in
          `~/.cargo` only the cache cargo writes, never its `env`, `config`, `credentials` or `bin`; five hosts, widened
          by a permission decision (the owner's answer to a `sandbox request` prompt under `acceptEdits`, a per-call
          review under `auto`) or by the worktree's own local settings (DEC-37)), with no inherited `GIT_*`; a
          `PreToolUse` hook, the worker file guard `scripts/router-file-guard.sh`, lets the file tools edit only the
          worktree (never its `.git` or its two settings files) and read neither `~/.ssh` nor `~/.claude/channels`,
          judged on the resolved path; the shell writes only the parts of `~/.cargo` cargo writes, never the worktree's
          `.git` link, its settings files or its admin dir's link files; `spawn`, `stop`, `worktree remove` and the
          watchdog's `facts` run no git in a worktree whose `.git` link a worker changed, and their own git reads there
          run with the fsmonitor hook off (`git worktree remove` itself does not: E-WMODE round 3, waived, backlog
          e-router-v2 R38); `spawn` refuses a worktree inside the router's or the main checkout, a router checkout
          inside the worktree, and a path holding a quote, a backslash or a newline (DEC-37); `--review` starts the
          review worker, the only one granted the `cr` note and denied every edit tool, `git add` and `git commit`; it
          copies the brief into the worker's worktree and prints its sha256 and the session's id; a start the CLI
          refuses is `DEAD` with the CLI's text. A stopped worker is never revived: there is no `resume` (a plain `--bg
          --resume` drops every launch flag). `stop` closes this repository's idle worker by id (`claude stop`, then
          `claude rm`), refuses a busy one, removes that session's brief copies and reports `drift=<branch>` when its
          worktree left the spawn's branch. `worktree add <epic/E | wu/E/slug>` cuts the branch off `main` or `epic/E`
          at `<main checkout>-<branch, / as ->`; `worktree remove <branch>` takes only a clean worktree whose branch is
          merged into its base, with no session in it, and keeps the branch. The worker reports by `SendMessage` to the
          router its brief names and stays alive; a follow-up task is the router's message; a `notify_when_idle`
          subscription is an optional extra. A watchdog (DEC-45) reports every live worker to the router every 5
          minutes: `watchdog start|stop <router-name>` runs one background session `watchdog-<router-name>` on `[router]
          watchdog_model` with local settings only and an inline agent whose only tools are `SendMessage` and
          `CronCreate`; its prompt hook `watchdog facts` marks an idle worker `DONE` and a blocked one, or one busy with
          a transcript quiet 15 minutes, `STUCK`, keeps its whole output under 9000 bytes, and stops the watchdog once
          the router is gone; `spawn` refuses `watchdog` names. Every worker is granted the gate commands (`cargo
          build|test|check|clippy|fmt`, `keel preflight|verify-doc|verify-dod|notes write|lint|check`) and denied `keel
          mr`, `cargo run` and the rest of DEC-46's deny list (git config, notes, stash, switch, checkout, push, `-C`,
          the launcher, `claude`, …), on its command line only (DEC-37); `spawn` starts the worker in `[router]
          worker_permission_mode` as committed at the router checkout's HEAD (`plan`, `acceptEdits` or `auto`,
          `acceptEdits` when absent, Keel: `auto`, DEC-37), takes an optional `--permission-mode` that may only narrow
          it (`plan` < `acceptEdits` < `auto`) and an optional `--effort`, and records the mode and the effort in the
          run dir and on the `RUNNING` line. Tests: `tests/suite/router.rs`
          `launcher_refuses_unsafe_targets_and_runs_one_worker_per_name`,
          `launcher_starts_a_worker_as_a_background_session_with_the_grant_and_a_validated_mode`,
          `worker_permission_mode_comes_from_the_committed_policy`,
          `a_permission_mode_outside_the_accepted_set_or_wider_than_the_policy_is_refused_before_any_start`,
          `worker_file_guard_lets_the_file_tools_edit_only_the_worktree_and_read_neither_ssh_nor_channels`,
          `launcher_passes_every_worker_the_file_guard_and_refuses_worktrees_it_cannot_bound`,
          `a_worktree_whose_git_link_was_changed_is_never_run_git_in`,
          `stop_stops_then_removes_this_repositorys_idle_worker_by_id`,
          `a_start_the_cli_refuses_is_reported_dead_with_its_reason`, the `watchdog_*` and `fact_block_*` tests; end to
          end, through the settings-wired guard with every launcher call under `GIT_*` naming a decoy repository
          (worktree add of an epic and a WU, watchdog start and its tick, spawn in plan mode, the router's messages,
          stop, a `--review` worker, a sign-off forged as the worker refused at the merge, worktree remove, watchdog
          stop): `epic_e2e_router_drives_a_granted_worker_in_a_seeded_worktree_to_its_end`. Outside every test, live
          evidence only: that Claude Code enforces the grant and mode it is given and delivers a worker's report to an
          idle router, and that it accepts `--permission-mode auto` (the router's first spawn after E-WMODE's merge).
          Plan mode was run live once (2026-11-12, Claude Code 2.1.288, DEC-37): the worker changed nothing and reported
          by message, because the model obeyed plan mode; the harness's own block was not exercised. On DSH: A worker is
          the host session `worker_spawn` starts with the worktree as its workspace and the brief as its prompt
          (UC-DSH-3, DEC-55): one per worktree, its directory never changing, and a subagent is not a worker because it
          inherits the router's directory. A follow-up is one `worker_send`. The report is a short post to the project's
          inbox (`sh <inbox> post <name> REPORT …`, Keel: `scripts/router-inbox.sh`, DEC-58): the router's one armed
          watcher prints it within a poll and `consume <id>` acks it; no reminder, schedule or loop delivers a report,
          and the router never posts. The transcript, read with `worker_output` at each wake and before each ask, stays
          the evidence, and where the project ships no inbox script it is the report alone. Tests:
          `tests/suite/router_inbox.rs` (the script through its process boundary, one temp inbox per case);
          `worker_list`, `worker_status` and `worker_stop` are the fleet view, the state and the end. The persona is the
          worktree's `AGENTS.md`, the skills through the shared root and the brief. The skill's transport table names
          these tools, is dated, and says to re-check the host's tool list. On every host a dispatch first writes the
          brief file `<checkout>/.router/briefs/<name>.md` and reads it back; on DSH the prompt is that same text, so a
          restart still finds what was dispatched. A Claude Code worker cannot post (its sandbox does not reach the
          inbox, DEC-46) and reports by `SendMessage`.
        failure: >-
          A worker started in the router's checkout or main, without its persona, with the user's settings, an MCP
          server, an inherited `GIT_*` or outside the sandbox; a stopped worker revived; a brief copy outliving its
          session; the author writing its own `cr` note; a worktree removed dirty, unmerged or with a session in it; two
          live runs of one name; a report read from a previous run; a worker refused its own gate commands; a worker
          allowed `keel mr`; any mode other than `plan`/`acceptEdits`/`auto` (`bypassPermissions`, `dontAsk`, `default`,
          a missing value, an unknown option), committed or asked for, reaching the worker's `claude`; a worker started
          with no option in a mode other than the committed policy's, or with one in a mode wider than it; a worker
          whose file tools may edit outside its worktree, its `.git` or its settings files, or read `~/.ssh`; a worker
          whose shell may write `~/.cargo/env`, `config` or `bin`; any git call, the fsmonitor hook's above all, in a
          worktree whose `.git` link a worker changed; an uncommitted config edit changing the mode; the grant reaching
          the router; a worker that hangs alive, or goes idle without reporting, going unnoticed past a watchdog tick; a
          busy worker read as stuck before 15 quiet minutes; a watchdog report too large to reach its model whole; a
          watchdog looped by the project's hooks.
      - id: UC-ROUTE-6
        title: "the router posture is enforced, fail-closed"
        trigger: >-
          Any tool call by a session whose agent type is `router` in a checkout that enforces the posture (Keel:
          `"agent": "router"` in `.claude/settings.json`).
        expected: >-
          One `PreToolUse` guard on every tool (Keel: `scripts/router-guard.jq`) allows only the tools in the router's
          agent file (no `Agent`, `Edit`, `Monitor`), the inline keel skills, `ListAgents`, `SendMessage` to any named
          session (DEC-42), `Write` to `<cwd>/.router/briefs/<name>.md`, and Bash commands of plain words matching the
          whitelist (read-only git, gh with named query flags only, ps, the launcher's shapes: spawn, stop, `worktree
          add|remove <epic/E or wu/E/slug>` and `watchdog start|stop <router-name>`, the five `router-watch.sh` kinds,
          the owner sender's three plain shapes (`scripts/notify-owner.py --send|--dry-run|--check`) the inbox's
          `init|status|watch <seconds>|consume <id>`, never `post` (DEC-58), the router bot's `scripts/router-gh.sh push
          <wu/E/slug|epic/E>`, `pr-open <branch> [--base main|epic/E]`, `pr-ready <n>`, `post <n> <body-name>`, `sync
          <epic/E>` and `issue <branch>`, and the GitHub watch's `scripts/router-gh-watch.sh review|comment <n> [since
          <id>|since latest]` and `merged|checks <n>` (DEC-61, DEC-62), each word validated so none starts with `-`);
          workers are denied both GitHub scripts and cannot read the App's key directory; `Write` also to the owner body
          `<cwd>/.router/notify/owner.md`. A guard error denies. Other agent types pass untouched. Run with `--arg
          watchdog_to <router-name>` (the watchdog session's only tool hook, DEC-45) it allows only `CronCreate` and a
          `SendMessage` to that router, for any agent type. Watch probes it stages fire only on the real event (PUSHED =
          the tip is in `origin/<b>`). Tests: `tests/suite/router.rs`, among them
          `router_guard_allows_the_owner_sender_only_as_a_plain_shape`,
          `router_guard_admits_the_inbox_watcher_and_consume_but_never_post` and
          `the_guard_and_the_inbox_script_take_the_same_ids_and_seconds`, and the guard-and-script agreement tests for
          `router-gh.sh` and `router-gh-watch.sh` on generated corpora. The bot's shapes are `push
          <branch>` (a task too), `pr-open <branch> [--base main|epic/E]` (a WU or task takes no `--base`; a WU never
          into main), `pr-ready <n>`, `post <n> <body-name>`, `sync <epic/E|main|wu/E/slug>` and `issue <branch>`, never
          `sync` or `issue` of a task; the GitHub watch gains `conflict <n>`; the launcher's `worktree add` takes a task
          branch. The guard and the scripts agree on generated corpora. On DSH: Nothing enforces this posture: DSH has
          no shell-hook surface, so until a guard plugin exists (a backlog row) the skill is the only guard. The router
          holds itself to the same whitelist, says that enforcement is missing, and never treats the gap as licence to
          do the work itself (DEC-55). The permission preset decides, not the owner (UC-DSH-4, DEC-56): a medium call
          runs, a high-risk call is denied, and a denial is final. Until the plugin lands the checklists stand in front
          of the call: the router says in its first message, in one line, that no guard is loaded, then works START by
          hand. Its fleet wake is the report channel's watcher, `<inbox> watch 6600`, armed before the first dispatch
          and re-armed on every wake, one for the whole fleet; with no inbox script the router says only the owner can
          wake it. The watcher's bound wakes an idle router about 13 times a day while armed (DEC-58); no reminder,
          schedule or loop is armed instead. Owner reach: Whenever the router needs the owner (a sign-off, a merge, a
          decision, a failed run) it sends in the same turn and records `Sent to <channel> (id N)`. Keel's sender is
          `scripts/notify-owner.py`, the same command on DSH and Claude Code: the router writes the body to
          `.router/notify/owner.md` and runs `--send`, which posts to the already-paired Telegram bot, prints `id N` and
          empties the body file; `--dry-run` validates and prints the request without reaching the network; `--check`
          names the bot and sends nothing. A failure is one line and exits non-zero; no mode prints the credential or
          the chat id. Tests: `tests/suite/notify_owner.rs`, against a local mock of the API. The first real send is the
          owner's live evidence.
        failure: >-
          Any shell spelling that reassembles a denied flag (`--out""put=`); a subagent or forked skill started by the
          router; gh pointed at another host; a hook error or timeout that allows the call; a watcher that fires before
          the owner acted; a `SendMessage` to a named session refused, or one with no named recipient allowed (DEC-42);
          a GitHub script shape the guard admits and the script refuses, or the reverse, outside the documented gaps.
      - id: UC-ROUTE-7
        title: "the owner commands the router through GitHub, and only commanders are heard"
        trigger: >-
          The router has armed `scripts/router-gh-watch.sh review|comment <n> [since <id>|since latest]` or
          `merged|checks <n>` on an issue or pull request the bot opened, and someone comments, reviews, merges, or the
          checks finish.
        expected: >-
          The watch checks at once, then about every 60 s, and exits 0 on the first event from a commander, with one
          event line carrying `at=`: `COMMAND … from=<id> verb=go|hold|retry|answer`, `MESSAGE`, `BADCOMMAND`, `EDITED`,
          `APPROVED pr= sha=`, `CHANGES-REQUESTED`, `COMMENTED`, `DISMISSED`, `MERGED`, `CLOSED` or `CHECKS …
          state=success|failure`. A comment's text follows indented, with control, separator, bidi, zero-width and tag
          characters as `?`; check names are cut at 100 characters. Commanders are the numeric user ids in the committed
          `[github] commanders` (Keel: the owner, `5499546`), account type User; the list is read from the router
          checkout only while it matches `HEAD`, and an empty list is refused. Anyone else, an App posting for a
          commander, and the bot itself are never printed and never wake the router: the event line is followed by
          `IGNORED from=other count=N`. Commands: a comment's first line may be `/keel go`, `/keel hold`, `/keel retry`
          or `/keel answer <n> <A|B>`; the other lines are the commander's message, trusted like a chat prompt; with
          `[github] free_text = false` only the commands reach the router. A review's text is a message, never a
          command. An edited comment prints `EDITED` and no text; the router asks the commander to post again. Without
          `since` the oldest new item is reported with `pending=` the count after it, so the router re-arms with `since
          <id>` and reads each once; `since latest` skips what was there at the first poll. Of a long thread the newest
          1,000 items are read; when `since` lies before them, an event among them carries `gap=yes oldest=<id>`, and
          with none the watch prints `OVERFLOW … resume=<id>`. It ends with `TIMEOUT` at `ROUTER_WATCH_MAX` (default
          6,600 s) or `UNREACHABLE` after 5 failed polls. Nothing is written and no state is kept; the watch holds no
          secret, and every read goes through `router-gh.sh watch-read`. The epic's tracking issue (`router-gh.sh
          issue`) shows the tip, the docs, the notes and a row per WU, each WU a sub-issue closed once merged (DEC-62).
          Tests: `tests/suite/router_gh_watch.rs`, `tests/suite/router_gh_watch_args.rs`, the issue tests in
          `tests/suite/router_gh.rs`. The commands' meanings were never recorded, and the owner questioned them on
          2026-11-17: an open question, no change (backlog G10).
        failure: >-
          A stranger's text printed, or a stranger waking the router; an edited comment read as an order; a command
          parsed from any line but the first, or a word outside the closed grammar accepted; a commander matched by
          login; a comment older than `since` read twice, or one silently skipped past the pages read; a watch that
          writes a file, keeps state or prints the key, the JWT or the token; a watch reading an issue or pull request
          the bot did not open.
