    steps:
      - "1. cd app && pnpm dev:browser, then open the /browser.html URL Vite prints. The banner's 'Fixture views' links: every-kind shows each kind in its group (Yours 7, Not yours 2, Sent 1); Open answers 'Opened in your browser.' (the fake opens nothing); Show the question shows its line; Mark sent moves the W8 plan to Sent and Not sent back; focus marks E-APPLIST.W5's result 'From your alert'; not-heard shows the red line and hides the question; nothing-waits says each group is empty. Repeat one view with the Light and Dark links."
      - "2. Quit every Keel first (Keel.app from the Dock, and any pnpm start; W5's step 0). Then: cd app && rm -f ~/keel-w6-alerts.jsonl ~/keel-w6-opened.jsonl && KEEL_APP_ALERT_SINK=$HOME/keel-w6-alerts.jsonl pnpm start. With your Keel checkout listed, the window opens on Waits on you with what waits now (main not pushed if main is ahead of origin; this work unit once its review note is on its tip)."
      - "3. On an item with Open (a plan or a result): your browser opens the page from ~/Library/Application Support/Keel/open/. Edit that page's working file in the checkout, Open again: still the committed text."
      - "4. Mark sent on a plan or a question (needs the router's stage or question line); quit and start again: still under Sent; Not sent moves it back."
      - "5. In a second terminal: scripts/router-app.sh alert '{\"headline\":\"W6 live check\",\"lines\":[\"One alert.\"],\"wu\":\"E-APPLIST.W6\"}' from your Keel checkout: within a minute the sink file's new line carries \"subtitle\":\"Keel\" (your project's name)."
      - "6. ?diff=latest: in the browser, append ?diff=latest to the opened page's address: does htmldoc open in diff mode? Then from Terminal: open 'file://<that page's path>?diff=latest': does the browser keep the query? Tell the router both answers."
    reset: "Quit the app; rm -f ~/keel-w6-alerts.jsonl; optionally rm -rf ~/Library/Application\\ Support/Keel/open ~/Library/Application\\ Support/Keel/sent.json."
  sandbox:
    - "pnpm dev:browser and pnpm start bind a port the worker's sandbox refuses (W5, W8): the live check is the owner's."
    - "fs.watch answers EMFILE in the sandbox: watch-view's real-watch test skips (1 skipped), as at W5."
    - "One command was denied by the permission review while planning: it held a git notes list on the repository, which the brief forbids; it was not re-run in any form. The tests' git notes run only in temp repositories, as W5's do."
