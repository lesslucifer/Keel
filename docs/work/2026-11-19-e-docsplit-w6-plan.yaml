      keel verify-doc built from 68a1520, in a scratch repo with a 10-word cap
      on docs/*.html; sections by the same rule (text of <main>, else <body>).
    architecture:
      total: 5917
      cap: 3000
      sections: {shape: 336, cli: 782, init: 832, config: 854, evidence: 452, router: 769, close: 708, gaps: 267, github: 472, not-gated: 331, next: 114}
    install:
      total: 1920
      cap: 1500
      sections: {intro: 40, "1-install": 304, "2-path": 44, "3-adopt": 431, "4-upgrade": 272, "5-github-app": 829}
  github-parts:
    note: >-
      Left as they are for E-GHREVERT (backlog local-app A1), which removes
      them; about 1,000 words in architecture, 829 in install. W6 changes no
      word in them, and they do not count toward the caps (owner comment on
      open point 1). With them, architecture stays about 3,800 and install
      about 1,700 until E-GHREVERT lands.
