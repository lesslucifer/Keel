  - id: B26
    title: "Keel calls git many times per gate step"
    status: "backlog: unowned; an epic that owns the gate's git calls"
    problem: >-
      Most of the test suite's process cost is keel's own git calls, not the tests'. E-TESTOPT.W4 counted every git
      process of one run per test on `5d2ab18`: 29,524 in all; keel and Keel's hook scripts made 23,088 (78 %), the
      test code 3,487 (12 %), the router scripts 2,026 (7 %), git's own children 923 (3 %). After W4's fixture
      templates, keel's share is about 80 % of 25,554. Keel's subcommands, most used first: `rev-parse` 5,887 · `diff`
      3,136 · `cat-file` 2,642 · `notes` 2,547 · `merge-base` 1,273 · `symbolic-ref` 1,142 · `rev-list` 1,136 ·
      `config` 1,113 · `show` 884 · `var` 822. The epic baseline found only 5 % of calls in one process to be exact
      repeats, so a cache of identical calls buys little. Every user's gate pays the same calls, so it is a product
      change, not a test change (E-TESTOPT epic plan, open point 4). Git's automatic maintenance (`git maintenance run
      --auto` after a commit or merge) was 789 of those 29,524 processes. The tests turn it off since E-TESTOPT.W5:
      every test spawn's global config is `tests/common/gitconfig`, `maintenance.auto = false` (DEC-59). Keel itself
      leaves it alone in a user's repo: there it is the user's setting.
    proposal: >-
      Batching is the direction: one `cat-file --batch` for object and note reads, one `rev-parse` for several refs.
    source: "E-TESTOPT.W4 result (the profile), W5 result; E-TESTOPT epic plan open point 4."
    taken-by: "unowned: an epic that owns the gate's git calls"

