  - id: R41
    title: "What remains after the worker file guard"
    status: "accepted residual (DEC-37, 'What remains')"
    problem: >-
      Owner code execution: (1) the worktree's own `.claude/agents/worker.md` and `.claude/skills/`, editable by the
      worker and loaded by the next session there; (2) other worktrees' admin dirs under the git dir, which the
      worker's shell can still rewrite, unchecked when the owner or the router runs git there (the router's checkout
      included when it is a linked worktree). Data exposure: under `auto` the classifier judges reads outside the
      worktree and extra hosts, so what a worker may read it may send; `WebFetch` is in-process and not gated by
      `allowedDomains` at all (W1 finding e).
    proposal: >-
      A guard or sandbox bound on the worktree's `.claude/agents/` and `.claude/skills/` and a `linked_ok`-style
      check before any owner or router git in a worktree. No read allowlist or host pin: the owner ruled 2026-11-26
