outcome: >-
  Delivered. keel hashes `git diff --full-index` for every diff binding (cr code_diff_hash, dod diff_hash, mr
  change_hash), so the text no longer depends on the object store's size. One rule, notes::binds, judges a stored
  hash for check 5, check 8 (a key signature verifies over the stored hash once the rule proved it) and the owner's
  review waiver: the stable form, else git's short form at --abbrev=N, N in LEGACY_ABBREV = 7..=12, in that order.
  A hash of another diff, or of a length outside 7..=12, fails. keel verify-dod epic ffb5cba, built from this
  branch, shows all 10 stale walk seams green, with no walk waiver; its only reds are 1·notes and 8·manual-review.
deviations: >-
  One addition: two older suite tests that recompute keel's hash by hand (verify_dod.rs, the narrow round and the
  fix-PASS tests) now pass --full-index, and mr.rs forge takes the form (forge_as), so the forged sign-offs stay
  "bound like a real one". A prototype of the store growth in a scratch shell was refused by the permission layer;
  the growth is proven inside the tests instead (git fast-import, short hash asserted 7 then 8).
