  - id: R5
    title: "Epic e2e for the router"
    status: "hermetic part done by E-ROUTER3.W7; the live-session part is still manual"
    problem: >-
      Automated by E-ROUTER3.W7 as far as a stub `claude` reaches: `tests/suite/router.rs`
      `epic_e2e_router_drives_a_granted_worker_in_a_seeded_worktree_to_its_end` runs, through the settings-wired guard
      and with every launcher call under `GIT_*` naming a decoy repository, worktree add (epic, then WU) -> watchdog
      start -> spawn in plan mode -> the router's messages -> the watchdog's tick -> stop -> a `--review` spawn and
      stop -> a sign-off the worker forges as itself, refused by keel's merge hook at 8·manual-review -> worktree
      remove -> watchdog stop. Still manual, because it needs a real model and real sessions: a router session
      loading `keel-router` and `project-router`, and live two-way delivery between sessions. The plan's original
      e2e (a scratch repo after `keel init`; a fresh session asked to "be the router for a new epic" loads
      `keel-router` and `project-router`, cuts and pushes the epic branch before any plan, stages rather than runs
      `keel mr confirm` with a watcher armed; refusals for a plan before the branch and for the router running
      `keel mr`) was never automated as a skill-loading session flow; W4 ran its try-recipe once by hand (skills
      listed and picked); `tests/suite/init.rs` and `tests/suite/router.rs` cover the installed files and the
      enforcement.
    proposal: >-
      The live part runs once by hand per epic as a try-recipe; the W7 run (2026-11-12) is recorded in the W7 result.
      An epic's `test/v1` counts its e2e layer and names that slice as waived in its covers sentence. Like
      e-seed-v2 B3: until built, an E-ROUTER-style epic `test/v1` waives its e2e layer.
    source: >-
      E-ROUTER plan e2e; E-ROUTER3.W7 (hermetic part automated). The page's badge: hermetic part done.
