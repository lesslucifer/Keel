deviations:
  - what: Before the owner's skills copy, five tests were red, not the three the router expected.
    why: >-
      All five failed at one point (tests/common/mod.rs:110): git write-tree refused while
      .claude/skills/keel-workflow/SKILL.md was unmerged. The self-hosting tests (init::self_hosting_check_passes_mid_merge_of_a_skill_change,
      init::self_hosting_clone_is_gated_and_init_is_a_noop,
      init::self_hosting_new_worktree_reads_the_committed_roster_and_copies_no_local_one,
      router::epic_e2e_router_drives_a_granted_worker_in_a_seeded_worktree_to_its_end,
      router::keels_router_security_files_are_rule_bearing) snapshot this repository's index. After the owner's
      cp -R skills/. .claude/skills/ and git add, the suite was 345 passed, 0 failed, as in the rehearsal.
  - what: Some commands were refused in the rehearsal, so the plan's hook finding came from the source, not a live run.
    why: >-
      Refused: git clone -q --shared -b epic/E-DOCSPLIT from this worktree's path (a clone from the main checkout
      was allowed and used); git switch, git worktree add, and git symbolic-ref with reset --hard inside the scratch
      clone (a second clone with --branch was used); keel hooks install in the scratch clone (auto mode classifier,
      "Undermining Oversight"). The finding has since held live: both owner commits, the merge 6890058 and the caps
      e11dd55, went through Keel's hooks in this worktree with keel mr commit.
  - what: In the rehearsal the port first left two YAML entries mis-indented.
    why: >-
      backlog-index.yaml (the closed E-GHREVERT rank) and e-router-v2.yaml (the closed R50) were indented one level
      too deep by the edit script; keel verify-doc refused both as invalid YAML and they were fixed before the
      rehearsal commit, so 63f45b4 and 2cf381b carry the fixed files.
