        507 probes serially).
      - >-
        row 5, W3 - `tests/suite/router_gh_watch.rs` harness: `watch_env` sets `ROUTER_WATCH_MAX=30` for single-event
        cases (a regression polls 30 s); `lines()` trims the whole output, so the CRLF case could pass a regression.
        (Fixed at the E-GHFLOW close, with the epic review's nits: both watch helpers now take `ROUTER_GH_GIT` from
        `Gh::github_env`, and `watch_raw`'s doc names every check it skips.)
      - >-
        row 6, W3 - test strength: `merged_prints_the_merge_or_the_close` serves a redundant open answer (a 1 s
        sleep); the `merged 32` refusal asserts neither empty output nor the calls; reviews have no test for
