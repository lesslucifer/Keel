outcome: >-
  Delivered, the owner's live check pending. With a project listed the window opens on screen 2, Waits on you: the
  main part draws every item of this epic's kinds from W5's view on each read (src/shared/items.ts), in three groups
  (yours, not yours, sent) with its work unit, branch, tip, since when, why and who acts, entering and leaving on its
  source with no click - a work unit's result on a PASS or WAIVED review note with no sign-off, to merge on the
  sign-off, gone with the merge (a FAIL or unreadable note is its worker's); an epic's result the same against main;
  a plan to read on the router's stage, gone on plan approved, its removal or the branch moving past the plan's tip;
  a question on its router line; a worker waiting while the watchdog says so; main not pushed while main is ahead of
  a live upstream; a task while its tip is outside its open work unit and no busy worker is on its branch; work in
  motion (plan in work, building, in review) under not yours, naming the worker. While the router is not heard its
  items are hidden and a line says so. Open copies the tip's docs/ from git into the app's folder through the fixed
  reads and opens the page its data file names in the owner's browser, the committed bytes even while the working
  file differs; an epic result opens in place from its worktree's docs/.archive/; a question shows its text in the
  row. Mark sent and Not sent move a plan or a question to and from Sent, kept in sent.json in the app's folder
  across a restart. A click on an alert or a keel:// link brings Waits on you forward with that work unit's items
  marked; a project switch clears the focus. The macOS alert names the project as its subtitle. Screen 6 shows the
  counts, each a way to the list, and the last change seen. node --test 354 (353 pass, 1 skipped in the worker's
  sandbox, as at W5), Vitest 230, typecheck, lint and keel check green. Nothing was built or packaged; the owner's
  live check (browser mode, then pnpm start) waits for him, the sandbox refusing the port both bind.
deviations:
  - "The item rules live in app/src/shared/items.ts, not app/src/main/items/ as planned: the window may import nothing from the main part, and the fake's fixtures draw their lists with the same rules, so browser mode cannot drift from the app (commit 652b22a)."
  - "The plan's note-show read is the blob read (cat-file blob <id>) on the note id W5's note-of already answers, so a rewritten review note (FAIL then WAIVED on one tip) is read again by its new id; doc-heads is the same blob read over the copy's data files, read from the copy on disk. Three new fixed reads in all: blob, commit-time and ls-docs. No cat-file --batch: the fixed commands run with stdin closed."
  - "The plan's commit 4 named the doc-heads read; it came with Open (commit 5), where it is used. The order is otherwise the plan's, plus one test fix (cfa49cd: a focus badge read before its effect ran, flaky in bd1cb17, which was committed while that test was red: the chained command did not stop on it)."
  - "Open copies only files that read whole as UTF-8 text (the fixed reads answer text): a binary file under docs/ would not be copied. Keel's docs are HTML, YAML and Markdown today; recorded on backlog row A3."
  - "A question has no 'since': the router's state keeps each key's value, not when it was set (the plan said the router line's time). A worker waiting shows its last activity; recorded on backlog row A3."
  - "Work in motion is not drawn for a work unit whose tip already carries a review note: the result item says more."
  - "Sent marks are cleaned at each write (this project's marks whose item is no longer listed), not at each read: a router restart, or silence, hides the items for a while, and a read-time clean-up would drop the owner's marks then."
  - "Every button on screen 2 is an outline pill, Open included: mx3a allows one solid pill per card, and a card of items holds no one main action. The current tab is an outline pill with an ink edge, so each screen's one solid pill stays its own."
  - "The plan's live-check step 1 names ?view=<each>: the browser mode gains ?view= with seven views (live, every-kind, nothing-waits, no-run, not-heard, after-restart, focus) and links to each in its banner."
  - "The lint helper accepted the honest screen code, so backlog A3's helper follow-up (the owner's answer 5a) was not needed and stays with W9."
