    W2: "scripts/router-worker.sh (the sandbox key); tests/suite/router.rs (the pin); tests/suite/notify_owner.rs (the deletion, code)"
    W3: "scripts/router-worker.sh (the store allowWrite); docs/install.html; app/ config (code)"
