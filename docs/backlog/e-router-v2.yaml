  - id: R25
    title: "The epic gate re-judges each inner sign-off by the epic target's roster"
    status: open
    problem: >-
      A same-user shell can commit its key onto `epic/<E>` with plumbing and forge an inner WU merge against that
      rewritten roster (DEC-48, threat T6); check 8 runs at the boundary only (DEC-22), so the epic walk never
      re-verifies a WU's `mr/v1`.
    proposal: >-
      Re-verifying every inner sign-off against main's roster at the epic gate would make that forgery visible
      before main.
    source: >-
      E-ROUTER3.W4 plan, threat table T6. Deferred by E-ROUTER3.W4 (owner, 2026-11-12).
    taken-by: "unowned: the next router epic (not yet proposed)"
  - id: R26
    title: "A worker repointing its worktree at a git dir it controls (the gitfile / `commondir` escape)"
    status: "unverified"
    problem: >-
      The sandbox lets a worker write its worktree and the shared git dir except `config`, `hooks`, `keel-hooks` and
      `info`. The worktree's `.git` file and the git dir's `worktrees/<name>/commondir` are both writable, so a worker
      could point its worktree at a git dir whose config and hooks it controls. Read from the launcher, never
      probed. Pairs with R22; residual of R3.
    source: >-
      Carried from E-ROUTER3.W4 into the E-ROUTER3.W5 plan (open point 7). Deferred by E-ROUTER3.W4 (owner,
      2026-11-12).
    taken-by: "unowned: the next router epic (not yet proposed)"
  - id: R27
    title: "The router passes `spawn` an absolute worktree path"
    status: open
    problem: >-
      In the W7 manual run (2026-11-12), `spawn w7-live .wt/worker ...` failed with `router-worker: no such
      worktree`, because a relative path resolves from the router's cwd (`.wt/router`). `../worker` was refused by
      the guard. Only the absolute path ran.
    proposal: >-
      The keel-router skill (worker-ops, Spawn) or the brief text should tell the router to pass the absolute path.
      This is a rule-bearing text change (owner `keel mr commit`), for the next router epic (proposed to the owner at
      the E-ROUTER3 close).
    source: >-
      E-ROUTER3.W7 result, hand-off (a). Found by E-ROUTER3.W7 (2026-11-12).
    taken-by: "unowned: the next router epic"
  - id: R28
