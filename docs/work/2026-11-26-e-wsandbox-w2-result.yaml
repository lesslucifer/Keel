outcome: >-
  Delivered. Parts 2 - 4 are built on one branch in two owner rule commits: allowLocalBinding true in the
  launcher's sandbox; no strictAllowlist and the five-host base kept (the auto reviewer decides each site, and
  registry.npmjs.org joins the base for installs); one fixed scratch helper on the grant; the 14 #[ignore]
  tests deleted; pnpm's store and its whole package tree outside every worktree, with the git-ignored
  app/node_modules linked at them. Review round 1 of 1 found one blocker (the store-only route left the
  package tree in the worktree); it was fixed and a second owner rule commit landed.
deviations:
  - "Review round 1's blocker (owner commit 707bb5a2, cr note): moving only pnpm's content-addressable store
    still materialised the package tree (xmlbuilder 15.1.1's .vscode/launch.json) inside the worktree, which the
    sandbox denies at any depth. Fixed in the second owner rule commit (28674051): the launcher sets pnpm's
    modules dir (pnpm_config_modules_dir) to a folder in the temp folder and links the worktree's git-ignored
    app/node_modules at it; PNPM_HOME keeps the store beside it."
  - ".gitignore changed from app/node_modules/ to app/node_modules: a symlinked node_modules is not a directory
    to git, so the launcher's link dirtied the worker's tree (the e2e's watchdog check caught it)."
  - "Forge packaging (pnpm make) stays the owner's lane: its packager needs a real, non-linked node_modules;
    the worker's test loops, Node and Vite resolve through the link."
  - "pnpm add and cargo add stay reviewer-judged: the plan adds no grant entry for package commands; a refused
    live proof would make that the follow-up."
  - "The live proofs are deferred to the epic's e2e (listed in details.deferred): only a spawned worker under
    the launcher's sandbox can run them."
