status: ready
id: E-WSANDBOX.W10
epic: E-WSANDBOX
title: "E-WSANDBOX.W10 result: the e2e fixes are built, the review round's harness changes are in, and the live proof waits for the re-run"
date: "2026-11-28"
page: 2026-11-28-e-wsandbox-w10-result.html
outcome: >-
  Delivered against the requirement, except its live part, which is owed to the epic e2e re-run. The launcher now
  hands a worker its pnpm settings (PNPM_HOME, pnpm_config_modules_dir, pnpm_config_store_dir = <home>/store) in
  the --settings env object and creates and checks the modules dir before any start; the export is gone. The owner's
  rulings (RULED, owner, 2026-11-28, the plan's defaults) are built: q1 (b) bare Bash(sh), Bash(bash), Bash(zsh)
  denied; q2 (a)+(c) pnpm install, add, run and test on the grant, and probe 3 split; q3 (a) the router stays an
  interactive session, stated in project-router, and the probe router writes nothing. The e2e harness reports raw
  output only, writes one evidence file a worker judges, and counts the red-doc messages in hook records only. The
  rule-bearing files landed as the owner's one commit 98c5d7b1 (Reviewed-By vuluu). Fix round 1 then answered the
  independent review of the harness (1 high, 3 medium, 4 low, all verified at 743ddf2c and fixed): the probe
  router's report can no longer go by SendMessage to a Claude Code router that is gone - the router is a DSH
  session - so the report is an assistant message in its transcript, told apart by its own first line; the owner's
  finish step reads it there, prints it, writes the evidence file and cleans up; the owner tells the DSH router,
  which reads the two files.
deviations:
  - "The q2 grant uses the launcher's Bash(c) and Bash(c *) pairs, so it also admits a bare pnpm add (an error) and pnpm run (lists the scripts); the plan listed pnpm add * and pnpm run * only. Harmless, and it keeps one grant shape."
  - "Probe 3c keeps env -u pnpm_config_modules_dir before pnpm add, as its own Bash call: without it the scratch install would land in the app's modules dir. The split separates the cd (3b) from it, which still finds the part that prompts."
  - "The modules-dir refusal is tested for a planted symlink and a planted file, not for a directory another user owns (not hermetic); the -O check is in the code beside the other two."
  - "The plan page's decision table still shows the defaults; the plan's data file records them RULED."
  - "Added a test the plan did not list: project_router_states_the_w10_launcher_and_the_interactive_router, so the skill change has a check. It was red until the owner's commit applied the patch."
  - "The two e2e pages (runbook, owner steps) each changed by one sentence for the new report path and evidence file; htmldoc snapshots were taken first."
  - "Fix round 1: the owner's three commands are unchanged. finish now waits for the probe router's report (up to 45 minutes, one line a minute) before its two checks; a new optional wait mode returns once the report exists, so the optional resume check can run before finish stops the worker."
  - "Fix round 1: the red-doc count on a full run drops from 14 to 7, because the filter is now a positive Stop-hook record test and the same delivery - written as a user meta record and as a system stop_hook_summary - is counted once, from the stop_hook_summary."
  - "Fix round 1: the probe router sends nothing. Its report is a plain assistant message in the transcript, found by its own first line, so a later turn-end note does not hide it; a Claude Code session cannot reach the owner's DSH router, so the owner is the hand-off."
evidence:
  - "Root cause (a), from the code at 990e57f8: router-worker.sh:809 created only the pnpm home, :815 named the modules dir, :863 linked app/node_modules at it, and no line created it. Fixed: the launcher mkdirs it, or refuses one that is not a real directory this user owns."
  - "Root cause (b), strong evidence, live proof owed: claude --bg hands the session to the Claude Code daemon; this worker's own job record (~/.claude/jobs/8d9c7ef4/state.json, read first-hand) shows backend daemon and providerEnv with one forwarded variable. The 2026-11-28 run fits: pnpm used the default app/node_modules and the store fell back to the worktree and the sandbox temp. W3's test passed only because its stub claude inherited the export as a direct child. Fixed: the three variables travel in --settings env. The live check is probe 2's printenv in the e2e re-run; if it shows them and the install still fails, (b) is refuted."
  - "Red first at 537ed4f4 (launcher unchanged): launcher_puts_a_workers_pnpm_package_tree_outside_its_worktree ('the worker's session does not get PNPM_HOME through --settings: \"\"'), launcher_refuses_a_modules_dir_that_is_not_a_real_directory ('the launcher accepted a planted modules dir: RUNNING name=m0 ...'), launcher_starts_a_worker_as_a_background_session_with_the_grant_and_a_validated_mode and worker_sandbox_writes_only_its_worktree_the_git_dir_and_cargos_cache (allow list) - 4 of 4 FAILED. At 237bda21 with the launcher staged: 490 passed, 1 failed (the project-router text test, which needed the patch)."
  - "Green on the owner commit 98c5d7b1: keel check 'check skipped - tree unchanged since last green'; the three W10 tests run alone: 3 passed, 0 failed."
  - "Tests (tests/suite/router.rs): stub_claude records the pnpm env from --settings only; launcher_puts_a_workers_pnpm_package_tree_outside_its_worktree extended (modules dir real, store under the home, the env object exact, a resume rebuilds it, an app-less worktree gets none); new launcher_refuses_a_modules_dir_that_is_not_a_real_directory; WORKER_GRANTS gains the four pnpm shapes, WORKER_SHELL_DENIES the three shells; new project_router_states_the_w10_launcher_and_the_interactive_router."
  - "The finish step's red-doc count, after fix round 1, is a positive test: system/stop_hook_summary records whose hookErrors carry the wording. Run against the real 2026-11-28 probe-router transcript 7658a584-367a-46ae-b73e-a785d1870762.jsonl it reads 7 router records and 0 worker wording (the old filter read 14: 7 user meta records plus the same 7 system records)."
  - "Fix round 1, every finding checked at 743ddf2c: see details.fix-round-1. bash -n clean; shellcheck -S warning clean; the report_text jq is empty on the real 2026-11-28 transcript (its report was a SendMessage) and returns the synthetic final message with the report line; wait_report returns 0 on that synthetic transcript and 2 when the session is absent."
  - "Commits: plan cd7564f4; rulings and the epic plan entry 5a431603; red tests 537ed4f4; e2e harness ac4a5ea4; text test 237bda21; owner keel mr commit 98c5d7b1 (scripts/router-worker.sh, .claude/skills/project-router/SKILL.md); the W10 result pair at 743ddf2c; fix round 1 on top of it, docs/work only."
  - "No live run: the worker may not run claude or the launcher; the stub claude stands in for the daemon."
distillation: >-
  In this WU: the project-router skill's Workers paragraph and its Briefs row (owner commit 98c5d7b1) carry the pnpm
  env through --settings, the modules dir, the pnpm grant, the bare-shell deny and the interactive router. DEC-37
  (grant and deny), DEC-46 point 9 (the worker's environment) and UC-ROUTE-5 take their rows at the E-WSANDBOX epic
  close, with W3's and W4's rulings they amend, per the epic plan's distillation-plan. The plan and this result are
  T3 and archive at epic close.
follow-ups:
  - "The live proof of cause (b), probe 2's printenv and install, the split probe 3, probe 5's own deny refusal, probe 9 and the fixed red-doc count: the E-WSANDBOX epic e2e re-run (owner's prepare, start, finish), judged by a worker from ~/keel-wsandbox-e2e-evidence.txt."
  - "DEC-37, DEC-46 point 9 and UC-ROUTE-5 rows for W10's rulings: E-WSANDBOX epic close distillation."
  - "If probe 3's split forms show which part prompted (the cd outside the worktree or the env wrapper): a launcher grant or a brief rule, in the E-WSANDBOX close or backlog e-router-v2."
  - "The watch family's parallel-only test failure (keel check red on this machine): a test-isolation fix, in the E-WSANDBOX close or backlog e-router-v2."
details:
  rulings: "q1 (b), q2 (a)+(c), q3 (a) - RULED (owner, 2026-11-28), relayed by the router of the time, keel-57; the plan yaml's details.open-questions records them."
  fix-round-1:
    reviewed: >-
      The independent review round 1 outside code_paths, on 743ddf2c: 1 high, 3 medium, 4 low. Each was checked at
      743ddf2c before the fix; all eight were confirmed and fixed, none refuted. The fix stays under docs/work/, so
      the code diff hash 3f4a19b6... and its PASS review are untouched.
    findings:
      - "HIGH probe-router.md:103, e2e-setup.sh:179, e2e-runbook.html:56/79, owner-steps.html:32: the probe router's only report went by SendMessage to keel-57, a Claude Code session that is gone; the router is now lead, a DSH session, and a Claude Code SendMessage cannot reach it, so the owner's finish trigger never arrived. Fixed: no message and no file. The report is a plain assistant message in the probe router's transcript, found by its own first line; finish waits for it (45 minutes, one line a minute), prints it to the log, writes the evidence file, then cleans up. A new wait mode returns once it exists, for the optional check. The owner tells the DSH router, which reads ~/keel-wsandbox-e2e-evidence.txt and ~/keel-wsandbox-e2e.log."
      - "MED e2e-runbook.html:38: said finish appends a report it no longer collects (the W10 change removed cat .router/notify/owner.md) and said 'send the log either way', omitting the evidence file. Fixed: the step now names the wait, the printed report, the evidence file, both files on any FAIL, and that a report that never comes stops the step before it writes or cleans anything."
      - "MED e2e-owner-steps.html:32: promised a pass/fail table from the probe router, which is verdict-free (probe-router.md:20,103; runbook:56), so the owner waited for something that cannot arrive then. Fixed: no pop-up; the report is its last message, step 3 prints it, and the table comes after step 3 from the judging worker."
      - "MED e2e-setup.sh:93-94: cargo build -q 2>&1 | tail -3 never failed the script under set -eu without pipefail, and [ -x target/debug/keel ] passed on a stale binary (cleanup keeps target/), so prepare could print 'ok: built the epic's keel' after a failed build. Fixed: the binary is removed first, cargo's own status is tested (|| die, the last 5 lines shown), then -x checks the fresh one."
      - "LOW e2e-setup.sh:103-104: ./target/debug/keel hooks install | head -1 masked a failed install, and the grep could pass from an earlier install. Fixed: the install must succeed (|| die) and its output is no longer piped; the grep then reads the installed hook file at the clone's common dir."
      - "LOW e2e-setup.sh:49-53: cleanup force-removed $P/.claude/worktrees/* too, not only the probe worktrees. Fixed: only $P-E-PROBE-* is removed; any other worktree is refused with the existing message."
      - "LOW e2e-setup.sh:202-204: the red-doc filter was 'not assistant and no tool_result', not a positive hook-record test (its comment said 'or a peer'); correct on the real 2026-11-28 transcript (n=14, w=0) but latent. Fixed: only system/stop_hook_summary records whose hookErrors carry the wording; the same delivery's user meta record is not counted twice (7 on the real transcript)."
      - "LOW e2e-probe-router.md:43-44: probe 5 (C2-5) accepted the auto reviewer's refusal as q1's proof, so a re-run could PASS without showing the shell deny fired. Fixed: only a denial naming the shell rule counts; an auto-reviewer refusal is a finding, never a PASS. The worker brief's probe 5 now says the q1 deny should refuse the pipe."
    tests: >-
      bash -n clean; shellcheck -S warning clean. The report_text jq reads empty on the real 2026-11-28 probe-router
      transcript (its report was a SendMessage) and returns the synthetic report even when a later assistant text
      follows; the positive hook filter reads 7 router records and 0 worker wording on that real transcript, where the
      old filter read 14. In isolation, wait_report returns 0 on a transcript holding the report and 2, with its note,
      when the session is absent.
    resumed: >-
      The previous fix session in this worktree was stopped mid-run after editing six files under docs/work/ and
      committing nothing: the two e2e pages, the probe-router brief, the setup script, and this result pair. This
      round read that diff, verified all eight findings and every changed line against 743ddf2c, kept all of it, and
      finished it; nothing was dropped. Added in this round: this record, one sentence on the result page, the
      runbook's precision about which message is the report, and the pages' rule for a report that never comes.
    gate: >-
      keel check is red on this machine, so preflight's 0·tree is red: four full runs on the new tip failed 5, 1, 6
      and 6 tests, and every failure whose log survives is in tests/suite/router.rs's watch family (watch_* and
      watcher_run_is_bounded_when_the_watch_outpolls_its_releases) at :1859 "watch never reached poll 1"; an
      earlier run also failed resume_finds_the_transcript_by_session_id_and_names_a_missing_run_file (RESUMED
      where a refusal was wanted). Each failing test passes alone (--exact), and the 23 router::watch* tests pass
      23/23 with --test-threads=1, so the watch family is not parallel-safe. Pre-existing: this diff changes no
      code path, and it was not fixed here because a code change would orphan the cr PASS. bash -n, shellcheck
      -S warning and keel verify-doc are clean; verify-dod is red only on the missing cr note (the review round 2
      writes it) and the owner's sign-off.
