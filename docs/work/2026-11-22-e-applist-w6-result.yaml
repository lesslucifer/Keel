  layout:
    new: [app/src/shared/items.ts, app/src/main/open/docs.ts, app/src/main/open/open.ts, app/src/main/items/sent.ts, app/src/window/screens/Nav.tsx, app/src/window/screens/Waits.tsx, app/src/window/ui/ItemRow.tsx]
