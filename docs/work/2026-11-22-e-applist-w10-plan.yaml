artifact: wu-plan
status: ready
id: E-APPLIST.W10
epic: E-APPLIST
title: "E-APPLIST.W10 · The app moves from npm to pnpm"
date: "2026-11-22"
page: 2026-11-22-e-applist-w10-plan.html
requirement: >-
  The app in app/ is installed and run with pnpm alone, at one pinned version (package.json packageManager
  pnpm@11.18.0): pnpm-lock.yaml replaces package-lock.json and resolves every package to the exact version
  package-lock.json held; pnpm install --frozen-lockfile installs it with a hoisted node_modules and no unapproved
  build script; pnpm test:main, test:window, lint and typecheck pass; and no test, guard, comment or current doc a
  person runs from names npm as the app's tool.
maps-to: >-
  Epic E-APPLIST, a WU added after W5 by the owner's ruling of 2026-11-22 ("we must use pnpm"), recorded as a
  deviation in the epic plan (wu-summaries, E-APPLIST.W10) and as a follow-up in the W5 result. It changes no use
  case; it reverses the W7 plan's open point "npm or pnpm?" (answered npm then).
expected:
  - "app/package.json names packageManager pnpm@11.18.0; app/pnpm-lock.yaml is committed and app/package-lock.json is gone."
  - "Every package in the old package-lock.json is in pnpm-lock.yaml at the same version, and the lockfile's importer lists exactly package.json's pins."
  - "In app/, pnpm install --frozen-lockfile installs with no error and no 'Ignored build scripts' failure; node_modules is a flat, npm-like tree (nodeLinker hoisted)."
  - "pnpm test:main, pnpm test:window, pnpm lint and pnpm typecheck pass; keel check passes, still installing nothing."
  - "No guard, test name, comment or current doc tells a person to run npm or npx for the app; the T3 history (W5, W7, W8 result steps) is left as written."
test-plan:
  unit: >-
    node --test, app/test/unit/guards.test.ts, red first: the lockfile guard now asks for pnpm-lock.yaml beside
    package.json, no package-lock.json, packageManager naming pnpm at one exact version, and pnpm-workspace.yaml
    holding nodeLinker hoisted and an allowBuilds entry for each package that has a build script; its test name and
    the "keel check needs no npm" name say pnpm or a package install instead.
  integration: >-
    node --test, a new app/test/integration/lockfile.test.ts, red first: on the real committed files, the lockfile's
    importer section lists exactly package.json's dependencies and devDependencies, each at the pinned version, and
    every scripts entry runs with no npm or npx in it (a script calling npm would break under pnpm alone). Recorded in
    the result: pnpm install --frozen-lockfile, then pnpm test:main, test:window, lint and typecheck, with counts.
  e2e: >-
    none: a WU's level is integration; the epic test is W9's and will run the app through pnpm start.
details:
  base: "wu/E-APPLIST/w10-pnpm off epic/E-APPLIST at 7684685 (W1, W2, W3, W5, W7, W8 merged)"
  choices:
    pnpm-version: >-
      pnpm@11.18.0, the version Homebrew installs on the owner's Mac today (/opt/homebrew/bin/pnpm). pnpm 11 checks
      packageManager itself: a different running pnpm downloads and switches to the pinned one, so a pinned version
      equal to the installed one needs no download.
    corepack: >-
      Not assumed. Node 24 still ships corepack, but it is off by default and Node 25 drops it. The owner gets pnpm
      by `brew install pnpm` (already done here: 11.18.0). corepack enable also works and reads the same field.
    settings-file: >-
      app/pnpm-workspace.yaml, not app/.npmrc: pnpm 11 reads its own settings (allowBuilds, nodeLinker) from
      pnpm-workspace.yaml; .npmrc keeps registry and auth only, and allowBuilds is accepted only in
      pnpm-workspace.yaml.
    node-linker: >-
      hoisted. Electron Forge's packager copies node_modules into the app and its docs require a flat tree under
      pnpm; pnpm's default symlinked tree breaks packaging. Hoisted also keeps the layout W7 and W8 were built and
      tested on (Forge start, the Vite plugin, emitted.js's node_modules walk).
    builds: >-
      pnpm 11 fails an install on any dependency build script not approved (strictDepBuilds, on by default). In
      the lock only fsevents 2.3.3 has one (a binding.gyp; it ships its prebuilt binary, the script would rebuild
      it). allowBuilds fsevents false: never run. Electron 45 has no install script: its binary is fetched on
      first run (its install-electron bin), so nothing to approve.
    lockfile: >-
      Made by pnpm import from the committed package-lock.json (same versions, checked package by package: 393 of
      393 npm entries found in pnpm-lock.yaml at the same version), then pnpm install --frozen-lockfile.
  files:
    - app/package.json (packageManager)
    - app/pnpm-lock.yaml (new) replacing app/package-lock.json (removed)
    - app/pnpm-workspace.yaml (new)
    - app/test/unit/guards.test.ts
    - app/test/integration/lockfile.test.ts (new)
    - "comments naming npm run: app/eslint.config.js, app/vitest.config.ts, app/eslint-rules/check-css.js, app/eslint-rules/emitted.js, app/src/window/browser.tsx, app/test-window/integration/guarantee.test.ts, app/test-window/integration/lint.test.ts"
    - "docs/backlog/local-app.yaml: A3's follow-ups (npm start -> pnpm start; W5's open review item added)"
    - docs/work/2026-11-20-e-applist-plan.yaml and .html (W10 recorded)
  left-alone:
    - "T3 history: the W5, W7 and W8 plan and result steps that say npm (what was run then)."
    - "keel check's test line (.keel/config.toml) runs node --test and names no npm: no rule-file change."
    - "dist-workspace.toml, .github/, docs/install.html, docs/decisions/distribution.html: Keel's own npm package (@lesslucifer/keel), not the app."
    - "docs/decisions/app.html DEC-73 and backlog L6 say 'npm packages': packages from the npm registry, still true under pnpm."
  sandbox: >-
    The registry is reached per command through the sandbox's allowance for registry.npmjs.org; pnpm's store goes
    to a fresh folder under $TMPDIR (the sandbox cannot write ~/Library/pnpm). If refused, the result gives the
    owner the exact command.
  open-points:
    - q: "Which pnpm, and how do you get it?"
      a: "11.18.0, pinned; you already have it from Homebrew. Corepack is not needed."
    - q: "Flat or linked node_modules?"
      a: "Flat (hoisted): Forge's packaging needs it, and it keeps today's layout."
    - q: "Run fsevents' build script?"
      a: "No: it ships its binary prebuilt."
  htmldoc:
    id: 3f9a61c07be24d8e5a1c94b2
