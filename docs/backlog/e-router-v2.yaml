  - id: R51
    title: "The worker sandbox is a deny list over a writable git dir"
    status: "open: severity medium"
    problem: >-
      A worker may write the whole shared git dir except the files named and globbed in its deny list. Every new
      file git learns to read there is open until someone denies it; a glob does not stop renaming a whole admin
      dir, which only the launcher's per-run check catches.
    proposal: >-
      An allow list for the git dir: only what a commit and a notes write need (`objects/`, the worker's own branch
      ref and its reflog, `refs/notes/` but `cr` for an author, `index` and lock files in its own admin dir),
      checked against git's own writes.
    source: >-
      E-GHFLOW.W3 result, security review round 2 (the shared git dir, left after R33's fix; DEC-37, amended). For the next router epic.
    taken-by: "unowned: the next router epic"
  - id: R52
    title: "Hardening the update log's writers (router-app.sh, the watchdog's app lines)"
    status: "open: nits and test gaps, nothing known to fail in use"
    problem: >-
      E-APPLIST.W1 and W2 left four nits in scripts/router-app.sh and seven surviving mutants plus two test gaps in
      the watchdog's app lines (scripts/router-worker.sh), each needing a hand edit, an odd environment or a
      not-yet-seen input to matter. Both scripts are rule-bearing: each fix is the owner's typed commit.
    proposal: >-
      One small router WU: the four script fixes below, each with a failing test first; for each surviving mutant a
      test that turns it red, or a note of why it is equivalent.
    source: >-
      E-APPLIST.W1 result, follow-ups N1 - N4 (b0cb60d); E-APPLIST.W2 result, follow-ups (7c6ac22), the independent
      review of scripts/router-worker.sh at 95c16af. Recorded by the E-APPLIST.W5 plan's follow-up.
    taken-by: "unowned: the next router epic (E-APPLIST closed without it)"
    items:
      - >-
        W1 N1, router-app.sh:119-121: a hardlinked log.jsonl or state.json passes the regular-file check (needs a
        same-user write). Fix: refuse a link count over 1.
      - >-
        W1 N2, router-app.sh:162-181: a hand-corrupted state.json holding two JSON values, or a non-integer .n,
        garbles the parse or is carried on; an empty state.json makes each writer exit 0, append an empty line and
        write a blank state until a start. Fix: read it with jq -s, check it holds exactly one value and n is a whole
        number; the wrong-shape test takes the three cases.
      - >-
        W1 N3, router-app.sh:33: an exported CDPATH makes the script fail closed (exit 1). Fix:
        HERE=$(CDPATH= cd -P -- ...).
      - >-
        W1 N4, router-app.sh:131-138: a signal between mkdir and the trap leaves a stale lock; any mkdir failure (an
        unwritable dir) reports LOCKED after 5 s. Fix: set the trap before the loop; fail at once when the dir is not
        writable.
      - >-
        W2, surviving mutants of router-worker.sh at 95c16af that no watchdog test pins: M10 (the write calls lose
        their </dev/null), M11 (app_lines loses its symlink check), M12 (app_lines loses its name check), M19 (no gd
        guard), M20 (a state whose values are not an object read as {}). M15a and M15b are pinned since 142ed86.
      - >-
        W2, a test that starts a run and then trips the git-dir check, to pin that nothing is written then (met by
        construction today).
      - >-
        W2, a per-worker jq that failed would drop that worker's row, and the write step would then delete its line;
        no input is known to make it fail. Fix: a guard that marks the tick unreadable instead.
  - id: R54
    title: "The review's code hash reads the signing checkout, not the merge target"
    status: "open: a gate fix, code"
    problem: >-
      `keel mr confirm` and a by-hand `keel verify-dod` compute `code_diff_hash` from the working tree's `code_paths`
      in the checkout they run in, while the merge hook uses the target branch's committed `.keel/config.toml`. When
      the two disagree - a rule commit that changes `code_paths` or `scripts/`, or a sign-off run in another worktree -
      the owner can sign a note the hook must reject, and the rejection blames the code.
    proposal: >-
      `code_binds` reads the target's committed config, as `review::policy` already does, or the cr note records the
      pathspec and the policy commit it hashed, so the sign-off and the hook agree on what "the code" is.
    source: "Found while signing E-WSANDBOX.W2 (owner's sign-off, 2026-11-26); recorded by the E-WSANDBOX.W9 worker."
    taken-by: "unowned: the next router epic"
  - id: R55
    title: "stop gives up when claude rm refuses right after claude stop"
    status: "open: a launcher hardening, rule-bearing"
    problem: >-
      In the owner's resume probe (2026-11-28) a `claude rm` run right after `claude stop` refused: "A Claude Code lock
      on the worktree names a process that is still running". The lock was on a Claude-managed worktree the session
      had entered itself; a launcher worker runs in a launcher-made git worktree, but if `rm` ever refuses, `stop`
      dies after the stop and its brief-copy cleanup does not run.
    proposal: >-
      `stop` retries `claude rm` a few times, 0.5 s apart, and runs its cleanup whatever `rm` returns, naming a
      refusal that outlasts the retries.
    source: "E-WSANDBOX.W5 (the owner's resume probe, 2026-11-28; analysed by the W5 worker)."
    taken-by: "unowned: the next router epic"
  - id: R56
    title: "A crashed worker still listed cannot be resumed"
    status: "open: unverified live; a launcher question, rule-bearing"
    problem: >-
      `resume <name>` refuses any session the CLI still lists under the name (`rows` matches by name), so a worker
      whose process crashed but whose row stays listed in a state other than idle cannot be resumed; the router has
      no `claude stop`, so it falls to the owner. Found by the E-WSANDBOX.W5 independent review (round 1), not seen
      live.
    proposal: >-
      Probe what `claude agents --json` lists for a crashed background session; if it stays, let `stop` (or resume)
      close a listed session whose process is gone, or name the owner step in the refusal.
    source: "E-WSANDBOX.W5 independent review round 1 (2026-11-28), a low."
    taken-by: "unowned: the next router epic"
