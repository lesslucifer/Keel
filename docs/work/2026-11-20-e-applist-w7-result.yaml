distillation: >-
  Nothing in W7. At the epic close (W9), per the epic's distillation plan: docs/local-app.html gains the shell as
  built (the two channels, the six requests and state.changed, the fixed commands, the login PATH, the app's folder,
  running with no window; its locked-git line gains --no-lazy-fetch, and has-config is ls-tree); docs/install.html how to build and install (npm ci && npm run make, ad-hoc by default,
  KEEL_SIGN_IDENTITY, the first run downloading Electron); docs/architecture.html app/'s place; the next free DEC
  record: app/ under the gate, the main part on node --test, the ad-hoc signature enough for the alert.
