  tests:
    unit: >-
      tests/suite/notify_owner.rs, parse_body driven through python3 (the checkout's script loaded by path, the
      bytes decoded as an argument is, surrogateescape): parse_reads_a_wu_header_and_builds_the_link,
      parse_reads_a_question_header_alone_or_with_a_wu_in_either_order, parse_without_a_header_keeps_the_body_byte_equal,
      parse_reads_a_header_like_line_after_the_text_as_text, parse_refuses_a_bad_or_repeated_header_naming_the_line,
      parse_gives_a_headline_only_body_its_default_line, parse_reads_crlf_and_blanks_control_characters,
      parse_cuts_a_long_headline_and_line_with_an_ellipsis, parse_shrinks_a_multibyte_body_to_its_byte_budgets,
      parse_blanks_a_byte_that_is_not_utf8.
    integration-runnable: >-
      tests/suite/notify_owner.rs (each case a temp git repo with copies of both scripts): a_body_naming_no_work_unit_has_no_link,
      a_question_header_writes_the_question_line_before_the_alert, a_failed_send_still_leaves_the_alert_line,
      a_log_that_cannot_be_written_still_tries_the_send_and_says_so, a_bad_header_sends_nothing_and_writes_nothing,
      dry_run_writes_no_line_and_shows_the_link, a_long_multibyte_body_fits_the_line,
      no_line_carries_the_credential_or_the_chat, a_byte_that_is_not_utf8_in_the_argument_still_previews_and_writes,
      a_writer_that_hangs_is_killed_with_its_children_and_its_lock_released,
      the_writer_never_sees_the_credential_or_the_test_seam, a_sender_ended_by_term_ends_its_hung_writer_and_frees_the_lock,
      a_sender_ended_by_hup_ends_its_hung_writer_and_frees_the_lock, a_dry_run_with_stdout_closed_still_succeeds.
      tests/suite/init.rs: router_skill_names_each_stage_and_its_moment, every_keel_router_file_equals_its_self_hosted_copy,
      project_router_names_every_rule_file.
    integration-ignored: >-
      Port-bound, run by the owner after f435eb1 ("ok"): a_send_writes_one_alert_line_before_the_message (the fake API
      reads the log the moment the request arrives), the_message_ends_with_the_link_when_the_body_names_a_work_unit,
      a_refused_or_stalled_send_still_leaves_the_alert_line, a_log_that_cannot_be_written_still_sends, and the 10
      existing notify-owner cases, now on the temp-repo copies.
