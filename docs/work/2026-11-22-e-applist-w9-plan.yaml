    - docs/work/2026-11-22-e-applist-w5-result.yaml, -w6-result.yaml, -w8-result.yaml, -w10-result.yaml; docs/work/2026-11-20-e-applist-w7-result.yaml (follow-ups)
    - docs/decisions/app.html (DEC-71 to DEC-77)
    - docs/backlog/local-app.yaml (A3)
    - app/src/main/index.ts, app/src/main/alerter/seams.ts, app/src/main/window-options.ts, app/forge.config.ts, app/vite.renderer.config.ts
    - "app/node_modules/@electron-forge/plugin-vite (8.0.1): VitePlugin's public build and buildRenderer; ViteConfigGenerator not exported"
    - scripts/notify-owner.py (KEEL_NOTIFY_API_BASE, the alert line before the send), scripts/router-worker.sh (watchdog facts, ROUTER_CLAUDE), app/test/support/router.ts
    - .claude/skills/project-router/SKILL.md (epic close), .claude/skills/keel-distill/SKILL.md
