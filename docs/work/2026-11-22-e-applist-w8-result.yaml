title: "E-APPLIST.W8 · The window's foundation"
date: "2026-11-22"
page: 2026-11-22-e-applist-w8-result.html
outcome: >-
  Delivered, the owner's second look pending. The owner rejected the first look in browser mode and ruled that the
  look follows his design file (docs/work/2026-11-22-e-applist-w8-design.md, Mercury). The window is drawn only from
  Keel's closed Tailwind 3.4.19 tokens valued from that file: its day world is the light appearance, its night world
  the dark one, still following the Mac (rgb(var(--name)) with R G B triplets in src/window/styles.css under :root and
  again under prefers-color-scheme: dark); one indigo action colour, translucent tinted pills, capsule radii, cards by
  fill, no shadow, weights 360-500; the system font, no font file, no url(). The guarantee that only Keel's
  vocabulary reaches the shipped CSS is a check on the CSS Tailwind emits (details.guarantee), run by npm run lint
  after ESLint from one pinned config over one source list; design/vocabulary (app/eslint-rules/, ported from
  Trawler) is the fast helper: it refuses an off-list class, an arbitrary value, a modifier step off its scale, the
  dark: variant and any variant the closed config lacks, reads class values through ESLint's scope analysis, reports
  a class built from pieces and what it cannot read, an inline style and classes written to the DOM by hand, and
  refuses no honest helper code. Inline eslint-disable comments are off; every scale Tailwind derives from spacing is
  closed. npm run lint is green over src/window. bridge.ts stays the one reader of
  window.keel, now with BridgeProvider and useBridge; hooks.ts holds useAppState, useAction and the answer texts. The
  fake bridge (src/window/fake/) answers every request in the contract from seven fixture scenarios and never reaches
  the shipped page (node guards). npm run dev:browser serves /browser.html on the fake. Screen 6 (Project, Tools,
  PATH, Alerts, the version) replaces W7's bare page. Vitest 138 tests (unit 77, integration 61) and node 184 tests
  pass; npm run typecheck green on TypeScript 6.0.3 (no fallback needed); keel check green at every commit but two
  (deviations). Nothing
  was built or packaged. The sandbox refused the port both dev:browser and npm start bind, so the owner's look
  (details.live-checks) is the live check; he has run browser mode on the first look only.
deviations:
  - >-
    Where the guarantee lives (review round 2, FAIL: 8 blockers, 4 importants, most of them routes past the
    hand-written class reader). The plan puts it in the lint rule (requirement: 'held by a lint rule'; expected:
    'npm run lint fails on ...'). It now lives in a check on the CSS Tailwind emits, which npm run lint runs after
    ESLint; the plan's promise holds unchanged: npm run lint still fails on each class the plan names, and there is no
    escape hatch. Why: Tailwind writes CSS only for whole class names it finds written out in its content files, so a
    check on what it emits sees every route however a string is built, while an AST reader must model every way
    JavaScript can build or move a string, and each round found more. The plan pair is otherwise unchanged
    (details.guarantee holds the design and the per-finding outcome). Commit c5ad1f9.
  - >-
    The look: the owner rejected the first look after trying browser mode ("terribly bad & ugly") and ruled on
    2026-11-22 that it follows docs/work/2026-11-22-e-applist-w8-design.md (a byte copy of his DESIGN.md, Mercury's
    website design system), recorded in the plan pair (73d7367). 668aee9 redoes the tokens, the vocabulary and screen
    6 to it, adapted to a settings window: no always-dark nav bar (light and dark follow the Mac, so the day and night
    worlds are the two appearances); type sized for a window (eyebrow 11px to heading 22px, no 52-60px display or stat
    sizes); a 4px half step beside its 8px scale for tight inline gaps; 32px buttons (its small pill) and 22px badges;
    cards padded 24px, not 32px. Left out as a website's, not a window's: the breakpoints and touch targets, the nav
    bar and nav links, the footer band, the pricing card and tier columns, the logo strip, stat and quote blocks, the
    email capture, the toggle switch, the accordion's icons and chevrons, hero photography and glowing illustrations,
    the soft-stack shadow, and its example surfaces (ex-*).
  - >-
    The one conflict with the design file: its font (arcadia, or Inter as the open substitute) is not shipped. The
    owner's earlier ruling (DEC-72) is the system font and no font file; SF Pro is variable, so the file's light weights
    (360, 400, 420, 480, 500) render. The owner may overrule.
  - >-
    The design file keeps status greens and oranges out of the chrome, so the ok, wait and fail colour tokens are gone.
    A tool's state is a word in a capsule badge whose tone is only loudness: 'set in Keel' on the indigo tint (a choice
    you made, like the actions), 'found on the PATH' on a faint ink wash, 'missing' polarity-flipped (ink fill, canvas
    text) in both worlds; a tool's problem, the PATH fallback and a failed read are ink at weight 500. No state is told
    by colour alone.
  - >-
    keel check was red at 73d7367 and 668aee9: the plan page linked the .md design file, and keel check's cargo suite
    (verify_doc::every_doc_in_docs_and_the_writing_example_pass_the_checks) copies the doc pages without it, so the link
    dangled there. The pre-commit hook runs lint only, and a grep in the worker's command let 668aee9 commit after a red
    check. 127cddc names the file as text; green since.
  - >-
    Review round 1 (cr note on 73d7367, FAIL: 2 blockers, 3 importants) hardened the lint, each fix with its failing
    test first: it reads class tables through as const, satisfies, as T and ! (a7c99ac); inline config is off and npm
    run lint is eslint --max-warnings 0 . (e7e78b2); class=, any ...ClassName prop and a class key in any object literal
    seed the search, an unreadable spread is reported (5d7776d); an unknown call, an import or a parameter reaching a
    class is reported as unread and a reassigned binding is read with every value (d458d14); every scale Tailwind
    derives from spacing is emptied unless declared, and padding, gap, height, margin, width, minWidth and minHeight
    are declared (64892b3; the emittable list falls to 996 classes). The sibling check adds an inline style and classes
    written to the DOM by hand (1a18513), and the waived nit on import.meta.glob became a node guard (8d941b1). The
    content-glob nit stays waived.
  - >-
    Review round 2 (cr note on 62cd3f8, FAIL: 8 blockers, 4 importants), each answered in details.guarantee.findings:
    c5ad1f9 the CSS check, one source list, the pinned config; 89edf8f the helper rebuilt on ESLint's scope manager
    (no false reports on helper bodies, group and peer markers or same-named variables; the AST-visible routes
    reported); 621b2d2 the browser-mode link contrast. The lint fixtures' and src/window's own test files are now
    linted too (the test-file ignore is gone: there are none in src/window).
  - >-
    Commit 1f7ab58's message names the wrong three of screen 6's tests as passing against W7's bare page (it says
    loading, the PATH-absent check and the refused and failed texts). Reading the tests against that page, the three
    are loading, Remove and the alert outcomes. The re-run that would have shown it (restoring the old App.tsx
    in the working tree) was denied by the sandbox's permission check and not retried. The 12-of-15 red count stands
    (from the run itself).
  - >-
    The lint rule does more than the plan's list: it refuses any variant the closed config lacks (md:, an arbitrary
    [&>*]:), not only dark:, because with no breakpoints Tailwind emits nothing for md:p-2 while the plain strip
    would call it legal. It reports a class built with + (Trawler skipped every BinaryExpression), and it reads a
    cx()/clsx() call's strings and object keys (Trawler skipped call arguments). Commit dbf1ac8.
  - >-
    Tokens beyond the plan's first cut, before the redesign: on-accent, a max width, flex, flexShrink and cursor
    (the lint refused flex-1, shrink-0 and cursor-pointer from undeclared scales). The redesign replaced the colour,
    type, spacing and radius tokens (668aee9); flex, flexShrink and cursor stay.
  - >-
    One test the plan did not list: test-window/integration/styles.test.ts runs Vite's own CSS transform of
    styles.css through vite.renderer.config.ts in middleware mode (no websocket, no port, no build), so a renderer
    config that drops Tailwind fails a test (red with it removed). Commit 1f7ab58.
  - >-
    Node guards beyond the plan's three: the import-graph walk's self-test, and browser.html carries the shipped
    page's CSP meta and loads only browser.tsx. Commits d6d291a.
  - >-
    The browser banner also links each fixture state (aria-current on the open one), so the owner switches states
    by a click. The refusing scenario refuses state.get too (the screen shows Keel could not read its state); the
    failing one reads state and fails every change, so both kinds of text are seen. Commits 41d7143, d6d291a.
  - >-
    Type plumbing the plan did not name: tsconfig allowJs with tailwind.config.js, eslint.config.js and
    eslint-rules/*.js checked (// @ts-check); src/window/env.d.ts declares CSS imports;
    eslint-rules/tailwind-internals.d.ts types the one Tailwind internal the rule reads; test-window/support/parse.ts
    types the parser for the tests.
  - >-
    Tried live in the sandbox: npm ci green (366 packages; one EPERM warning writing
    node_modules/xmlbuilder/.vscode/launch.json, harmless). npm run dev:browser: refused, listen EPERM ::1:5199 (and
    ::1:5173 under npm start, Forge's Vite server). Not routed around. Electron's binary downloads on the first npm
    start (electron 45 has no install script), so the owner's first npm start downloads it.
