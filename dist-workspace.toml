[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.34.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "npm", "homebrew"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin", "x86_64-unknown-linux-musl", "aarch64-unknown-linux-musl"]
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Whether to install an updater program
install-updater = false
# Scope of the npm package (@lesslucifer/keel)
npm-scope = "@lesslucifer"
# Homebrew tap repo that receives Formula/keel.rb
tap = "lesslucifer/homebrew-tap"
# Jobs that publish after the GitHub Release is created
publish-jobs = ["npm", "homebrew"]

# Actions pinned to the commits their major tags pointed to on 2026-11-09 (DEC-38)
[dist.github-action-commits]
"actions/checkout" = "d23441a48e516b6c34aea4fa41551a30e30af803"
"actions/upload-artifact" = "cf430e030ddbb5b0abf93d22962f4752f3646cd9"
"actions/download-artifact" = "9000827ccba6bdab643e8b6fd33ac0654aef8333"
"actions/setup-node" = "249970729cb0ef3589644e2896645e5dc5ba9c38"

# Ubuntu 24.04 runners instead of dist's 22.04 defaults (DEC-38)
[dist.github-custom-runners]
global = "ubuntu-24.04"
x86_64-unknown-linux-musl = "ubuntu-24.04"
aarch64-unknown-linux-musl = "ubuntu-24.04-arm"
