artifact: wu-plan
status: ready
id: E-CRLIMIT.W1
epic: E-CRLIMIT
title: "E-CRLIMIT.W1 · The review schedule as three settings"
date: "2026-11-24"
page: 2026-11-24-e-crlimit-w1-plan.html
requirement: >-
  keel preflight, keel notes write cr and the sign-off's review history read the code-review schedule as a
  review::Policy {max_rounds, whole_range_rounds, fix_importants_from} from the target's committed
  .keel/config.toml [review] (defaults 3, 1, 2), with round_follows = round < max_rounds && (round <
  fix_importants_from || blockers > 0) and rounds above whole_range_rounds scoped to the last fix; a bad schedule
  (a key that is no integer of 1 or more fitting u32, an explicit whole_range_rounds or fix_importants_from above
  max_rounds, an unknown [review] key) is red 0·review-cap at preflight, refused by the cr writer, and refused
  staged by the pre-commit hook and keel mr commit, while a default above a lowered max_rounds is clamped to it.
maps-to: >-
  Epic E-CRLIMIT, W1 of its plan (wu-summaries E-CRLIMIT.W1); the owner's rulings of 2026-11-24 (the 3-round
  schedule; the schedule configurable in [review]); UC-REV-3 and UC-GATE-1 amended; DEC-50 amended in place.
expected:
  - "With no [review] schedule key on the target, preflight announces 'review round 1 of 3 - scope: the whole range', then after a round-1 FAIL 'review round 2 of 3 - scope: the last fix, <round-1>..<tip>', and the round-2 note records scope 'since <round-1>'."
  - "After a round 2 with importants and no blocker, preflight is red 0·review-cap ('review round 3 runs only after round 2 found a blocker'), the writer refuses a round-3 verdict, and --verdict PASS --fixes <round-2> is written and verify-dod reads it as a PASS."
  - "After a round-2 blocker round 3 runs on the last fix; a round-3 blocker prints 'review cap reached' and the cap's waiver reads 'review cap: 3 rounds, 1 blockers open'."
  - "A target committing max_rounds = 4, whole_range_rounds = 2, fix_importants_from = 3 announces round 2 over the whole range and 'of 4', lets round-2 importants earn round 3, and refuses round 4 after a round 3 with no blocker; the branch's own committed settings never apply; the sign-off history tags that round 2 'full'."
  - "Bad values on the target (0, -1, \"3\", 2.5, a too-large integer, whole_range_rounds = 4 or fix_importants_from = 5 with max_rounds = 3, a misspelt key) are red 0·review-cap naming the key; the same staged are refused by the pre-commit hook and keel mr commit; max_rounds = 1 or 2 alone is accepted (defaults clamped)."
  - "A branch carrying three rounds recorded under the 5-round schedule gets no round 4, and its fix line names the owner's waiver or the fix-PASS; old notes still pass checks 3-5."
test-plan:
  unit: >-
    src/review.rs: the Policy reader (policy_in / policy_at) - defaults, each key, every refusal naming its key,
    the clamp under a lowered max_rounds, unknown keys, a target naming no commit; round_follows / then /
    next_round / fixable / fix_pass / cap / next_step / tags on the defaults and on a configured Policy (the old
    5-2-4 table included). src/main.rs: staged_config_refusal refuses a bad [review] schedule and accepts a good one.
  integration: >-
    tests/suite/verify_dod.rs, red first on the old code: the default 3-round schedule through preflight and the
    writer (scope, round-3 rule, fix-PASS from round 2, cap at 3); a configured target schedule (4/2/3) and the
    branch's own settings ignored; bad target values red 0·review-cap and refused by the writer; bad values staged
    refused by the pre-commit hook and keel mr commit; old 5-schedule notes; the sign-off history tags by the
    target's Policy. The existing 5-round tests are moved to the defaults or to an explicit 5-2-4 target.
  e2e: >-
    tests/suite/review.rs, the epic e2e per the epic plan's e2e-plan: WU A (nits, fix-PASS), WU B (round-2
    importants, no round 3, fix-PASS), WU C (cap at round 3, accepted waiver), a staged bad [review] refused by the
    real pre-commit hook, then a configured 4/2/3 schedule driving WU D, and the epic merge into main.
details:
  design:
    policy: >-
      review::Policy {max_rounds, whole_range_rounds, fix_importants_from}, all u32; Policy::DEFAULT = 3/1/2.
      review::policy(repo, target) replaces review::max_rounds (same target read: rev-parse, peel to commit,
      ls-tree, cat-file blob); policy_at keeps the 'names no commit' error; policy_in(text) parses the TOML and
      applies the one rule. review::schedule_problem(text) gives the bare reason for the staged check.
    rule: >-
      Each set key a TOML integer >= 1 that fits u32; [review] itself a table when present; known keys
      max_rounds, whole_range_rounds, fix_importants_from, modules, rubric; an explicit whole_range_rounds or
      fix_importants_from above the effective max_rounds refused; an unset one defaults then clamps to max_rounds.
    callers: >-
      Schedule::read carries policy (replacing max); next_round, then, fixable, fix_pass, cap, next_step,
      no_round_after, round_follows take &Policy or Policy; Next keeps max for the announce line and gets
      since from round > whole_range_rounds. review::tags takes the Policy; src/mr.rs review_history reads the
      target's Policy (the sign-off knows its target). src/notes.rs prints s.policy.max_rounds.
      src/main.rs staged_config_refusal adds review::schedule_problem after validate (validate itself, also used
      by mr::roster, is not widened: a landed bad schedule never blocks a sign-off).
  files: [src/review.rs, src/main.rs, src/mr.rs, src/notes.rs, src/gate.rs, tests/suite/verify_dod.rs, tests/suite/review.rs, tests/suite/mr.rs, docs/use-cases/workflow.yaml, docs/decisions/review-docs.html, docs/decisions/decisions-index.yaml, docs/use-cases/use-cases-index.yaml]
  not-touched: "No rule-bearing file: skills/, .claude/, templates/, .keel/, AGENTS.md, docs/*.html are W2's."
  own-review: "The installed keel still counts 5 rounds; this WU's review runs on the new table by hand (round 1 the whole range, round 2 the last fix, round 3 only after a round-2 blocker)."
