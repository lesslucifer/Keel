# The docs of every live branch as web pages on GitHub Pages (E-GHFLOW2.W8). It runs after each
# "Keel gate" (a pull request) or "Keel main" (a push of main, E-GHFLOW2.W4) run, from main: GitHub takes a workflow_run workflow from the default branch, so no
# branch can change this file or the builder it runs. The build job reads git data only, with a read
# token; the deploy job holds the Pages token and runs no repository code. No event value reaches a
# run line; the one the jobs read is the build job's if, which skips a run started from a fork.
name: Pages

on:
  workflow_run:
    workflows:
      - Keel gate
      - Keel main
    types:
      - completed

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - run: scripts/pages-build.sh "$RUNNER_TEMP/site"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: ${{ runner.temp }}/site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
