title: "E-APPLIST.W2 · The watchdog's lines"
date: "2026-11-21"
page: 2026-11-20-e-applist-w2-result.html
outcome: >-
  Delivered against the requirement. Each run of the watchdog's facts step now writes, only through
  scripts/router-app.sh with a fixed argv, one set worker/<name> per live worker whose value changed against the
  update log's state, one del worker/<name> per worker gone, then set router as the heartbeat; at most one line per
  key; nothing with no run, a gone router or an unreadable list; and its printed block, its exit 0 and the router's
  message are byte-equal to before. The worker deny list gains scripts/router-app.sh. The owner landed the launcher
  in two typed commits: 95c16af (the change) and cd16ede (the independent review's two LOW findings, fixed at the
  owner's choice). One plan check is met by construction rather than by a test: a red git-dir check writes nothing
  because that path ends the run before the facts step starts; no test starts a run first and then trips it.
deviations:
  - >-
    Review L1, beyond the plan: a session list that is JSON but not readable to its end (a row that is not an
    object) now writes nothing that tick, not even the heartbeat. Before the fix it wrote a del for every live worker
    listed after the bad row. The block keeps the rows read before the bad row, as it always has, so it is
    byte-equal to before for every list (the router's two suggested fixes would each have changed the block for
    some list: skipping non-objects adds workers after the bad row; refusing any non-object turns a null row, read
    whole today, into 'cannot be read').
  - >-
    Review L2 replaces open point 11: a value over router-app.sh's 512-byte cap is no longer refused and skipped.
    It loses one character at a time from the longest (by bytes) of branch, waiting and state until it fits
    (509-512 bytes), so a worker's line is never left stale. The character clips (20, 60, 120) stay. The exit-2 skip
    in the write loop stays as a guard; the watchdog no longer sends a value it can trigger with.
  - "Two case patterns inside the new command substitution take POSIX's leading parenthesis, (watchdog|watchdog-*) and (\"\"|*[!0-9]*): macOS /bin/sh (bash 3.2.57) cannot parse them inside $( ) otherwise. Same behaviour; sh -n and dash -n clean."
  - "Two red-first test commits, not one: 25c6009 (the nine planned tests) and 142ed86 (the review's fixes and test gaps), each before its rule commit. Thirteen new tests in all, and the refused-line case of an existing new test changed by L2."
  - "The epic branch (1494748, holding the W2 and W3 plans) was merged into this branch (548fc1f) before the build, at the router's request, so the WU builds on the signed plan."
  - "The main case could not be run by hand in a scratch project: the session's permission check denied the command (a scratch git repo with a worktree, the real launcher and router-app.sh, a stub session list). The example on the page is the integration tests' run of the same real scripts."
