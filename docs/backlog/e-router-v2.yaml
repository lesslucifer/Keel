# Keel backlog: e-router-v2. Data only, no page (DEC-69). Open rows in full; a closed row is its id, title and how it closed.
# Ids are never reused. Order and next free ids: backlog-index.yaml.
title: "Backlog: E-ROUTER v2"
letter: R
about: >-
  Router work deferred at E-ROUTER's close: open launcher issues, gate coverage of the router's security files,
  the epic e2e, and the accepted worker risk. Each row names the source it was deferred from. E-ROUTER's plan is
  archived out of git; `git show 9787799:docs/work/2026-11-07-router-plan.html` recovers it. Why things are as they
  are: decisions/router.html (DEC-42 - DEC-48 shaped the router as it is now). Rows R1 - R51.
