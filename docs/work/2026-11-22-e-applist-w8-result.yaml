details:
  base: "wu/E-APPLIST/w8-window-foundation off epic/E-APPLIST at 3cfa216"
  guarantee:
    claim: "Only Keel's closed vocabulary reaches the shipped CSS; npm run lint fails otherwise, with no escape hatch."
    where: >-
      app/eslint-rules/emitted.js, run as npm run lint's second step (eslint-rules/check-css.js) and by
      test-window/integration/guarantee.test.ts: src/window/styles.css through Tailwind's PostCSS plugin with the
      shipped tailwind.config.js (as vite.renderer.config.ts runs it), over the content list app/window-sources.js;
      every class in an emitted selector must pass classify() (the closed vocabulary), else exit 1 naming it.
    why: >-
      Tailwind emits CSS only for whole class names written out in its content files. Whatever route a string takes
      at run time (a +, interpolations, tables written later, imports, this., props by reference, nested ESLint
      configs, html pages), either its whole class name is written somewhere in the content set, and the check sees
      it emitted, or it is not, and Tailwind ships no CSS for it. The AST rule cannot reach that bound: each review
      round found routes it did not model.
    one-list: "window-sources.js: SOURCE_GLOBS is Tailwind's content; SCRIPT_GLOBS (the same minus html) is ESLint's files; the html pages are read by the CSS check only."
    pinned-config: "npm run lint runs eslint -c eslint.config.js; the tests use overrideConfigFile; guarantee.test.ts refuses any other eslint.config.* or .eslintrc* under app/. Probe run by hand: a nested eslint.config.js plus Bad.tsx under src/window/probe/sub, npm run lint exit 1, 3 errors (removed after)."
    helper: "design/vocabulary stays at error for fast feedback on honest code: scope-resolved, reads helpers by their returns, reports pieces and what it cannot read; refusing correct code is a bug."
    inline-style: "Inline styles are not Tailwind CSS: the packaged CSP (style-src 'self', no 'unsafe-inline') blocks style attributes, and the helper reports a JSX style and a style in a props object."
    findings:
      - "classes.js:427 adjacent interpolations - moot by the CSS check (probe: an imported PAD = 'p-[13px]' beside ${b}: p-[13px] caught; ${'p-'}${'[14px]'}: no CSS emitted) and fixed in the helper (each glued interpolation reported)."
      - "classes.js:223 a + of two names - moot (probe WHOLE + MORE: dark:bg-ink, p-[13px] caught) and fixed (any + reported as pieces)."
      - "eslint.config.js:10 a nested config - fixed (eslint -c, overrideConfigFile, the config guard; hand probe exit 1) and moot (the CSS check reads no ESLint config: dark:bg-ink, p-[3px] caught)."
      - "classes.js:408 cx identifier, computed and spread keys - moot (blur, grow, transition, p-[15px] caught; the computed piece ships no CSS) and fixed (identifier keys read, computed key read, spread unread)."
      - "classes.js:309 names without scope - fixed (scope manager: shadowing, for-of and catch unread; no false report on a same-named variable or text elsewhere) and moot for the evasion (p-[25px] caught)."
      - "classes.js:321 member writes, push, Object.assign - moot (p-[21px], p-[22px], dark:bg-ink, z-10 caught) and fixed (a table written or handed on after its declaration is unread)."
      - "classes.js:324 a helper's whole body read - fixed (a function is read by its returns; honest.tsx: throw, text constant, exhaustive switch, no report)."
      - "classes.js:120 group and peer markers refused - fixed (legal where their variants are; the CSS check passes group group-hover:text-ink peer peer-checked:bg-primary)."
      - "eslint.config.js:14 content set vs lint set - fixed (one list) and moot (the CSS check reads the html: z-50, p-[13px], dark:bg-ink, grid-cols-3 caught)."
      - "classes.js:195 this. chains - moot (p-[23px] caught) and fixed (this.look, this.props.className unread)."
      - "classes.js:330 props by reference and style in props - moot (p-[24px] caught) and fixed (createElement/cloneElement with a reference, a spread inside a spread literal, a computed key: unread; a style key: reported)."
      - "browser.tsx:23 link contrast - fixed (ink links; a contrast test over both worlds; since mx3a, any text colour a window file uses that the test does not measure, text-primary among them, fails it)."
  design-source: "mx3a, Spectrum Plain (the owner's choice, 2026-11-22): Mistral's type (docs/work/2026-11-22-e-applist-w8-design-mistral.md) on MiniMax's colour (docs/work/2026-11-22-e-applist-w8-design-minimax.md), as built on 67e1bda, adapted to a settings window. Mercury (docs/work/2026-11-22-e-applist-w8-design.md) is history."
  design-rules:
    - "Every value from a token; a new size or colour is a token change in tailwind.config.js (and styles.css for a colour), never a class, an inline style or a hand-written DOM class."
    - "Two worlds, chosen by the Mac: day is light, night is dark; a colour variable flips, no dark: class (the lint refuses it)."
    - "One solid action per card, the primary pill (black by day, white by night); every other action an outline pill with no fill, whose hover is an ink wash (6% by day, 10% by night)."
    - "Every button and badge a pill; cards white with a 1px hairline and 12px corners; rows inside a card split by 1px rules; the title bar the canvas over a 1px hairline; no shadow, no gradient."
    - "Mistral's type: the screen title (34px) and section heads (20px) in New York at 400, tracked in, in sentence case; the system sans for the rest at 400, controls and names at 500, a problem at 600."
    - "A state is a word on a badge whose colour repeats it (set blue, found green, missing red with white words); a problem is words in the problem colour; no state by colour alone."
    - "Contrast: every text pair 4.5:1 and every button edge 3:1 in both worlds; a text colour the window uses that the contrast test does not measure fails it."
    - "A scale with no magnitude (flex, cursor) or derived from spacing (width, margin) is declared with exactly the members the window draws from; an undeclared scale is empty."
    - "Text the main part sends is shown as text, never as markup; a path is shown whole, in mono, and may wrap."
    - "One action in progress at a time: every button is off while a request runs; the outcome is a sentence (role=status); a failed read is a sentence (role=alert)."
    - "Actions first; what you rarely read folded (the PATH's folders)."
    - "A row that names a thing (a tool) is a named group, so a screen reader and a test find its buttons by that name."
  tokens: "colours (day / night, R G B): canvas 255 255 255 / 16 16 16, card 255 255 255 / 27 27 27, line 238 238 240 / 46 46 53, edge 226 226 230 / 56 56 64, ink 17 17 17 / 244 244 246, ink-secondary 88 88 96 / 172 172 182, primary 17 17 17 / 244 244 246, on-primary 255 255 255 / 16 16 16, outline 17 17 17 / 200 200 208, set 219 232 255 / 30 54 120, on-set 22 64 190 / 196 214 255, found 223 245 230 / 22 72 44, on-found 22 101 52 / 186 240 204, missing 214 52 36 and on-missing 255 255 255 in both, problem 190 40 40 / 255 138 128; hover-alpha 0.06 / 0.1; spacing half 4, xs 8, sm 12, row 14, md 16, lg 20, xl 24, xxl 32, huge 40, badge 22, control 32 px; type legal 12, ui-sm 13, ui 14, body 14, body-lg 15, title 17, section 20, heading 34 px; weights 400, 500, 600; radius mark 3, card 12, pill 9999 px; no shadow, no gradient; faces sans system-ui, serif ui-serif (New York), mono ui-monospace"
  live-checks:
    by: "the owner on his Mac, about five minutes, before the sign-off; no package or make"
    steps:
      - "1. cd app && npm ci (about a minute)."
      - "2. npm run dev:browser, then open http://localhost:5173/browser.html (Vite prints the URL; if 5173 is taken it picks the next port). Screen 6 on fixtures under a 'Browser mode: fixtures, not your Mac' line. Switch states by the links in that line, or ?state=one-project, no-project, tool-missing, path-fallback, refusing, failing, slow. Try: no-project then Add a project...; tool-missing (claude missing, git with a problem); path-fallback (the fallback and why); refusing (Keel could not read its state); failing (any button says The request failed); slow (every button off for 0.8 s)."
      - "3. With the page open, System Settings > Appearance: Light, then Dark. The page turns with it, no reload. Or the Light, Dark and Follow the Mac links in the top line (?scheme=light|dark), which force one world without the Mac."
      - "4. Ctrl-C the dev server. npm start (the app unpackaged; the first run downloads Electron). Screen 6 with your real tools; Choose... opens the macOS file dialog; Use the PATH appears for a tool you set; Send a test alert shows the alert and its sentence."
