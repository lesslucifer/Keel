  - id: R31
    title: "The worker file guard misses Unicode case-fold variants"
    status: "open: severity high; owner-waived in E-WMODE.W1 (review round 3, 2026-11-12)"
    problem: >-
      `tr` lowercases ASCII only, and APFS folds U+017F (the long s) to "s", so a `Read` or `Grep` of `~/.<long s>ssh`
      and a `Write` of `<wt>/.claude/<long s>ettings.json` pass (reproduced at guard level).
    proposal: >-
      Compare through the file system (inode or `realpath` of the deny target), not by spelling.
    source: >-
      E-WMODE.W1 review round 3, the last round under the 3-round cap. The owner ruled option C on 2026-11-12: no
      further rounds, no code change, signed with these findings recorded (DEC-37, "Review round 3"). Owner-waived;
      fix in a later router epic. R32 and R33 are live for every worker today, whatever its permission mode.
    taken-by: "unowned: a later router epic"
  - id: R32
    title: "Dependency sources stay shell-writable"
    status: "open: severity high; live for every worker; owner-waived in E-WMODE.W1 (review round 3, 2026-11-12)"
    problem: >-
      `~/.cargo/registry/src` and `~/.cargo/git/checkouts` are under the worker's `allowWrite`, so a worker can edit
      a dependency's `build.rs`, which runs unsandboxed at the owner's next cargo build. Live since DEC-46,
      whatever the mode.
    proposal: >-
      A per-worktree `CARGO_HOME`, or deny `registry/src` and `git/checkouts` after a vendored or pre-fetched build.
    source: >-
      E-WMODE.W1 review round 3, the last round under the 3-round cap. The owner ruled option C on 2026-11-12: no
      further rounds, no code change, signed with these findings recorded (DEC-37, "Review round 3"). Owner-waived;
      fix in a later router epic. R32 and R33 are live for every worker today, whatever its permission mode.
    taken-by: "unowned: a later router epic"
