  live-checks:
    by: "the owner on his Mac, about five minutes, npm start only (no package or make), from the W5 worktree"
    steps:
      - "1. cd /Users/nguyenvanluong/Documents/proj/misc/Keel-E-APPLIST-w5-reader-watcher/app && npm ci (if npm start then says Electron failed to install: node node_modules/electron/install.js)"
      - "2. A scratch project, so your router's real log is untouched: T=$HOME/keel-w5-live; mkdir -p $T/.keel $T/scripts && printf 'code_paths = [\"src/\"]\\n' > $T/.keel/config.toml && cp ../scripts/router-app.sh $T/scripts/ && (cd $T && git init -q -b main && git add . && git commit -q -m init && ./scripts/router-app.sh start owner-check)"
      - "3. npm start. On the project screen: Remove your listed project if there is one (Add brings it back), then Add and choose ~/keel-w5-live."
      - "4. In a second terminal: ~/keel-w5-live/scripts/router-app.sh alert '{\"headline\":\"W5 live check\",\"lines\":[\"One alert at your desk.\"],\"wu\":\"E-APPLIST.W5\"}' - within a second (a minute at most) one macOS alert, 'W5 live check' over 'One alert at your desk.', from Electron (the unpackaged app's name). If macOS asks, allow Electron's notifications."
      - "5. Close the window (the app keeps running). Click the alert (in Notification Centre if it has gone): the window opens. What it points at is drawn by W6."
      - "6. Quit (Ctrl-C in the npm start terminal) and npm start again: no alert."
      - "7. Quit; then for i in 1 2; do ~/keel-w5-live/scripts/router-app.sh alert \"{\\\"headline\\\":\\\"While closed $i\\\",\\\"lines\\\":[\\\"line $i\\\"]}\"; done; npm start: one alert, '2 alerts while Keel was closed'."
      - "8. node --test test/integration/watch-view.test.ts: 5 tests pass, none skipped (real file events)."
    reset: "Quit the app; npm start, Remove keel-w5-live and Add your Keel checkout back; quit; rm -rf ~/keel-w5-live. The app's alerts.json in its folder (~/Library/Application Support/Keel) may stay: it is keyed by the scratch run."
