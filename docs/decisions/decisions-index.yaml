# Keel decision index: data only, no page (DEC-69). Read it first, then open only the decision page you need.
# Per record: id, title, the page that holds it, live or replaced-by. Ids are never reused: check every live
# branch before minting next-free. Trawler lineage: git history of decisions-index.html; backlog B5 holds what is open.
next-free: DEC-79
removed: >-
  Never reused: DEC-60 - DEC-68 were GitHub's flow (E-GHFLOW, E-GHFLOW2). E-GHREVERT removed them with the flow (the
  owner's ruling of 2026-11-19, DEC-70, amended); git history keeps their text.
pages:
  - file: distribution.html
    title: "Decisions: distribution and adoption"
    scope: >-
      Why Keel is one CLI that carries its own rules, how a project adopts it, and how Keel itself is run.
    topics: ["One CLI that carries its rules", "Install channels and release", "Adoption and defaults"]
  - file: workflow-gates.html
    title: "Decisions: workflow gates"
    scope: >-
      Why the notes, the merge gate, the human sign-off, the work process, Keel's own test suite and the local app
      are the way they are. Check here before "fixing" anything that looks deliberate.
    topics: ["Notes", "Merge gate", "Human sign-off", "Workflow process", "Keel's own test suite", "The local app"]
  - file: review-docs.html
    title: "Decisions: reviews and docs"
    scope: >-
      How code is reviewed (scope, waivers, the 5-round schedule, nits) and how docs are written, checked and kept
      short. Check here before "fixing" anything that looks deliberate.
    topics: ["Code review", "Documentation"]
  - file: router.html
    title: "Decisions: the router and its workers"
    scope: >-
      Why Keel's router has the posture it has, how its workers are started, bounded and watched, and what risk the
      owner accepted.
    topics: ["The router", "Workers: model, messages, sessions, watchdog", "Worker limits and accepted risk"]
  - file: router-hosts.html
    title: "Decisions: router hosts"
    scope: >-
      The router on DeepSeek Harness and the inbox that wakes it.
    topics: ["DeepSeek Harness (DSH)", "The inbox"]
  - file: app.html
    title: "Decisions: the local app's build"
    scope: >-
      How the local app's window is built, styled, tested and developed, what E-APPLIST leaves out, and how the app
      and the router's update log were built. Why the app exists and what it may do stays DEC-70, in
      workflow-gates.html.
    topics: ["The window", "E-APPLIST's scope", "How E-APPLIST built it"]
