    status: "struck at the E-LOCALTOOL close (2026-11-19): taken by E-GHREVERT"
    problem: >-
      Test-only nits from the passing code reviews; none changes a result. W2's were waived by its round 2 PASS; W3's
      round 2 PASS left them "to fix after this PASS", and no fix followed before the close. E-GHFLOW2.W5 fixed W3's
      test-strength rows on its own branch (`b365291` on `wu/E-GHFLOW2/w5-tryit`), but W5 was dropped unmerged, so
      those rows stay open here. E-GHFLOW2.W6 did github-flow G8's four W3 code-review nits. W2's four rows (items 1 -
      4) are done by E-GHFLOW2.W3, but the corpus's serial cost: the App key is made once per run and copied; the
      fixture and the argument checks take a `HOME` the script accepts under any `TMPDIR`; the argument checks share
      one curl stub; the dash invariant covers the mode word and `--base` and asserts each reason. The guard-agreement
