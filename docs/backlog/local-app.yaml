  - id: A6
    title: "Review the plan-WU flow"
    status: open (the owner's ruling of 2026-11-20)
    problem: >-
      A WU plan is written on its own WU branch, signed and merged into the epic early, before the WU's code; E-KEELFIX
      ran it four times (W1, W2, W3, W5). The owner wants the flow looked at as a whole.
    proposal: >-
