outcome: >-
  Delivered. keel preflight, keel notes write cr and the sign-off's review history read review::Policy
  {max_rounds, whole_range_rounds, fix_importants_from} from the target's committed .keel/config.toml [review],
  defaults 3, 1, 2 (5, 2, 4 restore E-CRCAP's schedule); round_follows = round < max_rounds && (round <
  fix_importants_from || blockers > 0); rounds past whole_range_rounds review the last fix. One rule
  (review::policy_in) refuses a key that is no integer >= 1 fitting u32, an explicit whole_range_rounds or
  fix_importants_from above max_rounds, a non-table [review] and an unknown key, and lowers a default above a lowered
  cap: red 0·review-cap at preflight naming the key, refused by the cr writer, refused staged by the pre-commit hook
  and keel mr commit (main::staged_config_refusal). Old notes still pass checks 3-5 and are counted on the new
  settings. Every expected line of the plan is met by a test.
deviations:
  - "The sign-off's history (src/mr.rs review_history) does not refuse when the target's schedule is refused: it tags rounds by the defaults and prints one line naming the refusal. A bad schedule blocks the review (preflight, writer), never the owner's sign-off or waiver; the plan named only 'history tags read the target's Policy'. main::validate, which mr::roster also runs, is not widened for the same reason."
  - "review::Schedule::read and review::policy return (what, fix) pairs, so a refused schedule carries its own fix line (correct [review] on the target) instead of preflight's generic 'fix the repo state'; src/notes.rs maps it through its refuse()."
  - "DEC-26's sentence on what the CLI reads from [review] was amended too (it named max_rounds only), and the use-case index's UC-REV-3 title follows the new title ('the review follows the target's schedule'). Not in the distillation plan; the code wins."
  - "A history tag for a round recorded under the old schedule reads '[round 2, since <c>; the note records round 2, full]' (both recorded fields, as tags already printed), not '...records full'."
  - "The plan's real-run example was to be run in a scratch repo; that command was denied by the sandbox's permission check and not retried. The page's example is the same flow as the integration and e2e tests run it through the real binary and hooks."
