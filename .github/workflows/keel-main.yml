# Keel's tests on each push of main (E-GHFLOW2.W4; before, keel-gate.yml's push run). main moves only
# by a merged pull request once the rulesets are on, so this file is main's own. Its one job is
# named main/ci, never a required name: a pull request whose head is main's commit (a back-merge)
# carries this run's checks too, and they must not stand in for keel/ci, keel/gate or keel/docs.
# keel is built from main (the pushed commit) by scripts/ci-gate.sh; read token, no secret, no
# credential kept, no cache; event values reach the script only through env.
name: Keel main

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: keel-main-${{ github.sha }}
  cancel-in-progress: false

jobs:
  ci:
    name: main/ci
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - run: rustup component add rustfmt clippy
      - run: scripts/ci-gate.sh ci
        env:
          HEAD_BRANCH: ${{ github.ref_name }}
          HEAD_SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
          HEAD_REPO: ${{ github.repository }}
