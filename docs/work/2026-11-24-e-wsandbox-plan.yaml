  w9-effort-policy:
    ruling: "Owner, 2026-11-26: 'From now, later workers use low effort except planner workers, who use high.' Asked about the DSH/Claude Code wording: 'it's different wording between DSH & claude. Maybe we can have a WU to resolve that.' The ruling is the policy; W9 ruled the key shape, the planner role and what a worker may still ask for, below."
    facts:
      claude-code: >-
        .keel/config.toml:61-62: worker_efforts = ["medium", "high"], worker_default_effort = "medium".
        scripts/router-worker.sh:469-471 defaults --effort to worker_default_effort and refuses one outside
        worker_efforts; :544 passes --effort; :81 and :586 record it in the run dir and the RUNNING line; read_policy
        (:181-208) refuses any unknown line in [router] (the catch-all sets bad=1), so a new key such as
        planner_effort refuses the whole policy until the parser learns it. DEC-39 is the decision ('workers run on
        opus at medium or high effort; the policy lives in .keel/config.toml [router] and the launcher enforces it').
        project-router SKILL.md:67 says 'opus, --effort medium by default, --effort high for design, review and
        debugging'; :42 runs the review worker at high.
      dsh: >-
        The DSH route (provider deepseek-official, model deepseek-flash) exposes off | low | high (default) | max
        (list_subagent_models, 2026-11-26); worker_spawn's effort is optional and omitted means the route's default,
        so omitting it is the high trap. keel-router SKILL.md:275-277 is the host dispatch table (Claude Code launcher
        vs DSH worker_spawn) and :335-337 says the effort may be the policy's default.
      today-differs: "The launcher's policy names medium/high with medium as the default; the DSH route has no medium, defaults to high, and adds off and max. That is the wording the owner asked a WU to resolve."
    policy: >-
      One host-neutral policy: a role names a level both hosts carry - worker = low, planner = high. off and max are
      not used (the policy never asks for them); medium and xhigh leave worker_efforts, because the ruling replaces
      them and DSH has neither.
    key-shape-recommended: >-
      Keep the flat [router] grammar: worker_default_effort = "low"; a new planner_effort = "high"; worker_efforts =
      ["low", "high"]. The launcher's parser accepts only key = "word" or key = ["word", ...] and validates --effort
      against worker_efforts, so one worker_effort policy string would need a new grammar and still a second role.
      Alternative considered and not recommended as the default: one worker_effort string with the role table in the
      skill, which hides the second role outside the committed keys.
    mapping: >-
      Claude Code: the router passes --effort low for a worker (or omits it: the launcher default is low) and --effort
      high for a planner; the launcher refuses anything outside worker_efforts (medium included, once it is
      narrowed). DSH: the router passes worker_spawn's effort = low or high explicitly and never omits it (omission is
      the high default). The launcher takes the role explicitly (--role worker|planner), and a planner authors a plan or a
      design while reviews, builds, fixes and checks are workers.
    facts-to-update: >-
      project-router SKILL.md:42 (the review row's --effort high) and :67 (the 'medium by default' sentence); both
      keel-router copies (skills/keel-router and .claude/skills/keel-router, kept equal by
      init::every_keel_router_file_equals_its_self_hosted_copy): SKILL.md:275-277 and :335-337, plus
      references/worker-ops.md:4,104-105 and references/checklists.md:29 if they repeat the old default;
      docs/architecture.html:119 (the [router] keys row); DEC-39 in docs/decisions/router.html (Amended row);
      .keel/config.toml and scripts/router-worker.sh.
    tests: >-
      tests/suite/router.rs: worker_policy_reads_an_optional_watchdog_model (the policy read) and
      launcher_starts_a_worker_as_a_background_session_with_the_grant_and_a_validated_mode (the --effort
      validation); a new text test (e.g. effort_policy_is_one_wording_across_the_skills) reads the committed [router]
      keys and the skill texts and asserts the key names match and no skill names medium as the worker default; a
      launcher test that --effort medium is refused and high is accepted.
    order: >-
      After W2-W4 (their one commit edits the launcher) and before W5 (its resume flag builder reads the policy).
      Trade-off: one small launcher commit before W5; the W2-W4 and W9 workers themselves still spawn under the old
      medium default, since W9 cannot govern its own worker.
