    source: >-
      E-LOCALTOOL.W5 result, P4 to P6, and the close's walk-through.
    taken-by: "E-APPSIGN"

  - id: A5
    title: "E-APPFLEET · Fleet, epics, many projects"
    status: after A3, A4
    problem: >-
      First use: the fleet (n4), the epics (n5) and many projects (n7).
    proposal: >-
      Parts: screens 4 and 5 (one epic, one worker); Attach (K13); your note to a worker through the router's inbox
      (K11); the router's conflict and paused-epic lines (K6, K7) and a worker's last report line (K8); many projects
      on screen 6, with "Add a project" listing what is missing first (E-GHSETUP W6's idea). From the close's
