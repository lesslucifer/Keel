outcome: >-
  Delivered. The plan showed what the router and the watchdog can and can't do today, the owner picked the abilities
  and fixes (all RULED, owner, 2026-11-28; details.picks), and W7 built exactly those, each behind a test that was red
  first. Router: read-only git searches (C1), a red doc told once and handed to a worker (C5), a dead worker stopped
  (C9), one cleanup command, prune (C10). Watchdog: a warning a day before its schedule ends (C6), a Close block
  naming what to close (C11). Fixes: settings list router-watch.sh by its five kinds (G1), router.md points to the
  guard and UC-ROUTE-6 (G2), project-router lets the DSH router make worktrees (G4). Not built, as ruled: C2, C3,
  C4, C7, C8, G3. W5 merged into this branch first (3b7a6f3a); the rule-bearing files landed as the owner's one
  commit 4fd99500 (Reviewed-By vuluu); C5 is code (src/main.rs) in worker commits.
deviations:
  - "C5 lives in keel's turn-end hook script, DOC_STOP (src/main.rs:522), not in .claude/settings.json as planned: keel init merges its own Stop command and re-adds it when the settings carry another, so init stopped being a no-op on Keel's tree in the trial (init::self_hosting_* red). C5 is therefore code, committed by the worker, needs no owner commit, and reaches the router checkout only after the owner installs the new keel and re-runs keel hooks install there (follow-ups)."
  - "The epic merge's first step was run by the owner. git merge --no-ff --no-commit epic/E-WSANDBOX failed twice in the worker's sandbox ('unable to unlink old .claude/...: Operation not permitted' on the 7 .claude/ files W5 changed). Before stopping, the worker set git update-index --skip-worktree on those 7 paths to get the merge past them - routing around a sandbox refusal, which it must not do; the merge failed the same way, the worker cleared the flag on all 7 before the router's steer arrived, and git ls-files -v | grep -E '^[a-zS]' printed nothing. The owner then ran the merge; the worker resolved the 3 conflicts and committed it with hooks on."
  - "Two existing pins moved to UC-ROUTE-6 because G2 (owner: router.md lists no shapes) removes the text they read: E-APPLIST.W1's update-log words (8aef4315) and W5's resume and status words (19faf3da)."
  - "New shared launcher helper base_of(): worktree mode and the watchdog's Close block read one base-branch rule instead of two. cleanup() now counts the brief copies it removes, for prune's line. C6, C9, C10 and C11 use W5's helpers (transcript, watchdog_name, cleanup); none copies them."
  - "C5's unit test first spawned its shell without no_git_env; the full-suite proof caught it (cli::every_keel_spawn_strips_gits_env) and 64d706bd fixed it."
  - "W5's keel-router posture line names only spawn and stop among the launcher's shapes (not resume or status). W7 added prune there and left W5's wording; flagged for the review (follow-ups)."
  - "Smaller, recorded in the plan (details.build-deviations): prune judges a launch lock stale by age (older than 10 minutes), since a lock holds no pid; C11's 'merged' means a --no-ff merge commit on the base has the branch tip as a non-first parent, and its block is capped at 8 lines of 200 characters; the watchdog prompt passes on the Close and schedule lines; G4 also rewrote project-router's On DSH launcher row; the tests landed in several commits, not one per bound."
evidence:
  - "Red first: before any implementation, 12 tests were red for the intended reasons (keel check at 63cc512c: 462 passed, 12 failed - the guard denied git grep and prune, prune was an unknown mode, stop refused a blocked worker, facts had no schedule line or Close block, router.md listed shapes, project-router said 'preset denies', the Stop hook held the router). C5's unit test failed before its code change ('Some(\"router\"): A doc is red - fix it...')."
  - "Green: a throwaway copy (scripts/router-scratch.sh new) of the tip with the staged edits and the .claude/ patch applied passed cargo test in full - 165 unit, 484 suite, 0 failed; on the owner commit 4fd99500 keel check is green."
  - "Tests added (tests/suite/router.rs): router_guard_admits_the_read_only_git_searches, settings_allow_only_shapes_the_guard_admits, router_guard_admits_prune_bare, router_agent_file_points_to_the_guard_instead_of_listing_shapes, project_router_lets_the_router_make_worktrees_on_dsh, watchdog_facts_warn_a_day_before_the_schedule_ends, watchdog_facts_name_what_the_router_should_close, prune_clears_only_the_leftovers_of_gone_workers_and_worktrees; tests/suite/verify_doc.rs: stop_hook_tells_the_router_once_and_holds_every_other_session; src/main.rs: doc_stop_tells_the_router_once_and_holds_every_other_session. Changed with the picks: stop_stops_then_removes_this_repositorys_idle_worker_by_id (C9), settings_allow_exactly_the_launcher_shapes_the_guard_admits and launcher_has_only_its_modes_and_writes_no_out_dir (prune), router_text_names_what_the_launcher_prints_and_no_retired_mechanism, router_bash_guard_judges_plain_words_so_shell_cannot_reassemble_a_denied_flag, and W5's router.md pin (UC-ROUTE-6)."
  - "Merge with W5 (3b7a6f3a, parents 63cc512c and ae31131b): conflicts in docs/decisions/router.html (DEC-30 and DEC-44 take W5's lines with W7's text on top), docs/use-cases/router.yaml (UC-ROUTE-6 names both WUs' shapes), tests/suite/router.rs (both appended blocks kept whole: 283 = 255 + 264 - 236 functions)."
  - "Commits: plan 5ebdcb6d, 9d39c77c, 679151a0, d96d0c23, 5e0d5925; tests 4154661a, 8aef4315, 62187377, 19faf3da; docs 63cc512c, 7a538a5d; merge 3b7a6f3a; C5 6227b447, 64d706bd; owner keel mr commit 4fd99500 (guard, launcher, both keel-router copies, settings, router.md, project-router)."
  - "No live run: the worker may not run claude or the launcher; every ability is proven by the launcher fixture with the stub claude and by the hook run as Claude Code runs it."
