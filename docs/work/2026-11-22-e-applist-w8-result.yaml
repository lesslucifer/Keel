details:
  base: "wu/E-APPLIST/w8-window-foundation off epic/E-APPLIST at 3cfa216"
  design-source: "docs/work/2026-11-22-e-applist-w8-design.md (the owner's DESIGN.md, Mercury), adapted to a settings window"
  design-rules:
    - "Every value from a token; a new size or colour is a token change in tailwind.config.js (and styles.css for a colour), never a class, an inline style or a hand-written DOM class."
    - "Two worlds, chosen by the Mac: the design file's day world is light, its night world dark; a colour variable flips, no dark: class (the lint refuses it)."
    - "One saturated colour, indigo, for the most important action: at most one solid primary button per card; every other action a translucent tinted pill (indigo 10% by day, periwinkle 20% by night)."
    - "Actions are capsules (xl 32px for the primary, pill 40px for the rest); cards are rounded md (12px) and stand off the canvas by fill alone; rows inside a card are split by 1px rules; no shadow."
    - "Type is light: body 400, UI 420, headings 480, eyebrows 500; nothing above 500; uppercase only for small eyebrows."
    - "No status greens, ambers or reds: a state is a word in a badge whose tone is loudness (choice, quiet, strong); a problem is ink at 500."
    - "A scale with no magnitude (flex, cursor) or derived from spacing (width, margin) is declared with exactly the members the window draws from; an undeclared scale is empty."
    - "Text the main part sends is shown as text, never as markup; a path is shown whole, in mono, and may wrap."
    - "One action in progress at a time: every button is off while a request runs; the outcome is a sentence (role=status); a failed read is a sentence (role=alert)."
    - "Actions first; what you rarely read folded (the PATH's folders)."
    - "A row that names a thing (a tool) is a named group, so a screen reader and a test find its buttons by that name."
  tokens: "colours canvas, card, line, ink, ink-secondary, primary #5266eb, on-primary, tint (day: #fbfcfd, #edecfb, fog, #28253b, #554e7b, indigo at 10%; night: #171721, #1e1e2a, slate, #ededf3, fog, periwinkle at 20%); spacing half 4, xs 8, sm 12, md 16, lg 20, xl 24, xxl 32, huge 40, badge 22, control 32 px; type eyebrow 11, legal 12, ui-sm 13, ui 14, body 14, body-lg 15, title 17, heading 22 px; weights 360, 400, 420, 480, 500; radius xs 4, sm 8, md 12, lg 16, xl 32, pill 40, full; no shadow; mono ui-monospace"
  live-checks:
    by: "the owner on his Mac, about five minutes, before the sign-off; no package or make"
    steps:
      - "1. cd app && npm ci (about a minute)."
      - "2. npm run dev:browser, then open http://localhost:5173/browser.html (Vite prints the URL; if 5173 is taken it picks the next port). Screen 6 on fixtures under a lavender 'Browser mode: fixtures, not your Mac' line. Switch states by the links in that line, or ?state=one-project, no-project, tool-missing, path-fallback, refusing, failing, slow. Try: no-project then Add a project...; tool-missing (claude missing, git with a problem); path-fallback (the fallback and why); refusing (Keel could not read its state); failing (any button says The request failed); slow (every button off for 0.8 s)."
      - "3. With the page open, System Settings > Appearance: Light, then Dark. The page turns with it, no reload."
      - "4. Ctrl-C the dev server. npm start (the app unpackaged; the first run downloads Electron). Screen 6 with your real tools; Choose... opens the macOS file dialog; Use the PATH appears for a tool you set; Send a test alert shows the alert and its sentence."
    worker-tried: "npm ci green. dev:browser and npm start both refused by the sandbox: listen EPERM on ::1 (ports 5199 and 5173)."
