      walk-through: an alert about an epic opens that epic's view, not the list. Waits on: A3, A4.
    source: >-
      E-LOCALTOOL.W5 result, P4 to P6, and the close's walk-through.
    taken-by: "E-APPFLEET"

  - id: L1
    title: "Message the router from the app"
    status: later
    problem: >-
      Need n8: a free message to the router, by a way only you can use (never the inbox, where a worker can post).
    proposal: >-
      Candidates: Claude Code's channels or its per-session message socket; how an outside program posts on the
      socket is not checked.
    source: >-
      E-LOCALTOOL close.
    taken-by: "no epic yet"

  - id: L2
    title: "Alerts when you are away"
    status: later
    problem: >-
      Need n9. Until the app sends both alerts, Telegram stays the router's, and one event may alert you twice at the
      desk.
    proposal: >-
      The app sends both the desk alert and the away alert and picks one.
    source: >-
      E-LOCALTOOL close.
    taken-by: "no epic yet"

  - id: L3
    title: "A home other than GitHub for releases and your pushes"
    status: later
    problem: >-
      Need n10. Releases need a build on your Mac (`dist build`), a place for the binaries, and the npm and Homebrew
      tap tokens.
    proposal: >-
      Your pushes need another remote, such as a bare repository on a disk, with the same push hook.
    source: >-
      E-LOCALTOOL close.
    taken-by: "no epic yet"

