artifact: wu-result
status: ready
id: E-WSANDBOX.W5
epic: E-WSANDBOX
title: "E-WSANDBOX.W5 result: resume a stopped worker, and reuse it when that is cheaper"
date: "2026-11-28"
page: 2026-11-28-e-wsandbox-w5-result.html
outcome: >-
  Delivered, design A. `scripts/router-worker.sh resume <name>` brings back the newest stopped run of exactly that
  name through the spawn's checks and argv build, with every flag rebuilt from the committed policy plus
  `--resume <id>` and a fixed resume prompt, and refuses what it cannot rebuild; `status [<name>]` reads context,
  peak, idle minutes, warm or cold cache and `fits` from transcript usage records and timestamps only; `[router]`
  holds `reuse_max_context_cold = 200000` and `reuse_max_context_warm = 400000`; the guard, settings and router.md
  admit `resume <name>` and `status [<name>]` by name only; both keel-router copies and project-router state one
  reuse rule and no longer say a stopped worker is never revived. The owner's probe (2026-11-28) chose design A:
  a resume after `claude stop` and `claude rm` kept the history and the session id, so `stop` is unchanged. The
  twelve rule-bearing files landed as the owner commit `58f05f51`.
deviations:
  - "No separate flag-builder function: spawn and resume run the same code from the worktree checks through the argv build to the start, with a few `if resume` branches. One builder in effect, a smaller diff to merge with W7."
  - "resume refuses a live session before it checks the brief's sha256, the transcript and the branch; a test pins that order."
  - "status lists the newest run first by the run dir's second, ties broken by name; its test compares the lines as a set, since its four spawns share a second."
  - "The transcript is found by Claude Code's project slug (every non-alphanumeric character as '-'); a path long enough for Claude Code to hash its slug reads as transcript=none (a known limit)."
  - ".claude/agents/router.md changed although the plan said 'only if a tool line changes': its Bash posture lists the launcher shapes and a test now pins them."
  - "Backlog R55 was added (from the probe: stop gives up when `claude rm` refuses right after `claude stop`), and backlog-index next-free is R56."
  - "The worker's sandbox refused writes to `.claude/settings.json`, `.claude/agents/router.md` and `.claude/skills/` (\"Operation not permitted\"); those six files went to the owner as a patch, `.router/w5-owner-apply.patch`, not through the worker's staging."
  - "Patch episode: the owner's first `git apply` and `git add` of the patch succeeded; a second run of the same chain errored ('patch does not apply' on all six files) because the content was already there (`git apply --reverse --check` passed, the mirrors equal skills/). Nothing was rebuilt."
  - "With the patch in place one test was red: the documented-shapes guard test mapped the new `resume *` settings entry to spawn-style arguments the guard rightly refuses. Fixed in the test only (c269acd3); the guard was right."
  - "An earlier text-test bug, fixed before the owner commit (29bf95b8): the ceiling-number check matched an existing `7200000` timeout; it now matches whole numbers."
evidence:
  - "Red first: on the old launcher with the new tests (commit 527d3496), `cargo test --test suite router::` gave 86 passed, 11 failed - the eleven new or rewritten pins."
  - "Green: `keel check` on c269acd3 with the owner's staged files in place - 164 passed (unit), 471 passed, 0 failed (suite), 'check green'; and again on the result tip."
  - "Tests in tests/suite/router.rs: resume_rebuilds_the_spawn_argv_and_adds_only_the_recorded_session, resume_refuses_what_it_cannot_rebuild_before_any_start, status_reads_context_and_cache_from_usage_records_at_a_fixed_clock, the_reuse_ceilings_are_two_digit_keys_given_together_warm_not_below_cold, router_guard_admits_resume_and_status_by_name_alone, the_reuse_rules_are_stated_once_by_their_keys; rewritten pins: launcher_has_only_its_modes_and_writes_no_out_dir, router_guard_admits_spawn_and_stop_and_refuses_wait_send_and_a_resume_with_arguments, settings_allow_exactly_the_launcher_shapes_the_guard_admits, the epic e2e's guard step, router_text_names_what_the_launcher_prints_and_no_retired_mechanism, committed_worker_policy_is_low_for_a_worker_and_high_for_a_planner_in_auto_mode; the stub claude keeps a --resume id."
  - "Probe (owner, 2026-11-28, Keel-probe): transcript e926a2ea-d395-4769-be11-43c1c3558953.jsonl - turn 1 'Remember the word heron' then 'OK.'; stop, rm, `--bg --resume`; 05:13:57 'Which word were you asked to remember?' and 05:13:58 'heron'; the same id e926a2ea and sessionId before and after."
  - "Commits: b2d807ca, 40da8cb4, 48ce1464 the plan pair and its rulings; 527d3496, 29bf95b8, c269acd3 the tests; a91e80fa DEC-30/43/44/46, UC-ROUTE-1/5/6, backlog R23 and R53 done, R55 added; 58f05f51 the twelve rule-bearing files (owner `keel mr commit`, Reviewed-By vuluu); this result pair."
distillation: >-
  Landed in this WU: DEC-30, DEC-43, DEC-44 and DEC-46 amended in place (resume by name, status, the reuse rule, the
  probe's finding), UC-ROUTE-1, UC-ROUTE-5 and UC-ROUTE-6, backlog R23 and R53 closed and R55 added (T2); the
  keel-router skill's Workers section and project-router (T1, rule-bearing, in the owner commit). The plan and this
  result are T3 and archive at epic close.
follow-ups:
  - "R55 - stop retries `claude rm` and runs its cleanup whatever rm returns: the next router epic (backlog e-router-v2 R55)."
  - "The live proof - a probe-clone worker spawned, told a word, stopped, resumed by the launcher, answering the word under the same session id, still refused a Write outside its worktree, and `status` matching its transcript: E-WSANDBOX epic e2e (after W7)."
  - "The independent review round and the WU sign-off: a fresh review worker in this worktree, then the owner."
details:
  probe:
    outcome: A
    question: "Does claude --bg --resume <sid> after claude stop and claude rm keep the history and the session id?"
    answer: "Yes: the resumed turn answered 'heron', the session id e926a2ea stayed the same, and the transcript stayed on disk after rm."
    noise: "The probe clone's own keel Stop hook (a red doc) drove both turns into doc edits through a Claude-managed worktree (EnterWorktree); the leftover lock on that worktree made a later rm refuse (pid 98725, not checked: ps was denied to the worker). Recorded as R55."
