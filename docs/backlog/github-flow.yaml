# Keel backlog: github-flow. Data only, no page (DEC-69). Open rows in full; a closed row is its id, title and how it closed.
# Ids are never reused. Order and next free ids: backlog-index.yaml.
title: "Backlog: the GitHub flow"
letter: G
about: >-
  What E-GHFLOW left for the next GitHub-flow epic: six planned work units, the live checks owed on GitHub, the router
  skills, and the follow-ups of the three units that landed. E-GHFLOW closed on 2026-11-15 with three of its nine work
  units: GitHub runs the checks as a signal (DEC-60), the router bot pushes work branches and opens pull requests
  (DEC-61), and the router hears its commanders through GitHub (DEC-62). The owner ruled that day: land those three on
  main early, close the epic, and start a new epic for the rest, run through the GitHub flow. The contracts are
  UC-GATE-7, UC-ROUTE-1, UC-ROUTE-6 and UC-ROUTE-7. Distilled from E-GHFLOW (epic plan v4, W1 - W3 results, close);
  E-GHFLOW2 landings 1, 2 and 3, and its close. The flow is dropped (E-LOCALTOOL close, 2026-11-19): the owner ruled to
  go back to before GitHub's flow, as soon as possible, in one revert epic, E-GHREVERT (backlog local-app A1), recorded
  in DEC-70. G2, G4, G5, G7 and G10 are struck to it: their live checks, CI follow-ups, test nits and approval follow-ups
  belong to code the revert deletes, and the owner's setup steps become its step 1, switching the settings off. G11
  (the bot's stale base) is struck the same way. G1, G3, G6, G8 and G9 stay as history. The flow and its records stand
  until E-GHREVERT lands; this topic is closed then. The rows keep their text.
open:
  - id: G4
    title: "CI follow-ups from W1"
    status: "struck at the E-LOCALTOOL close (2026-11-19): taken by E-GHREVERT"
    problem: >-
      Three W1 follow-ups on the CI workflow, listed as items.
    proposal: >-
      See the fix direction in each item.
    source: >-
      E-GHFLOW.W1 plan open points 4 and 6, and its result's follow-ups.
    taken-by: "E-GHREVERT (backlog local-app A1)"
    items:
      - >-
        row 1, Cost: each push runs three uncached debug builds of keel, one per job. Fix direction: cache the base
        build, or build once and share the binary between jobs.
      - >-
        row 2, A range walk on pushes to `main`: a push to `main` runs `ci` only (W1 plan open point 4); the pushed
        range's seams are the local pre-push walk's job. Fix direction: a CI `keel verify-dod range` job, if wanted once
        `main` moves only on GitHub (github-flow G1, W5).
      - >-
        row 3, Pinning the Rust toolchain: `ci` uses the runner's stable plus `rustup component add rustfmt clippy`, so
        a newer clippy shows on GitHub first. Fix direction: a toolchain file, if it bites.

  - id: G5
