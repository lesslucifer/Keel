      evidence: "250; one row per note (keel-workflow §3, DEC-13 - DEC-18)"
      router: "350; one line per tool, may-not lists go (keel-router skill; DEC-46, DEC-48, DEC-63); the DSH worker plugin paragraph becomes one line (UC-DSH-1 - UC-DSH-4, DEC-55, DEC-56)"
