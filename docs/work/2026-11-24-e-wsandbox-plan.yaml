  w5-resume:
    request: "Owner 2026-11-26: 'that rule is absolutely wrong, I DO WANT the worker to be able to resume, let's add that to the wsandbox to fix'. Reason: reuse saves tokens; a fresh session re-reads everything."
    rule-today: "scripts/router-worker.sh:24-27 (stop runs claude stop then claude rm; 'A stopped worker is never revived (DEC-46: a plain --bg --resume drops every launch flag)'); DEC-30, DEC-44, DEC-46; UC-ROUTE-5 (router.yaml:109-110, 162); keel-router SKILL.md:267, 282, 314-315 and references/worker-ops.md:146-149 (both copies); project-router Workers ('there is no resume'); tests/suite/router.rs:1985-1999, 2013-2030, 4758-4800."
    verified-from-code: |-
      Claude Code 2.1.288 (~/.local/share/claude/versions/2.1.288; strings, not run):
      - stop: 'Stop a background session. Its conversation is kept: `claude attach <id>` opens it again, `claude --resume` works once it is stopped'.
      - rm: 'Delete a background session, and its worktree when that is safe. Works on sessions that have already exited'; its refusal text says it removes 'worktree and job state'.
      - --bg with --resume: 'With --resume <session-id>, continues that session in the background under the same ID, or starts a copy and says so when the session is already running'; '--bg manages the session id; ignoring --session-id (use --resume <id> to continue an existing session)'. The launch request of mode resume carries the command line's own flags (flagArgs), so the flags must be passed again.
      - respawn: 'Restart a background session ... so it runs the current Claude Code version'; it resumes the saved transcript with the job state's saved respawnFlags.
      - A running background session rewrites its own saved respawnFlags when its --permission-mode, --model, --effort, --name or --advisor changes (function PH, called from those paths). So saved flags are not the committed policy.
    verified-on-disk: |-
      - Job state: ~/.claude/jobs/<short id>/state.json. Every launcher worker's state lists respawnFlags with -n --effort --agent --setting-sources --strict-mcp-config --settings --allowedTools --disallowedTools --permission-mode --model; this worker's has 97 items, 78 Bash rules, the sandbox JSON, mode auto, agent worker, sources project,local (names and counts read; no env, no text).
      - The plain-resume probe of 2026-11-11 left a job whose saved flags are only --permission-mode, template router: P3(i) as recorded.
      - Transcript: ~/.claude/projects/<cwd slug>/<session id>.jsonl. All 554 session ids recorded in .router/runs/*/session have a transcript; only 36 have a job dir. So claude rm deletes the job state and keeps the transcript; the brief's 'history does not survive claude rm' is not so on disk.
      - Retention: transcripts are cleaned after cleanupPeriodDays (default 30, schema text); which session runs the cleanup for workers loaded with --setting-sources project,local is unverified.
    earlier-probe: "W8 probe P5 (2026-11-11, plan v3 627a29a; backlog R23): claude --bg -n <name> --resume <sid> of a stopped session with spawn's full flag set kept the sandbox, the persona, the name, no MCP and the earlier conversation. Whether that session had also been rm'd is not recorded."
    needs-live-probe:
      - "A resume after claude stop and claude rm keeps the history and the session id (decides the open question on resume and stop)."
      - "Whether a stopped, not removed, session is listed by claude agents --json and in which state (a kept row would block a fresh spawn of the name and show in the watchdog's facts)."
      - "The full e2e (W5's wu-expected) after the launcher change."
    owner-probe: |-
      An owner step in the probe clone (project-router recipe); haiku; no sandbox needed for this one; log $HOME/keel-wsandbox-w5-probe.log.
      cd /Users/nguyenvanluong/Documents/proj/misc/Keel-probe
      L=$HOME/keel-wsandbox-w5-probe.log
      claude --bg -n rp1 --model haiku --agent worker "Remember the word heron. Reply OK, then end your turn." 2>&1 | tee -a $L
      claude agents --json | jq -c '.[] | select(.name=="rp1") | {id, sessionId, status, state}' | tee -a $L
      # once it is idle (same command), with <id> and <sid> from that line:
      claude stop <id> 2>&1 | tee -a $L
      claude agents --json | jq -c '.[] | select(.name=="rp1") | {id, sessionId, status, state}' | tee -a $L
      claude rm <id> 2>&1 | tee -a $L
      ls ~/.claude/projects/*/<sid>.jsonl 2>&1 | tee -a $L
      claude --bg -n rp1 --model haiku --agent worker --resume <sid> "Which word were you asked to remember? One word." 2>&1 | tee -a $L
      claude agents --json | jq -c '.[] | select(.name=="rp1") | {id, sessionId, status, state}' | tee -a $L
      # once idle, with the new <id2>:
      claude logs <id2> 2>&1 | tail -20 | tee -a $L
      claude stop <id2> 2>&1 | tee -a $L; claude rm <id2> 2>&1 | tee -a $L
      Expect: after stop, the row's state (listed or not); the transcript listed after rm; the same sessionId after the resume; 'heron' in the logs.
    token-case: "R53's workbook (docs/.archive/worker-token-usage-2026-11-26.xlsx, git-ignored): every worker's first turn holds 35 - 38k tokens of context before any work (e.g. e-crlimit-w1-fix1 37,740; e-crlevel-plan 35,790); a fresh fixer, e-crlimit-w1-fix1, read 2,965,661 cache tokens in 42 turns."
  w6-reuse:
    rulings: |-
      Owner 2026-11-26, locked (ratified, not open):
      1. Reuse wins when the task is relevant to or a follow-up of the old task and the context is under 200k for a cold cache and 400k for a warm cache (configurable? - the open question on settings).
      2. A fix is not forced to be in a fresh context; it is up to the worker (the decision rule: the open question on fixes).
      3. The implementation includes check and resolve of all skill / instruction conflicts.
      4. The router has a quick and reliable way to check the cache and context status of workers.
      The owner's reason: even with a cold cache, re-reading files costs many round trips and tool calls, more than re-caching the old context; a reuse from a big context can cost more, so the router decides.
    evidence: "Backlog R53 (E-CRLEVEL close): e-crlevel-w1-build, kept for follow-ups, ran 128 turns over 7 tasks, its context growing from 37,771 to 418,476 tokens and 35.9M cache read; R53 proposed reuse under about 130k and retire past about 300k. The owner's ceilings above replace R53's proposal."
    cache-lifetime: "Verified from code (2.1.288): two lifetimes, 300000 ms and 3600000 ms; a usage record is labelled '1h' when cache_creation.ephemeral_1h_input_tokens > 0, else '5m' when ephemeral_5m_input_tokens > 0. This worker's own usage records show 1-hour writes (ephemeral_1h_input_tokens > 0, ephemeral_5m_input_tokens 0). The cold/warm definition is the open question on a warm cache."
    status-facts: "Per live or stopped worker, from its transcript's assistant usage records and timestamps only (the R53 workbook's method: ids, timestamps, model, numeric usage; no message text): context now = input + cache write + cache read of the last turn; peak; idle minutes since the last record; the lifetime its last write used; warm or cold; the two ceilings. Where: a read-only launcher mode (status, admitted by the guard) or a line per worker in the watchdog's facts. The router guard and settings are the owner's: any whitelist change is an owner keel mr commit."
    conflicts-to-resolve: |-
      Starting list; W6 greps both skill copies, AGENTS.md, .claude/agents and the brief skeleton for the rest:
      1. keel-router SKILL.md:310-315 'One live session per WU' (a fix round goes to the live author) vs SKILL.md:431, the review table's 'fix round (fresh worker, new tip, re-gate)'.
      2. 'a stopped worker is never revived' (SKILL.md:267, 282, 314-315; worker-ops.md:146-149; project-router; DEC-44, DEC-46; UC-ROUTE-5): owned by W5, which rewrites them; W6 checks they agree with the reuse rules.
      3. worker-ops.md:46-47 (an in-session subagent resumed for a fix round only when keeping its context is the point) and worker-ops.md:129 ('A new WU gets a fresh worker'): checked against rule 1.
    unchanged: "Reviewer independence: a review worker is fresh every round and the author never reviews its own diff (keel-router review section, DEC-46 point 4). W6 does not change it."
    why-after-w5: "Resume changes what a cold, stopped worker costs: it comes back with its context (one cache write) instead of a fresh 35 - 38k start plus re-reads, so W6's rule counts a stopped worker as reusable only once W5 exists."
    fix-rule-to-decide: "W6 must write down: who judges (the router, before it sends the fix); on what facts (the fix belongs to the author's WU or is a follow-up of its last task; the author's context now and warm or cold from the status read, against the two ceilings); what the author may do (take it, or say in its report that it should go fresh, and the router then spawns fresh); and the open fork for the owner: whether the author may also keep a fix the ceilings send fresh."
  sign-off: "Each WU with a rule-bearing file: only those files staged -> the owner's keel mr commit -> a fresh worker re-gates -> the owner confirms and merges (project-router 'Sign-off sequences')."
