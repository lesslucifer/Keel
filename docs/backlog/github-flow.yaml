  - id: G11
    title: "The bot measures a pull request's range from its own copy of the base"
    status: "struck at the E-LOCALTOOL close (2026-11-19): taken by E-GHREVERT"
    problem: >-
      A pull request page can list the wrong docs, or none. `router-gh.sh pr-open` and `issue` take the range from the
      merge-base of the router checkout's local base branch and the tip. When that copy lags GitHub's base (PR #14: a
      local `epic/E-DOCSPLIT` still before W1's merge), the range holds another WU's docs; when it already holds the
      tip's docs, the page says "No doc changed in this range". E-DOCSPLIT.W3 fixed the title alone: the newest plan,
      read from its data file.
    proposal: >-
      Refuse when the local base is not GitHub's base, or measure from GitHub's base sha (fetched first). Either
      changes when the bot refuses, so it is a GitHub-flow change, not part of the docs split.
    source: >-
      the E-DOCSPLIT.W3 plan's bot defects and the owner's ruling of 2026-11-18 ("doc split w3 lgtm", question 1).
    taken-by: "E-GHREVERT (backlog local-app A1)"
