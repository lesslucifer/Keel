# Keel policy (written by `keel init`). The merge gate judges a merge by this file
# as committed on the target branch, so a branch cannot change its own rules.

# Path prefixes the gate treats as code (cr binds them). A diff touching none is
# docs/infra-only and exempt from test/cr/doc evidence. Adjust to your layout.
code_paths = ["src/", "tests/"]

# Optional: narrow that exemption to paths matching these globs (and outside
# code_paths). Unset = every non-code path is docs/infra.
# infra_paths = ["docs/**", "*.md"]

# Commits touching these need a Reviewed-By trailer (`keel mr commit`).
# A trailing / is a prefix; otherwise a glob (* and ? within a segment, ** across).
rule_bearing = ["AGENTS.md", "docs/*.html"]

[check]
lint = {{LINT}}
test = {{TEST}}

[branches]
main = {{MAIN}}
epic_prefix = "epic/"   # epic branches: <epic_prefix><slug>
wu_prefix = "wu/"       # WU branches: <wu_prefix><epic-slug>/<slug>, measured against its epic

[paths]
worktrees = ".claude/worktrees/"   # where Claude Code creates agent worktrees; init gitignores it

[docs]
root = "docs/"

[docs.tiers]
T0 = ["AGENTS.md", "CLAUDE.md"]
T1 = ["docs/*"]
T2 = ["docs/use-cases/**", "docs/decisions/**", "docs/backlog/**"]
T3 = ["docs/work/**", "docs/.archive/**"]

[docs.caps]   # a ready page's word cap by its path (glob = words; a page several match takes the smallest). A plan or result is capped by its data file's role instead.
"docs/decisions/*.html" = 5000
"docs/architecture.html" = 3000
"docs/install.html" = 1500

[tests]
# adapter = "python"   # rust | ts | python | go | regex; default: by file extension
# pattern = "..."      # test-declaration regex, for the regex adapter

[mr]
tiers = ["email", "username", "key"]   # accepted .keel/mr-allowed tiers; ["key"] = signatures only (email/username are a string match)
report = "required"   # required | optional | none: must a WU/epic sign-off attest its result report (the page whose data file has artifact wu-result / epic-result)

[review]   # the schedule keys are read by the CLI from the target branch's committed copy, at the review's level; modules and rubric by the keel-code-review skill
# the rule: keel-code-review skill, section 5. A schedule key left out takes [review]'s, else its default; a set key is a whole number of rounds, 1 or more, none above its table's max_rounds
# a staged change is checked by the pre-commit hook and keel mr commit; keel mr confirm tags the review history's rounds by the target's settings
# max_rounds = <n>           # the cap: no review round runs past it
# whole_range_rounds = <n>   # rounds up to this one review the whole range; later rounds only the last fix
# fix_importants_from = <n>  # from this round on, importants with no blocker are fixed under a fix-PASS; only a blocker earns another round
# fix_blockers_from = <n>    # unset: off. From this round on every finding, blockers too, is fixed under a fix-PASS: no round follows, no cap waiver
modules = ["src/*"]          # each match of a glob's * is one module (altitude finder)
rubric = ".keel/rubric.md"   # optional project-local rubric
# [review.wu]                # a WU review (its target is not main): any schedule key above, over [review]
# max_rounds = <n>
# [review.epic]              # an epic review (its target is main): any schedule key above, over [review]
# max_rounds = <n>
