  rules:
    decision: >-
      A live record keeps its title, choice, why and what was rejected, about
      250 words at most; context, consequences and lineage rows go; an Amended
      row is folded into the choice, naming the amending DEC. A record a later
      one replaces whole becomes "DEC-n · title · replaced by DEC-m" (none
      today: DEC-4's skills-root line and DEC-43's mechanism are replaced in
      part, and each keeps what stands). Others W5 suspects (such as DEC-36
      against DEC-42) are named in the result for the owner, not changed. The
      page's how-to-read line says current truth, not append-only. Ids are
      never reused; every record keeps its id="dec-n" anchor.
    use-case: >-
      Per area file - area, title, and per use case id, title, trigger,
      expected, failure; rows such as "On DSH" or "Idempotent" fold into
      expected. "Built by" and "amended by" go. No artifact key - a pageless
      .yaml without one is other data to the check.
    backlog: >-
      An open row keeps id, title, problem, proposal, source and who takes it.
      A closed row (done, struck, superseded, obsolete, re-pointed, or accepted
      where a decision records it, as R4 in DEC-48) keeps "id - title - how it
      closed" under closed. An accepted row no decision records (B21) stays
      open as a known limit. Ids are never reused.
    order: >-
      A data file is written in the same commit that deletes its page - a .yaml
      beside a same-named .html is read as that page's data file and is red
      ("missing field artifact"), seen with the branch's keel.
  id-check: >-
    A one-off Python script in a mktemp -d scratch directory, not committed;
    its source and output go in the result's data file. Before (at W5's base)
    it lists every defined id - DEC from the h3 anchors, UC from the use-case
    anchors, backlog ids from the row anchors and headings - and every cited
    id, by git grep over src/, tests/, scripts/, templates/, skills/,
    .claude/, AGENTS.md and docs/: DEC-n, UC-AREA-n, and the backlog forms
    "backlog Xn", "<area> Xn", "<area>.html#xn". After, it reads the decision
    pages' anchors, decisions-index.yaml, the use-case files and the backlog
    files, open and closed. It passes when every id defined before is
    defined after, every cited id resolves, and each index names the file
    that holds the id. It also prints each page's and each record's words.
    Today it finds closed backlog rows cited in code (B16 in src/notes.rs; R1,
    R8, R33, G8 in tests/suite/), in scripts (R33) and in a skill (G2).
  route: >-
    Default for a WU with a rule-bearing file (project-router), not a task:
    the four rule-bearing files (.keel/config.toml, docs/architecture.html,
    docs/install.html, .claude/skills/project-router/SKILL.md) stay edited in
    the worktree, uncommitted, so the docs on disk stay green; the worker
    stages exactly them and reports; the router stages the owner's keel mr
    commit -m ... --as vuluu (a Reviewed-By trailer) and watches it land. A
    task would still need the trailer for .keel/ (DEC-67), and its separate
    branch would leave architecture's links dangling on the WU branch until
    its merge.
  parts: >-
    One worker, no tasks, five commits in order, each green on disk -
    1 use cases to data, 2 backlog to data, 3 decisions slimmed and split,
    their index to data, 4 links in docs/work, then the owner's commit of the
    four rule-bearing files, 5 the result pair. The epic tip is merged in
    before commit 3.
  review: >-
    No code, so no code review. The router dispatches one read-only worker
    (project-router, "What no gate reviews") to compare each slimmed decision
    record with its text at W5's base, naming any choice lost or changed; its
    findings are fixed before the result.
  sign-off: >-
    Docs-only range - the gate exempts test, cr and doc notes, and [mr] report
    asks for no report without code; W5 writes its result pair anyway, as the
    epic plan asks for the counts. The owner's approval of the pull request
    signs it; auto-merge merges it.
  overlap:
    - E-DOCSPLIT.W3 (running) may add rows to decisions or use cases; whichever of W3 and W5 merges second writes them in the other's shape. W5 merges the epic tip before commit 3.
