  - id: R14
    title: "A granted worker can sign as the owner (key-only tiers)"
    status: "partly done by E-ROUTER3.W4 (DEC-47, DEC-48); the key-only flip is open (owner ruling 2026-11-12)"
    problem: >-
      Done by E-ROUTER3.W4 (DEC-47, DEC-48): the roster is `.keel/mr-allowed` committed on the target, nothing reads
      `.mr-allowed`, `.gitworktreecopy` no longer seeds it. Open (owner ruling 2026-11-12): Keel's tiers keep
      `username`, so a same-user process can still sign as the owner by name. The original finding (L2; owner
      decision was open): `.gitworktreecopy` seeded every new worktree with the main checkout's `.mr-allowed`, and
      the `email`/`username` tiers are a string match with no key. A launcher worker can edit `.keel/config.toml`
      `[check] test` to run `keel mr confirm --as <owner>`, then run `keel check` (granted, DEC-37); the `keel mr`
      deny does not stop it. Same class as `src/mr.rs` `tier_of`'s accepted limitation, DEC-33 and DEC-37, but
      seeding made it reachable in every worktree.
    proposal: >-
      The remaining fix is an owner commit setting `tiers = ["key"]` with a presence key (DEC-48 item 4). Original
      fix options: key-only `[mr] tiers`, or stop seeding `.mr-allowed` (the second is done).
    source: >-
      Carried over from the dropped E-SEED2.W9 (branch `wu/E-SEED2/w9-router-followups`, a51bb88; dropped by owner
      ruling 2026-11-10; `git show a51bb88:docs/work/2026-11-09-w9-router-followups-wu-plan.html` recovers its plan):
      the E-ROUTERFIX independent review (L2), via the W9 plan. Key-only flip deferred by E-ROUTER3 (DEC-48 item 4).
    taken-by: "unowned: the next router epic (not yet proposed)"
