    b1: "The port key sat at sandbox.allowLocalBinding; 2.1.288 drops a top-level field and reads sandbox.network.allowLocalBinding. Fixed in the launcher, the pin test (the real path, red first), and the project-router facts; the WU plan's two mentions corrected. The worker persona and the keel-router skill state only that ports are open, never a settings path, so nothing there matched the old placement."
    b2: "The pnpm tree used the launcher's $TMPDIR, which the worker's sandbox cannot write (it reaches the cwd, its own temp and allowWrite). Fixed by adding exactly the pnpm home to filesystem.allowWrite, with a fixed name only inside the user's own $TMPDIR and a mktemp dir plus an ownership/symlink guard otherwise; the tree test now asserts the allowWrite root instead of denying it."
    nit3: "The helper matches the basename with eight alnum characters, requires the parent to be $TMPDIR, and refuses a .git that is a symlink or not a directory."
    nit4: "The security-file test now names scripts/router-scratch.sh, router-inbox.sh, router-file-guard.sh, router-app.sh and notify-owner.py."
    nit5: "project-router: code_paths now includes app/; the no-gate-review list names the helper and the other router scripts."
    nit6: "this pair records the fix-PASS on b04d4a88 and this independent review."
    nit7: "a new test runs the accepted helper path and a real keel init in its fresh dir, with the built binary on PATH."
