  mechanism: >-
    pnpm 11 reads pnpm_config_modules_dir from the environment (probed). The launcher points it at
    $TMPDIR/keel-worker-pnpm/modules-<cksum of the worktree>, exports PNPM_HOME beside it, and links the
    worktree's git-ignored app/node_modules at the modules dir (a real install is never replaced), and adds the
    home to filesystem.allowWrite because the sandbox reaches only the cwd, its own temp and that list. The
    sandbox anchors its hard-coded **/.vscode/** deny at the session cwd, so the whole package tree must be
    outside; the link is the tooling bridge.
  probe: >-
    2026-11-26, scratch dir under $TMPDIR with PNPM_HOME/store there: a copy of app/package.json,
    pnpm-lock.yaml and pnpm-workspace.yaml with app/node_modules linked at the modules dir, then pnpm install
    --frozen-lockfile: 368 packages, xmlbuilder 15.1.1 included, done in 40 s; .vscode appeared only under the
    modules dir, nothing under the app tree; require('xmlbuilder') and a pnpm run script resolved through the
    link; pnpm add worked; a real node_modules plus the env still installed outside and was left intact.
  deferred:
