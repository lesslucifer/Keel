owner-changes:
  - when: You open a decision
    today: Context, lineage and amendments, up to 2,300 words a record
    after: The choice, why, what was rejected; about 250 words
  - when: You ask about a use case or backlog row
    today: An agent reads 28,500 words of pages
    after: It reads data files, open rows only
  - when: A decision file grows
    today: No limit
    after: Red over 5,000 words
expected:
  - Every page under docs/decisions/ is at most 5,000 words, and .keel/config.toml sets "docs/decisions/*.html" = 5000, so one over it is red.
  - No .html is left under docs/use-cases/ or docs/backlog/, nor docs/decisions/decisions-index.html; each has its .yaml data file.
  - The id check (details.id-check) passes - every id defined before is defined after, every cited id resolves, each index names the file that holds the id.
  - keel verify-doc over all docs exits 0, with the installed keel and with the branch's build; the suite test every_doc_in_docs_and_the_writing_example_pass_the_checks passes.
  - The result lists every file's words before and after, and every live decision record over 250 words, with why.
test-plan:
