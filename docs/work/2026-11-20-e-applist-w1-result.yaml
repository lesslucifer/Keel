distillation: >-
  Nothing in W1. At the epic close: UC-ROUTE-8 (new: the router's update log) and UC-ROUTE-6 (amended: the guard
  admits the update command in plain words); docs/local-app.html "Where it travels" gains stage and the state-first
  write order, per the epic's distillation plan.
follow-ups:
  - >-
    N1 (nit) router-app.sh:119-121: a hardlinked log.jsonl or state.json passes the regular-file check (needs a
    same-user write). Fix idea: refuse a link count over 1. Taken by: a later small WU of E-APPLIST, or the A5 epic
    (the router's own follow-ups), the owner's choice.
  - >-
    N2 (nit) :162-181: a hand-corrupted state.json holding two JSON values, or a non-integer .n, garbles the parse or
    is carried on. Round 2's sweep found a third case of the same cause: an empty state.json makes a writer exit 0,
    append an empty line to the log and write a blank state, and every writer after it does the same until a
    start (only a hand edit or a truncation outside the script makes one: the script replaces the state by a
    rename). Fix idea: read it with jq -s and check it holds exactly one value and n is a whole number; the
    wrong-shape test then takes the three cases. Taken by: the same WU as N1.
  - >-
    N3 (nit) :33: an exported CDPATH makes the script fail closed (exit 1). Fix idea: HERE=$(CDPATH= cd -P -- ...).
    Taken by: the same WU as N1.
  - >-
    N4 (nit) :131-138: a signal between mkdir and the trap leaves a stale lock; any mkdir failure (an unwritable dir)
    reports LOCKED after 5 s. Fix idea: set the trap before the loop; fail at once when the dir is not writable.
    Taken by: the same WU as N1.
  - >-
    N5 (nit) :55: the alert link grammar (the plan's) admits keel://../../etc. alert is not reachable by the router.
    Fix idea: tighten the grammar (no .. segment) in the script, or check it in the app's link handler. Taken by: W3
    (the sender writes alerts) or the app's link handler, in E-APPLIST.
  - "N6 (nit) the guard is stricter than the script for a name containing --ou: safe, no fix. Taken by: none needed."
  - "docs/local-app.html 'Where it travels' lacks stage: E-APPLIST's close, distillation."
  - "Code review round 3 on the round-2 fix, the owner's sign-off and the merge into epic/E-APPLIST: the router starts the review; the owner signs."
