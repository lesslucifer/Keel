  - id: A8
    title: "The dispatch guard's reviewed lines match by substring"
    status: open
    problem: >-
      The guard that every dispatched command has its own usage skips a line that contains a reviewed entry's text
      (`NOT_COMMANDS` in `src/help.rs`), so an alternative added before or after a reviewed line passes unseen; it
      holds for all ten entries. Nothing checks that every entry still matches a line of the production code.
    proposal: >-
      Match a reviewed entry against the whole trimmed line, not a substring; add a test that every `NOT_COMMANDS`
      entry still matches exactly one production line.
    source: >-
      E-KEELFIX.W5 result (deviation 1, follow-up) and its plan's open point 3; refuted as pre-existing by W5's review.
    taken-by: "unowned: the next epic or WU that edits `src/help.rs`"

  - id: A9
    title: "A bad roster line committed through keel mr commit locks the branch out"
    status: open
    problem: >-
      A staged `.keel/mr-allowed` is not checked before it lands, as a staged `.keel/config.toml` is. A line keel
      cannot read (an unknown tier, a typo, a leftover `github:` line) can land through `keel mr commit` or a merge
      signed with `--roster-change`; then every later rule-bearing commit and sign-off on that branch is refused, the
      repair included, with the bare parse error and no fix line. Recovery is by hand (DEC-47).
    proposal: >-
      Parse the staged roster at pre-commit and in `keel mr commit` when the commit changes it, and refuse with a fix
      line; give the HEAD-roster parse error a recovery line, as `.keel/config.toml`'s has.
    source: >-
      E-KEELFIX.W3 review round 1 (two refuted candidates: pre-existing, lock-out accepted by the W3 plan's open
      point 2).
    taken-by: "unowned: an epic that owns `keel mr`"

