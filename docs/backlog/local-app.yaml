# Keel backlog: local-app. Data only, no page (DEC-69). Open rows in full; a closed row is its id, title and how it closed.
# Ids are never reused. Order and next free ids: backlog-index.yaml.
title: "Backlog: the local app"
letters: [A, L]
about: >-
  Going back to before GitHub's flow, then building the desktop app in place of it: five epics in order (A1 - A5),
  then four later needs and one re-pointed idea (L1 - L5). E-LOCALTOOL closed on 2026-11-19 with a design and no code:
  docs/local-app.html is the app as designed, and DEC-70 records why. Each epic waits only on the ones before it and is
  useful on its own. Its parts and K-numbers (the keel or router changes the app needs) are in docs/local-app.html,
  under "The build order"; the needs n1 - n10 are listed there too. Distilled from E-LOCALTOOL (W5 result, P4 to P6,
  and the close).
open:
