outcome: >-
  Delivered. All ten findings of the epic review's round 1 (cr note on 7d8d346) are fixed, each pinned by a
  test: Open reads through the old-git runner the list reader uses; item.mark writes in the handlers' queue and
  rereads after it; loads and writes of one app-folder file take turns and a vanished file reads as missing; the
  branch, id and router-key grammars live in shared/names.ts only; the sort order is a rank per contract kind;
  and the git reader asks note-of and --merged only when a ref they depend on moved. I7 (a data file's roles)
  ended where the owner ruled on 2026-11-23: Open asks keel itself, through a new read-only keel doc-roles, and
  the app keeps no YAML reader. This WU's own review, round 1 (cr note on 9b02970: 2 blockers, 3 importants, 2
  nits), is fixed too, each finding by its own commit and test. keel check is green on a02b51d. The window's
  code is unchanged.
deviations:
  - >-
    I7 changed course. The plan had the app read a data file's roles as keel does, both held to one case table.
    The WU review's round 1 showed a hand-written copy still disagrees with keel on valid YAML (9 of the repo's
    historic data files, quoted keys, tags, flow mappings, depth). The owner ruled on 2026-11-23 that Open asks
    keel: keel gains a read-only subcommand, keel doc-roles, and the app's YAML reader, ROLES and PAIRS go. Open
    now needs a usable keel (set in the settings or found on the login PATH); with none it says to choose one,
    and with an older keel, one with no doc-roles, it says to update keel.
  - >-
    B3's write-order test first passed with the per-file turn removed (the WU review's round 1,
    app-folder.test.ts:430). 816b1fa holds the load after its read and before it sets the file aside; with
    writeAtomic's turn removed in a scratch copy the test now fails 3 of 3 (the just-written projects.json is
    set aside), and passes 3 of 3 at the fix.
  - >-
    I9/I10 changed one older test's set-up: "when main's merged read fails..." now moves a branch before its
    failing read, since an unchanged main is no longer asked. Its assertion is unchanged.
  - >-
    A command that bundled the I4-I6 guard fix with a check of the guard against the old items.ts was denied (it
    held a stray git stash list and overwrote a tracked file from git show). It was not re-run; the guard's red on
    the old code was shown read-only instead: git show 7d8d346 of items.ts, git.ts and log.ts holds 5, 4 and 3 of
    the copies the guard refuses.
