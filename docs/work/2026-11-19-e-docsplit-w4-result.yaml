outcome: >-
  Delivered. keel-plan, keel-write, keel-distill, keel-workflow and
  keel-router's references/commands.md and references/brief-skeleton.md teach
  DEC-69's split - a plan or result is a page plus the YAML data file beside
  it, the check reads the data file, every page kind has a word cap, the
  sign-off finds the report through the data file, a pair archives as one doc,
  use cases, the backlog and the indexes are data files. None of them, nor
  AGENTS.md or templates/AGENTS.md, names data-artifact, data-status,
  data-item or data-wu. keel-write's example is a pair (references/example.html
  in the epic plan page shape, references/example.yaml a ready epic-plan) that
  src/init.rs ships and keel verify-doc passes. skills/keel-* and
  .claude/skills/keel-* are byte-equal; AGENTS.md equals its template;
  project-router names backlog D2 in docs/backlog/dsh.yaml. All landed in the
  owner's one keel mr commit 79d6409, as the plan routed it.
deviations:
  - what: The main case - keel init in a scratch repo, the example pair copied into docs/work/ and checked - ran through the integration test (tests/suite/init.rs writing_skill_ships_with_a_passing_example_and_is_pointed_to, through the built binary), not by hand.
    why: The finishing worker's hand run of keel init in a mktemp scratch repo was denied by the session's permission classifier; the worker did not route around it. The test drives the same steps (keel init in a temp repo, the pair copied, keel verify-doc green, the data file without intent red naming it).
  - what: A second owner keel mr commit of skill fixes after an independent skills review of 79d6409 (the owner chose "ok fix now", 2026-11-19).
    why: >-
      The review found two issues and seven nits, all fixed in skills/ and copied
      to .claude/skills/ by the owner. I1 keel-write rule 3 sent the check id to
      the work list - now the data file, or Details in any other doc. I2
      keel-workflow and keel-plan did not say a typed --report is taken as named
      (only a .yaml is refused; src/mr.rs pick_report), while the search, the
      approval path and keel notes write report check the data file. N1 bare
      keel verify-doc skips git-ignored files, so an archived epic result is
      checked by path. N2 a one-part doc takes the epic id and has no epic
      field. N3 the data file is in the signed diff for a WU; an epic's sits
      untracked beside its page. N4 keel-distill's archive line drops the .yaml
      for a page with no data file. N5 "every relative link (<a href>)". N6 a
      decision file's 5,000 is its [docs.caps] path cap; a record's 250 is not
      checked. N7 keel-write's self-check says "checklist markup", not "tag".
      N8 example.html's Terms heading is an h2; the pair stays green, 465 of
      700 words, top 216 of 300.
  - what: Code review round 1 (the cr note on 135341e) was FAIL - two importants, four nits, all in src/ and tests/ - fixed in 1fb6b38 and 0b9fdc1.
    why: >-
      keel_plan_names_every_field_the_check_reads pooled every role's fields
      into one hand-copied list, so a field moved between roles stayed green.
      It now takes each role's checklist from role_fields(), the list fields()
      reads, and wants it in that role's paragraph of keel-plan §3 (WU_SUB under
      wu-summaries, TEST_LEVELS under test-plan); every other field
      fields(&[role]) knows must be a §2 table row. The nits: the old-tag scan
      and the AGENTS.md checks moved into embedding_is_complete_and_prefixed,
      one list in one keel init; installed_skills_and_rule_file_name_no_old_page_tag
      and the two narrower tag lists went. No skill text changed.
