    sandbox-skipped-by-the-reviewer: "keels_router_security_files_are_rule_bearing and epic_e2e_router_drives_a_granted_worker_in_a_seeded_worktree_to_its_end, which the independent reviewer's sandbox could not run, ran here in the full suite at cd16ede: both ok"
  independent-review: >-
    A fresh read-only worker reviewed scripts/router-worker.sh at 95c16af (security path): no blocker, two LOW
    findings. L1: a list valid as JSON but not readable to its end cut the rows short, and the step then deleted every
    live worker listed after the bad row (proven with [r1, w1, 5, w2]). L2: a value over 512 bytes was refused, so
    the worker's last line stood stale while it lived (a worker can cause it with git branch -m). The owner chose to
    fix both now: cd16ede, tests 142ed86. Its test gaps were pinned in the same test commit: the clip lengths and
    the block printed before the first write (its mutant M7). No further independent review of cd16ede (the router's
    note: its lows are follow-ups, done).
  code-review:
    round-1: "PASS on b545459, the whole range 1494748..b545459, tests/suite/router.rs (the cr gate's code path): 0 blockers, 0 importants, seven nits; two waived by the reviewer (no test makes router-app.sh refuse a line: the watchdog can no longer send a refusable value; the byte-clip case's placement), five marked to fix under a fix-PASS."
    nits-taken: >-
      5ac92b4, tests/ only: the byte clip pinned longest first (branch and waiting within 4 bytes); the value's
      untouched branches (status working, done, none read busy, idle, unknown for a worker and the heartbeat; a
      non-hex sessionId gives no session key; an unlinked .git no branch, tip or dirty); start_run and the direct
      router-app.sh call behind the git shim; one row builder; router_row for every r1 row. Each new assertion red
      against a launcher mutant in a scratch copy (a fixed-order fit, the raw worker state, lbr from br, any
      sessionId, the raw router state), green on cd16ede's launcher; the copy restored and compared. No launcher
      change was needed.
    next: "a fresh reviewer writes the fix-PASS (--fixes b545459)"
  docs: "this result pair (new; updated after round 1); the plan pair at f86005a; no other doc touched"
distillation: >-
  Nothing in W2. At the epic close (W9): UC-ROUTE-8 names the watchdog as the update log's second writer;
  docs/local-app.html "Where it travels" gains the worker line's value (state, waiting, session, branch, tip, dirty,
  active), the router heartbeat's value and the no-write cases, per the epic's distillation plan.
follow-ups:
  - >-
    The independent review's surviving mutants of scripts/router-worker.sh at 95c16af, watchdog tests that did not
    pin: M10 (the write calls lose their </dev/null), M11 (app_lines loses its symlink check), M12 (app_lines loses
    its name check), M15a (no clip of a worker's state), M15b (no clip of its branch), M19 (no gd guard), M20 (a
    state whose values are not an object read as {}). M15a and M15b are now pinned by
    a_worker_lines_strings_are_clipped_to_their_lengths (142ed86): each mutant, applied to cd16ede in a scratch copy,
    turns it red. The other five each want a test or an equivalence note. Taken by: docs/backlog/local-app.yaml, in
    the row the router opens for the router scripts' hardening (with W1's N1-N5), the owner's choice of when.
  - >-
    A test that starts a run and then trips the git-dir check, to pin that nothing is written then (met by
    construction today). Taken by: the same backlog row, or this WU's code review if it asks for it.
  - >-
    A per-worker jq that failed would drop that worker's row, and the write step would then delete its line. No
    input is known to make it fail (every argument is checked or defaulted); a guard would mark the tick unreadable
    instead. Taken by: the same backlog row.
