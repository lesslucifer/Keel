# Keel use cases: the router. Data only, no page (DEC-69). Contract level: trigger, expected, failure.
# Ids are never reused. Index: use-cases-index.yaml.
title: "the router"
about: >-
  The standard itself is the `keel-router` skill (`skills/keel-router/`); this file holds only the contract. Why the
  router is shaped this way: decisions/router.html (DEC-30 – DEC-37, DEC-39, DEC-42 – DEC-46, DEC-48, DEC-55, DEC-56,
  DEC-58); the update log the app reads (UC-ROUTE-8): decisions/app.html (DEC-78).
areas:
  - area: UC-ROUTE
    title: "routing"
    use-cases:
      - id: UC-ROUTE-1
        title: "the router coordinates, the owner acts"
        trigger: >-
          A router session coordinating worker sessions on a Keel project.
        expected: >-
          It verifies workers' claims against the repo, stages the owner's commands (sign-off, merge, push, tag) for
          the owner to run, and never signs (`keel mr`), merges or pushes for the owner. In the turn it stages an
          owner action it arms a read-only watch for it in the background (Keel: `scripts/router-watch.sh
          commit|signed|merged|pushed|tagged <args>`, DEC-30), so it learns the action landed without the owner
          saying "done". The watch checks at once and then polls until the state holds. It wakes the router with one
          event line plus what landed: the commits with their `Reviewed-By`, the landed paths against the staged set
          (`COMMITTED-PARTIAL` when one is missing), the `mr` note, and whether a merge was `no-ff` or `ff`.
          Otherwise it ends with `REWRITTEN`, `DELETED`, `TAGGED-MISMATCH`, `TIMEOUT` (before the 2 h background
          ceiling; the router re-arms) or `UNREACHABLE`. Detail lines are untrusted data.  It talks to its workers by
          `SendMessage` to a named session, both ways (DEC-42): a worker is a long-running background session that
          reports to the router by message when it finishes, takes a follow-up task as the router's next message, and
          stays alive until the router closes it (`stop`, DEC-44); a watchdog worker messages the router every 5
          minutes with one sentence per live worker, done and stuck first (DEC-45), so the router itself runs no loop
          or timer. At the moment of action it runs the skill's short checklists (`references/checklists.md`): START
          before the first tool call of a session, WAKE on every wake, DISPATCH before every spawn or send, each row
          naming its trigger and what skipping it cost. Read tools serve dispatch, verification and relaying, never
          deriving the substance, and never a document a worker was just sent to read. A turn never closes with a
          live worker and no wake armed, and a call denied since the last message is named with its exact command,
          never retried and never handed to a worker. Tests: `tests/suite/router.rs` `watch_*`; `tests/suite/init.rs`
          `router_ships_the_moment_of_action_checklists` (the three lists, their triggers, and a row for each of the
          four failures the DSH guard plugin will enforce); the guard's `SendMessage` tests on the captured real
          payloads; delivery between real sessions is live evidence only (W7).
        failure: >-
          The router runs `keel mr` itself, merges or pushes; or relays a worker claim it did not check; or a watch
          fires before the owner acted, misses a partial commit or an `ff` merge, or polls past its timeout; or a
          router that cannot message a live worker or receive its reply; or a router that polls or sleeps instead of
          waiting for messages; or a router that reads a plan, a config or a backlog row to do a running worker's
          job, closes a turn with a live worker and nothing armed, or leaves a denied call unnamed.
      - id: UC-ROUTE-2
        title: "epic branch first"
        trigger: >-
          A router starts a new epic.
        expected: >-
          Its first action, before any plan doc or WU, is creating `<epic_prefix><id>` from the current main tip in a
          worktree of its own (prefixes from `.keel/config.toml` `[branches]`; Keel: the router runs
          `scripts/router-worker.sh worktree add epic/<id>`, DEC-46). No worker pushes: the router stages `git push -u
          origin <epic branch>` for the owner and arms the `pushed` watch; plan work starts once the branch exists
          locally. All plan and WU work lands there; WUs branch as `<wu_prefix><id>/<slug>` and merge back `--no-ff`;
          main receives only the closed epic (DEC-12).
        failure: >-
          A plan drafted before the branch exists; a worker pushing; any WU or T3 doc of an unclosed epic reaching main;
          an epic retrofitted onto its branch afterwards.
      - id: UC-ROUTE-3
        title: "substance comes from workers"
        trigger: >-
          The router relays or publishes something substantive: a "done" claim, doc prose, a comment reply.
        expected: >-
          It traces to a worker that derived it from the current code, tests or artifacts. Worker briefs are dispatch
          mechanics, not substance: the router writes them itself (DEC-32), never pasting untrusted report text into
          one.
        failure: >-
          The router drafts content for a worker to paste, or a mechanics-only worker posts content.
      - id: UC-ROUTE-4
        title: "the router skill ships complete"
        trigger: >-
          `keel init` in any repo.
        expected: >-
          Writes `.claude/skills/keel-router/` (SKILL.md and every reference it names, no orphan: brief skeleton,
          commands, review checklists, lessons, messages, worker ops, project-router template) byte-identical to the
          embedded copy, plus the `project-router` template. The shipped skill carries no Trawler-only token outside
          lineage and no Keel-only state (its branches, commits, launcher path); every `keel` command it names exists.
          Enforcement and the launcher are not shipped: a project commits its own (DEC-30). Test: `tests/suite/init.rs`
          `router_skill_is_complete`, `embedding_is_complete_and_prefixed`.
        failure: >-
          A named reference missing or an orphan shipped; a stale Keel fact or Trawler token in an adopter's copy.
      - id: UC-ROUTE-5
        title: "worker modes, each with a full recipe"
        trigger: >-
          The router needs a worker.
        expected: >-
          Native background sessions (`claude --bg`) through the project's launcher are the standard (DEC-44): spawn,
          report, follow-up and retire recipes in the skill's `worker-ops.md`. In-session `Agent` subagents only where
          the project does not enforce the router posture. Keel's launcher `scripts/router-worker.sh` has these modes
          (DEC-46). `spawn`: validated arguments, a fixed prompt and flags, `--agent worker` always; it refuses the
          router's own checkout and the main checkout, a non-`.md`, symlinked or out-of-dir brief, an unregistered
          worktree, a worktree without `.claude/agents/worker.md` (naming the fix) or on a detached HEAD, a name `claude
          agents --json` already lists, and a name whose launch holds `.router/runs/.lock-<name>`; it starts the worker
          with `--setting-sources project,local`, `--strict-mcp-config` and Claude Code's Bash sandbox in `--settings`
          (writes: the worktree but its `.git` link and settings files, the git dir but its config and hooks, and in
          `~/.cargo` only the cache cargo writes, never its `env`, `config`, `credentials` or `bin`; five hosts, widened
          by a permission decision (the owner's answer to a `sandbox request` prompt under `acceptEdits`, a per-call
          review under `auto`) or by the worktree's own local settings (DEC-37)), with no inherited `GIT_*`; a
          `PreToolUse` hook, the worker file guard `scripts/router-file-guard.sh`, lets the file tools edit only the
          worktree (never its `.git` or its two settings files) and read neither `~/.ssh` nor `~/.claude/channels`,
          judged on the resolved path; the shell writes only the parts of `~/.cargo` cargo writes, never the worktree's
          `.git` link, its settings files or its admin dir's link files; `spawn`, `stop`, `worktree remove` and the
          watchdog's `facts` run no git in a worktree whose `.git` link a worker changed, and their own git reads there
          run with the fsmonitor hook off (`git worktree remove` itself does not: E-WMODE round 3, waived, backlog
          e-router-v2 R38); `spawn` refuses a worktree inside the router's or the main checkout, a router checkout
          inside the worktree, and a path holding a quote, a backslash or a newline (DEC-37); `--review` starts the
          review worker, the only one granted the `cr` note and denied every edit tool, `git add` and `git commit`; it
          copies the brief into the worker's worktree and prints its sha256 and the session's id; a start the CLI
          refuses is `DEAD` with the CLI's text. A stopped worker is never revived: there is no `resume` (a plain `--bg
          --resume` drops every launch flag). `stop` closes this repository's idle worker by id (`claude stop`, then
          `claude rm`), refuses a busy one, removes that session's brief copies and reports `drift=<branch>` when its
          worktree left the spawn's branch. `worktree add <epic/E | wu/E/slug>` cuts the branch off `main` or `epic/E`
          at `<main checkout>-<branch, / as ->`; `worktree remove <branch>` takes only a clean worktree whose branch is
          merged into its base, with no session in it, and keeps the branch. The worker reports by `SendMessage` to the
          router its brief names and stays alive; a follow-up task is the router's message; a `notify_when_idle`
          subscription is an optional extra. A watchdog (DEC-45) reports every live worker to the router every 5
          minutes: `watchdog start|stop <router-name>` runs one background session `watchdog-<router-name>` on `[router]
          watchdog_model` with local settings only and an inline agent whose only tools are `SendMessage` and
          `CronCreate`; its prompt hook `watchdog facts` marks an idle worker `DONE` and a blocked one, or one busy with
          a transcript quiet 15 minutes, `STUCK`, keeps its whole output under 9000 bytes, and stops the watchdog once
          the router is gone; `spawn` refuses `watchdog` names. Every worker is granted the gate commands (`cargo
          build|test|check|clippy|fmt`, `keel preflight|verify-doc|verify-dod|notes write|lint|check`) and denied `keel
          mr`, `cargo run` and the rest of DEC-46's deny list (git config, notes, stash, switch, checkout, push, `-C`,
          the launcher, `claude`, …), on its command line only (DEC-37); `spawn` starts the worker in `[router]
          worker_permission_mode` as committed at the router checkout's HEAD (`plan`, `acceptEdits` or `auto`,
          `acceptEdits` when absent, Keel: `auto`, DEC-37), takes an optional `--permission-mode` that may only narrow
          it (`plan` < `acceptEdits` < `auto`) and an optional `--effort`, and records the mode and the effort in the
          run dir and on the `RUNNING` line. Tests: `tests/suite/router.rs`
          `launcher_refuses_unsafe_targets_and_runs_one_worker_per_name`,
          `launcher_starts_a_worker_as_a_background_session_with_the_grant_and_a_validated_mode`,
          `worker_permission_mode_comes_from_the_committed_policy`,
          `a_permission_mode_outside_the_accepted_set_or_wider_than_the_policy_is_refused_before_any_start`,
          `worker_file_guard_lets_the_file_tools_edit_only_the_worktree_and_read_neither_ssh_nor_channels`,
          `launcher_passes_every_worker_the_file_guard_and_refuses_worktrees_it_cannot_bound`,
          `a_worktree_whose_git_link_was_changed_is_never_run_git_in`,
          `stop_stops_then_removes_this_repositorys_idle_worker_by_id`,
          `a_start_the_cli_refuses_is_reported_dead_with_its_reason`, the `watchdog_*` and `fact_block_*` tests; end to
          end, through the settings-wired guard with every launcher call under `GIT_*` naming a decoy repository
          (worktree add of an epic and a WU, watchdog start and its tick, spawn in plan mode, the router's messages,
          stop, a `--review` worker, a sign-off forged as the worker refused at the merge, worktree remove, watchdog
          stop): `epic_e2e_router_drives_a_granted_worker_in_a_seeded_worktree_to_its_end`. Outside every test, live
          evidence only: that Claude Code enforces the grant and mode it is given and delivers a worker's report to an
          idle router, and that it accepts `--permission-mode auto` (the router's first spawn after E-WMODE's merge).
          Plan mode was run live once (2026-11-12, Claude Code 2.1.288, DEC-37): the worker changed nothing and reported
          by message, because the model obeyed plan mode; the harness's own block was not exercised. On DSH: A worker is
          the host session `worker_spawn` starts with the worktree as its workspace and the brief as its prompt
          (UC-DSH-3, DEC-55): one per worktree, its directory never changing, and a subagent is not a worker because it
          inherits the router's directory. A follow-up is one `worker_send`. The report is a short post to the project's
          inbox (`sh <inbox> post <name> REPORT …`, Keel: `scripts/router-inbox.sh`, DEC-58): the router's one armed
          watcher prints it within a poll and `consume <id>` acks it; no reminder, schedule or loop delivers a report,
          and the router never posts. The transcript, read with `worker_output` at each wake and before each ask, stays
          the evidence, and where the project ships no inbox script it is the report alone. Tests:
          `tests/suite/router_inbox.rs` (the script through its process boundary, one temp inbox per case);
          `worker_list`, `worker_status` and `worker_stop` are the fleet view, the state and the end. The persona is the
          worktree's `AGENTS.md`, the skills through the shared root and the brief. The skill's transport table names
          these tools, is dated, and says to re-check the host's tool list. On every host a dispatch first writes the
          brief file `<checkout>/.router/briefs/<name>.md` and reads it back; on DSH the prompt is that same text, so a
          restart still finds what was dispatched. A Claude Code worker cannot post (its sandbox does not reach the
          inbox, DEC-46) and reports by `SendMessage`.
        failure: >-
          A worker started in the router's checkout or main, without its persona, with the user's settings, an MCP
          server, an inherited `GIT_*` or outside the sandbox; a stopped worker revived; a brief copy outliving its
          session; the author writing its own `cr` note; a worktree removed dirty, unmerged or with a session in it; two
          live runs of one name; a report read from a previous run; a worker refused its own gate commands; a worker
          allowed `keel mr`; any mode other than `plan`/`acceptEdits`/`auto` (`bypassPermissions`, `dontAsk`, `default`,
          a missing value, an unknown option), committed or asked for, reaching the worker's `claude`; a worker started
          with no option in a mode other than the committed policy's, or with one in a mode wider than it; a worker
          whose file tools may edit outside its worktree, its `.git` or its settings files, or read `~/.ssh`; a worker
          whose shell may write `~/.cargo/env`, `config` or `bin`; any git call, the fsmonitor hook's above all, in a
          worktree whose `.git` link a worker changed; an uncommitted config edit changing the mode; the grant reaching
          the router; a worker that hangs alive, or goes idle without reporting, going unnoticed past a watchdog tick; a
          busy worker read as stuck before 15 quiet minutes; a watchdog report too large to reach its model whole; a
          watchdog looped by the project's hooks.
      - id: UC-ROUTE-6
        title: "the router posture is enforced, fail-closed"
        trigger: >-
          Any tool call by a session whose agent type is `router` in a checkout that enforces the posture (Keel:
          `"agent": "router"` in `.claude/settings.json`).
        expected: >-
          One `PreToolUse` guard on every tool (Keel: `scripts/router-guard.jq`) allows only the tools in the
          router's agent file (no `Agent`, `Edit`, `Monitor`), the inline keel skills, `ListAgents`, `SendMessage` to
          any named session (DEC-42), `Write` to `<cwd>/.router/briefs/<name>.md`, and Bash commands of plain words
          matching the whitelist (read-only git, gh with named query flags only, ps, the launcher's shapes: spawn,
          stop, `worktree add|remove <epic/E or wu/E/slug>` and `watchdog start|stop <router-name>`, the five
          `router-watch.sh` kinds, the owner sender's three plain shapes (`scripts/notify-owner.py
          --send|--dry-run|--check`), the inbox's `init|status|watch <seconds>|consume <id>`, never `post`
          (DEC-58), and the update log's plain shapes (UC-ROUTE-8: `scripts/router-app.sh start <router-name>`,
          `stage <wu> plan-in-work|plan-to-read|plan-approved|building|in-review [<tip>]`, `del question/<id>`, `del
          wu/<wu>/stage`, never `set` or `alert`), each word validated so none starts with `-`); `Write` also to the owner body
          `<cwd>/.router/notify/owner.md`. A guard error denies. Other agent types pass untouched. Run with `--arg
          watchdog_to <router-name>` (the watchdog session's only tool hook, DEC-45) it allows only `CronCreate` and
          a `SendMessage` to that router, for any agent type. Watch probes it stages fire only on the real event
          (PUSHED = the tip is in `origin/<b>`). Tests: `tests/suite/router.rs`, among them
          `router_guard_allows_the_owner_sender_only_as_a_plain_shape`,
          `router_guard_admits_the_inbox_watcher_and_consume_but_never_post`,
          `the_guard_and_the_inbox_script_take_the_same_ids_and_seconds` and
          `the_guard_and_the_app_script_take_the_same_words`. On DSH: Nothing enforces this posture: DSH
          has no shell-hook surface, so until a guard plugin exists (a backlog row) the skill is the only guard. The
          router holds itself to the same whitelist, says that enforcement is missing, and never treats the gap as
          licence to do the work itself (DEC-55). The permission preset decides, not the owner (UC-DSH-4, DEC-56): a
          medium call runs, a high-risk call is denied, and a denial is final. Until the plugin lands the checklists
          stand in front of the call: the router says in its first message, in one line, that no guard is loaded,
          then works START by hand. Its fleet wake is the report channel's watcher, `<inbox> watch 6600`, armed
          before the first dispatch and re-armed on every wake, one for the whole fleet; with no inbox script the
          router says only the owner can wake it. The watcher's bound wakes an idle router about 13 times a day while
          armed (DEC-58); no reminder, schedule or loop is armed instead. Owner reach: Whenever the router needs the
          owner (a sign-off, a merge, a decision, a failed run) it sends in the same turn and records `Sent to
          <channel> (id N)`. Keel's sender is `scripts/notify-owner.py`, the same command on DSH and Claude Code: the
          router writes the body to `.router/notify/owner.md` and runs `--send`, which posts to the already-paired
          Telegram bot, prints `id N` and empties the body file; `--dry-run` validates and prints the request without
          reaching the network; `--check` names the bot and sends nothing. A failure is one line and exits non-zero;
          no mode prints the credential or the chat id. Tests: `tests/suite/notify_owner.rs`, against a local mock of
          the API. The first real send is the owner's live evidence.
        failure: >-
          Any shell spelling that reassembles a denied flag (`--out""put=`); a subagent or forked skill started by
          the router; gh pointed at another host; a hook error or timeout that allows the call; a watcher that fires
          before the owner acted; a `SendMessage` to a named session refused, or one with no named recipient allowed
          (DEC-42).
      - id: UC-ROUTE-8
        title: "the router tells the app what only it knows"
        trigger: >-
          The router starts, stages a work unit or deletes a question; its watchdog ticks; its sender sends the owner
          a message.
        expected: >-
          Each change is one numbered JSON line in `<main checkout>/.router/app/log.jsonl`, folded into `state.json`
          beside it, written only by `scripts/router-app.sh` under one lock (verbs `start`, `stage`, `set`, `del`,
          `alert`; the state first, then the line, so a reader never meets a repeated number). `start` wipes both
          files and begins a new run; past 2,000 lines the log restarts from the state. The router runs only `start`,
          `stage` and `del`, in the plain shapes UC-ROUTE-6 admits; `set` and `alert` carry free JSON and only fixed
          programs run them: each watchdog tick writes a `set` per worker whose facts changed, a `del` per worker gone,
          then the router's heartbeat, and never drops its facts block for a failed write; `notify-owner.py --send`
          writes the question line and the alert line (with `keel://wu/<id>` when the body names a work unit) before
          it sends. A refused call writes nothing and exits 2. The local app reads the two files (UC-APP-1, UC-APP-2).
          Tests: `tests/suite/router_app.rs`; in `tests/suite/router.rs`
          `watchdog_tick_writes_each_live_worker_and_then_the_heartbeat`,
          `a_failing_log_write_never_drops_the_facts_block` and `the_guard_and_the_app_script_take_the_same_words`;
          `tests/suite/notify_owner.rs` (`a_send_writes_one_alert_line_before_the_message`,
          `a_failed_send_still_leaves_the_alert_line`); app/test/integration/router-log.test.ts and e2e-world.test.ts
          read lines the real script wrote.
        failure: >-
          Two writers interleaving or repeating a number; a symlinked or hardlinked file followed out of
          `.router/app/`; a half-written line read as whole; the router writing free text into the log through its own
          command; a watchdog tick that loses its facts block, or deletes a live worker's line, because a write failed.
