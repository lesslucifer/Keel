details:
  review-round-1: |-
    Code review round 1 of 1 on c6ef9f2f: FAIL, 2 blockers, 2 importants, 1 nit; fixed in this round, no new round (fix_blockers_from=1).
    - Blocker :370 (close_lines): a fresh branch a sibling had back-merged read as merged. Fixed: only merges on the base's first-parent line count (git rev-list --first-parent --merges --parents), the branch's own --no-ff merge (DEC-45). Test watchdog_close_ignores_a_fresh_branch_a_sibling_back_merged, red first.
    - Blocker :646 (prune): about D squared forks. Fixed: one pass over the run dirs, the list held in memory, the brief removal shared with cleanup as drop_brief. Test prune_reads_the_run_dirs_once (red first: 24.9 s for 120 run dirs). Measured after: 0.85 s for 120, 3.2 s for 480.
    - Important :649: a list prune could not read cleaned every brief. Fixed: anything but a JSON array of sessions stops prune (nolist). Test prune_stops_on_a_session_list_it_cannot_read, red first.
    - Important :642: the list was read before the run dirs. Fixed: glob first, then the list. Test prune_never_takes_a_worker_started_after_its_list_for_a_gone_one (the stub's one-shot after-agents hook), red first.
    - Nit src/main.rs:1103 (the C5 unit test repeats the integration test): kept both - the unit test pins DOC_STOP's text, the commit-level charter for src/main.rs; the integration test runs the hook keel hooks install writes.
    Independent review round 1:
    - HIGH: stop closed a worker listed only as state working. Fixed: one helper, norm_state, maps working to busy and done to idle for stop, the watchdog's facts and the update log; worker-ops says it. Test stop_holds_a_worker_listed_only_as_working, red first. Such a row now gets the busy wait, then the refusal, not a refusal at once.
    - MEDIUM: the posture line names resume <name> and status [<name>] (both copies).
    - LOW: settings allow git grep by design, recorded in DEC-30 (the guard refuses -O for the router; a worker's pager runs in its own sandbox; no deny pattern names an -O inside a cluster).
    - LOW: DEC-44 names prune, resume and status among the guard's shapes. UC-ROUTE-6's git list is whole and names --open-files-in-pager. project-router's DSH launcher row opens with today's fact.
    - LOW: the owner step names the exact commands (result page, follow-ups, the epic plan's details.close-steps-w7).
    - Raised out of scope: prune and git_dirs_ok - it held already (git_dirs_ok runs before every mode, :416); prune also checks the router checkout's own .git link, as spawn does, and both git-dir tests now run prune.
