details:
  base: "wu/E-APPLIST/w8-window-foundation off epic/E-APPLIST at 3cfa216"
  design-rules:
    - "Every value from a token; a new size or colour is a token change in tailwind.config.js (and styles.css for a colour), never a class."
    - "Dark lives in the tokens: a colour variable flips under the Mac's dark setting; no dark: class (the lint refuses it)."
    - "A scale with no magnitude (flex, cursor) is declared with exactly the members the window draws from; an undeclared scale is empty."
    - "Text the main part sends is shown as text, never as markup; a path is shown whole, in mono, and may wrap."
    - "Green, amber and red mean done, waits on someone, failed; the accent means a choice you made; nothing else uses them."
    - "One action in progress at a time: every button is off while a request runs; the outcome is a sentence (role=status); a failed read is a sentence (role=alert)."
    - "Actions first; what you rarely read folded (the PATH's folders)."
    - "A row that names a thing (a tool) is a named group, so a screen reader and a test find its buttons by that name."
  tokens: "colours canvas, surface, line, ink, ink-muted, accent (light 61 99 153, dark 124 158 207), on-accent, ok, wait, fail; spacing 0, px, 1-4, 6, 8 (4px steps), control 24px; type caption 11, body 13, title 15, heading 20 px; weights regular, medium, semibold; radius control 6, panel 8, full; mono ui-monospace"
  live-checks:
    by: "the owner on his Mac, about five minutes, before the sign-off; no package or make"
    steps:
      - "1. cd app && npm ci (about a minute)."
      - "2. npm run dev:browser, then open http://localhost:5173/browser.html (Vite prints the URL; if 5173 is taken it picks the next port). Screen 6 on fixtures under an amber 'Browser mode: fixtures, not your Mac' line. Switch states by the links in that line, or ?state=one-project, no-project, tool-missing, path-fallback, refusing, failing, slow. Try: no-project then Add a project...; tool-missing (claude missing, git with a problem); path-fallback (the fallback and why); refusing (Keel could not read its state); failing (any button says The request failed); slow (every button off for 0.8 s)."
      - "3. With the page open, System Settings > Appearance: Light, then Dark. The page turns with it, no reload."
      - "4. Ctrl-C the dev server. npm start (the app unpackaged; the first run downloads Electron). Screen 6 with your real tools; Choose... opens the macOS file dialog; Use the PATH appears for a tool you set; Send a test alert shows the alert and its sentence."
    worker-tried: "npm ci green. dev:browser and npm start both refused by the sandbox: listen EPERM on ::1 (ports 5199 and 5173)."
