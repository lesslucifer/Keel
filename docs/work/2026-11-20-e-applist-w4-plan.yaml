artifact: wu-plan
status: ready
id: E-APPLIST.W4
epic: E-APPLIST
title: "E-APPLIST.W4 · The app's frame"
date: "2026-11-20"
page: 2026-11-20-e-applist-w4-plan.html
requirement: >-
  app/ holds an Electron app whose window can ask its main part only by six named requests, each from the app's own
  window with checked arguments, whose main part runs git only as fixed, shell-free, locked-down commands with no
  inherited GIT_* and a PATH read once from the login shell, keeps its settings and a one-project list in its own
  folder and never writes inside a project, and which packages with Electron Forge into a signed Keel.app that shows
  one macOS test alert on the owner's Mac (or names the signing step that does not).
maps-to: >-
  Epic E-APPLIST, its W4 summary (wu-maps-to: local-app.html 'The stack: Electron', screen 6; backlog local-app A3's
  PATH setting and Apple's membership). DEC-70 (Electron; named requests; fixed commands; paths set in the app; no
  port). No use case is recorded by W4: UC-APP-1 and UC-APP-2 are W5's and W6's (epic plan use-cases).
expected:
  - "An unknown request name, a request from any frame but the app's own window's main frame, or an argument that is not one of its slot's values (free text, an extra key, a wrong type) is refused, and nothing runs."
  - "Every git run starts with -c core.fsmonitor=false --no-optional-locks, carries no GIT_* variable whatever the app's own environment holds, runs with no shell, and a value with $( ), ; or a space reaches git as one literal argument."
  - "The PATH is read once at start from the owner's login shell, relative entries dropped; a hung or failing shell falls back to the system PATH plus the tools' folders, and the window says which."
  - "Settings (where keel, git and claude are) and the project list round-trip through the app's own folder; adding and removing a project leaves every file of that project, and its git status, unchanged; a second project is refused."
  - "A project is accepted only as a main checkout (not a linked worktree) whose HEAD commits .keel/config.toml."
  - "app/'s tests run with node --test and no packages installed; once the owner's [check] commit lands, keel check runs them beside cargo test."
  - "Live, on the owner's Mac: the signed build opens, finds the three tools and the PATH, takes Keel's main checkout, and its test alert shows; or the result names the signing rung that failed and the owner decides Apple's membership."
test-plan:
  unit: >-
    app/test/unit/*.test.ts, node:test and node:assert only, each declared as a top-level test( so keel's ts counter
    counts it. Each written red first against the module's empty export, the red run noted in the result. Covered:
    each argument slot check (enum, project id, length cap, control characters), with a seeded generated-input test
    that no random string passes a slot unless it matches it; the sender check; the PATH marker parse and entry filter;
    the tool-path shape check; the settings and project-list parse (half file, unknown version, extra keys); the
    asset resolver (.., %2e%2e, %2f, absolute, NUL refused); the window options pinned (each webPreferences value, the
    built CSP string); the navigation and permission policies refuse everything; plain() blanks control characters;
    two static guards: app/src/window/ never uses innerHTML, outerHTML, insertAdjacentHTML, document.write, eval or new
    Function, and every module a test reaches imports only node: built-ins and relative .ts files (so keel check needs
    no npm).
  integration: >-
    app/test/integration/*.test.ts, hermetic (temp dirs from fs.mkdtemp under os.tmpdir(), real git, fake tools as
    shell scripts written into the temp dir), red first. (1) bridge: the whole request table against a recorded
    sender, every name and slot, refusals for an unknown name, a foreign frame, a subframe, another window, a missing
    frame, free text, an extra key; the table's names and slots snapshot-locked as the window's wire contract.
    (2) run: a fake git records argv and env: the locked flags come first, no GIT_* reaches it though the test sets
    GIT_DIR, GIT_CONFIG_PARAMETERS and GIT_EXTERNAL_DIFF, and an argument "$(touch pwned); x" arrives whole and creates
    nothing; real git in a temp repo answers from that repo, not GIT_DIR's. (3) login PATH: a fake login shell that
    prints profile noise around the markers gives the PATH; relative and empty entries dropped; a shell that hangs is
    killed at the timeout and the fallback carries its reason; a non-zero exit falls back. (4) settings and projects
    in a temp app folder: round-trip across a fresh load; a broken file is set aside and defaults load; a tool path
    that is relative, a folder, not executable, or inside a listed project is refused; a temp main checkout with a
    committed .keel/config.toml is accepted; a linked worktree, a plain folder, a repo whose config is only in the
    working tree, and a second project are refused; a tree snapshot (every path, size, mtime, bytes) and git status
    --porcelain of the project are equal before and after add, remove and every settings write.
  e2e: >-
    none: a WU's level is integration; the epic test (app/test/applist.e2e.test.ts) is written at the epic close.
    What no hermetic test reaches (the window on screen, the macOS alert, codesign, Launch Services) is checked live
    at W4's close on the owner's Mac and recorded in the result (details.live-checks).
details:
  base: "epic/E-APPLIST at 1f96ca3 (the epic plan merged, plus the owner's opening rules commit: app/ in code_paths)"
  versions-seen-2026-11-20: >-
    npm registry: electron 45.4.1 (latest; 43 and 44 still supported), @electron-forge/cli, plugin-vite,
    plugin-fuses, maker-zip 8.0.1, @electron/fuses 2.1.3, typescript 7.0.2, vite 8.3.8. Local node v24.18.0. Each is
    pinned exactly at the first install (save-exact) and recorded in the result; devDependencies only.
  layout:
    app/package.json: >-
      name keel-app, productName Keel, private, "type": "module", engines node >=24, main pointing at Forge's Vite
      build; scripts start (electron-forge start), package, make, typecheck (tsc --noEmit), test
      (node --test 'test/**/*.test.ts'); devDependencies exact: electron, @electron-forge/cli, plugin-vite,
      plugin-fuses, maker-zip, @electron/fuses, typescript, vite. No runtime dependencies.
    app/package-lock.json: "committed; npm ci only"
    app/tsconfig.json: >-
      strict, noEmit, allowImportingTsExtensions, erasableSyntaxOnly (node's type stripping runs the same files),
      verbatimModuleSyntax, module nodenext, target es2024.
    app/forge.config.ts: >-
      packagerConfig: name Keel, appBundleId dev.keel.app, asar true, osxSign with identity from KEEL_SIGN_IDENTITY
      (default "-": ad-hoc), no osxNotarize, protocols [{name: Keel, schemes: [keel]}] (the link scheme is declared
      here; W5 handles it). makers: zip for darwin. plugins: vite (main, preload, renderer) and fuses: RunAsNode off,
      EnableNodeOptionsEnvironmentVariable off, EnableNodeCliInspectArguments off, EnableCookieEncryption on,
      EnableEmbeddedAsarIntegrityValidation on, OnlyLoadAppFromAsar on, GrantFileProtocolExtraPrivileges off.
    app/vite.main.config.ts, app/vite.preload.config.ts, app/vite.renderer.config.ts: "Forge's Vite template, nothing added"
    app/src/main/index.ts: >-
      The Electron shell, the only main-part file that imports electron (with forge's build constants): single
      instance lock; the app:// scheme registered privileged and served by the asset resolver; one BrowserWindow from
      window-options; will-navigate, will-frame-navigate and will-attach-webview prevented, setWindowOpenHandler deny,
      the session's permission request and check handlers deny; ipcMain.handle('keel:ask') passes each call through
      bridge.check, then the handler; the folder and file dialogs and the Notification live here. Not unit-tested
      (needs Electron); its logic is the pure modules below; checked live.
    app/src/main/window-options.ts: "pure: webPreferences, the CSP for the build (dev adds Vite's ws origin only when not packaged), the navigation and permission policies"
    app/src/main/assets.ts: "pure: resolve an app:// path to a file under the renderer folder, or null"
    app/src/main/bridge.ts: "pure: the request table (names, argument slots) and check(call, sender, expected) -> {name, args} or {refused}"
    app/src/main/commands.ts: >-
      the fixed commands: a table of named git command shapes with typed slots (W4's three below); run(name, slots)
      builds [git, '-c', 'core.fsmonitor=false', '--no-optional-locks', ...shape], adds --no-ext-diff --no-textconv
      to any diff, log -p or show shape, spawns with execFile (shell false, stdin ignored, 10 s timeout for reads),
      env built from nothing: PATH (the login PATH), HOME, USER, LOGNAME, LANG, TMPDIR.
    app/src/main/login-path.ts: >-
      the PATH read: the login shell from os.userInfo().shell (else /bin/zsh), args -ilc and a fixed script printing
      the PATH between two markers, env HOME, USER, LOGNAME, SHELL, TERM=dumb, stdin ignored, 5 s timeout; the text
      between the markers split on ':', non-absolute and empty entries dropped. Fallback:
      /usr/bin:/bin:/usr/sbin:/sbin plus the set tools' folders, with the reason. The one place a shell runs: a fixed
      script, no value from the app in it.
    app/src/main/tools.ts: "the three tool paths: from settings, else looked up on the login PATH; check: absolute, real path a regular executable file, basename keel, git or claude, not inside a listed project"
    app/src/main/store.ts: "the app folder's two files: read, parse, write atomically (temp file in the same folder, rename); a broken file renamed aside with a time suffix and defaults loaded"
    app/src/main/settings.ts: "settings.json: {version: 1, tools: {keel?, git?, claude?}}; unset tools are looked up"
    app/src/main/projects.ts: >-
      projects.json: {version: 1, projects: [{id, path, name}]}; id 'p' plus 8 hex, minted in the main part; add
      checks the folder with the fixed commands (show-toplevel equals the folder's real path; the absolute
      git-common-dir is the folder's .git; HEAD holds .keel/config.toml); at most one project in W4.
    app/src/main/text.ts: "plain(s): control characters blanked, length capped; every string the main part sends to the window passes it"
    app/src/preload/index.ts: "contextBridge.exposeInMainWorld('keel', {ask: (name, args) => ipcRenderer.invoke('keel:ask', {name, args})}); nothing else"
    app/src/window/: >-
      index.html (CSP meta, one script, one stylesheet), main.ts, style.css: screen 6 (the project, Add, Remove),
      the settings panel (each tool's path and state, Choose, Reset; the PATH's source), Send a test alert and its
      outcome. Built with textContent and createElement only.
    app/test/unit/, app/test/integration/: "as test-plan"
    .gitignore: "app/node_modules/, app/out/, app/.vite/ (Forge's Vite build folder; see open points)"
  named-requests:
    rule: >-
      The window sends {name, args}. The main part refuses unless: the sender frame is the main frame of the app's one
      window and its URL is the app's own page (app://keel/index.html packaged, the Vite dev URL only when not
      packaged); the name is in the table; args is a plain object with exactly the slot keys; each value matches its
      slot (an enum, or the project id ^p[0-9a-f]{8}$). No slot takes a path, a command, a commit or free text; a
      path is only ever chosen in a main-part dialog.
    w4:
      - {name: state.get, args: none, does: "settings with each tool's state, the PATH and its source, the project list, the app's version"}
      - {name: projects.add, args: none, does: "main-part folder dialog; the project checks; saved; refused while one project is listed"}
      - {name: projects.remove, args: "{project: id}", does: "removes it from the list; the project's folder is not touched"}
      - {name: settings.choose, args: "{tool: keel | git | claude}", does: "main-part file dialog; the tool check; saved"}
      - {name: settings.reset, args: "{tool: keel | git | claude}", does: "drops the setting; the tool is looked up on the PATH again"}
      - {name: alert.test, args: none, does: "one Notification (title Keel, body 'Test alert: alerts work on this Mac.'); answers shown, or not shown within 5 s, or not supported"}
    later: "the waiting list, open an item's doc, the link (W5, W6); one work unit, one epic, one worker, the fleet, run an item's command, Attach, send a note (A4, A5): same table, same checks"
  fixed-commands-w4:
    - {name: toplevel, line: "git -C <project> rev-parse --show-toplevel"}
    - {name: common-dir, line: "git -C <project> rev-parse --path-format=absolute --git-common-dir"}
    - {name: has-config, line: "git -C <project> cat-file -e HEAD:.keel/config.toml"}
    - note: "each prefixed with -c core.fsmonitor=false --no-optional-locks; <project> is a real path from the main-part dialog or the list; W4 runs no keel and no claude"
  security-checklist: >-
    Electron's checklist, each item and where: remote content none (app:// only); nodeIntegration false,
    contextIsolation true, sandbox true, webSecurity true, allowRunningInsecureContent false, no
    experimentalFeatures or enableBlinkFeatures, webviewTag false (window-options, unit-pinned); CSP default-src 'none',
    script-src 'self', style-src 'self', img-src 'self', base-uri 'none', form-action 'none' (meta tag; unit-pinned);
    navigation, new windows and webviews refused; every permission denied; every IPC sender checked (bridge); no
    file:// (a privileged app:// scheme, served by the asset resolver); fuses as forge.config.ts; Electron current (a
    major within the three supported). shell.openExternal is not used in W4.
  order-of-commits:
    - "1. This plan, committed; the owner approves and signs it with --report on the page."
    - "2. Worker: app/ skeleton, the pure main-part modules and their unit and integration tests, .gitignore. node --test green, cargo test green."
    - >-
      3. The owner's typed rules commit on wu/E-APPLIST/w4-app-frame, only .keel/config.toml staged, one line changed
      in [check]: test = "cargo test && node --test 'app/test/**/*.test.ts'" (quoted: keel check runs it with sh -c and
      node expands the glob). Command: keel mr commit -m "chore(E-APPLIST.W4): [check] test runs the app's tests" --as
      vuluu. It comes after step 2 so the glob never matches nothing. An independent read-only review of the config
      change (config checklist) before the WU's sign-off.
    - "4. Re-gate: the worker runs keel check on that tip; green means cargo test and the app's tests both pass; a red stops the WU and goes to the router."
    - "5. Worker: the Electron shell, preload, window, Forge config, package.json and package-lock.json (npm ci in the sandbox, below), typecheck green."
    - "6. Owner at the Mac: the live checks below; the worker records them."
    - "7. Result report, test and doc notes, preflight, review, verify-dod wu, the owner's sign-off and merge."
  sandbox-and-network:
    worker-can: >-
      Write the code and tests; node --test; cargo test; keel check; npm ci, npm run typecheck and npm run package
      in app/ with npm_config_cache and ELECTRON_CACHE under $TMPDIR (the sandbox cannot write ~/.npm or
      ~/Library/Caches/electron; seen 2026-11-20: npm view failed on ~/.npm and passed with a temp cache);
      npx @electron/fuses read on the packaged app.
    network: >-
      Under auto mode, per call with allowed_domains: registry.npmjs.org (seen working 2026-11-20), and for Electron's
      binary github.com plus its download host (objects.githubusercontent.com or release-assets.githubusercontent.com).
      A refusal goes to the router with the exact command; nothing is routed around.
    owner-only: >-
      Opening the app (the sandbox blocks Launch Services), the macOS notification permission and the alert itself,
      a signing identity in the login keychain, and the Launch Services check of the keel scheme.
  live-checks:
    why: "no hermetic test reaches the window on screen, the notification center, codesign or Launch Services"
    steps:
      - "1. cd app && npm ci && npm run make (KEEL_SIGN_IDENTITY unset: ad-hoc). Copy out/Keel-darwin-arm64/Keel.app to /Applications and open it."
      - "2. The settings panel finds keel, git and claude and says 'PATH from your login shell'."
      - "3. Add the Keel main checkout: screen 6 lists it; git status in it is unchanged."
      - "4. Send a test alert; allow notifications when macOS asks. Seen, or not."
      - "5. codesign -dv /Applications/Keel.app (the signature) and npx @electron/fuses read --app /Applications/Keel.app (the fuses)."
      - "6. lsregister -dump | grep -i 'keel:' lists only Keel.app (the link scheme is unclaimed by another app)."
    signing-ladder:
      - "rung 1, free: ad-hoc (identity '-'; if Forge's signer refuses it, codesign --force --deep --sign - after package, recorded)"
      - "rung 2, free: an Apple Development certificate from a free Apple ID in Xcode (KEEL_SIGN_IDENTITY='Apple Development: …')"
      - "rung 3, paid: Apple's Developer Program membership (Developer ID); the owner's decision, only if rungs 1 and 2 show no alert"
    stop-at: "the first rung whose alert shows; the result names it and the steps that showed it"
  open-points:
    - q: "How many projects does W4 allow?"
      a: "One; a second is refused until it is removed. The list's file already holds a list, so A5 lifts the cap with no migration."
    - q: "Does keel check type-check app/?"
      a: "No: tsc needs npm install, and keel check must not. The worker runs npm run typecheck before each app commit and the review runs it; node's own run catches syntax."
    - q: "Is app/.vite/ ignored too?"
      a: "Yes: Forge's Vite plugin builds there and cannot be pointed elsewhere; the epic named only node_modules and out. Same independent read of .gitignore."
    - q: "Which signature first?"
      a: "Ad-hoc, then a free Apple Development certificate, then the paid membership only if both fail: cheapest first, and a build made on the same Mac needs no notarization to open."
    - q: "Bundle id?"
      a: "dev.keel.app: notifications are keyed to it; changing it later loses the notification permission once."
    - q: "Window built with a framework?"
      a: "No: plain TypeScript and textContent. Screen 6 and settings are small, and no framework means no packages in the window."
    - q: "Where do the app's files live?"
      a: "~/Library/Application Support/Keel (Electron's userData): settings.json, projects.json; W5 adds the shown alerts there."
