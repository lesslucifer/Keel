        option or escape; N2, `ROUTER_GH_DIAG=mint` exits 0 even when the mint fails, so a caller cannot tell from the
        status.

  - id: G7
    title: "Sign-off by approval: what E-GHFLOW2.W3 leaves"
    status: "struck at the E-LOCALTOOL close (2026-11-19): taken by E-GHREVERT"
    problem: >-
      E-GHFLOW2.W3 made a pull-request approval the sign-off (the github tier, `keel ci sign-off`, the two workflows).
      Proven hermetically only: the workflows run from main, so live after landing 2. At the E-GHFLOW2 close: item 1's
      live facts moved to github-flow G10. Item 5 (when no request run starts) is closed: W4 merges main into an epic
      after landing 2, and W6's conflict watch sends a conflicted pull request back to its worker. Items 2 - 4 stay
      open for a later epic; item 3's limit is recorded in DEC-64 and DEC-48 amended, and since DEC-66 such a note
      also covers the review. New, from E-GHFLOW2.W7: the epic walk still reads `walk_waivers` from a cr note an
      approval covered as FAIL or stale, so a waiver from a review that did not pass can pass a seam.
    proposal: >-
      For the W7 point: read `walk_waivers` only from a passing review, or name them in `covers`. The rest is in the
      items.
    source: >-
      E-GHFLOW2.W3 plan open points 1 - 3 and 6, and its result.
    taken-by: "E-GHREVERT (backlog local-app A1)"
    items:
      - >-
        row 1, Live facts owed at landing 2 (moved to github-flow G10), each checked by the first approval on GitHub:
        that a `pull_request_review` run's `workflow_run` payload carries `pull_requests[0].number` for a
        same-repository pull request (the writer falls back to `GET /repos/{o}/{r}/commits/{sha}/pulls`); that
        `workflow_run` takes main's file with the token it declares; that `pull-requests: read` reads the reviews and
        `statuses: write` sets `keel/sign-off`; that `contents: write` pushes `refs/notes/mr`; and that GitHub asks no
        approval to run the request workflow for the owner's own review. Takes: the epic's landing 2 report.
      - >-
        row 2, A dismissed approval: the note it wrote stays, as a typed sign-off does; a later run sets
        `keel/sign-off` back to pending. Retracting a sign-off is a new rule (W7's comments could carry it). Takes:
        E-GHFLOW2.W7 or a later epic.
      - >-
        row 3, Check 8 re-reads nothing in CI: it checks an approval note's bindings offline; the writer is the one CI
        step that reads the review, and W4 makes its status required. Until a check re-reads the review, a github-tier
        note proves no more than a `username:` line: anyone who can write GitHub's notes, or a same-user shell here,
        can write one (security review I2). The router takes GitHub's sign-offs into the checkout add-only
        (writer-shaped ones GitHub added since the router last pushed `refs/notes/mr`), never an edit or a deletion,
        fetching by sha the commit of a sign-off it lacks; a note on a commit GitHub does not serve is not taken, and
        the next push drops it from GitHub. One known wrinkle, self-healing (security review round 3, I3-3): a
        sign-off removed here after an import whose leased push failed is taken back once, since the snapshot moves
        only on a successful push; the next successful push carries the removal. DEC-48 records this at the
        distillation (github-flow G6). Takes: E-GHFLOW2.W4, if the rules need more.
      - >-
        row 4, The epic report note and an approval: GitHub never shows a note, and a worker can rewrite one before
        the push, so an approval attests only a report committed in the range; the report note is attested by the
        typed sign-off alone (security review I6). Binding the note to what the signer saw (its hash shown on the page
        he reads, as of the review) waits for docs as pages. Takes: E-GHFLOW2.W8.
      - >-
        row 5 (done: closed at the E-GHFLOW2 close, W4 merges main into an epic after landing 2 and W6's conflict watch
        sends a conflicted pull request back to its worker), When no request run starts (security review N7): GitHub
        takes a `pull_request_review` workflow from the pull request's merge commit: a WU pull request into an epic
        branched before landing 2 holds no request workflow on either side, and a conflicted pull request has no merge
        commit, so neither runs the writer; `keel/sign-off` stays unset and the typed sign-off signs. Merging main into
        the epic after landing 2 (W4's rule) fixes the first; the conflict flow (W6) the second. Takes: E-GHFLOW2.W4
        and W6.

