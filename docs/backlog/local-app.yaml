# Keel backlog: local-app. Data only, no page (DEC-69). Open rows in full; a closed row is its id, title and how it closed.
# Ids are never reused. Order and next free ids: backlog-index.yaml.
title: "Backlog: the local app"
letters: [A, L]
about: >-
  Going back to before GitHub's flow, then building the desktop app in place of it: five epics in order (A1 - A5),
  then later needs and one re-pointed idea (L1 - L9). E-LOCALTOOL closed on 2026-11-19 with a design and no code:
  docs/local-app.html is the app as designed, and DEC-70 records why. Each epic waits only on the ones before it and is
  useful on its own. Its parts and K-numbers (the keel or router changes the app needs) are in docs/local-app.html,
  under "The build order"; the needs n1 - n10 are listed there too. Distilled from E-LOCALTOOL (W5 result, P4 to P6,
  and the close).
open:
  - id: A2
    title: "E-KEELFIX · Keel fixes"
    status: next; A1 done
    problem: >-
      First use: your rule-file commit runs the committed rules, and the gate can run with nothing written (n3).
    proposal: >-
      Parts: K9, the commit hooks read the committed `.keel/config.toml`, not the folder's file; K2, `keel verify-dod
      … --no-receipt`; `keel notes write … --help` prints help and writes no note; the github tier's reading removed
      once E-DOCSPLIT is on main (E-LOCALTOOL is). Waits on: A1 (done).
    source: >-
      E-LOCALTOOL.W5 result, P4 to P6, and the close.
    taken-by: "E-KEELFIX"

  - id: A3
    title: "E-APPLIST · Alerts and your list"
    status: after A1; replanned 2026-11-20 (DEC-71 - DEC-77)
    problem: >-
      First use: an alert at your desk (n1) and one list of what waits on you (n2). Read-only.
    proposal: >-
      Parts: the router's update log (K14) and the watchdog's lines (K15), with their defaults and the "router not
      heard" bar, tested by an app restart and a router restart; the router's stage lines (K4) and alert line (K10);
      the app shell (Electron's main part, a preload bridge with a request and a push channel, the security checklist,
      the PATH setting, one project, a Forge build, Apple's membership decided at its signed build); the window's
      foundation (React with Vite, Tailwind on Keel's own closed tokens and a lint rule, a browser mode on a fake
      bridge, Vitest run by hand); the Reader, Watcher and Alerter on the two sources, with the app reading the local
      epic branch; screens 1, 2 and 6, and Open with a copy of the committed page; the alert's link and one Telegram
      test (K12); `?diff=latest` on a file link checked; the epic test on Playwright, driving the unpackaged app. No
      tray, menu or login item (L9). Waits on: A1.
    source: >-
      E-LOCALTOOL.W5 result, P4 to P6, and the close; the owner's replan of 2026-11-20 (DEC-71 - DEC-77).
    taken-by: "E-APPLIST"
    follow-ups:
      - >-
        Simplify the lint helper (app/eslint-rules/classes.js) to an advisory for honest code and leave the guarantee
        to the emitted-CSS check (app/eslint-rules/emitted.js); close the four round-5 findings W8 was signed with,
        its review at the 5-round cap (cr note on 796fb29, WAIVED: 2 blockers, 2 importants open; none ships anything
        wrong): classes.js:283 (blocker: the taint rule refuses honest code - a non-literal string binding or a table
        handed to an imported or a rest-parameter helper is reported unread); classes.js:362 (blocker: a table changed
        in a local helper through arguments[0], forEach, new, an array, a spread, a tag or an object wrapper is read
        as its declared value); emitted.js:149 (important: a stylesheet in a package that is not a runtime dependency,
        reached by a relative node_modules path, ships with lint green); emitted.js:182 (important: the import and
        injection scans are regexes over raw text, so honest JSX text, a comment or an SVG icon fails lint). Source:
        E-APPLIST.W8 result and its cr note; recorded by the E-APPLIST.W5 plan. Taken by: E-APPLIST.W6 if the helper
        refuses its honest screen code, else this row at E-APPLIST's close (W9), which re-points it to a row of its
        own if still open.
      - >-
        Back to TypeScript 7 when typescript-eslint can read it: W8 pinned one TypeScript, 6.0.3, for both the type
        check and the lint, because typescript-eslint cannot parse 7 (W8 plan open point 2, the owner's answer of
        2026-11-22). Source: E-APPLIST.W8 result, follow-ups (796fb29). Taken by: this row; at E-APPLIST's close (W9)
        it moves to a row of its own if typescript-eslint still cannot read 7.
      - >-
        A tool reached through a chain of links whose middle hop is inside a project (/usr/local/bin/git ->
        <proj>/bin/git -> /outside/git) is still accepted; fix by walking each link hop (W7 review round 3's refuted
        candidate). Source: E-APPLIST.W7 result, follow-ups (791eca7). Taken by: this row; at E-APPLIST's close (W9)
        it moves to a row of its own if still open.
      - >-
        After a left job that wrote past LATE_OUTPUT_CAP ends, its paused pipe is never read to its end, so the app
        keeps that pipe and the capture's answer until it quits (W7 review round 4's waived nit, app/src/main/commands.ts:177;
        bounded, at most the login-shell read once per launch). Source: E-APPLIST.W7 result, follow-ups (791eca7).
        Taken by: this row; at E-APPLIST's close (W9) it moves to a row of its own if still open.
      - >-
        A second launch that loses the single-instance lock quits silently (app/src/main/index.ts, where
        app.requestSingleInstanceLock() fails), so an npm start while another Keel runs (the packaged app keeps running
        with no window, DEC-77) hands its window to the old build with no word in the terminal. Fix: print "Keel is
        already running: this launch quits; quit the other first" to stderr before app.quit(); W9's Playwright test
        checks a second launch shows no old window. Source: the E-APPLIST.W5 live check (2026-11-22), the worker's
        trace. Taken by: this row; at E-APPLIST's close (W9) it moves to a row of its own if still open.
      - >-
        The test alert's "not shown" text says "Check System Settings > Notifications > Keel" (app/src/window/hooks.ts),
        right for the packaged app; under npm start the unpackaged app is Electron.app, and macOS files its
        notifications under "Electron" (on the owner's Mac it had no entry at all). Fix: name the right place for each
        (the main part knows app.isPackaged). Source: the E-APPLIST.W5 live check (2026-11-22). Taken by: this row;
        at E-APPLIST's close (W9) it moves to a row of its own if still open.

