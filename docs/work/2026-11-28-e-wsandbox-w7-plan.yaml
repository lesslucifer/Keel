artifact: wu-plan
status: ready
id: E-WSANDBOX.W7
epic: E-WSANDBOX
title: "E-WSANDBOX.W7 plan: what the router and the watchdog may do, in two tables a test pins"
date: "2026-11-28"
page: 2026-11-28-e-wsandbox-w7-plan.html
requirement: >-
  The router's bound and the watchdog's bound are each written once, as one table of every admitted tool, Bash shape,
  write, setting and unsandboxed script with what widening it exposes, in one new decision in
  docs/decisions/router.html; tests/suite/router.rs reads both tables and fails when a table row, a guard shape, a
  settings allow line, the router agent file's tools or the watchdog's launch argv disagree; neither session gains a
  sandbox or any power, and after W5 merges the tables and tests cover its resume and status shapes too.
maps-to: >-
  E-WSANDBOX.W7 (wu-summaries); the owner's scope note of 2026-11-26 (the router's and the watchdog's own parts); the
  merge ruling of 2026-11-28 (old W7 and W8 as one WU); the parallel ruling of 2026-11-28 (W7 runs beside W5);
  UC-ROUTE-1 and UC-ROUTE-6 (amended).
expected: >-
  docs/decisions/router.html holds one new decision with two tables (router, watchdog), each row a bound id, what is
  admitted and what widening it exposes; the guard test admits one example of every router Bash alternative and
  refuses a near miss of each, and its set of alternatives equals the router table's Bash rows; every
  permissions.allow line of .claude/settings.json is admitted by the guard on an example and every guard Bash
  alternative has its allow line (router-watch.sh narrowed to its five kinds if the owner keeps the default); the
  guard's verdicts are the same under every permission_mode; router.md's tools equal the guard's and its body points
  to the table instead of listing shapes; the watchdog's argv carries only --setting-sources local, --tools
  SendMessage CronCreate, --strict-mcp-config and a --settings whose only key is hooks (the facts hook and the guard
  with watchdog_to), and the guard with watchdog_to refuses every other tool and every other CronCreate or recipient;
  after the epic merge, resume and status (and retire, under W5's outcome B) are rows and pins; the rule-bearing files
  are staged together for one owner keel mr commit.
test-plan:
  unit: >-
    Per worker commit, in tests/suite/router.rs (the guard and launcher are jq and shell, run through the suite's
    helpers guard(), guard_event(), guard_to() and the stub-claude Launcher, as every router test is): one verdict case
    per admitted shape and per refused near miss, each a single jq run on one PreToolUse event. A case pinning
    behaviour that already holds is green when added; the settings-narrowing case and the router.md pointer case are
    red until the owner commit, like W9's and W5's staged-file tests.
  integration: >-
    tests/suite/router.rs, new or extended: (1) router_bounds_table_matches_the_guard - parses the new decision's two
    tables (rows carry data-bound="<id>") and asserts the router Bash ids equal the guard's alternatives in bash_ok and
    app_shapes, the tool ids equal def tools, the skill ids equal def skills, the write ids equal the two Write paths;
    (2) settings_allow_and_the_guard_name_the_same_bash_shapes - every allow line is admitted on an example, every
    alternative has a line (generalises settings_allow_exactly_the_launcher_shapes_the_guard_admits and
    settings_allow_exactly_the_app_shapes_the_guard_admits, which stay); (3) router_guard_verdicts_ignore_the_permission_mode -
    the same events under plan, acceptEdits, auto, default and bypassPermissions give the same verdicts;
    (4) router_agent_file_names_the_tools_and_points_to_the_bounds - tools: equals def tools (kept from
    router_guard_confines_the_router_to_its_tools_and_leaves_other_agents_alone), no Agent, Edit or Monitor, the body
    cites the decision; (5) watchdog_bounds_table_matches_its_launch - the watchdog table's ids equal the argv flags
    the launcher passes (extends watchdog_session_loads_local_settings_only_and_defines_its_agent_inline and
    watchdog_starts_as_a_background_session_whose_hooks_carry_the_routers_name: the --settings JSON's only key is hooks,
    no permissions, no sandbox, no env); (6) watchdog guard refusals widened - Bash, Read, Write, CronDelete, a
    CronCreate with another cron, prompt or recurring false, a SendMessage to another name or an empty to (extends
    guard_run_with_a_watchdog_recipient_allows_only_the_scheduler_and_a_message_to_that_name); the facts hook's
    linked_ok-before-git pin is the existing watchdog_facts test at router.rs:1740-1741, cited by the table, not
    duplicated. After the epic merge: W5's resume, status (and retire under B) rows join (1) and (2).
  e2e: >-
    none: both bounds are the guard and the launcher's argv, proven by the fixture tests above (epic plan
    details.w7-router-bounds.no-live-probe); the epic e2e is W5's probe-clone run and is unchanged by W7.
details:
  grounding:
    tip: "0f68238b950bb6536f4d805159fa06ac9241ebef (= epic/E-WSANDBOX); line numbers below are at this tip."
    guard: |-
      scripts/router-guard.jq (72 lines): def tools line 15 (11 tools); def skills line 18 (keel-router,
      project-router, keel-workflow, keel-plan, keel-distill); gh_args line 32; app_shapes line 36; bash_ok 37-41
      (character whitelist, no --ou, the alternatives, no .. in a scripts/ path); watchdog_to branch 43-51; agent_type
      gate 52; tools 53; Bash 54-59 (length cap 1000, trim, deny text 58); Write 60-64 (.router/briefs/<name>.md and
      .router/notify/owner.md under cwd); Skill 65-66; SendMessage 69-71 (any non-empty to). The guard never reads
      permission_mode.
    settings: |-
      .claude/settings.json: "agent": "router" line 2; permissions.allow 4-39 (34 lines); PreToolUse guard 42-53, no
      matcher, fail-closed (jq failure exits 2); PostToolUse and Stop verify-doc hooks 54-74. Line 32
      "Bash(scripts/router-watch.sh *)" is wider than the guard's five kinds (commit|signed|merged|pushed|tagged); the
      guard is the bound, so an allow line wider than it only skips a prompt the guard denies anyway.
    agent-file: ".claude/agents/router.md: tools line 4 (the guard's 11); body 11-33 lists the Bash shapes by hand and omits scripts/router-inbox.sh, a drift source the pointer removes."
    mode: "The router's permission mode is the user settings' (auto); the project settings set none. Hooks run in every mode, so the bound does not depend on it; test (3) pins that."
    launcher-watchdog: |-
      scripts/router-worker.sh watchdog mode 348-384: start reads [router] watchdog_model (haiku), refuses an unlisted
      router and a second start, builds the inline agent (tools SendMessage, CronCreate; prompt says the blocks are
      untrusted) 368-369 and the hooks JSON 370-372 (UserPromptSubmit: watchdog facts <router>, timeout 60;
      PreToolUse matcher *: router-guard.jq --arg watchdog_to <router>, fail-closed), then claude --bg -n
      watchdog-<router> --setting-sources local --agents ... --agent watchdog --model <m> --tools SendMessage CronCreate
      --allowedTools SendMessage CronCreate --strict-mcp-config --autocompact 100k --settings <hooks> 374-376. No
      --permission-mode. facts() 218-307: claude agents --json; claude stop of its own session when the router is gone
      (225-226); git -c core.fsmonitor=false (and --no-optional-locks for status) in a worktree only after linked_ok
      (261-268); reads the last 64 KB of each worker's transcript; app_lines writes the update log through
      scripts/router-app.sh. Header 11-20.
    local-settings: "--setting-sources local loads the router checkout's .claude/settings.local.json (absent at this tip; git-ignored; the owner's file). A worker's sandbox cannot write the router checkout (DEC-46 point 9; the file guard), so only the owner can widen the watchdog that way."
    skill: "skills/keel-router/SKILL.md and .claude/skills/keel-router/SKILL.md (identical), 'The router posture' 25-78: generic, names no Keel file path beyond the launcher's shapes; has no watchdog paragraph."
    project-router: ".claude/skills/project-router/SKILL.md:22 (Router checkout row) and :43 (posture: .claude/agents/router.md)."
    decisions: "docs/decisions/router.html: DEC-30 (line 21-27, the whitelist and the guard), DEC-45 (96-103, the watchdog), DEC-46 (117-138, scope); DEC-37 (105-116) is the worker grant and mode, which W7 does not touch. Highest DEC id in docs/decisions at this tip: DEC-83 (distribution.html); the new decision takes the next free id at build time (DEC-84 if none lands first)."
    use-cases: "docs/use-cases/router.yaml UC-ROUTE-1 (line 12) and UC-ROUTE-6 (line 177): UC-ROUTE-6 names the tests; it gains the two new test names and the decision."
    tests: "tests/suite/router.rs (5064 lines): guard 19, guard_event 24, settings 46, router_guard_confines_... 261-288, settings_run_the_guard_on_every_tool_and_fail_closed 543, router_guard_admits_spawn_and_stop_and_refuses_resume_wait_and_send 2078, settings_allow_exactly_the_launcher_shapes_the_guard_admits 2115, guard_to 3081, watchdog tests 3094-3357, facts unlinked pin 1740-1741."
  router-bounds:
    - {id: tools, admitted: "Read, Grep, Glob, Write, Bash, Skill, ToolSearch, TodoWrite, AskUserQuestion, SendMessage, ListAgents", widening-exposes: "Agent: a subagent runs under its own agent type, outside the guard, with full tools. Edit: any file, the guard and settings included. Monitor: a shell outside the Bash hook."}
    - {id: read, admitted: "Read, Grep, Glob of any path the owner's user can read (no sandbox)", widening-exposes: "Already wide: secrets under the owner's home are readable by a session that reads untrusted text; its only ways out are a brief and a SendMessage. Recorded, not changed (open question)."}
    - {id: bash-git, admitted: "git status|log|diff|show ..., git branch -v|-vv|-a|-av|-va|-a -v|--all|--all -v", widening-exposes: "Any other git word writes refs, config or hooks with the owner's rights, unsandboxed."}
    - {id: bash-gh, admitted: "gh pr view|list|status with named query flags and bare words; no -R, URL, -q/--jq/-t, --web", widening-exposes: "A host or jq argument points gh's keychain token at any host or reads the environment."}
    - {id: bash-ps, admitted: "ps aux, ps -ef", widening-exposes: "kill or another process tool stops the owner's sessions."}
    - {id: bash-launcher, admitted: "scripts/router-worker.sh spawn|stop <words>, worktree add|remove <epic/E or wu/E/slug>, watchdog start|stop <router-name>; after the merge, W5's resume <name> and status [<name>] (retire <name> under outcome B)", widening-exposes: "Each mode runs claude and git with the owner's rights; a new mode or argument is a new unsandboxed power."}
    - {id: bash-watch, admitted: "scripts/router-watch.sh commit|signed|merged|pushed|tagged <words not starting with ->", widening-exposes: "pushed runs git fetch of one remote ref over the network; another kind or a flag reaches more of the network or git."}
    - {id: bash-notify, admitted: "scripts/notify-owner.py --check|--send|--dry-run (body in .router/notify/owner.md)", widening-exposes: "A body argument lets a quoted string reach the shell; the sender reaches its push host."}
    - {id: bash-inbox, admitted: "scripts/router-inbox.sh init|status|watch <seconds>|consume <id>, never post", widening-exposes: "post lets the router write a report as if from a worker."}
    - {id: bash-app, admitted: "scripts/router-app.sh start <name>|stage <wu> <stage> [<tip>]|del question/<id>|del wu/<wu>/stage, never set or alert", widening-exposes: "set and alert carry free JSON no plain-word guard can judge."}
    - {id: bash-form, admitted: "One command of plain words, at most 1000 characters; no quote, $, glob, pipe, redirect, separator, --ou, or .. in a scripts/ path", widening-exposes: "Any shell syntax lets a denied command be reassembled (lessons K10)."}
    - {id: write, admitted: "<cwd>/.router/briefs/<name>.md and <cwd>/.router/notify/owner.md", widening-exposes: "A write to scripts/ or .claude/ rewrites the guard or settings the next session loads."}
    - {id: skills, admitted: "keel-router, project-router, keel-workflow, keel-plan, keel-distill (inline)", widening-exposes: "A skill that forks a subagent escapes the guard as Agent does."}
    - {id: message, admitted: "SendMessage to any non-empty name; ListAgents", widening-exposes: "Already any named session; a peer's message is never the owner's approval (UC-ROUTE-1)."}
    - {id: settings-allow, admitted: "permissions.allow: the same shapes as the guard (skips the prompt only)", widening-exposes: "Nothing while the guard runs; a line wider than the guard is drift (router-watch.sh * today)."}
    - {id: mode, admitted: "the user settings' mode (auto); the guard runs in every mode", widening-exposes: "None through the mode; removing the hook or the agent line removes the bound."}
    - {id: hooks, admitted: "PreToolUse guard on every tool, fail-closed; PostToolUse and Stop verify-doc", widening-exposes: "A matcher on the guard leaves the unmatched tools unbounded; an error that allows lets every call through."}
  watchdog-bounds:
    - {id: tools, admitted: "--tools SendMessage CronCreate (only those exist in the session); --allowedTools the same", widening-exposes: "Bash or Read lets a session that reads worker transcripts act on them."}
    - {id: guard, admitted: "router-guard.jq --arg watchdog_to <router>: CronCreate only of cron */5 * * * *, prompt tick, recurring true; SendMessage only to <router>", widening-exposes: "Another recipient lets untrusted worker text steer a worker; another schedule floods the router."}
    - {id: settings, admitted: "--setting-sources local (the router checkout's settings.local.json, absent today, the owner's), --settings with hooks only, --strict-mcp-config, inline agent, no --permission-mode", widening-exposes: "Project settings bring the Stop verify-doc hook (the watchdog loops on a red doc) and the router's allow list; MCP brings tools the guard never named."}
    - {id: model, admitted: "[router] watchdog_model (haiku), --autocompact 100k, never resumed", widening-exposes: "Cost only."}
    - {id: facts-hook, admitted: "watchdog facts <router>, unsandboxed with the owner's rights, timeout 60: claude agents --json; claude stop of its own session once the router is gone; git branch/log/status in a worktree only after linked_ok, fsmonitor off, no optional locks; the last 64 KB of each transcript; the update log through router-app.sh", widening-exposes: "git in an unlinked worktree runs a worker-written config or fsmonitor with the owner's rights; any write beyond the update log is unsandboxed."}
  sandbox-fork:
    facts: "A Claude Code sandbox bounds the Bash tool only. The watchdog has no Bash tool, and its facts hook runs outside any sandbox; so a sandbox bounds nothing of it. The router's Bash runs only the whitelisted shapes; the launcher must write ~/.claude (claude --bg), the git dir (worktree add) and reach the network (claude, git fetch, the push sender)."
  overlap-with-w5:
    files-both-edit:
      - "scripts/router-guard.jq (W5: resume, status, retire under B, the deny text; W7: a header comment citing the decision, the deny text pointing to it)"
      - ".claude/settings.json (W5: allow resume *, status, status *, retire * under B; W7: router-watch.sh narrowed to five kinds)"
      - ".claude/agents/router.md (W5: only if a tool line changes, none expected; W7: the body points to the decision)"
      - "scripts/router-worker.sh (W5: resume, status, stop, the flag builder; W7: none planned - a header comment only if the review asks)"
      - "skills/keel-router/SKILL.md and .claude/skills/keel-router/SKILL.md (W5: Workers, the review table, 'One live session per WU'; W7: 'The router posture' only, 25-78)"
      - ".claude/skills/project-router/SKILL.md (W5: Workers 68; W7: the Router checkout row 22 and the posture row 43)"
      - "tests/suite/router.rs (W5 rewrites router_guard_admits_spawn_and_stop_and_refuses_resume_wait_and_send and settings_allow_exactly_the_launcher_shapes_the_guard_admits; W7 adds tests (1)-(6) beside them)"
      - "docs/decisions/router.html (W5: DEC-30, DEC-43, DEC-44, DEC-46 rows; W7: the new decision, DEC-30, DEC-45, DEC-46 Amended rows)"
      - "docs/use-cases/router.yaml (W5: UC-ROUTE-1, -5, -6; W7: UC-ROUTE-1, -6)"
      - "docs/decisions/decisions-index.yaml (W7 only: the new decision's entry)"
    merge-order:
      recommended: >-
        A - W5 merges into epic/E-WSANDBOX first. W7 builds now: its tests and docs are worker commits; it makes no
        rule-bearing edit yet. Once W5 has merged, the W7 worker merges epic/E-WSANDBOX into
        wu/E-WSANDBOX/w7-bounds with a merge commit (never a rebase). Conflicts can fall only in files W7 has
        committed (tests/suite/router.rs, docs/decisions/router.html, docs/use-cases/router.yaml), none rule-bearing,
        so the worker resolves them. Then it adds W5's resume and status rows and pins, makes its rule-bearing edits
        on top of W5's, stages them, and the owner makes the one keel mr commit. One review covers the range and the
        merge's resolution.
      cost-of-A: "W7's owner commit, review and sign-off wait for W5's merge, which waits on the owner's W5 probe. No second owner commit, no re-review."
      alternative-B: >-
        W7 first, signed and merged. W5 then merges the epic into its branch (a merge commit) and must add its resume and
        status rows to W7's tables and tests, which test (1) and (2) force (a guard alternative with no row fails).
        Cost: W5's confirmed plan is amended and its review covers the table rows; W7 is not touched again.
      alternative-C: >-
        W7 signs off before W5 merges, then takes W5's shapes later. Cost: a second owner keel mr commit on W7 (or a
        follow-up WU) and a second review round.
      switch-rule: "If W5 is blocked (no probe) when W7 is otherwise ready, the router asks the owner to switch to B; no code changes with the switch, only who adds W5's rows."
  rule-bearing-map:
    staged-for-one-owner-commit:
      - ".claude/settings.json (router-watch.sh * becomes five kind lines, if the default holds)"
      - ".claude/agents/router.md (body: the hand list replaced by a pointer to the decision; tools line unchanged)"
      - "scripts/router-guard.jq (header comment and deny text cite the decision; no verdict changes)"
      - "skills/keel-router/SKILL.md and its .claude/skills/keel-router mirror ('The router posture': a watchdog paragraph and the rule 'every bound has a table and a test'; generic, no Keel paths)"
      - ".claude/skills/project-router/SKILL.md (rows 22 and 43 point to the decision)"
    committed-by-worker:
      - "docs/work/2026-11-28-e-wsandbox-w7-plan.html and .yaml (this pair), later the result pair"
      - "tests/suite/router.rs"
      - "docs/decisions/router.html (the new decision with both tables; DEC-30, DEC-45, DEC-46 Amended rows) and docs/decisions/decisions-index.yaml"
      - "docs/use-cases/router.yaml (UC-ROUTE-1, UC-ROUTE-6)"
      - "docs/backlog/e-router-v2.yaml only under the sandbox fork's option (b) or the read option deferred"
    epic-plan-deviation: "The epic's rule-bearing-by-wu.W7 names DEC-37; DEC-37 is the worker grant and mode, which W7 does not touch, so the Amended rows go to DEC-30 (the router whitelist), DEC-45 and DEC-46."
  open-questions:
    - q: "Do the router and the watchdog stay outside a sandbox? (the epic's open fork)"
      default: "Yes. The guard is the bound. A sandbox bounds only the Bash tool: the watchdog has none, and the router's Bash runs only whitelisted scripts that need ~/.claude, the git dir and the network."
      options: "(a) stay unsandboxed - default; (b) sandbox the router's Bash with exceptions for the launcher, watch and sender; (c) defer to a backlog row."
      under-each: "(a) the decision records it; no backlog row. (b) out of W7 (it adds a setting, not a table): a backlog row in docs/backlog/e-router-v2.yaml, W7 unchanged otherwise. (c) the same backlog row, worded as open."
    - q: "Narrow the router's settings allow line for router-watch.sh to its five kinds?"
      default: "Yes: five lines, one per kind, so the settings and the guard name the same set. No power changes; the guard already refuses the rest."
      options: "(a) narrow - default; (b) keep router-watch.sh * and record it as allowed drift."
      under-each: "(a) test (2) checks both directions, red until the owner commit. (b) test (2) holds a named exception for that one line."
    - q: "Where do the two tables live?"
      default: "One new decision in docs/decisions/router.html (T2, the why); router.md, project-router and UC-ROUTE-6 point to it; the keel-router skill keeps the generic rule only."
      options: "(a) the decisions doc - default; (b) the project-router skill (rule-bearing: every table change is an owner commit)."
      under-each: "(a) the tables change in worker commits, and the test ties them to the guard, which only the owner commits. (b) the tables join the owner commit; test (1) reads the skill."
    - q: "Should the router's Read reach stay as wide as the owner's user?"
      default: "Yes, recorded as accepted: the router must read worktrees, transcripts and git state; W7 adds and removes no power."
      options: "(a) record only - default; (b) the guard also denies Read, Grep and Glob under ~/.ssh and ~/.claude/channels, the paths a worker's sandbox denies."
      under-each: "(a) a row in the decision. (b) a guard change in the owner commit, its pins in test (1), a narrowing the owner names."
    - q: "Which WU merges into the epic first?"
      default: "W5 first (overlap-with-w5.merge-order.recommended, A)."
      options: "(A) W5 first, W7 merges the epic in, then its one owner commit; (B) W7 first, W5 adds its rows; (C) W7 signs first and takes W5's shapes in a second owner commit."
      under-each: "A: W7 waits at its owner commit. B: W5's plan is amended. C: a second owner commit and review on W7."
  commit-order:
    - "1. docs(E-WSANDBOX.W7): this plan pair (now)."
    - "Owner: confirms the plan (owner ruling 2026-11-28). Nothing below starts before it."
    - "2. test(E-WSANDBOX.W7 router): tests (1)-(4); (1) reads a decision not yet written, so it lands with 4, or is red until 4."
    - "3. test(E-WSANDBOX.W7 watchdog): tests (5)-(6)."
    - "4. docs(E-WSANDBOX.W7): the new decision with both tables, the Amended rows, the index entry, UC-ROUTE-1 and UC-ROUTE-6."
    - "5. Under A: once W5 is merged, a merge commit of epic/E-WSANDBOX into this branch (no rebase); then test and docs commits adding W5's resume and status (retire under B) rows and pins."
    - "Staged, not committed by the worker: every file under rule-bearing-map.staged-for-one-owner-commit, made after step 5 on top of W5's versions."
    - "6. Owner: one keel mr commit of the staged files; the red cases go green on it."
    - "7. docs(E-WSANDBOX.W7): the result pair; a fresh worker re-gates; a fresh reviewer runs the round."
  owner-steps:
    - "1. Read this page; answer or accept the five questions by htmldoc comment; confirm the plan."
    - "2. Under the merge-order default: sign off and merge W5 as its plan says; W7 then merges the epic in by itself."
    - "3. After the worker stages: one keel mr commit of the staged rule-bearing files (--as vuluu)."
    - "4. After the re-gate, the review round and the result pair: keel mr confirm wu <tip> --as vuluu --target epic/E-WSANDBOX, then git merge --no-ff wu/E-WSANDBOX/w7-bounds into epic/E-WSANDBOX."
  gates:
    - "keel verify-doc on every changed doc, keel check raw, by the worker."
    - "keel preflight wu and keel verify-dod wu after the owner commit (they bind the tip)."
  effort-note: "This epic's workers run on opus at effort medium (owner ruling 2026-11-28); the epic's open effort question is not W7's and is unchanged."
  htmldoc:
    id: 6b0a62cc9f34851f0dfb2dae
