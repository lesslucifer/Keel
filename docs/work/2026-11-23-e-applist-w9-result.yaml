outcome: >-
  Delivered, the owner's packaged live check pending. The epic test app/e2e/applist.e2e.spec.ts drives the
  unpackaged app (Vite's three bundles made by Forge's own Vite plugin, pnpm build:e2e; nothing packaged or signed)
  in a temp app folder (the new KEEL_APP_DIR seam) through eleven named steps on a temp keel project written by the
  real router-app.sh, the watchdog's facts step and notify-owner.py --send; the owner's second run (on 2347864) passed every step in 2.1 minutes (evidence.e2e-runs). Its fast twin,
  test/integration/e2e-world.test.ts, walks the same world through the real reader, alerter, marks and Open in keel
  check with no Electron and no port. A3's two app items are fixed, red first: a second launch says 'Keel is already
  running: this launch quits; quit the other first' on stderr before it quits; the test alert's 'not shown' text
  names Notifications > Keel when packaged and Notifications > Electron under pnpm start (state.get carries
  packaged). T2 distilled and committed: UC-APP-1 and UC-APP-2 (docs/use-cases/app.yaml, new), UC-ROUTE-8 and the
  amended UC-ROUTE-6, DEC-78, backlog A3 closed with its open follow-ups on A11 and two live-check questions on A4.
  T1 written for the owner's rule-file commits, not committed by the worker: docs/local-app.html,
  docs/architecture.html, docs/install.html. node 406 tests (405 pass, 1 skipped in the worker's sandbox: fs.watch),
  Vitest 232, typecheck, lint and keel check green before every commit.
deviations:
  - >-
    The epic test was run by the owner, not in the worker's session: the worker's sandbox refused the local port
    probe (listen EPERM on 127.0.0.1 port 0) although the worktree's settings allow local binding, and the owner ruled
    that the sandbox stays as it is (a later epic reviews it); Playwright reaches Electron through a debugging port.
    The plan's open point 1 answer (a) became option (b): the owner runs pnpm e2e, the router relays the log.
  - >-
    The worker could not install @playwright/test: pnpm refused with ERR_PNPM_UNEXPECTED_STORE (the global store
    ~/Library/pnpm/store is not writable in the sandbox, so pnpm chose a store in the worktree); the owner ran pnpm add
    -D -E @playwright/test@1.65.1, and the worker committed the lockfile it left (only @playwright/test, playwright
    and playwright-core).
  - >-
    The app folder: the plan's first try, Chromium's --user-data-dir, could not be tried (no launch in the worker's
    sandbox), so the fourth seam KEEL_APP_DIR was added at once (absolute, no control character, never the root,
    ignored when packaged), setting userData before the single-instance lock.
  - >-
    The build helper is two files: e2e/build.ts (the logic, a Listr stand-in running only the Vite plugin's
    prePackage hook) and e2e/build-bundles.ts (pnpm build:e2e's entry, which imports forge.config.ts): the app's guard
    forbids any node test from reaching a package, so no test imports forge.config.ts; the unit test reads its text.
    The preload output is .vite/build/preload.cjs (the plan said preload.js; Forge 8 emits .cjs and index.ts loads it).
  - >-
    Order: the two A3 fixes (5b, 5c) were committed before the spec (5), so the first owner run covers step 6's
    stderr line. The build:e2e and e2e scripts came with the Playwright commit (2), the build helper itself with 3.
  - >-
    The owner's first run (5a6f089) failed at step 2: the temp project had no .router/app/ when the app listed it,
    so the app saw the router's first start at its minute's re-read (watcher/watch.ts, by design), past the step's
    20 s. The test now waits up to 75 s there and ticks again (2347864); a failed step prints the window's text, both
    sinks and the router's state. Watching the project folder until .router/app/ exists is on backlog A11.
  - >-
    The new backlog row is A11, not A6 (the owner's answer to open point 4 named A6): A6 - A10 are taken on main by
    E-KEELFIX, and ids are never reused.
  - >-
    Step 2 of the walk shows work in motion on a second unit (E-A.W2, building), since a busy worker on the plan's own
    unit would leave 'Plan being written' only through stages the walk also uses; every other step is as planned.
