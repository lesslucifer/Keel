    - keel verify-doc over all docs, installed and branch-built
    - cargo test --test suite every_doc_in_docs_and_the_writing_example_pass_the_checks (reads Keel's own docs/)
    - word counts per page and per decision record, by the check's own counter
    - an independent read of each slimmed decision against its old text (details.review)
