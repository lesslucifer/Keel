    proposal: >-
      Take them in whichever WU next touches these files.
    source: >-
      the `cr/v1` notes on `wu/E-GHFLOW/w2-router-bot` (52171f8) and `wu/E-GHFLOW/w3-gh-watch` (36222c7); E-GHFLOW.W2
      result; E-GHFLOW2.W1's code review round 1 and security review.
    taken-by: "E-GHREVERT (backlog local-app A1)"
    items:
      - >-
        row 1, W2 - the fixture rebuild (done by E-GHFLOW2.W3): `tests/suite/router_gh.rs` rebuilds the `Gh` fixture,
        an RSA key included, per test (about 0.25 s each; round 1's waiver).
      - >-
        row 2, W2 - a fixture `HOME` under an odd `TMPDIR` (done by E-GHFLOW2.W3): the fixture and
        `router_gh_args::check` use a raw temp dir as the script's `HOME`, which the script refuses outside
