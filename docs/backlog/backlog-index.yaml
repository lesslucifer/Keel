# Keel backlog index: data only, no page (DEC-69). Read it first, then open only the file you need.
# Each backlog file holds its open rows in full and each closed row as its id, title and how it closed.
# Ids are never reused: a new row takes its letter's next-free id, checked on every live branch first.
files:
  - letter: B
    file: e-seed-v2.yaml
    scope: >-
      Work deferred at the E-SEED, E-SEED2, E-SEED3, E-CRCAP, E-DOCSTYLE and E-TESTOPT closes: release, per-language
      e2e, Trawler re-records, the gate fixes, the notes fetch, accepted limits of the doc check, small follow-ups.
    next-free: B28
  - letter: R
    file: e-router-v2.yaml
    scope: >-
      Router work deferred at the E-ROUTER close and since: the launcher, the worker environment and sandbox, the
      watchdog, the report channel, the shared git dir; rows for the next router epic.
    next-free: R52
  - letter: G
    file: github-flow.yaml
    scope: >-
      The GitHub flow after the E-GHFLOW and E-GHFLOW2 closes: CI follow-ups, test nits, what the sign-off by
      approval leaves, the owner's GitHub steps and the live facts still owed; the bot's pull-request range (G11).
    next-free: G12
  - letter: D
    file: dsh.yaml
    scope: >-
      DeepSeek Harness host plugins, each in its own repo in the desktop-dsh project: the doc gate, the router guard,
      the worker plugin's cold resume.
    next-free: D4
