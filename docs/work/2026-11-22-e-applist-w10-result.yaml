artifact: wu-result
status: ready
id: E-APPLIST.W10
epic: E-APPLIST
title: "E-APPLIST.W10 result · The app moves from npm to pnpm"
date: "2026-11-22"
page: 2026-11-22-e-applist-w10-result.html
outcome: >-
  Delivered in the tree, not yet run end to end. app/package.json pins packageManager pnpm@11.18.0;
  app/pnpm-lock.yaml (pnpm import of the committed package-lock.json) replaces package-lock.json and holds the same
  393 packages at the same versions; app/pnpm-workspace.yaml sets nodeLinker hoisted and allowBuilds fsevents false.
  pnpm install --frozen-lockfile accepted the lockfile ("Lockfile passes supply-chain policies (393 entries)") and
  then failed writing the files: the sandbox refuses any write under a .vscode folder, and xmlbuilder 15.1.1 ships
  .vscode/launch.json. So pnpm test:window, pnpm lint and pnpm typecheck were not run here; the owner runs them
  (details.owner-run). The main tests (node --test, the same command as pnpm test:main) and keel check are green.
deviations:
  - >-
    The four pnpm checks were to be green before each commit. Only test:main's command (node --test, run directly)
    and keel check ran: pnpm test:main itself first tries to install a missing node_modules, so it reached the
    registry and was stopped; test:window, lint and typecheck need the install the sandbox refused. Not routed
    around (no other store, no copy method, no borrowed node_modules).
  - >-
    The plan's settings-file note says .npmrc keeps registry and auth only. Checked here: with both files present,
    pnpm-workspace.yaml's nodeLinker wins over .npmrc's node-linker. That allowBuilds is accepted only in
    pnpm-workspace.yaml was not tested; it is where pnpm 11 writes approvals itself (pnpm approve-builds).
  - >-
    pnpm ignored npm_config_store_dir and put its store at the worktree root (.pnpm-store, 190 MB, on the same
    disk); it was deleted with the partial app/node_modules. Nothing of it is committed.
