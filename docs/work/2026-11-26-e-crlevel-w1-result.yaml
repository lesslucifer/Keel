outcome: >-
  Step 1 of the owner's steps delivered (the code, its tests and the T2 docs); steps 2-5 (the rule text, the
  reinstall, Keel's .keel/config.toml, the independent review and the sign-off) are the owner's and later workers'.
  review::policy_in reads [review]'s shared schedule keys and two optional level tables, [review.wu] and
  [review.epic], each taking only the schedule keys; per key the level's value wins, then [review]'s, then
  review::Policy::DEFAULT. A value a level table writes above its level's max_rounds is refused naming the table and
  key; an inherited one is lowered to it. A fourth key, fix_blockers_from (Policy gains Option<u32>, None in
  DEFAULT): from that round on a round's findings, blockers too, are fixed under a fix-PASS, no round follows, and
  the cap's waiver is refused. review::level reads the level from the target (main by name or refs/heads/<main>:
  epic; any other: WU), so preflight 0·review-cap, keel notes write cr and keel mr confirm's review history pick the
  same level with no new flag. cr/v1 is unchanged: a blocker fix-PASS writes the fields any fix-PASS writes; the
  history row names the blockers it answers, read from the round's own note, and the files it changed; no
  --accept-waiver is asked. A file with no level table and no fix_blockers_from gives both levels the schedule it
  gave before: every existing schedule test passes unchanged in what it expects.
deviations:
  - "review::policy takes the main branch's name: policy(repo, target, main), as do Schedule::read and mr::review_history. Each caller passes [branches] main from the config it already loaded, the same value that names an epic's target, so the level and the target cannot disagree. The brief wrote policy(repo, target)."
  - "policy_in returns both levels (review::Policies {wu, epic}); a bad value at one level refuses the file for both, at preflight, in the writer and staged. One rule, whichever level reads it."
  - "A level table cannot unset a fix_blockers_from that [review] writes (TOML has no unset): it reaches both levels, lowered to each level's max_rounds. This follows the per-key rule; Keel writes the key in [review.wu] only, so the epic level keeps the cap's waiver."
  - "UC-REV-2 amended too (the cap's waiver only below fix_blockers_from), as the plan's distillation-plan says; the brief named UC-REV-3 and UC-GATE-1. DEC-26's sentence on what the CLI reads from [review] amended, as its key list was stale."
  - "The fix-PASS writer says 'answering its N blockers' and review::Fix carries the count; nothing of it is recorded on the note."
  - "A [review.wu.deep] sub-table is refused as '[review.wu] deep is not a schedule key'."
  - "The real-run example: a scratch-repo run of the built binary was denied by the session's auto-mode permission check and not retried; the page's example is the flow the integration tests and the e2e run through the real binary and hooks."
  - "Code review round 1 (FAIL on 0f6eabc7: 1 blocker, 1 important, 1 nit), fixed with red-first tests: fixable's fix_blockers_from arm summed two u32 counts (b + i), so typed counts at the edge of u32 panicked in debug and wrapped in release into the cap's waiver - now b > 0 || i > 0, and the same sum in cr_verdict (a PASS with open findings) likewise; cap() asks then() instead of restating its rule; next_round no longer says a fix-PASS answers a round from fix_blockers_from on that counted no finding."
