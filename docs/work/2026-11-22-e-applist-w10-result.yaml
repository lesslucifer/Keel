    integration: "app/test/integration/lockfile.test.ts: the lockfile's root importer equals package.json's pins; the importer reader on a fabricated lockfile; no script calls npm or npx"
  red-first: "node --test test/unit/guards.test.ts test/integration/lockfile.test.ts before the switch: 4 failing (the three guards and the importer test)."
  green: "node --test 'test/**/*.test.ts' in app/: 297 tests, 296 pass, 1 skipped, 0 fail. keel check: green."
  versions: "Every name@version in the old package-lock.json (393) is in pnpm-lock.yaml's packages, and none more."
  not-run: "pnpm install to the end, pnpm test:window, pnpm lint, pnpm typecheck (sandbox, above)."
  docs: "this result pair; the plan pair; the epic plan pair (W10 added); docs/backlog/local-app.yaml (A3: W5's open review item, npm start -> pnpm start)"
