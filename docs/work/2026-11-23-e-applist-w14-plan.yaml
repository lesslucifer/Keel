artifact: wu-plan
status: ready
id: E-APPLIST.W14
epic: E-APPLIST
title: "E-APPLIST.W14 · Bindings that survive git's longer short hashes"
date: "2026-11-23"
page: 2026-11-23-e-applist-w14-plan.html
requirement: >-
  A diff binding (cr code_diff_hash, dod diff_hash, mr change_hash) written by keel hashes a diff text that
  does not depend on the object store's size (`git diff --full-index`), and the one binding rule
  (notes::binds) accepts a stored hash when it equals that stable form or git's legacy short form at any
  `--abbrev=N`, N in LEGACY_ABBREV = 7..=12, for check 5, check 8 (key signatures included) and the
  owner's review waiver alike; a hash of any other diff still fails.
maps-to: >-
  Epic E-APPLIST, owner ruling 2026-11-23 (fix B29 inside E-APPLIST so the epic's 10 walk seams go green
  with no waiver). Backlog e-seed-v2 B29. UC-REV-1 (the review is bound to the code diff) and check 8's
  change binding (UC-GATE, DEC-40/47) kept and made store-size independent.
expected:
  - "A wu whose notes and sign-off were written below 2^14 objects stays green at verify-dod after the store passes 2^14 (git's short hash 7 -> 8 characters)."
  - "A cr note or an mr sign-off (identity or key tier) whose hash is git's --abbrev=N form, N in 7..=12, binds; N = 6 or 13, or another diff, is red at 5·diff-binding and 8·manual-review."
  - "The owner's --waive-review over a failed round whose hash is a legacy form keeps that round (not 'not reviewed')."
  - "keel verify-dod epic ffb5cba, built from this tip, shows all 10 walk seams green; the only reds are 1·notes (no epic cr note) and 8·manual-review."
test-plan:
  unit: >-
    src/notes.rs tests: binds accepts the stable form and each legacy length, refuses N outside
    LEGACY_ABBREV and a hash of another diff (real git in a temp dir); waive keeps a round only when
    the binding rule says it binds. src/mr.rs: existing payload and stale_change tests kept.
  integration: >-
    tests/suite/verify_dod.rs: notes and sign-off written, the store grown past 2^14 with git fast-import,
    verify-dod green (red on the old code at 5 and 8); legacy forms N in 7..=12 green, 6 and 13 red, a
    later code commit red. tests/suite/mr.rs: a key-signed sign-off in the 7-character form verifies
    after the store grows; the owner's waiver over a legacy-form failed round keeps its counts.
  e2e: >-
    none: a WU's level is integration; the epic's e2e is unchanged (no app/ change), and the epic gate on
    ffb5cba, read-only, is the end-to-end proof on this repository.
details:
  base: "wu/E-APPLIST/diff-hash-fix off epic/E-APPLIST at ffb5cba"
  bug: "src/notes.rs diff_text runs git diff with core.abbrev=auto: the index lines' short hashes grow with the store (7 below 2^14 objects, 8 below 2^16, ...); the shared store passed 16384 objects on 2026-11-23 20:17"
  readers: "gate.rs check 5 (cr code_diff_hash), mr.rs manual_review check 8 (change_hash and the key payload), notes::waive (same range test) via notes.rs write_cr and mr.rs confirm; dod diff_hash is written, never read back"
  design:
    stable: "--full-index: git's documented flag for full object names in index lines, the hash algorithm's own length (40 for SHA-1, 64 for SHA-256); --abbrev=40 would cut a SHA-256 repository's names"
    legacy: "git diff --abbrev=N for N in 7..=12, tried only when the stable form does not match; 7 is git's floor for the automatic length, 12 covers a store of 2^24 (16.7M) objects, beyond any repository keel gates today"
    key: "a key-backed sign-off verifies over the stored change_hash once the rule proved it hashes this range"
  limit: "a legacy hash is recomputed against today's store: git lengthens an abbreviation past N when N characters are ambiguous, so an object that became ambiguous since the note was written still turns it red (re-record that note)"
  rule-bearing: "no skill or T0 doc names the hash's exact form; UC-REV-1 (T2) is updated"
  open-points:
    - q: "Which stable form?"
      a: "--full-index: hash-algorithm independent, documented for exactly this."
    - q: "How far back does the legacy rule reach?"
      a: "Short forms of 7 to 12 characters: git's floor to 16.7 million objects."
  htmldoc:
    id: 5a6333097749b5dd63a4afb1
