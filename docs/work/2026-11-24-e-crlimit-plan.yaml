artifact: epic-plan
status: ready
id: E-CRLIMIT
title: "E-CRLIMIT · A code review stops after 3 rounds, and the schedule is yours to set"
date: "2026-11-24"
page: 2026-11-24-e-crlimit-plan.html
intent: >-
  Two owner rulings of 2026-11-24. First, the code-review round limit is lowered. Today (E-CRCAP, DEC-50, UC-REV-3)
  a review may run 5 rounds: rounds 1-2 read the whole range, rounds 3-5 only the last fix, importants earn a new
  round up to round 3, and only a blocker earns round 5. The new schedule: round 1 reads the whole range; round 2
  reads only the fix of round 1's findings; round 3 runs only when round 2 found a blocker, and nothing else earns
  it; the cap is 3, and a blocker still open at the cap ends in the cap's waiver, which the owner accepts or not at
  sign-off, as today. Second, the schedule's whole shape becomes a project setting: three keys in the [review] table
  of the target's committed .keel/config.toml (max_rounds, whole_range_rounds, fix_importants_from), the new
  schedule being their defaults; the code keeps its constants only as those defaults, and the rule files name the
  keys instead of repeating numbers. The owner's standing table stays: a nit (low) is a follow-up or fixed under a
  fix-PASS; an important (medium) gets a fix round inside the schedule. Now, because the 5-round schedule costs two
  whole-range rounds on every WU that fails once, and the owner ruled.
owner-changes:
  - {when: "Round 1 fails", today: "Round 2 reads the whole work again", after: "Round 2 reads only the fix"}
  - {when: "Round 2 finds only medium findings", today: "Rounds 3 and 4 may follow", after: "No round 3: they are fixed and recorded, and the review is done"}
  - {when: "A blocker is still open", today: "At round 5, the review stops and you decide at sign-off", after: "At round 3, the same"}
  - {when: "You want another schedule for a project", today: "Only the cap can move", after: "Three settings in the project's rules file move the cap, the whole-range rounds and when only a blocker earns a round"}
  - {when: "A setting is wrong (0, or more whole-range rounds than the cap)", today: "A bad cap is refused when a review starts", after: "Any bad setting is refused at the commit that adds it, and when a review starts"}
  - {when: "You read the skills or the architecture page", today: "They repeat the numbers 5, 2 and 4", after: "They name the settings and point to them; the defaults show in one table"}
use-cases:
  - "UC-REV-3, amended: the schedule is the target's [review] max_rounds, whole_range_rounds and fix_importants_from, defaulting to the 3-round schedule (round 1 the whole range, round 2 the last fix, round 3 only after a round-2 blocker); bad values refused (W1)"
  - "UC-GATE-1 (the pre-commit rules-file check), amended: a staged .keel/config.toml whose review schedule is refused is refused at commit, as an unknown signer tier is (W1)"
  - "UC-REV-2 and UC-REV-1 unchanged: the cap's waiver and the nit cases keep their rules"
expected:
  - "With no schedule key on the target, keel preflight prints 'review round 1 of 3 - scope: the whole range', then after a round-1 FAIL 'review round 2 of 3 - scope: the last fix, <round-1 commit>..<tip>'."
  - "After a round 2 with importants and no blocker, preflight is red 0·review-cap ('review round 3 runs only after round 2 found a blocker'), keel notes write cr refuses a round-3 verdict, and a fix-PASS answering round 2 is accepted and merges."
  - "After a round-2 blocker, round 3 runs on the last fix; a round-3 blocker prints 'review cap reached', the cap's waiver reads 'review cap: 3 rounds, <b> blockers open', and the owner's --accept-waiver signs it."
  - "A target whose committed [review] sets the three keys gets exactly that schedule: its cap, how many rounds read the whole range, and from which round only a blocker earns another; the sign-off history tags rounds by the same settings."
  - "A schedule key that is not a whole number of 1 or more, an explicit whole_range_rounds or fix_importants_from above max_rounds, or an unknown [review] key is refused: red 0·review-cap at preflight, refused by the cr writer, and refused by the pre-commit hook and keel mr commit when staged."
  - "cr notes written under the 5-round schedule still pass checks 3-5 and the walk; no note is rewritten."
  - "No shipped skill, templates/config.toml or docs/architecture.html states the schedule's numbers outside the one defaults table in the keel-code-review skill and the template's commented defaults."
  - "The epic test (tests/suite/review.rs) passes through the real hooks of a repo keel init set up, on the defaults and on a configured schedule."
non-goals:
  - "What reviewers look for (the rubric), the finders, the verifiers and the severities."
  - "The fix-PASS, the waivers and the sign-off: their rules stay; only the rounds they name come from the settings."
  - "A change to cr/v1's fields, a schedule version on notes, or a migration of old notes."
  - "Setting the schedule keys in Keel's own .keel/config.toml: the defaults are the owner's schedule."
  - "Re-signing or re-reviewing anything already merged."
wu-summaries:
  - wu: E-CRLIMIT.W1
    wu-summary: >-
      The schedule as settings. src/review.rs: a Policy {max_rounds, whole_range_rounds, fix_importants_from} read
      from the target's committed .keel/config.toml [review] (the reader max_rounds uses today, widened), defaults
      3, 1 and 2 (the old constants become the defaults; DEFAULT_MAX_ROUNDS 5 -> 3). round_follows, then, fixable,
      next_round, fix_pass, cap, next_step, Next::announce and tags take the Policy instead of the bare cap and the two
      constants; Schedule::read carries it. One validation rule, shared by the target read and the staged-config
      check (src/main.rs staged_config_refusal, run by pre-commit and keel mr commit): each key a whole number of 1 or
      more; an explicit whole_range_rounds or fix_importants_from not above max_rounds; no unknown [review] key; a
      default above a lowered max_rounds is clamped to it, so a project that set only max_rounds = 1 or 2 keeps
      working. src/mr.rs's review history reads the target's Policy for its round tags. The doc comments and fix
      lines name the settings, not rounds 3, 4 or 5. Tests: the unit tests in src/review.rs, the schedule tests in
      tests/suite/verify_dod.rs, the staged-config tests, and the epic e2e tests/suite/review.rs move to the Policy.
      Distilled in the same WU: UC-REV-3 and UC-GATE-1 (docs/use-cases/workflow.yaml), DEC-50 amended in place
      (docs/decisions/review-docs.html), the decision and use-case indexes' scope lines. No rule-bearing file.
    wu-maps-to: "The owner's rulings of 2026-11-24 (the 3-round schedule; the schedule configurable in [review]); UC-REV-3 and UC-GATE-1 (amended); DEC-50 (amended)."
    wu-expected: >-
      Integration (tests/suite/verify_dod.rs, red first): on the defaults, round 2 announces 'the last fix,
      <round-1>..<tip>' and records scope 'since <round-1>'; after a round 2 with importants only, preflight is red
      0·review-cap naming round 3 and the blocker rule, the writer refuses --verdict FAIL, and --verdict PASS --fixes
      <round-2> is written and passes verify-dod; after a round-2 blocker round 3 runs, and its blocker ends in 'review
      cap: 3 rounds, 1 blockers open'. A target setting max_rounds = 4, whole_range_rounds = 2, fix_importants_from = 3
      announces round 2 over the whole range and 'of 4', lets round-2 importants earn round 3, and refuses round 4
      after a round 3 with no blocker; the branch's own committed settings never apply. Bad values on the target (0,
      -1, "3", 2.5, whole_range_rounds = 4 with max_rounds = 3, fix_importants_from = 5 with max_rounds = 3, a
      misspelt key) are red 0·review-cap naming the key; the same staged are refused by the pre-commit hook and keel
      mr commit. A branch carrying three 5-schedule rounds gets no round 4 and its fix line names the owner's waiver.
      keel mr confirm's history tags a configured round 2 as 'full'. Unit (src/review.rs, src/main.rs): the Policy
      reader and its refusals, the clamp of a default under a lowered cap, and next_round, then, fixable, fix_pass,
      cap, next_step and tags on the defaults and on a configured Policy. E2E: tests/suite/review.rs (the epic e2e,
      below).
    wu-deps: none
  - wu: E-CRLIMIT.W2
    wu-summary: >-
      The rules name the settings. Rule-bearing text only, no code path. The schedule's rule is stated once, in
      skills/keel-code-review/SKILL.md section 5, in terms of the three keys, with the defaults shown as one table
      labelled 'the defaults' (round 1 the whole range, round 2 the last fix, round 3 only after a round-2 blocker,
      cap 3); sections 1-3 say 'rounds up to whole_range_rounds' and 'later rounds' instead of numbers.
      skills/keel-workflow/SKILL.md: the cr/v1 row and the 0·review-cap row name the keys and point to that section,
      no numbers. skills/keel-router/SKILL.md: the independent-review table is replaced by a pointer to the same
      section and the project's [review] keys (the severity mapping stays); references/messages.md: 'Round <n> of at
      most <max_rounds>' and a scope line by whole_range_rounds; references/brief-skeleton.md: the review rows name
      the settings. The same files under .claude/skills/. templates/config.toml: the three keys, commented out, each
      with its default marked as the default, under one comment naming the rule and pointing to the skill.
      docs/architecture.html: the config-keys row lists the three keys, its default column points to
      templates/config.toml and the skill, no number. .keel/config.toml: only its stale '[review] read by the skill,
      not by the CLI' comment is corrected; no key is set. Each commit stages only rule-bearing files and is the
      owner's keel mr commit, then a fresh worker re-gates the new tip (project-router 'WU with a rule-bearing file').
      An independent read-only review on opus at high effort reads the text against W1's tool before the sign-off.
    wu-maps-to: "The owner's rulings of 2026-11-24; the keel-code-review, keel-workflow and keel-router skills; UC-REV-3 as W1 amends it."
    wu-expected: >-
      Integration: waived - the WU changes no code path (exempt, never from the sign-off). Unit: waived, same reason.
      Checked by: git grep over the shipped skills, their .claude copies, templates/ and docs/architecture.html finds
      no '5-round', 'rounds 3-5', 'round 5', 'from round 3', 'default 5' and no schedule number outside the
      keel-code-review defaults table and the template's commented defaults; every place names max_rounds,
      whole_range_rounds or fix_importants_from or points to the skill; skills/ and .claude/skills/ match (diff -r,
      project-router aside); the independent review passes; keel check stays green (skills are embedded by
      include_str!).
    wu-deps: [E-CRLIMIT.W1]
e2e-plan: >-
  tests/suite/review.rs becomes this epic's e2e (it is E-CRCAP's today, on the 5-round table; W1 changes it, so the
  epic's test note names it). A scratch repo keel init set up, its real hooks, no network. On the defaults: WU A -
  round 1 finds only nits, a fix-PASS answers them, the WU merges. WU B - round 1 fails with a blocker; round 2 reads
  only the fix and finds importants with no blocker; preflight refuses round 3 and the writer refuses its verdict; a
  fix-PASS answers round 2 and the WU merges. WU C - round 1 and round 2 fail with blockers; round 3 reads only the
  last fix and fails with a blocker; the cap's waiver 'review cap: 3 rounds, 1 blockers open' is written; sign-off
  without --accept-waiver is refused, with it the WU merges. A configured schedule: a commit staging a bad [review]
  key (whole_range_rounds above max_rounds) is refused by the pre-commit hook; then the epic commits max_rounds = 4,
  whole_range_rounds = 2, fix_importants_from = 3, and WU D, cut after it, behaves by it - round 2 reads the whole
  range, round-2 importants earn round 3, round 3 with importants only gets no round 4 and merges on a fix-PASS. The
  epic: its own round 1, the walk shows WU C waived, and it merges into main. No waiver of the e2e layer.
distillation-plan:
  - "docs/use-cases/workflow.yaml: UC-REV-3 amended to the three settings and their defaults; UC-GATE-1 amended for the staged schedule check (W1). UC-REV-2 names no round number and stays."
  - "docs/decisions/review-docs.html: DEC-50 amended in place - its title, choice and why: the schedule's shape is the target's [review] settings, defaulting to the 3-round schedule, with both rulings of 2026-11-24 as the reason; the old 5-round shape named as the settings that would restore it (W1)."
  - "docs/decisions/decisions-index.yaml and docs/use-cases/use-cases-index.yaml: the '5-round schedule' scope lines and DEC-50's title (W1)."
  - "T1, rule-bearing: docs/architecture.html's config-keys row points to the settings (W2); the skills are shipped rules, edited in W2, not distilled."
  - "At the epic close: the plan and result pairs archived to docs/.archive/ with keel notes write doc --distill naming the docs above."
open-questions:
  - "Three settings, or fewer? Three. They answer three separate questions: how many rounds at most, how many read the whole work, and from which round only a blocker earns another. Deriving one from the cap would make raising the cap also change when medium findings stop earning rounds."
  - "Is a misspelt key in the review settings refused? Yes. A typo would silently give the default schedule. The known keys are the three settings plus modules and rubric, which the review skill reads."
  - "A project lowers the cap below a default (cap 1, say): refused? No: a default above the cap is lowered to it. Only a value the project writes above its own cap is refused, so a project that set only the cap today keeps working."
  - "Does Keel's own rules file set the settings? No: the defaults are your schedule. The schedule is read by preflight and the review writer from the target's committed rules, never by the merge hook, so nothing must land in .keel/ first. W2 only corrects its stale comment there, in your rule-file commit."
  - "Do the router's reviews of non-code files follow the same settings? Yes: the router skill points to the code-review schedule and the project's settings, instead of its own table."
  - "How do this epic's own reviews count rounds? On the new defaults, by hand, until you reinstall keel from main: the installed keel allows 5, so 3 by hand stays inside it. A round-3 blocker then goes to your --waive-review, since the installed keel writes the cap's waiver only at round 5."
details:
  rulings:
    - >-
      2026-11-24, first (router brief e-crlimit-plan): round 1 the full range; round 2 the last changes only (the fix
      of round 1's findings); round 3 only if round 2 found a blocker, no other finding earns it; cap 3; at the cap a
      still-open finding is waived and the owner decides at sign-off. Standing table: low -> follow-up; medium -> a
      fix round inside this schedule.
    - >-
      2026-11-24, second (router keel-04, on this plan's first version, 51d84521): the schedule must be configurable
      in the committed .keel/config.toml [review], not hard-coded; the constants stay only as defaults; bad values are
      refused; the config read is the target's committed one. docs/architecture.html carries no number and points to
      [review]; the skills and templates/config.toml state the rule once, name the keys, and avoid numbers where a
      pointer works (the skills may show the default table as 'the defaults').
  closed-by-the-rulings: >-
    Medium findings in round 2 are fixed under a fix-PASS (first ruling: only a blocker earns round 3). Old notes stay
    valid (below). DEC-50 is amended in place. A round 2 FAIL with nothing counted ends in the owner's waiver, as a
    round from fix_importants_from on does today.
  keys:
    max_rounds: "the cap: no round past it; a blocker open in its last round ends in the cap's waiver. Default 3 (was 5). Existing key."
    whole_range_rounds: "rounds 1 to n read the whole range; later rounds read only the branch's own changes since the last reviewed commit. Default 1 (was the constant 2). New key."
    fix_importants_from: "from this round on, importants with no blocker are fixed under a fix-PASS and only a blocker earns another round; before it, importants earn the next round. Default 2 (was the constant 4). New key."
    why-three: >-
      Both schedules happen to satisfy fix_importants_from = max_rounds - 1, and the new one also whole_range_rounds =
      fix_importants_from - 1, but the old one does not (2 vs 3). Deriving either would tie two policies to one
      number: raising the cap would also move when importants stop earning rounds. Three independent questions, three
      keys; each has a default, so a project sets only what it changes.
    old-shape: "max_rounds = 5, whole_range_rounds = 2, fix_importants_from = 4 restores E-CRCAP's schedule exactly."
    refusals: >-
      Each key, when set, a TOML integer of 1 or more that fits u32 (0, negatives, strings, floats and too-large values
      refused, naming the key and value). An explicit whole_range_rounds or fix_importants_from above max_rounds is
      refused. A default above a lowered max_rounds is clamped to it (fixable already applies min(fix_importants_from,
      max)). An unknown key in [review] is refused (known: max_rounds, whole_range_rounds, fix_importants_from, modules,
      rubric) - open question 2. Read from the target's committed .keel/config.toml (rev-parse the target, peel to its
      commit, read the blob), as review::max_rounds does today: a target naming no commit or a config git cannot read
      is an error, never the defaults; a target holding no config gets the defaults. The same rule refuses a staged
      config in pre-commit and keel mr commit (src/main.rs staged_config_refusal), so a bad schedule rarely lands; one
      that lands by --no-verify is red 0·review-cap at preflight and refused by the cr writer.
  keel-config: >-
    .keel/config.toml needs no key: the binary's defaults are the owner's schedule. The schedule is read only by
    keel preflight and keel notes write cr (and the sign-off's history tags), each from the target's committed config
    (epic/E-CRLIMIT for this epic's WUs, main for its epic review); the merge hook's verify-dod never reads it. Its
    '[review]   # read by the keel-code-review skill, not by the CLI' comment has been wrong since E-CRCAP and is
    corrected in W2, by the owner's keel mr commit; no key is added.
  gate-check: >-
    The rule 'round 3 only after a round-2 blocker' is review::round_follows(note, round, policy) = round <
    max_rounds && (round < fix_importants_from || note.blockers > 0); with the default fix_importants_from = 2 it is
    false after a round 2 with no blocker. review::next_round turns that into keel preflight's red 0·review-cap
    (src/gate.rs preflight: 'review round 3 runs only after round 2 found a blocker, and round 2 on <c> found none';
    fix line: the fix-PASS --fixes <round-2 commit>, or the owner's waiver when nothing was counted), and keel notes
    write cr refuses the same round through the same review::Schedule (src/notes.rs). verify-dod does not count
    rounds, as since DEC-50 (checks 3-5 read verdict, base and code_diff_hash; a fix-PASS reads as PASS); a
    hand-written round-3 note is a bypass the sign-off history shows. W1's tests pin preflight, the writer and the fix
    line on the defaults and on a configured Policy.
  old-notes: >-
    Valid as written. cr/v1 is unchanged; round and scope are stamped facts the gate does not read. Merged branches
    are never re-scheduled (the walk re-runs checks 1-7, none of which reads round or scope). A branch in review when
    the new keel lands counts its rounds from its notes on the target's current settings: with the defaults, 3 or
    more recorded rounds mean no new round (a fix-PASS where allowed, else the owner's waiver), and review::tags marks
    an old round-2 'full' note with 'the note records full'. A cap waiver written as 'review cap: 5 rounds, ...' stays
    as signed: waiver_hash covers the note's own reason, never a recomputed one.
