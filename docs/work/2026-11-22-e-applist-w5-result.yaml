outcome: >-
  Delivered; review round 1 (FAIL: 2 blockers, 4 importants) fixed in six commits; the owner's live check runs
  through the test sink, its restart step to redo. The app's main part keeps one view of the listed project:
  reader/git.ts reads the local branches with their upstream standing, which open branches' tips carry an mr, cr
  or dod note, what main, each epic and each work unit with a task holds, and the worktrees, through four new
  fixed reads (refs, note-of, merged, worktrees) behind the locked flags, a cut answer taken as a problem; reader/log.ts folds <main checkout>/.router/app/
  by the log's rules (new run, next number, seen, missing number reads the state once, half line, unknown key) and
  says the router is not heard 15 minutes after its newest line; reader/view.ts builds the view and says whether it
  changed. watcher/watch.ts watches the git folder's refs and .router/app/, reads a second after a burst and once a
  minute anyway, never two reads at once, and re-arms after each read. alerter/alerts.ts shows one macOS alert per
  new alert line, recorded first in alerts.json in the app's folder per run; at a first look at a run (the app's
  start, a project switched in), the lines already there make one summary alert (owner answer 1a). alerter/link.ts opens only
  keel://wu/E-<CODE>.W<m>. The contract gains waiting.get and waiting.changed; the fake bridge answers waiting.get
  from five views. index.ts wires it all; only the packaged app claims keel://. node --test 275 tests (274 pass,
  1 skipped in the worker's sandbox: fs.watch gets no events there), Vitest 207, typecheck, lint and keel check
  green before every commit. Nothing was built or packaged. The owner's Mac has no "Electron" entry in its
  notification settings, so the unpackaged app shows no banner; the live check uses the file sink instead, and
  the banner waits for W9's signed build.
deviations:
  - "Run records and the inbox listing are not read, by the owner's answer 2a: the epic plan's W5 summary names them; no item kind in E-APPLIST uses them, the fleet screens of A5 do (plan pair: details.owner-answers.departure-from-epic-summary)."
  - "At the app's start, a single alert line written while it was closed is shown as itself; the summary ('N alerts while Keel was closed') is for two or more. A summary of one says less than the line (answer 1a, read so)."
  - "An alert's title is its headline and its body its lines, not the plan's 'title Keel': macOS already names the app above the title, so 'Keel' twice said nothing."
  - "The view has no 'defaulted' field: a key the router has not written is absent (at its default), and run null means no run was read. Fewer fields saying the same."
  - "The refs read lists refs/notes/ beside refs/heads/; the merged read joins the ref to its option (--merged=<ref>), so it is never read as one. The notes read is note-of (git notes --ref=<kind> list <tip>), run per open branch's tip (work units not in their epic, epics not in main, at most 40) and only for a kind whose notes ref exists, so GitFacts.notes holds open tips only: review round 1 found the plan's whole-kind list grows with history and is cut past the output cap."
  - "alerts.json keeps what was shown per run (version 2, the last 8 runs), not one run: a project switched away and back alerts nothing again (review round 1, with the first-look rule). A version-1 file from the live check is set aside once."
  - "Captured (commands.ts) gains cut: a stream that passed the 1 MiB output cap; the git reader takes a cut answer as a problem (review round 1)."
  - "text.ts gains codePoints(): the log reader's alert caps count code points, as the writers do (review round 1)."

  - "The main branch is taken to be 'main' (as in Keel), not read from the project's [branches] main; a project naming another main shows no merges into it."
  - "Two helpers the plan's layout did not name, each to keep index.ts free of logic: handlers.ts readerParts (the listed project and the usable git, from the app's folder) and alerts.ts heldSink (each Notification held until clicked, closed or failed, so its click is not lost); each has its test."
  - "The window's typing gains waiting.get (src/window/bridge.ts Args, hooks.ts's answer text); no screen changes. The router-app.sh test helpers moved to app/test/support/router.ts, shared by four integration files."
  - "In the worker's sandbox fs.watch answers EMFILE (the file-event service is closed to it): the real-watch integration test checks for file events first and skips with that reason; it runs on the owner's Mac (keel check, pre-push). The watch-off test (the minute's re-read) runs everywhere. The watcher closes a failed watch and tries again after each read."
  - "The live check was not run by the worker: Electron's binary is not downloaded in this worktree and npm start binds Vite's port, which the sandbox refuses. Its steps were tried short of the app (a temp project, the real router-app.sh lines) and the main part was run for real on that project with a recording sink (details.example-run)."
  - "The owner's live check goes through the file sink (KEEL_APP_ALERT_SINK), not macOS's banner: macOS lists no 'Electron' entry under Notifications on his Mac, so the unpackaged app's test alert says 'not shown' too (unchanged since W7: alert.ts and notify() have no W5 diff). Run 2026-11-22: the project was added (projects.json), one alert line while running gave one sink line, correct; the two 'While closed' lines were written while the same instance still ran (its single-instance lock unchanged from 18:05:29), so two live alerts, correct, and the restart step is to redo with the app quit first."

