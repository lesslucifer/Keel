  - id: R40
    title: "The live check of `auto`"
    status: "owed at the first spawn after E-WMODE's merge"
    problem: >-
      Nothing before the merge ran `claude --bg --permission-mode auto`, the guard hook from `--settings` under
      `--bg`, or cargo under the narrowed `~/.cargo` `allowWrite`.
    proposal: >-
      The router's first spawn from a checkout whose HEAD carries E-WMODE checks it: expect
      `RUNNING ... permission-mode=auto`, not `DEAD` with the CLI's text. Then the worker, in order: one `Edit` and
      one `Write` in the router checkout, both refused at once with `worker file guard: ... outside the worktree`; a
      `Read` under `~/.ssh`, refused; one `Edit` in its own worktree, allowed; one `git commit` and one
      `keel notes write`, both succeed; one `cargo build`, succeeds; a read outside its worktree with no prompt row
      in `claude agents --json`. Also note whether a plan-mode or auto-memory write is denied. A `DEAD` spawn, a
      guard that does not fire, or a failed commit or build is fixed by an owner `keel mr commit`:
      `worker_permission_mode = "acceptEdits"`, or a launcher change. The result goes to DEC-37 as an Amended row.
    source: >-
      E-WMODE plan open point 9, W1 result. Found at the E-WMODE close (epic closed 2026-11-12; why: DEC-37's E-WMODE
      row): follow-ups the E-WMODE.W1 result named that no WU absorbed.
