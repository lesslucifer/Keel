artifact: wu-plan
status: ready
id: E-APPLIST.W13
epic: E-APPLIST
title: "E-APPLIST.W13 · Fix the epic review's round-2 findings"
date: "2026-11-23"
page: 2026-11-23-e-applist-w13-plan.html
requirement: >-
  Each of the three findings of the E-APPLIST epic review, round 2 (cr note on 96207aa: 1 blocker, 2
  importants), is fixed in the app and pinned by a test that fails without its fix: Open asks keel
  doc-roles about every data file at the tip that keel could accept (keel judges the size, never a cap of
  the app's own), while the temp folder it writes for keel holds at most HEADS_DISK_CAP bytes at a time;
  the notes and times reads take their tips from the reader's one open rule (openSets, plus main for the
  times); and git.ts names a work unit's tasks only through names.ts isTaskBranch and unitOfTask.
maps-to: >-
  Epic E-APPLIST, the epic review's fix round (keel-code-review §5), after W12. UC-APP-2 (Open learns a
  data file's roles from keel doc-roles, never its own) and DEC-79 are kept and restored where the size
  cap broke them. The 6 refuted items, the W5/W8 waivers and backlog A11's follow-ups are not reopened.
expected:
  - "B1: a wu-plan or wu-result data file of 100 KiB, and one of exactly 1 MiB (keel's bound), opens from a fresh copy, a kept copy and docs/.archive; the temp folder handed to keel never holds more than HEADS_DISK_CAP bytes, even when the data files at the tip add up to more."
  - "I1: the notes read asks only the tips of facts.open's epics and units, and the times read only main and facts.open's branches; with main's read failed, an epic's read failed, or a task merged into its unit, no read asks a branch the list does not show, and a crowd of such branches never pushes a shown one past NOTE_TIPS or TIME_TIPS."
  - "I2: wu/E-A/w1_a_b is no task of wu/E-A/w1 to heldBy, to the times read or to the task reads, as it is none to openSets."
test-plan:
  unit: >-
    node --test: doc-find.test.ts (headBatches: data files grouped under HEADS_DISK_CAP bytes and
    DOC_ROLES_BATCH files, every file within OUTPUT_CAP in exactly one batch, generated inputs;
    HEADS_DISK_CAP >= OUTPUT_CAP); git-read.test.ts (openTips and timeTips from the open sets, the
    disagreeing cases: a failed main read, a failed epic read, a merged task, a crowd of closed branches;
    heldBy and the task rule on wu/E-A/w1_a_b).
  integration: >-
    node --test: open.test.ts (real git, real keel: data files of 100 KiB and 1 MiB open fresh, kept and
    in docs/.archive; a recording keel wrapper shows each run's temp folder within HEADS_DISK_CAP while
    the tip's data files pass it); git-facts.test.ts (real git: a task merged into its unit and a branch
    wu/E-A/w2_a_b get no time read and no task read; main's failed read asks no notes).
  e2e: >-
    none: a WU's level is integration, and this worktree cannot bind a port. The change touches app/, so
    the owner reruns the epic e2e before the epic merges.
details:
  base: "wu/E-APPLIST/epic-review-fix2 off epic/E-APPLIST at 96207aa"
  findings:
    - "B1 app/src/main/open/docs.ts:24 - HEAD_CAP (64 KiB) drops a data file keel accepts (up to 1 MiB): remove HEAD_CAP; ask keel about every .yaml the copy plan takes (OUTPUT_CAP, keel's MAX_DATA_BYTES, both 1 MiB) in fresh copy, kept copy and docs/.archive; write the head files in batches (headBatches) of at most HEADS_DISK_CAP bytes, one temp folder per batch, removed before the next; keep the texts read for the copy only up to COPY_CAP bytes"
    - "I1 app/src/main/reader/git.ts:132 - openTips/openUnits/timeTips repeat the open rule: openTips(branches, open) and timeTips(branches, open) take facts.open; read() picks the epics and units it reads from openSets; openUnits goes; the times read says so when it passes TIME_TIPS"
    - "I2 app/src/main/reader/git.ts:120 - startsWith(`${u}_`) three times: heldBy, timeTips (now via open.tasks) and read()'s task check use isTaskBranch/unitOfTask"
  not-reopened: "the 6 refuted items of the cr note, the W5/W8 owner waivers, backlog A11"
  rust: "no Rust change planned"
  open-points:
    - q: "Does Open cap the size of a data file itself?"
      a: "No: keel judges it. The copy's read cap (1 MiB) equals keel's bound, and a test with a 1 MiB file pins that."
    - q: "What bounds the disk the temp folder for keel takes?"
      a: "Batches of at most 4 MiB, each folder removed before the next batch is written."
  htmldoc:
    id: e81b724cb776a56125398db9
