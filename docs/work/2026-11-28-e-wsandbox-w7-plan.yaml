artifact: wu-plan
status: ready
id: E-WSANDBOX.W7
epic: E-WSANDBOX
title: "E-WSANDBOX.W7 plan: what the router and the watchdog can and can't do, and the new abilities you pick"
date: "2026-11-28"
page: 2026-11-28-e-wsandbox-w7-plan.html
requirement: >-
  The plan shows the owner what the router and the watchdog can and can't do today, each item grounded in a
  file:line, and lists candidate new abilities with what each gives, what it exposes and a recommendation; W7 then
  builds only the abilities and gap fixes the owner picks, each behind a test that is red before it and green after
  the owner's one keel mr commit.
maps-to: >-
  E-WSANDBOX.W7 (wu-summaries); the owner's scope note of 2026-11-26 (the router's and the watchdog's own parts); the
  merge ruling of 2026-11-28 (old W7 and W8 as one WU); the parallel ruling of 2026-11-28 (W7 beside W5); the owner's
  direction of 2026-11-28 ("I want to know first what it can & can't do in the plan. Then I decide to add more
  ability if needed. W7 is the implementation plan for the new abilities."); UC-ROUTE-1 and UC-ROUTE-6 (amended for
  each ability picked).
expected: >-
  For each ability or gap fix the owner picks (details.candidates, details.gaps): the guard, settings, launcher or
  hook admits exactly the new shape and still refuses its near misses; its tests in tests/suite/router.rs are red on
  the epic tip and green after the owner commit; UC-ROUTE-6, the keel-router posture section, router.md and the
  decision rows name it. Nothing the owner did not pick changes. If the owner picks nothing, W7 closes with no build
  and its result says so.
test-plan:
  unit: >-
    Per worker commit, in tests/suite/router.rs through the existing helpers (guard() and bash() at router.rs:19 and
    :42, guard_to() :3081, the stub-claude Launcher, facts() :3403): for each picked ability one case per new admitted
    shape and one per refused near miss, each red on the epic tip (the guard refuses the shape today) and green after
    the owner commit. Per candidate, details.candidates[].tests names them.
  integration: >-
    tests/suite/router.rs: the settings-vs-guard tests (settings_allow_exactly_the_launcher_shapes_the_guard_admits
    :2115, settings_allow_exactly_the_app_shapes_the_guard_admits :494) extended so every permissions.allow line is
    admitted by the guard and every new guard shape has its allow line; the router.md tools test (:261-288) kept; for
    C5 the wired Stop hook run as Claude Code runs it (as settings_run_the_guard_on_every_tool_and_fail_closed :543
    runs the PreToolUse one); for C6 the watchdog facts at a fixed clock (ROUTER_NOW) with a schedule age past six
    days. After W5 merges in: W5's resume and status shapes sit in the same extended tests.
  e2e: >-
    none: every ability on offer is a guard, settings or launcher shape proven by the fixture tests; the epic e2e is
    W5's probe-clone run, unchanged by W7. If the owner picks C3 (htmldoc comments), one live read of a page's
    comments by the router is an owner step at the epic e2e.
details:
  grounding:
    tip: "0f68238b950bb6536f4d805159fa06ac9241ebef (= epic/E-WSANDBOX); line numbers below are at this tip."
    denials-on-record: |-
      The router's transcripts in ~/.claude/projects/-Users-nguyenvanluong-Documents-proj-misc-Keel (54 sessions, 8
      with a guard denial, Nov 7 - Nov 28): 83 'Bash whitelist' denials, 14 'SendMessage only as a pure subscription'
      (the old rule, gone since DEC-42), 8 'jq failed', 4 'Skill only'. The denied calls, grouped:
      - search: grep -n <file> (7; the Grep tool would have served), git grep at a ref (7), git ls-tree (1)
      - git outside the shapes: git branch --list/-v -a variants (5; most now admitted), git worktree list (2), git -C <other worktree> log (1), cd <other checkout> && git (2), git ls-remote origin refs/notes/* (1)
      - gh: --repo (2), gh pr view --comments (1), gh run view --log (1)
      - shell forms: a pipe (ps aux | grep), an until/kill -0 wait loop, python3 <script> (2)
      - skills: htmldoc (1), loop (1)
      - data errors: router-app.sh stage with an unknown stage word (1), router-watch.sh with no kind (2)
    delegated-today: "skills/keel-router/SKILL.md:49-51: keel verify-dod, keel check, git notes, gh run, curl against an htmldoc server, lsof, watch loops, a git worktree the launcher does not make - delegated to a worker. project-router SKILL.md:42: reading CI runs and git state beyond the whitelist is a read-only worker's."
    dsh: "project-router SKILL.md:18, :41, :75: on DSH the preset denies the launcher's worktree add|remove, so a worker does it; DSH has no shell hook, so the posture is unenforced there (keel-router SKILL.md:66-73)."
  can-today:
    router:
      - {can: "Use 11 tools: Read, Grep, Glob, Write, Bash, Skill, ToolSearch, TodoWrite, AskUserQuestion, SendMessage, ListAgents", where: "scripts/router-guard.jq:15,53; .claude/agents/router.md:4"}
      - {can: "Read and search any file the owner's user can read (no sandbox, no path rule)", where: "router-guard.jq:52-72 (no Read rule); W1 findings details.router-watchdog.router"}
      - {can: "Read git: status, log, diff, show with any plain-word args (git log --notes included), branch -v/-vv/-a/-av/-va/-a -v/--all/--all -v", where: "router-guard.jq:40"}
      - {can: "Read pull requests: gh pr view|list|status with named query flags", where: "router-guard.jq:32,40"}
      - {can: "List processes: ps aux, ps -ef", where: "router-guard.jq:40"}
      - {can: "Start and stop workers, add and remove worktrees, start and stop the watchdog (the launcher, run with the owner's rights)", where: "router-guard.jq:40; scripts/router-worker.sh:5-8"}
      - {can: "Watch for the owner's commit, sign-off, merge, push and tag (push runs git fetch)", where: "router-guard.jq:40; scripts/router-watch.sh"}
      - {can: "Push the owner a message (body from .router/notify/owner.md)", where: "router-guard.jq:40,63; scripts/notify-owner.py"}
      - {can: "Read worker reports from the inbox: init, status, watch, consume", where: "router-guard.jq:40; scripts/router-inbox.sh"}
      - {can: "Write the update log: start, stage, del", where: "router-guard.jq:36"}
      - {can: "Write worker briefs and the owner's message body", where: "router-guard.jq:60-64"}
      - {can: "Message any named session; list sessions", where: "router-guard.jq:69-71"}
      - {can: "Load five skills: keel-router, project-router, keel-workflow, keel-plan, keel-distill", where: "router-guard.jq:18,65-66"}
      - {can: "Run in any permission mode with the same limits (the guard never reads the mode)", where: "router-guard.jq (no permission_mode); .claude/settings.json:42-53"}
    router-cannot:
      - {cannot: "Edit any file, or Write anything but briefs and the message body", where: "router-guard.jq:53,60-64"}
      - {cannot: "Start a subagent or a shell watcher (Agent, Monitor)", where: "router-guard.jq:13-15,53"}
      - {cannot: "Run any other command: no pipe, cd, quote, $, glob, redirect, chain; no grep, git grep, git -C, git worktree list, git ls-tree, gh run, curl, keel, cargo, kill, python3", where: "router-guard.jq:37-41,57"}
      - {cannot: "Point gh at another repo or host (-R, --repo, a URL), or use gh --jq, --template, --web", where: "router-guard.jq:26-32"}
      - {cannot: "Post to the inbox, or write set and alert lines to the update log", where: "router-guard.jq:33-36,40"}
      - {cannot: "Load any other skill (htmldoc, loop, code review)", where: "router-guard.jq:18,65-66"}
      - {cannot: "End its turn while a doc in its checkout is red: the Stop doc hook refuses, and it cannot fix docs (backlog R20)", where: ".claude/settings.json:65-74; docs/backlog/e-router-v2.yaml:165-176"}
      - {cannot: "Run keel checks, read git notes refs remotely, read CI runs or htmldoc comments itself: a worker does it", where: "skills/keel-router/SKILL.md:49-51"}
      - {cannot: "Create or remove worktrees on DSH (the preset denies the launcher there)", where: "project-router SKILL.md:41"}
    watchdog:
      - {can: "Create its one schedule: CronCreate of */5 * * * *, prompt tick, recurring", where: "router-guard.jq:46-47; router-worker.sh:374-376"}
      - {can: "Message its own router", where: "router-guard.jq:48"}
      - {can: "Through its facts hook, each tick, with the owner's rights: list sessions; read each worker's branch, tip and dirty count after checking the worktree's link; read the last 64 KB of each worker's history; write the update log; stop itself once the router is gone", where: "router-worker.sh:218-307, 225-226, 261-268"}
      - {can: "Load the router checkout's local settings file (absent today)", where: "router-worker.sh:374 (--setting-sources local)"}
    watchdog-cannot:
      - {cannot: "Use any tool but those two: no shell, read or write", where: "router-worker.sh:375 (--tools SendMessage CronCreate)"}
      - {cannot: "Message anyone else, or change or delete its schedule", where: "router-guard.jq:46-51"}
      - {cannot: "Load project or user settings, or MCP servers", where: "router-worker.sh:374-375"}
      - {cannot: "Keep its schedule past 7 days: the recurring job ends and its reports stop (backlog R29)", where: "docs/backlog/e-router-v2.yaml:273-282; skills/keel-router/references/worker-ops.md:198"}
  candidates:
    - id: C1
      ability: "Router: more read-only git - git grep (at a ref), git ls-tree, git worktree list, git branch --list <name>"
      gives: "Search another branch or tip and list worktrees without a worker (14 denials on record)."
      exposes: "git grep -O / --open-files-in-pager runs a command, so those flags are refused; the rest reads the repo only, as git show already does."
      recommend: "Yes."
      build: "router-guard.jq bash_ok: four shapes, each word plain, -O, --open-files-in-pager and --ou refused; settings.json allow lines; deny text; keel-router posture and UC-ROUTE-6 list them."
      tests: "Admitted: git grep -n word main -- path, git ls-tree --name-only main docs, git worktree list, git branch --list main. Refused: git grep -O vim x, git grep --open-files-in-pager=x y, git worktree add x, git ls-tree x; rm -r y."
    - id: C2
      ability: "Router: read CI runs - gh run list|view with named query flags, --log included"
      gives: "Check a red CI run without a worker (delegated today, SKILL.md:49)."
      exposes: "Run logs are untrusted text, like PR bodies; no -R or URL, so the token reaches only this repo's host."
      recommend: "Yes."
      build: "router-guard.jq: gh run (view|list) with gh_args plus --log and --job; settings.json; posture text."
      tests: "Admitted: gh run list --limit 5, gh run view 44453026886 --log. Refused: gh run rerun 1, gh run view 1 -R x/y, gh run view 1 --jq .x."
    - id: C3
      ability: "Router: read a page's htmldoc comments through a new fixed script (one host, GET only)"
      gives: "Relay and route the owner's page comments without a worker."
      exposes: "A new unsandboxed script with network to htmldoc.wfomobile.com; comments are untrusted text."
      recommend: "Not now: the owner's comments reach the worker that owns the page; revisit if relaying them by hand costs."
      build: "scripts/router-htmldoc.sh comments <24-hex id> (fixed URL, jq summary); rule_bearing entry in .keel/config.toml; guard shape; settings line."
      tests: "Stubbed curl: the fixed URL, an id refused unless 24 hex; guard admits only that shape."
    - id: C4
      ability: "Router: git in another worktree (git -C <path> log|status)"
      gives: "Read a worker's branch state directly."
      exposes: "git in a worktree whose .git a worker rewrote runs the worker's config, hooks or fsmonitor with the owner's rights (why the launcher checks linked_ok first)."
      recommend: "No: the watchdog's facts and W5's status already read it safely."
      build: "-"
      tests: "-"
    - id: C5
      ability: "Router: end its turn while a doc is red (the Stop doc hook skips the router)"
      gives: "No loop on a red doc it cannot fix (R20)."
      exposes: "Nothing: the router writes no doc; a worker still sees the hook."
      recommend: "Yes."
      build: "settings.json Stop hook: skip when the hook input's agent_type is router (checked against a captured Stop event first; if Stop carries no agent_type, the plan reports it and drops C5)."
      tests: "The wired Stop command with a red doc: a router event passes, a worker event is refused."
    - id: C6
      ability: "Watchdog: warn the router before its 7-day schedule ends"
      gives: "The router restarts it (watchdog stop, start) before reports stop (R29)."
      exposes: "Nothing: one more line in the facts block; no new tool."
      recommend: "Yes."
      build: "router-worker.sh facts: read the watchdog session's start time from its transcript's first record and print 'Schedule ends in under a day: restart the watchdog.' past six days; keel-router worker-ops.md:198 names it."
      tests: "Facts at ROUTER_NOW six days and one hour after a fixture start print the line; at five days they do not."
    - id: C7
      ability: "Router: run keel verify-dod, keel check or preflight itself"
      gives: "Verify a worker's gate claim without a worker."
      exposes: "keel runs git in the worker's worktree with the owner's rights (the C4 risk) and reads code the worker wrote."
      recommend: "No."
      build: "-"
      tests: "-"
    - id: C8
      ability: "Router on DSH: worktree add|remove through the launcher"
      gives: "No worker for worktrees on DSH."
      exposes: "DSH has no hook to bound the shape; a host preset change outside this repo."
      recommend: "No in W7 (a DSH preset, not this repo's guard); a backlog row if wanted."
      build: "-"
      tests: "-"
  gaps:
    - id: G1
      gap: "settings.json:32 allows Bash(scripts/router-watch.sh *); the guard admits five kinds only"
      effect: "None while the guard runs (the guard refuses the rest); the two lists disagree."
      recommend: "Fix: five allow lines, one per kind; test as C1's settings test."
    - id: G2
      gap: ".claude/agents/router.md:16-23 lists the router's shapes by hand and omits router-inbox.sh"
      effect: "A reader of the agent file sees an older list."
      recommend: "Fix: replace the list with a pointer to UC-ROUTE-6 and the guard."
    - id: G3
      gap: "The watchdog loads the router checkout's .claude/settings.local.json (router-worker.sh:374)"
      effect: "Hooks or permissions in that file reach the watchdog. Absent today; git-ignored; only the owner writes it (a worker's sandbox cannot write the router checkout)."
      recommend: "Leave, and record it in DEC-45."
  sandbox-fork:
    question: "The epic's open question: do the router and the watchdog stay outside a sandbox?"
    default: "Yes. A sandbox bounds the Bash tool only: the watchdog has none and its facts hook runs outside any sandbox; the router's Bash runs only fixed scripts that need ~/.claude, the git dir and the network."
    under-default: "Recorded in DEC-30 and DEC-45 Amended rows with the abilities picked; no backlog row."
  overlap-with-w5:
    files-both-may-edit: "scripts/router-guard.jq (C1, C2, C3), .claude/settings.json (C1, C2, C3, C5, G1), .claude/agents/router.md (G2), scripts/router-worker.sh (C6), skills/keel-router SKILL.md and references/worker-ops.md and their .claude mirrors (posture; C6), .claude/skills/project-router/SKILL.md, tests/suite/router.rs, docs/decisions/router.html, docs/use-cases/router.yaml. W5 edits all of these (its plan's rule-bearing-map)."
    recommended: >-
      A - W5 merges into the epic first. W7 commits its tests and doc rows now (worker commits; the tests red), makes
      no rule-bearing edit yet, and once W5 has merged merges epic/E-WSANDBOX into wu/E-WSANDBOX/w7-bounds with a
      merge commit (never a rebase). Conflicts fall only in the non-rule-bearing files W7 committed; the worker
      resolves them. Then the rule-bearing edits go on top of W5's and are staged for the one owner commit.
    cost: "W7's owner commit and sign-off wait for W5's merge (which waits on the owner's W5 probe). No second owner commit, no re-review."
    alternatives: "B - W7 first; W5 merges the epic in and its settings and guard tests carry W7's shapes (W5's plan amended). C - W7 signs before W5 merges; a second owner commit and review if W5's shapes then break W7's tests."
    if-nothing-picked: "No overlap: W7 closes with its plan and result only."
    if-only-c6: "Overlap only in router-worker.sh, worker-ops.md and router.rs; A still holds."
  rule-bearing:
    staged-for-one-owner-commit: "Per pick: scripts/router-guard.jq (C1, C2, C3), .claude/settings.json (C1, C2, C3, C5, G1), .claude/agents/router.md (G2), scripts/router-worker.sh (C6), skills/keel-router and .claude/skills/keel-router (posture and worker-ops.md), .claude/skills/project-router, scripts/router-htmldoc.sh and .keel/config.toml rule_bearing (C3 only)."
    committed-by-worker: "This plan pair and the result pair; tests/suite/router.rs; docs/decisions/router.html (DEC-30, DEC-45 Amended rows); docs/use-cases/router.yaml (UC-ROUTE-1, UC-ROUTE-6); docs/backlog/e-router-v2.yaml (R20, R29 closed if C5, C6 picked)."
  commit-order:
    - "1. docs(E-WSANDBOX.W7): this plan pair."
    - "Owner: picks abilities and gap fixes, and confirms the plan. Nothing below starts before it."
    - "2. test(E-WSANDBOX.W7): per pick, the red cases."
    - "3. docs(E-WSANDBOX.W7): DEC, UC and backlog rows for the picks."
    - "4. Under A: after W5 merges, a merge commit of epic/E-WSANDBOX; then any test fix W5's shapes need."
    - "Staged, not committed: the picks' rule-bearing edits, on top of W5's."
    - "5. Owner: one keel mr commit; the red cases go green."
    - "6. docs(E-WSANDBOX.W7): the result pair; a fresh worker re-gates; a fresh reviewer runs the round."
  owner-steps:
    - "1. Read the page; pick abilities (C1-C8) and gap fixes (G1-G3), or none, by htmldoc comment; confirm the plan."
    - "2. Sign off and merge W5 as its plan says; W7 then merges the epic in by itself."
    - "3. One keel mr commit of the staged files (--as vuluu)."
    - "4. After the re-gate, the review and the result pair: keel mr confirm wu <tip> --as vuluu --target epic/E-WSANDBOX, then git merge --no-ff wu/E-WSANDBOX/w7-bounds into epic/E-WSANDBOX."
  dropped-from-first-draft: "The first draft (5ebdcb6d) built two bounds tables as a new decision and pinned them with tests, adding no power. The owner rejected that direction on 2026-11-28; its facts are kept above (can-today, gaps), its deliverable is dropped."
  gates:
    - "keel verify-doc on every changed doc, keel check raw, by the worker."
    - "keel preflight wu and keel verify-dod wu after the owner commit."
  effort-note: "This epic's workers run on opus at effort medium (owner ruling 2026-11-28)."
  htmldoc:
    id: 6b0a62cc9f34851f0dfb2dae
