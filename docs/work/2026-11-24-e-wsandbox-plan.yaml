  merged-wus: |-
    Owner rulings 2026-11-28: merge the old W5 (worker resume) and W6 (reuse policy and status read) into one WU, and
    the old W7 (router's bounds) and W8 (watchdog's bounds) into one WU.
    Ids and slugs: W5 keeps its id as the merged resume-and-reuse WU (wu/E-WSANDBOX/w5-resume-reuse); W7 keeps its id
    as the merged bounds WU (wu/E-WSANDBOX/w7-bounds); W6 and W8 are retired as ids and never reused, so the gaps in
    W1 - W9 are deliberate.
    Each merged WU, like W2 - W4: one branch with two parts built in order, one WU plan/result pair naming both parts,
    one tip. The worker commits what is not rule-bearing and stages the rule-bearing edits; the owner makes one keel mr
    commit for both parts' rule-bearing files; one review covers the range, one result report, one keel mr confirm wu,
    one --no-ff merge into the epic.
    Cost: one review and one signature cover both parts, so a part cannot be dropped alone at sign-off. For W5, a held
    reuse part holds resume too (and the reverse); for W7, the router's table cannot be signed without the watchdog's.
    Accepted by the merge ruling. Gain: two reviews, two owner commits and two sign-offs instead of four, and the
    guard and settings change twice instead of four times.
  effort-for-remaining-workers: |-
    Owner ruling 2026-11-28: workers for this epic's remaining work (W5, W7, their reviews and fixes, the epic e2e
    worker) run on opus at effort medium.
    Conflict: the merged W9 policy on this branch (.keel/config.toml:61-63 worker_efforts ["low","high"],
    worker_default_effort "low", planner_effort "high") refuses medium by name (W9's ruled open question). The
    launcher reads the policy from the router checkout's HEAD, which is main, where worker_efforts is still
    ["medium","high"] and the default medium; so the medium ruling works today without a policy change. It stops
    working the moment this epic merges to main.
    Ruled (owner, 2026-11-28): (a), keep W9's low/high; medium was this epic's workers only. No policy change.
    Not changed here: the policy stays as W9 merged it; the question 'What effort policy holds when this epic
    reaches main?' carried the options (a keep low/high, b widen with medium, default low, c medium default again) and
    the recommended default (a). The router passes --effort medium explicitly for each remaining spawn, so a later main
    default does not change it silently.
