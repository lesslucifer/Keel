outcome: >-
  Delivered. app/ holds an Electron 45 app built by Electron Forge 8 with Vite 8 and a bare React 19 page. The window
  reaches the main part only through window.keel (the preload's makeBridge): ask() on the request channel keel:ask
  with six named requests (state.get, projects.add, projects.remove, settings.choose, settings.reset, alert.test),
  each judged by bridge.check (sender = the app window's main frame on the app's own page; name in the table; args a
  plain object with exactly its slot keys; each value an enum or the project id) before anything runs; and on() for
  the one listed push event state.changed on keel:push, sent only to the app's window, every string through plain().
  git runs only as the three fixed commands (toplevel, common-dir, has-config), each prefixed -c
  core.fsmonitor=false --no-optional-locks --no-lazy-fetch, no shell, stdin closed, an environment built from nothing (the login
  PATH plus HOME, USER, LOGNAME, LANG, TMPDIR: no GIT_*). The PATH is read once from the login shell (-ilc, markers,
  5 s) with a fallback that says why. Settings and a one-project list live in the app's own folder (Electron's
  userData: settings.json, projects.json), written atomically; a project's files and git status are unchanged by add,
  settings writes and remove; a second project is refused. Closing the window leaves the app running; the Dock opens
  it again (DEC-77). The main part's tests run on node --test with nothing installed, and keel check runs them beside
  cargo test since the owner's two [check] commits (7beb242, edd11d6). Live on the owner's Mac (2026-11-21): npm run
  make with the ad-hoc signature (rung 1) built Keel.app, it opened, showed the bare page, and the test alert showed;
  Apple's paid membership is not needed for the alert. Node 161 tests pass (unit 99, integration 62); cargo test 137
  unit and 373 suite pass (10 ignored); npm run typecheck green.
deviations:
  - >-
    Spawning: the plan says execFile with a timeout. capture() in src/main/commands.ts spawns each child detached as
    the leader of its own process group and kills the whole group at the timeout. Why: execFile's timeout kills only
    the direct child, then waits on pipes a grandchild (a login shell's children) still holds. Cost: a terminal ^C
    does not reach that group, so the tests' hanging fakes poll their parent (test/support/fs.ts HANG), and a test
    the plan did not list holds it (test/integration/no-leak.test.ts, four exit paths). Commits 4838f25, b24973d,
    e6acc3a.
  - >-
    The dev content policy is swapped in by a Vite plugin (keel:dev-csp in vite.renderer.config.ts, through the pure
    withCsp() in window-options.ts) only while Vite serves under electron-forge start; the page ships with the
    packaged policy in its meta tag and a unit test pins both. Also added: devServerOf(), because Forge hands the main
    part its dev URL without the root slash and the sender check would refuse every request under forge start. Commit
    565c2ef.
  - >-
    ELECTRON_CACHE is passed to the packager as download.cacheRoot in forge.config.ts, because @electron/get no longer
    reads the variable and a sandboxed build cannot write ~/Library/Caches. Commit 64f319a.
  - >-
    The bare page has more than the plan's: a Choose and a Use-the-PATH button per tool and Add and Remove for the one
    project, so the live check reaches the main part's two dialogs, which no hermetic test can. W8 replaces the page.
    Commit eb37626.
  - >-
    Guards beyond the plan's two: the sink guard reads all of app/src, not only app/src/window/ (a superset); only
    src/main/index.ts and src/preload/index.ts import electron, and the window imports no node: module, no electron
    and nothing from the main part; every package is pinned to one exact version with the lockfile beside it. Each
    guard's reader has a self-test. Commits 5d19913, 964e552.
  - >-
    The handlers and the test alert live in pure modules (src/main/handlers.ts, src/main/alert.ts), not in the shell
    as the plan's layout says, so the integration test reaches them through the same dispatcher the shell hands to
    ipcMain.handle, with the dialogs, the Notification and the push injected. settings.ts and projects.ts call a
    changed callback once per saved change. The packager's values, the fuses and the signing rung live in
    src/build/package-options.ts, unit-pinned, because forge.config.ts needs npm to load. Commits 2fc8766, 6b28904,
    67f4917.
  - >-
    Step 2's tests were written before npm install, so tsc first read them at step 5 and found six type errors in two
    test files, none in a source. c5c62b6 fixes them (casts through unknown for deliberately partial handler tables;
    Tool, not string); no assertion changed.
  - >-
    The owner's rules change took two typed commits, not one: 7beb242 makes keel check run the app's tests, edd11d6
    makes it fail when the app's test folders hold no test (the ls guard before node --test).
  - >-
    The shell also prevents will-redirect (the plan names will-navigate, will-frame-navigate and
    will-attach-webview) and refuses device permissions with the rest. Commit 6d60d72.
  - >-
    Review round 1 (cr note on bb3fb5f, FAIL: 4 blockers, 3 importants) changed four things the plan fixed. has-config
    is 'git -C <project> ls-tree --full-tree HEAD -- .keel/config.toml' and must show one regular file (mode 100644 or
    100755, a blob), not the plan's 'cat-file -e HEAD:.keel/config.toml', which accepted a folder (a link and a
    submodule are refused too). The locked flags gain --no-lazy-fetch, so a partial clone is never fetched into; a git
    older than 2.44 is refused by name. capture() answers a program that exits by itself from its own exit code after a
    200 ms grace for its pipes and kills nothing after that exit; after a timeout it answers once the group is gone
    (bounded 2 s). The two dialogs run outside the request queue, in a queue of their own. Also: a git inside the
    folder being added is refused before it runs; the nits index.ts:93, :103, handlers.ts:82, :103 and the tools.ts:42
    link test are taken. Commits eac3028, ee9fd7b, a908043, 7e6602d, 7105837, 72c70b3, d6616a7.
