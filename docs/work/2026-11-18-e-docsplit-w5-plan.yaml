requirement: >-
  After W5, each decision page under docs/decisions/ is under 5,000 words and
  keel verify-doc is red above that ([docs.caps] in .keel/config.toml); the use
  cases, the backlog and the three indexes (decisions, use cases, backlog) are data files with
  no page; and a one-off id check finds, after W5, every DEC, UC and backlog id
  that existed before it and every id cited in src/, tests/, scripts/,
  templates/, skills/, .claude/, AGENTS.md or docs/.
maps-to: >-
