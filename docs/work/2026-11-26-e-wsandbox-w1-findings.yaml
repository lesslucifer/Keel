artifact: wu-result
status: ready
id: E-WSANDBOX.W1
epic: E-WSANDBOX
title: "E-WSANDBOX.W1 findings: what a worker may do"
date: "2026-11-26"
page: 2026-11-26-e-wsandbox-w1-findings.html
outcome: >-
  Delivered. Every point the epic plan marks unverified is settled from Claude Code 2.1.288's own code (byte offsets
  in the installed binary, below) or a probe in this worker's sandbox, except four live confirmations that need a
  launcher change or a port; those are owner steps in the probe clone. Two plan facts are corrected: a worktree's
  own settings.local.json cannot add hosts or loopback binding under the launcher, and R40's live check did run
  (2026-11-12, all as expected). Each of the six open questions has a sharpened default; no ruling is made here.
deviations:
  - "No WU plan pair: W1 changes no code or rule, and the epic plan's wu-summary is its plan (the brief's instruction; keel-plan names a WU plan before a WU's code). Reversible: a WU plan pair can be added before sign-off."
  - "The live probes of a widened sandbox (Unix socket dir, strictAllowlist, loopback binding) were not run: each needs a launcher --settings change or a port. They are owner steps in the probe clone (details.owner-steps)."
  - "No TCP bind was attempted (the brief: probes bind no port). The 2026-11-24 bind EPERM is cited instead."
  - "Process slip: the worker ran ~/.local/bin/claude --version once (it printed 2.1.288 and exited); the brief forbids running claude. Nothing else ran."
evidence:
  - "Source: /Users/nguyenvanluong/.local/share/claude/versions/2.1.288 (sha256 bbe93063f7a0879a1021b2891e5c9354e5b3b98433e32efe6750f7710afed750), read with strings and a byte search; offsets in details.findings."
  - "Probes in this worker (launcher-spawned, mode auto): Unix socket bind and connect; shell writes under .vscode, .idea, .claude/skills, .claude/hooks, .claude/agents, .mcp.json in the worktree and under $TMPDIR. Raw output in details.findings."
  - "R40: transcript ~/.claude/projects/-Users-nguyenvanluong-Documents-proj-misc-Keel-E-CRCAP-w1-waived-verdict/7a672b9a-62f8-4f99-87cc-04340dc85745.jsonl and run snapshot .router/runs/e-crcap-w1-20261112204836-3317-spawn (permission-mode auto)."
  - "Commit: this pair only (docs/work/)."
distillation: >-
  Nothing distilled in W1 (a findings report; the owner rules first). At epic close: DEC-37 and DEC-46 lose the
  claim that a worktree's settings.local.json widens hosts (false under the launcher's allowUnsandboxedCommands
  false); backlog R40 closes as run on 2026-11-12; R42 loses the local-settings cause; the plan's
  distillation-plan carries the rest.
follow-ups:
  - "The six rulings: the owner, on this page; then W2, W3, W4 as ruled (E-WSANDBOX)."
  - "Optional live confirmation of findings (c), (e) and (b): owner steps 1 and 2 in the probe clone (details.owner-steps), before W2 or W4 builds on them (E-WSANDBOX.W2, W4)."
  - "Backlog R40 to closed, R42's candidate causes trimmed, DEC-37/DEC-46 host-widening sentence corrected: E-WSANDBOX epic close (distillation-plan)."
  - "WebFetch is not gated by strictAllowlist (in-process tool); under auto the classifier still judges it: E-WSANDBOX.W4 decides a WebFetch deny on the worker or records a residual in R41."
details:
  claude-code: "2.1.288, the version the launcher runs (~/.local/bin/claude -> versions/2.1.288). Offsets are byte offsets in that binary; a later version may move or change them."
  findings:
    a-w9-local-binding:
      verdict: "settled: by design, not a bug"
      fact: >-
        The launcher's --settings sets sandbox.allowUnsandboxedCommands false (scripts/router-worker.sh:534). Claude
        Code then treats the sandbox as an admin mandate (function La, offset 184533645: true when flagSettings or
        managed settings set allowUnsandboxedCommands false) and takes allowLocalBinding, allowUnixSockets,
        allowAllUnixSockets and allowMachLookup only from managed, --settings or user settings; project and local
        values are dropped with the debug line '[sandbox] admin sandbox mandate: ignoring sandbox.network.<key> from
        project/local settings' (offset 79487226). The settings schema says so: 'true from project settings
        (.claude/settings.json and .claude/settings.local.json) is ignored (false there still applies)' (offset
        179459667). A worker starts with --setting-sources project,local, so user settings are not loaded either:
        only the launcher's --settings can set the key.
    b-loopback-bound:
      verdict: "settled: no such bound in Claude Code"
      fact: >-
        allowLocalBinding true makes the macOS profile emit exactly (allow network-bind (local ip "*:*")),
        (allow network-inbound (local ip "*:*")) and (allow network-outbound (remote ip "localhost:*")) (offset
        184393717). No key narrows the bind to 127.0.0.1 or to named ports, or the outbound to named local ports
        (schema, offset 81164972: 'macOS only: If true, sandboxed commands can bind to localhost ports'). So a worker
        with the key listens on every interface and reaches every local listener, other sessions' filtering proxies
        included. The proxies carry an auth token (proxyAuthToken in the profile call); whether another session's
        proxy refuses a call without it is unverified.
      probe: "2026-11-24 (epic plan): python socket.bind(('127.0.0.1', 0)) -> PermissionError [Errno 1] Operation not permitted. Not repeated (the brief: no port)."
    c-unix-socket:
      verdict: "settled for today; the widened case is from code, live run is owner step 1"
      fact: >-
        Without a key the profile allows no Unix-socket bind or connect. sandbox.network.allowUnixSockets (a list
        of paths, macOS only) emits (allow system-socket (socket-domain AF_UNIX)) plus bind and outbound limited to
        (subpath <path>) for each entry (offset 184394088); allowAllUnixSockets opens every path. Under the launcher
        only --settings can set them (finding a).
      probe: |-
        socketpair(AF_UNIX): ok
        socket(AF_UNIX): ok
        bind /tmp/claude-502/wsb-w1.rm2Iuy/t.sock : PermissionError(1, 'Operation not permitted')
        connect /var/run/mDNSResponder: PermissionError(1, 'Operation not permitted')
    d-write-denies:
      verdict: "settled: hard-coded, no settings key lifts them"
      fact: >-
        The sandbox runtime always adds, under the session's working directory, denies for **/.vscode/**,
        **/.idea/**, **/.claude/commands/**, **/.claude/agents/**, **/.git/hooks/**, the files .gitconfig,
        .gitmodules, .bashrc, .bash_profile, .zshrc, .zprofile, .profile, .ripgreprc, .mcp.json at any depth, and
        .git/config unless allowGitConfig (lists at offset 183589534; appended to every denyWithinAllow at offset
        184387221). Claude Code itself adds <cwd>/.claude/skills and <cwd>/.claude/hooks, with no condition
        (offset 184484081). The globs are anchored at the working directory: the same file under $TMPDIR is
        writable.
      probe: |-
        sh: wsbprobe/x/.vscode/launch.json: Operation not permitted
        sh: wsbprobe/x/.idea/a.xml: Operation not permitted
        sh: .claude/skills/.wsb-probe: Operation not permitted
        mkdir: .claude/hooks: Operation not permitted
        sh: .claude/agents/.wsb-probe: Operation not permitted
        sh: wsbprobe/.mcp.json: Operation not permitted
        EXISTS: wsbprobe/ok.txt   (plain file in the worktree: allowed)
        $TMPDIR scratch .vscode/launch.json: allowed
    e-host-widening:
      verdict: "settled from code; live run is owner step 1"
      fact: >-
        sandbox.network.strictAllowlist true, honoured from --settings (schema, offset 81163816: 'deterministically
        denies hosts not in allowedDomains instead of prompting ... Only honored from user, managed/policy, or CLI
        (--settings) settings'), makes the allowlist the whole allowlist (function Eyn, offset 184471311), and a Bash
        call carrying allowed_domains is refused with 'allowed_domains cannot widen network access in this session:
        the configured sandbox allowlist is the whole allowlist here (a managed-domains-only or strictAllowlist
        policy, or a confined evaluation run). Remove allowed_domains and use a host the configured allowlist
        already covers.' (offset 77827968). Today the per-call grants land in sessionAllowedHosts and join the list
        (offset 184482898). WebFetch is in-process and not gated by it.
      correction: >-
        Under the launcher's allowUnsandboxedCommands false, allowedDomains and WebFetch(domain:...) allow rules from
        project and local settings are already dropped ('admin sandbox mandate: ignoring N
        sandbox.network.allowedDomains / WebFetch(domain:...) allow entries from project/local settings', offset
        184482783). The plan's and DEC-37's 'or by the worktree's own .claude/settings.local.json' is false for
        2.1.288, and R42's local-settings candidate is ruled out (the launcher has set the key since 781e3a1b,
        2026-11-11).
    f-classifier-guidance:
      verdict: "settled: yes, from --settings, not from project files"
      fact: >-
        Classifier rules autoMode.environment, allow, soft_deny, hard_deny (and classifyAllShell) are read from
        userSettings, flagSettings and policySettings only (offset 181154976); project and local ones are ignored
        with 'only user/flag/managed settings may set classifier rules (projectSettings and localSettings are
        repo-controllable)' (offset 181155316). Each list replaces the built-in one unless it carries the literal
        "$defaults". The classifier is also shown the session's loaded CLAUDE.md text, and may weigh it only where it
        'explicitly authorizes the SPECIFIC action under review - same operation, same target' (offset 77979032).
        Keel has no project CLAUDE.md (AGENTS.md only). Bash allow rules (the launcher's grant) skip the classifier
        unless classifyAllShell is true (schema text).
    g-r40:
      verdict: "settled: ran 2026-11-12, all as expected; the backlog row is stale"
      fact: >-
        Brief e-crcap-w1 Step 0 asked for it; the spawn snapshot records permission-mode auto. Transcript results:
        12:48:43Z Write to Keel/.router/livecheck-r40.txt refused by the worker file guard; 12:49:03Z Edit of a
        router brief refused by the guard (the first Edit, on a missing file, proved nothing and was repeated);
        12:48:54Z Read ~/.ssh/known_hosts refused ('denied by your permission settings'); 12:49:12-14Z Write and Edit
        in the worktree allowed; 12:49:23Z cargo build finished; first git commit d77f915 succeeded; 13:46Z first
        keel notes write succeeded. Reported to router keel-77 at 13:02:49Z.
  questions:
    q1-ports: {verified: "a, b", unverified: "whether other sessions' proxies refuse a call without their token", default: "No local port for any worker, and no per-part opt-in: Claude Code has no loopback-only bound. Your lane, written down.", example: "A worker starts the app dev server: today bind EPERM; with allowLocalBinding it binds every interface and reaches every local listener."}
    q2-ignored-tests: {verified: "c (today refused; a per-path key exists)", unverified: "live run of allowUnixSockets (owner step 1); a socket transport in the sender", default: "Your lane at the close of an epic that touches the sender. The socket seam is a real alternative: one socket folder inside the worktree, set only in the launcher.", example: "Each ignored test in tests/suite/notify_owner.rs starts a fake Telegram server on a loopback port; an allowUnixSockets folder could replace the port if the sender gains a socket transport."}
    q3-packages: {verified: "d (hard-coded under the worktree; not under other paths)", unverified: "whether pnpm's store and virtual store can live outside the worktree with Forge and Vite working", default: "You install (lane) unless W3 first proves a store outside the worktree in one folder the launcher may write; pnpm add stays yours either way.", example: "xmlbuilder 15.1.1 ships .vscode/launch.json (the plan, W10 f0b2886); unpacked inside the worktree it is refused, so the install fails (the main case on the page)."}
    q4-websites: {verified: "e (strictAllowlist in --settings ends per-call widening); local settings already cannot widen", unverified: "live run (owner step 1); WebFetch stays with the classifier", default: "Yes, pin it: strictAllowlist true in the launcher; a new site is your commit. WebFetch: deny it or record it.", example: "A Bash call with allowed_domains [registry.npmjs.org]: today auto may approve it, and what the worker read can then be sent there; with strictAllowlist the tool refuses it at once."}
    q5-scratch: {verified: "f (rules from --settings only; the grant skips the classifier)", unverified: "the helper's e2e", default: "The fixed helper on the grant, as planned; optionally an autoMode.environment line in the launcher with $defaults kept. Mode stays auto.", example: "A throwaway git repo under $TMPDIR may be judged risky by the classifier; classifier rules come only from the launcher, never from project files."}
    q6-commits: {verified: "W2, W3 and W4 all edit scripts/router-worker.sh", unverified: "none", default: "One owner commit per part, in build order on the one file; if ports stay off, W2 has no launcher change.", example: "Ports off and the list pinned: W4 is one launcher commit, W2 has none, and W3 can be dropped alone."}
  router-watchdog:
    asked: "Owner comment 2026-11-26 on the questions table: is there a sandbox or restriction on the router and the watchdog?"
    router: >-
      No Bash sandbox: neither ~/.claude/settings.json, the project's .claude/settings.json nor a local settings file
      in the main checkout sets a sandbox key, and no managed settings exist. Its bound is the router guard
      (scripts/router-guard.jq, a fail-closed PreToolUse hook on every tool): the 11 tools of .claude/agents/router.md
      (no Agent), Bash only a whitelist of plain-word commands (git and gh pr reads, ps, the router scripts), Write
      only .router/briefs/<name>.md and .router/notify/owner.md, five inline skills. It runs in the owner's default
      mode (auto, from user settings). The scripts it may run (launcher, router-watch.sh with git fetch,
      notify-owner.py) run unsandboxed with the owner's rights.
    watchdog: >-
      No Bash sandbox: the launcher starts it with --setting-sources local and a --settings holding only hooks
      (scripts/router-worker.sh, watchdog mode). Tools SendMessage and CronCreate only; the guard (router-guard.jq
      with watchdog_to) admits only CronCreate of the */5 tick and a SendMessage to its router. Its facts hook runs
      the launcher unsandboxed and checks each worktree's .git link before any git there (linked_ok).
    scope: "Sandboxing either is not in E-WSANDBOX's scope; a new part or epic if the owner wants it."
  owner-steps:
    recipe: >-
      Probe clone /Users/nguyenvanluong/Documents/proj/misc/Keel-probe (project-router skill, 'Live probes'), run in
      your own terminal: cd /Users/nguyenvanluong/Documents/proj/misc/Keel-probe && git fetch
      /Users/nguyenvanluong/Documents/proj/misc/Keel wu/E-WSANDBOX/w1-findings && git checkout --detach FETCH_HEAD,
      set [router] worker_model = "haiku" in .keel/config.toml and commit it, keel hooks install, then git worktree
      add ../Keel-probe-router -b probe/wsb-router and git worktree add ../Keel-probe-worker -b probe/wsb-worker.
    step-1-socket-and-hosts: >-
      In ../Keel-probe-router: sed -i '' 's|"github.com"\]}}|"github.com"], strictAllowlist: true, allowUnixSockets:
      [$w + "/wsb-sock"]}}|' scripts/router-worker.sh; write .router/briefs/wsb-probe.md asking the worker to run,
      appending raw output to /Users/nguyenvanluong/Documents/proj/misc/Keel-probe-worker/wsb-probe.log: (1) mkdir
      -p wsb-sock && python3 -c "import socket;s=socket.socket(socket.AF_UNIX);s.bind('wsb-sock/a.sock');print('in-dir
      bind ok')"; (2) python3 -c "import socket,os;s=socket.socket(socket.AF_UNIX);s.bind(os.environ['TMPDIR']+'/b.sock');print('tmp
      bind ok')"; (3) curl -sS -m 10 -o /dev/null -w '%{http_code}\n' https://registry.npmjs.org/ with Bash
      allowed_domains ["registry.npmjs.org"]; (4) the same curl without allowed_domains. Spawn:
      scripts/router-worker.sh spawn wsb-probe /Users/nguyenvanluong/Documents/proj/misc/Keel-probe-worker
      .router/briefs/wsb-probe.md haiku. Expected: (1) ok, (2) Operation not permitted, (3) the tool's 'allowed_domains
      cannot widen network access' refusal, (4) a proxy refusal. Log: Keel-probe-worker/wsb-probe.log.
    step-2-port: >-
      Only if you want the live proof of finding b (it binds a port): in ../Keel-probe-router git checkout --
      scripts/router-worker.sh, then sed -i '' 's|"github.com"\]}}|"github.com"], allowLocalBinding: true}}|'
      scripts/router-worker.sh, stop the step-1 worker (scripts/router-worker.sh stop wsb-probe), and spawn it again
      with a brief running python3 -c "import socket;[print(h, (lambda s: (s.bind((h, 0)), s.getsockname(), s.close())[1])(socket.socket())) for h in
      ('127.0.0.1', '0.0.0.0')]" >> /Users/nguyenvanluong/Documents/proj/misc/Keel-probe-worker/wsb-probe-port.log
      2>&1. Expected: both binds succeed (every interface). Log: Keel-probe-worker/wsb-probe-port.log.
  scratch: "mktemp -d $TMPDIR/wsb-w1.XXXXXX (/tmp/claude-502/wsb-w1.rm2Iuy), removed at the end; probe process group 48344 confirmed gone (kill -0: no such process)."
