# Keel's gate on GitHub (E-GHFLOW.W1), base-defined since E-GHFLOW2.W4: the tests, the merge check and
# the doc check for every pull request into main or an epic. A push of main runs keel-main.yml.
# pull_request_target: GitHub takes this file from main for every pull request, whatever its base or
# head holds, and the checkout below is main's commit, so a pull request never changes the workflow
# or scripts/ci-gate.sh that judge it. `edited` is a trigger so a retargeted pull request is judged
# again: the script refuses any base but the head's own (a WU into its epic, an epic into main).
# The rulesets require keel/ci, keel/gate and keel/docs by these names, which no older workflow
# ever used: a branch cut before W4 still runs its old ci, gate and docs on a push, from its own
# code. Every job is one call of scripts/ci-gate.sh; event values reach it only through env. The
# token is contents: read in every job; no job names a secret; no checkout keeps a credential; no
# cache is read or written. Only keel/ci runs the head's code (its tests), on the head merged into
# the base. keel is built once, from the base, by build; each job refuses a keel whose SHA-256
# differs from build's output, since head code could swap the run's artifact (kept 7 days: after
# that, re-run all jobs, never the failed ones alone). No job skips (GitHub counts a skipped job as
# passed): a fork's pull request, or a failed build, is red in every job.
name: Keel gate

on:
  pull_request_target:
    types:
      - opened
      - synchronize
      - reopened
      - edited
    branches:
      - main
      - 'epic/**'

permissions:
  contents: read

concurrency:
  group: keel-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      keel_sha256: ${{ steps.build.outputs.keel_sha256 }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - id: build
        run: scripts/ci-gate.sh build
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_BRANCH: ${{ github.event.pull_request.base.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          REPO: ${{ github.repository }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          KEEL_OUT: ${{ runner.temp }}/keel-bin
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: keel
          path: ${{ runner.temp }}/keel-bin/keel
          retention-days: 7
          if-no-files-found: error

  ci:
    name: keel/ci
    needs: build
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: keel
          path: ${{ runner.temp }}/keel-bin
      - run: rustup component add rustfmt clippy
      - run: scripts/ci-gate.sh ci
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_BRANCH: ${{ github.event.pull_request.base.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          REPO: ${{ github.repository }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          KEEL: ${{ runner.temp }}/keel-bin/keel
          KEEL_SHA256: ${{ needs.build.outputs.keel_sha256 }}

  gate:
    name: keel/gate
    needs: build
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: keel
          path: ${{ runner.temp }}/keel-bin
      - run: scripts/ci-gate.sh gate
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_BRANCH: ${{ github.event.pull_request.base.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          REPO: ${{ github.repository }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          KEEL: ${{ runner.temp }}/keel-bin/keel
          KEEL_SHA256: ${{ needs.build.outputs.keel_sha256 }}

  docs:
    name: keel/docs
    needs: build
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: keel
          path: ${{ runner.temp }}/keel-bin
      - run: scripts/ci-gate.sh docs
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_BRANCH: ${{ github.event.pull_request.base.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          REPO: ${{ github.repository }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          KEEL: ${{ runner.temp }}/keel-bin/keel
          KEEL_SHA256: ${{ needs.build.outputs.keel_sha256 }}
