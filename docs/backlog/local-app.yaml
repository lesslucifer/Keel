# Keel backlog: local-app. Data only, no page (DEC-69). Open rows in full; a closed row is its id, title and how it closed.
# Ids are never reused. Order and next free ids: backlog-index.yaml.
title: "Backlog: the local app"
letters: [A, L]
about: >-
  Going back to before GitHub's flow, then building the desktop app in place of it: five epics in order (A1 - A5),
  then four later needs and one re-pointed idea (L1 - L5). E-LOCALTOOL closed on 2026-11-19 with a design and no code:
  docs/local-app.html is the app as designed, and DEC-70 records why. Each epic waits only on the ones before it and is
  useful on its own. Its parts and K-numbers (the keel or router changes the app needs) are in docs/local-app.html,
  under "The build order"; the needs n1 - n10 are listed there too. Distilled from E-LOCALTOOL (W5 result, P4 to P6,
  and the close).
open:
  - id: A2
    title: "E-KEELFIX · Keel fixes"
    status: next; A1 done
    problem: >-
      First use: your rule-file commit runs the committed rules, and the gate can run with nothing written (n3).
    proposal: >-
      Parts: K9, the commit hooks read the committed `.keel/config.toml`, not the folder's file; K2, `keel verify-dod
      … --no-receipt`; `keel notes write … --help` prints help and writes no note; the github tier's reading removed
      once E-DOCSPLIT is on main (E-LOCALTOOL is). Waits on: A1 (done).
    source: >-
      E-LOCALTOOL.W5 result, P4 to P6, and the close.
    taken-by: "E-KEELFIX"

  - id: A3
    title: "E-APPLIST · Alerts and your list"
    status: after A1
    problem: >-
      First use: an alert at your desk (n1) and one list of what waits on you (n2). Read-only.
    proposal: >-
      Parts: the app's frame; the Reader, Watcher and Alerter on the two sources; screens 1, 2 and one project on 6;
      the router's update log (K14) and the watchdog's lines (K15), with their defaults and the "router not heard"
      bar, tested by an app restart and a router restart; the router's stage lines (K4) and alert line (K10); Open with
      a copy of the committed page, and the PATH setting; the alert's link and one Telegram test (K12); `?diff=latest`
      on a file link checked; the app reads the local epic branch; Apple's membership decided at the first signed
      build. Waits on: A1.
    source: >-
      E-LOCALTOOL.W5 result, P4 to P6, and the close.
    taken-by: "E-APPLIST"

  - id: A4
    title: "E-APPSIGN · Sign off and merge from the app"
    status: after A2, A3
    problem: >-
      First use: the sign-off and the merge from the app (n3), and the code read before you sign (n6).
    proposal: >-
      Parts: the five run lines, the dialog and keel's words; the diff page; screen 3 (one work unit); Commit… for a
      rule-file commit (K5, keel names the rule files among staged files); Merge task… and Push…; the gate's checks as
      JSON for the dialog (K1); signing with a key; Cursor's guard of a worker's folder checked. From the E-LOCALTOOL
