# Keel policy (written by `keel init`). The merge gate judges a merge by this file
# as committed on the target branch, so a branch cannot change its own rules.

# Path prefixes the gate treats as code (cr binds them). A diff touching none is
# docs/infra-only and exempt from test/cr/doc evidence. Adjust to your layout.
code_paths = ["src/", "tests/", "app/"]

# Optional: narrow that exemption to paths matching these globs (and outside
# code_paths). Unset = every non-code path is docs/infra.
# infra_paths = ["docs/**", "*.md"]

# Commits touching these need a Reviewed-By trailer (`keel mr commit`).
# A trailing / is a prefix; otherwise a glob (* and ? within a segment, ** across).
rule_bearing = ["AGENTS.md", "docs/*.html", "skills/", "templates/", ".keel/", ".claude/skills/", ".claude/settings.json", "scripts/router-guard.jq", "scripts/router-inbox.sh", "scripts/router-scratch.sh", "scripts/router-worker.sh", "scripts/router-file-guard.sh", "scripts/router-watch.sh", "scripts/router-app.sh", "scripts/notify-owner.py", ".claude/agents/"]

[check]
lint = "cargo fmt --check && cargo clippy --all-targets -- -D warnings"
test = "cargo test && ls app/test/unit/*.test.ts app/test/integration/*.test.ts >/dev/null && node --test 'app/test/**/*.test.ts'"

[branches]
main = "main"
epic_prefix = "epic/"   # epic branches: <epic_prefix><slug>
wu_prefix = "wu/"       # WU branches: <wu_prefix><epic-slug>/<slug>, measured against its epic

[paths]
worktrees = ".claude/worktrees/"   # where Claude Code creates agent worktrees; init gitignores it

[docs]
root = "docs/"

[docs.tiers]
T0 = ["AGENTS.md", "CLAUDE.md"]
T1 = ["docs/*"]
T2 = ["docs/use-cases/**", "docs/decisions/**", "docs/backlog/**"]
T3 = ["docs/work/**", "docs/.archive/**"]

[docs.caps]
"docs/decisions/*.html" = 5000   # E-DOCSPLIT.W5 (DEC-69)
"docs/architecture.html" = 3000   # E-DOCSPLIT.W7: holds now that E-GHREVERT removed the GitHub parts
"docs/install.html" = 1500

[tests]
# adapter = "python"   # rust | ts | python | go | regex; default: by file extension
# pattern = "..."      # test-declaration regex, for the regex adapter

[mr]
tiers = ["username", "key"]   # accepted .keel/mr-allowed tiers; key-only is deferred by owner ruling 2026-11-12 (DEC-48)

[review]   # modules, rubric: read by the keel-code-review skill. The schedule keys (max_rounds, whole_range_rounds, fix_importants_from, fix_blockers_from): by the CLI from the target branch's committed copy
# at the review's level: a review whose target is main is an epic review, any other a WU review; per key [review.epic] or [review.wu] wins, then [review], then the default (the rule: skill keel-code-review section 5)
# [review] sets no schedule key here; a staged change is checked by the pre-commit hook and keel mr commit; keel mr confirm tags the review history's rounds by the target's settings
modules = ["src/*"]          # each match of a glob's * is one module (altitude finder)
rubric = ".keel/rubric.md"   # optional project-local rubric

[review.wu]   # the WU review's own schedule: blockers too are fixed under a fix-PASS, with no further round and no cap waiver; the epic review follows [review] and the defaults
max_rounds = 1
fix_blockers_from = 1

[router]   # read by scripts/router-worker.sh, not by the CLI (DEC-39)
worker_model = "opus"
worker_efforts = ["medium", "high"]
worker_default_effort = "medium"
worker_permission_mode = "auto"
watchdog_model = "haiku"
