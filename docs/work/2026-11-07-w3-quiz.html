<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>E-SEED.W3 quiz</title>
<style>
  :root{
    --bg:#f6f4ef; --paper:#ffffff; --ink:#1d1b17; --muted:#6b6557; --line:#e4ded0;
    --accent:#a2401f; --ok:#2f6b3a; --ok-bg:#e6f0e3; --bad:#a2401f; --bad-bg:#fbe9e2;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#17150f; --paper:#201d16; --ink:#efe9dd; --muted:#a39d8c; --line:#352f23;
      --accent:#e07a4c; --ok:#7fce8e; --ok-bg:#1d2e1f; --bad:#f09a7e; --bad-bg:#352119;
      color-scheme: dark;
    }
  }
  *{box-sizing:border-box}
  body{margin:0; padding:0 16px; background:var(--bg); color:var(--ink); font-family:ui-sans-serif,system-ui,sans-serif}
  .wrap{max-width:760px; margin:0 auto; padding:40px 0 80px}
  h1{font-family:Georgia,serif; font-weight:600; font-size:clamp(1.6rem,4vw,2.3rem); margin:0 0 6px}
  .lede{color:var(--muted); margin:0 0 24px; max-width:60ch; line-height:1.5}
  .bar{position:sticky; top:0; z-index:1; display:flex; justify-content:space-between; align-items:center; gap:12px;
    padding:10px 0; margin-bottom:14px; background:var(--bg); border-bottom:1px solid var(--line)}
  .score{font-size:.9rem; color:var(--muted); font-variant-numeric:tabular-nums; padding:4px 10px; border:1px solid var(--line); border-radius:999px}
  .score.done{color:var(--ok); border-color:var(--ok)}
  .card{background:var(--paper); border:1px solid var(--line); border-radius:10px; padding:18px 20px; margin-bottom:14px}
  .tag{font-size:.75rem; font-weight:700; color:var(--accent); text-transform:uppercase; letter-spacing:.04em}
  .q{font-weight:600; margin:4px 0 12px; line-height:1.45}
  .opts{display:flex; flex-direction:column; gap:8px}
  .opt{display:flex; align-items:flex-start; gap:10px; text-align:left; padding:10px 12px; border:1px solid var(--line);
    border-radius:8px; background:transparent; color:var(--ink); font:inherit; cursor:pointer; line-height:1.4}
  .opt:hover:not(:disabled){border-color:var(--accent)}
  .opt:focus-visible{outline:2px solid var(--accent); outline-offset:1px}
  .opt:disabled{cursor:default}
  .mark{flex:none; width:1.3em; height:1.3em; border-radius:50%; border:1.5px solid var(--line);
    display:flex; align-items:center; justify-content:center; font-size:.75rem; margin-top:.1em}
  .opt.correct{background:var(--ok-bg); border-color:var(--ok)}
  .opt.correct .mark{background:var(--ok); border-color:var(--ok); color:#fff}
  .opt.wrong{background:var(--bad-bg); border-color:var(--bad)}
  .opt.wrong .mark{background:var(--bad); border-color:var(--bad); color:#fff}
  .explain{margin-top:12px; padding:12px 14px; border-radius:8px; background:var(--bg); border:1px dashed var(--line);
    font-size:.92rem; color:var(--muted); line-height:1.5; display:none}
  .explain.show{display:block}
  .explain b, code{color:var(--ink)}
  code{font-size:.9em}
  .reset{font:inherit; font-size:.85rem; color:var(--muted); background:none; border:1px solid var(--line); border-radius:999px; padding:6px 14px; cursor:pointer}
  .reset:hover{border-color:var(--accent); color:var(--accent)}
</style>
</head>
<body>
<div class="wrap">
  <h1>E-SEED.W3: merge gate</h1>
  <p class="lede">Ten questions on what W3 actually built: <code>verify-dod</code> checks 1&ndash;7, its five modes, <code>walk_waivers</code>, the UC-GATE-5 exemption, and the follow-ups (the gate0&rarr;check rename, <code>infra_paths</code>, branch prefixes). Options are shuffled on every load and every reset.</p>

  <div class="bar">
    <span class="score" id="score">0 / 0 answered</span>
    <button class="reset" id="reset" type="button">Reshuffle &amp; reset</button>
  </div>
  <div id="quiz"></div>
</div>

<script>
(function(){
  "use strict";

  var DATA = [
    {
      tag: "Check 1 · notes",
      q: "A plain commit (commit level) changes code under code_paths and also a file under docs.root. Which notes does check 1 require on it?",
      opts: ["test/v1 only. cr/v1 and doc/v1 are wu/epic only", "test/v1 and doc/v1, but not cr/v1", "test/v1, cr/v1 and doc/v1", "No notes, because commit level only runs check 2"],
      correct: 1,
      why: "test/v1 is always required. cr/v1 is required at wu/epic only. doc/v1 is required at wu/epic, and <b>at commit level when the commit touches docs.root</b>. Check 6 then verifies doc/v1 <code>changes</code> lists exactly the changed docs, with no missing and no phantom entries (since W8, each with its <code>docs.tiers</code> tier). Had the commit touched <i>only</i> the doc, it would be docs-only and exempt (UC-GATE-5): no notes at all."
    },
    {
      tag: "Check 2 · manifest",
      q: "A WU's test note has only a unit layer, and every note's tip is correct. Which check fails, and why?",
      opts: ["1·notes, because the note is incomplete JSON", "3·review, because cr/v1 has no integration verdict", "2·manifest, because wu level needs the integration layer (counted or waived)", "None. unit covers every level"],
      correct: 2,
      why: "2·manifest maps each level to a layer: commit &rarr; unit, wu &rarr; integration, epic &rarr; e2e. It also covers identity: a note whose <code>tip</code> is not the commit it sits on (e.g. copied by <code>git notes copy</code>) fails here, since Keel's identity block has no epic/wu ids."
    },
    {
      tag: "Checks 4 & 5",
      q: "A blessed WU's tip and the tip's notes are untouched, but the gate computes a different merge-base than the one the review recorded (e.g. it is judged against another target). Only non-code commits separate the two bases. Which check goes red?",
      opts: ["5·diff-binding: cr.code_diff_hash no longer matches", "4·review-base: cr.base no longer equals the merge-base of tip and target", "3·review: the verdict is invalidated automatically", "7·walk: the seam is re-walked"],
      correct: 1,
      why: "4·review-base compares <code>cr.base</code> with the <b>current</b> merge-base of tip and target. 5·diff-binding compares <code>cr.code_diff_hash</code> with the hash of <code>git diff base tip -- code_paths</code>, using the same shared helper W2's writer uses, so it stays green when no code differs. (Check 8 also goes red, since mr/v1 is bound to the base.) Note: the epic simply gaining commits does <b>not</b> move the merge-base of an untouched WU tip, so nothing goes red; rebasing the WU makes a new tip with no notes (1·notes). The writer and the gate measuring from different targets is the real trap, which is why W3 changed <code>notes write</code> to resolve its target the same way the gate does."
    },
    {
      tag: "Check 7 · walk",
      q: "A second WU is fast-forwarded into an epic, so its code commit has no notes. What does the epic gate report?",
      opts: ["7·walk·1·notes: the plain commit is checked as a commit and fails check 1", "7·walk·2·manifest: the seam is checked as a WU", "Nothing. fast-forward seams are landed history and skipped", "7·walk·octopus"],
      correct: 0,
      why: "The walk re-checks every first-parent seam in base..tip. A 2-parent merge is checked as a WU (tip = parent 2, target = parent 1). A <b>plain commit is checked as a commit</b> (target = its parent). An octopus merge is always red. Back-merges of landed history are skipped. Failures are reported as <code>7·walk·&lt;inner id&gt;</code>. The epic tip itself is not walked (open point 7)."
    },
    {
      tag: "verify-dod modes",
      q: "In hook mode (pre-merge-commit), where does verify-dod get the tip, since MERGE_HEAD does not exist yet?",
      opts: ["ORIG_HEAD", "HEAD^2", "The rev in GIT_REFLOG_ACTION (or MERGE_HEAD when present). Target = HEAD, level comes from HEAD's branch", "It reads refspec lines on stdin"],
      correct: 2,
      why: "Hook: tip = MERGE_HEAD or the <code>GIT_REFLOG_ACTION</code> rev. Target = HEAD. HEAD = branches.main &rarr; epic gate, HEAD = an epic branch &rarr; WU gate, anything else is ungated. Two or more merge heads are refused. Refspecs on stdin belong to <code>keel hook pre-push</code>."
    },
    {
      tag: "verify-dod modes",
      q: "Of the five modes (wu, epic, commit, hook, range), which write a dod/v1 receipt on green?",
      opts: ["All five", "Only epic", "commit and range only", "wu, epic and hook, and only when the range is non-exempt"],
      correct: 3,
      why: "The receipt goes to <code>refs/notes/dod</code> on a green, non-exempt wu/epic/hook run, holding identity, <code>level</code>, <code>checks</code> and <code>diff_hash</code>. <b>commit</b> (target = sha^) and <b>range</b> (old..new, each first-parent plain commit as a commit, which is what pre-push runs) write none, as in Trawler."
    },
    {
      tag: "walk_waivers",
      q: "Which walk_waivers entry actually waives a red seam?",
      opts: ["{\"seam\":\"a1b2c3\",\"why\":\"vendored hotfix, reviewed in #42\"} on the epic tip's cr/v1 note", "{\"seam\":\"a1b2c3\",\"why\":\"\"} on the epic tip's cr/v1 note", "keel notes write cr --waive a1b2c3", "{\"seam\":\"a1b2c3\",\"why\":\"...\"} on the seam commit's own test/v1 note"],
      correct: 0,
      why: "walk_waivers lives on the <b>epic tip's cr/v1</b> as <code>[{seam, why}]</code>. The sha is matched by prefix in either direction, and a <b>blank why never waives</b>. It is a hand edit (<code>git notes --ref=cr edit</code>), not a CLI flag, and is added with <code>#[serde(default)]</code>. A waived seam prints as waived. The tip's own checks still run."
    },
    {
      tag: "Exemption boundary",
      q: "Which statement about the UC-GATE-5 docs/infra exemption is true?",
      opts: ["An empty code_paths makes everything exempt", "An exempt epic also skips the 7·walk", "An exempt range skips checks 1–6 and writes no receipt, but W4's 8·manual-review and W8's epic tracked-doc layout still run, and so does the epic walk", "Exemption only skips the test note. cr/v1 is still required"],
      correct: 2,
      why: "Exempt = every changed path is infra. Checks 1&ndash;6 are skipped and no receipt is written. An <b>empty code_paths makes every path code</b>, so nothing is exempt by accident. Never exempt: check 8 (mr/v1), which runs in <code>gate::run()</code> after <code>verify()</code>, and at an epic the tracked-doc layout. W3 planned a slot for both inside <code>verify()</code>; W4 moved check 8 up to <code>run()</code> because the walk re-enters <code>verify()</code> per seam. A docs-only range that archives a T3 doc still needs doc/v1 (W8). The walk runs on exempt epics because each seam judges its own diff."
    },
    {
      tag: "Follow-up · infra_paths",
      q: "With code_paths = [\"src/\", \"tests/\"] and infra_paths = [\"docs/**\", \"*.md\"], a WU changes only Makefile. What happens?",
      opts: ["Exempt, because Makefile is outside code_paths", "Gated: infra_paths can only narrow the exemption, and Makefile matches no glob", "Config error, because infra_paths and code_paths conflict", "Gated only at epic level"],
      correct: 1,
      why: "<code>is_infra</code> = outside code_paths <b>and</b> (infra_paths unset <b>or</b> matches a glob, using the docs.tiers matcher). Unset keeps the old rule (everything non-code is infra). Set, it narrows the exemption and can never widen it, because a code path is never exempt. Test: <code>infra_paths_narrows_the_exemption_and_unset_keeps_everything_outside_code_paths</code>."
    },
    {
      tag: "Follow-ups · rename & prefixes",
      q: "Which accurately describes the post-W3 follow-ups?",
      opts: ["gate0 became `keel verify`; [gate0] is still read as an alias; branch names stay hard-coded epic/ and wu/", "gate0 became `keel check` with a [check] section and a keel-check-green cache, with no [gate0] back-compat. branches.epic_prefix / wu_prefix (defaults \"epic/\", \"wu/\") drive hook level detection, the pre-push range check and notes::target", "Only the cache file was renamed. A new top-level epic_branch key replaces branches.main", "gate0 became `keel check`, but prefixes are configured per hook under [hooks]"],
      correct: 1,
      why: "Rename: <code>keel check</code>, <code>[check]</code> (same lint/test keys), <code>keel-check-green</code>. No compat for <code>[gate0]</code>, since nothing has shipped. Prefixes live under <code>[branches]</code>, and <code>&lt;wu_prefix&gt;&lt;e&gt;/&hellip;</code> resolves to <code>&lt;epic_prefix&gt;&lt;e&gt;</code>. Configs without the keys behave as before. Test: <code>custom_branch_prefixes_get_the_same_gating</code>."
    }
  ];

  // Fisher-Yates in place
  function shuffle(a){
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1)), t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  var mount = document.getElementById('quiz');
  var scoreEl = document.getElementById('score');

  function render(){
    mount.innerHTML = '';
    var answered = 0, right = 0, total = DATA.length;
    function updateScore(){
      scoreEl.textContent = answered < total
        ? answered + ' / ' + total + ' answered · ' + right + ' correct'
        : 'Done: ' + right + ' / ' + total + ' correct';
      scoreEl.classList.toggle('done', answered === total);
    }
    updateScore();

    DATA.forEach(function(it, qi){
      var opts = shuffle(it.opts.map(function(l, i){ return {l: l, c: i === it.correct}; }));

      var card = document.createElement('div');
      card.className = 'card';
      var tag = document.createElement('div');
      tag.className = 'tag';
      tag.textContent = it.tag;
      var q = document.createElement('p');
      q.className = 'q';
      q.textContent = (qi + 1) + '. ' + it.q;
      var box = document.createElement('div');
      box.className = 'opts';
      var explain = document.createElement('div');
      explain.className = 'explain';
      explain.innerHTML = it.why;

      opts.forEach(function(o){
        var btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'opt';
        var mark = document.createElement('span');
        mark.className = 'mark';
        var txt = document.createElement('span');
        txt.textContent = o.l;
        btn.appendChild(mark);
        btn.appendChild(txt);
        btn.addEventListener('click', function(){
          if (card.dataset.answered) return;
          card.dataset.answered = '1';
          answered++;
          if (o.c) right++;
          Array.prototype.forEach.call(box.children, function(b, idx){
            b.disabled = true;
            if (opts[idx].c) { b.classList.add('correct'); b.firstChild.textContent = '✓'; }
          });
          if (!o.c) { btn.classList.add('wrong'); mark.textContent = '✕'; }
          explain.classList.add('show');
          updateScore();
        });
        box.appendChild(btn);
      });

      card.appendChild(tag);
      card.appendChild(q);
      card.appendChild(box);
      card.appendChild(explain);
      mount.appendChild(card);
    });
  }

  document.getElementById('reset').addEventListener('click', render);
  render();
})();
</script>
</body>
</html>
