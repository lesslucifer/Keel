  - id: B24
    title: "A notes fetch that neither drops nor blocks"
    status: "backlog: needs an owner pick (A, B, C or E), then an epic"
    problem: >-
      A fresh clone still fetches evidence by hand (DEC-19 stays push-only). backlog B6's plan was a non-forced
      `refs/notes/*:refs/notes/*` on `remote.origin.fetch`. Git rejects that fetch whenever a local note ref is ahead
      of origin's, not only when it diverged: `! [rejected] refs/notes/test -> refs/notes/test (non-fast-forward)`,
      exit 1. So every `git fetch`, in any worktree, fails between a `keel notes write` and the next push. Seen in an
      E-SEED3.W5 scratch-repo test, right after a clean `git notes merge` made the local ref a descendant of origin's.
      The options (D was the deferral itself) are in the items.
    proposal: |-
      The owner picks A, B, C or E, then an epic builds it. The fix for a diverged note ref, per note kind:

          git fetch --refmap= origin +refs/notes/<kind>:refs/notes/keel-remote-<kind> &&
            git notes --ref=<kind> merge -s ours refs/notes/keel-remote-<kind>
          git update-ref -d refs/notes/keel-remote-<kind>

      `--refmap=` stops the configured refspec retrying the rejected ref. The `+` lets a re-run replace a temporary ref
      a failed run left behind. `git notes merge` expands any name into `refs/notes/`, so the temporary ref must live
      there. The last line runs whatever happened before it, so the pre-push sync of `refs/notes/*` never sends it.
      Keel writes notes with `git notes add -f`, so two machines noting one commit conflict. The default strategy
      (manual) then stops mid-merge. `-s ours` keeps your note on such a commit; `-s theirs` takes origin's. Which one
      is right is part of the pick above. Tested in E-SEED3.W5: the earlier form (no `+`, no strategy, delete chained
      with `&&`) on a clean merge. This form is not tested.
      The E-SEED3 epic test's fourth step belongs here (owner ruling 2026-11-14). The epic plan made "a fresh clone set
      up by `init` fetches the evidence with a plain fetch, and `keel verify-dod epic` is green there" part of
      E-SEED3's epic e2e. It cannot run while the fetch is deferred: there is no fetch setup to exercise. The owner
      moved it here for that same reason (B6 was deferred to B24 by the same owner, ruling D, 2026-11-13), kept the
      plan's other three steps as E-SEED3's e2e, and claimed no waiver - those three run and prove the close. What
      this work must prove: once the fetch setup this row picks exists, a fresh clone set up by `keel init` fetches
      the evidence with a plain `git fetch`, and `keel verify-dod epic` is green in that clone. E-SEED3 does not prove
      it, and its e2e names the step as this row's obligation.
    source: >-
      E-SEED3.W5 (B6 deferred by owner ruling D, 2026-11-13). The E-SEED3 epic test's "a fresh clone fetches the
      evidence" step changes with it (moved here by owner ruling 2026-11-14).
    taken-by: "an owner pick (A, B, C or E), then an epic; stays in the backlog until then"
    items:
      - >-
        option A, forced `+refs/notes/*:refs/notes/*`: fetch always works; unpushed local notes are dropped. Rejected
        by E-SEED3 open point 5.
      - "option B, non-forced, as B6 planned: fetch fails after every local note write until the push."
      - >-
        option C, forced mirror `+refs/notes/*:refs/notes-origin/*`: holds nothing local, so force is safe. Keel's note
        readers fall back to it, or a merge step runs `git notes merge`. Touches the note reader and the hooks.
      - >-
        option E, an explicit `keel notes pull`: no refspec, `git fetch` is untouched. The command runs the fix line
        below for each note kind, and says what it merged or which note conflicted. (D was the deferral itself.)

