outcome: >-
  Delivered. keel preflight, keel notes write cr and the sign-off's review history run the schedule the target's
  committed [review] sets: review::Policy {max_rounds, whole_range_rounds, fix_importants_from}, round n followed by
  round n+1 exactly when n < max_rounds and (n < fix_importants_from or round n found a blocker), rounds past
  whole_range_rounds scoped to the last fix, the cap's waiver naming max_rounds. One rule (review::policy_in)
  refuses a bad schedule at preflight, in the writer and staged at commit, and lowers a default value above a set
  cap. The default values live only in review::Policy::DEFAULT. After the owner's rework round, every test
  expectation is computed from the schedule under test: unit tests over six schedules, integration tests over four
  (the default values and 5/2/4, 2/1/2, 4/3/3), the e2e over the default values and 4/2/3.
deviations:
  - "The sign-off's history (src/mr.rs review_history) does not refuse when the target's schedule is refused: it tags rounds by the default values and prints one line naming the refusal. A bad schedule blocks the review, never the owner's sign-off or waiver. main::validate, which mr::roster also runs, is not widened for the same reason."
  - "review::Schedule::read and review::policy return (what, fix) pairs, so a refused schedule names its own fix (correct [review] on the target branch); src/notes.rs maps it through its refuse()."
  - "DEC-26's sentence on what the CLI reads from [review] was amended too, and the use-case index's UC-REV-3 title follows the new title. Not in the distillation plan; the code wins."
  - "A history tag for a round recorded under another schedule names both recorded fields ('; the note records round n, full')."
  - "Rework round (owner feedback 2026-11-24): the first plan and tests were written around the default values. The plan, the result and every schedule test were rewritten in terms of the settings; the code needed no logic change (its audit found only doc lines restating the values, an old-plan citation and one fix line naming 'round 1')."
  - "Code review round 1 (FAIL, 0 blockers, 2 importants, 3 nits), fixed: the tests' default schedule is one DEFAULTS in tests/common (keel is a binary crate, so the test crate cannot read review::Policy::DEFAULT); the fix-PASS test asks the schedule whether round 2 follows and also runs fix_importants_from = 1; fixable's clamp is a debug_assert; a key above an unset max_rounds is refused as above the default cap; the e2e's doc names no default value."
  - "The real-run example: a scratch-repo run was denied by the sandbox's permission check and not retried; the page's example is the flow the tests run through the real binary and hooks."
