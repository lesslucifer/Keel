      gaps: "100; the resolved row (history) goes; the refspec row folds into init's line; the DSH doc-check row stays (backlog D1)"
      not-gated: "200"
      next: "100"
      header: "the meta line's E-SEED3 tip (history) becomes the current date"
      aim: "about 2,730 without the GitHub parts (now about 4,900)"
    install:
      intro: "40"
      "1-install": "230; the shell profile list becomes one sentence; the name-clash list becomes two sentences (the hooks name the fix)"
      "2-path": "44"
      "3-adopt": "380; the harness-hook detail goes (architecture #init, keel-workflow §7); the doc-gate placeholder becomes one line (backlog D1)"
      "4-upgrade": "180; the lock mechanics become one line (architecture #init); the E-SEED2.W2 SHA-256 note (history) goes - keel-workflow §3 holds the re-sign rule"
      aim: "about 870 without §5 (now 1,091, already under the cap: history and repeated rules only)"
  links-in:
    anchors-kept: ["architecture.html#github (from install.html)", "install.html#github-app (from architecture.html, decisions/router-hosts.html, decisions/workflow-gates.html)"]
    whole-page: "docs/local-app.html, the backlog and use-case data files, templates/config.toml, src/main.rs (the install URL), tests (pages_build.rs fixtures only; no test pins either page's text)"
    internal: "architecture's own #init, #targets, #gaps, #github links are kept or re-pointed in the same commit"
  local-app-backlog:
    why: >-
      Main's merge (68a1520) kept docs/backlog/local-app.html as a page:
      docs/architecture.html (#github note, A1) and docs/local-app.html (three
      links), both signed on main, link it. DEC-69 makes the backlog data only.
    change: >-
      local-app.yaml in github-flow.yaml's form (open rows A1 - A5, L1 - L5 in
      full); backlog-index.yaml's A and L entries name it; the four links become
      plain backlog/local-app.yaml text (architecture's note keeps its words).
  commits:
    steps:
      - "1, one owner keel mr commit (owner comment on open point 3: one): docs/architecture.html and docs/install.html slimmed; docs/backlog/local-app.html becomes local-app.yaml, backlog-index.yaml's A and L entries name it, and the links in docs/architecture.html and docs/local-app.html are re-pointed"
      - "then plain worker commits: the W6 result pair; test and doc notes on the tip"
    how: >-
      The worker edits and stages everything; the router gives the owner the
      one command; nothing of it is committed by an agent. .keel/config.toml is
      not changed: no cap line lands in W6.
  caps:
    decided: >-
      No [docs.caps] line for either page in W6: the check counts the whole
      page, GitHub parts included, so a cap line now would be red. E-GHREVERT
      adds "docs/architecture.html" = 3000 and "docs/install.html" = 1500 when it
      removes the GitHub parts (a follow-up of W6's result, taken by
      E-GHREVERT, backlog local-app A1). The config comment "the architecture
      and install caps wait for W6" is left for E-GHREVERT to update with them.
  not-in-w6: >-
    docs/local-app.html (2,901 words) has no cap in W1's table and is
    E-LOCALTOOL's design; it stays as it is. The GitHub parts. Any code.
