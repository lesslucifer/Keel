        The review's nits: `DIAG keys=` prints the response's key names unfiltered (`scripts/router-gh.sh` line 435,
        in `diag_mint`); the mint loop's bad-token cases hold no tab and no DEL byte; the diagnostic lacks shape and
        size cases (its `token-shape` and `token-length` lines are untested for an odd shape or an oversize token). The
