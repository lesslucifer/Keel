artifact: wu-plan
status: ready
id: E-APPLIST.W5
epic: E-APPLIST
title: "E-APPLIST.W5 · The Reader, the Watcher and the Alerter"
date: "2026-11-22"
page: 2026-11-22-e-applist-w5-plan.html
requirement: >-
  For the one listed project, the app's main part keeps one view of what git and the router say - the local branches
  and their tips, which tips carry a sign-off, review or gate note, what each epic, work unit and main has merged,
  main against its upstream, the worktrees; and the router's values folded from .router/app/ by the log's rules, with
  their defaults and a "router not heard" flag after 15 minutes with no line - re-reads it within about a second of a
  change (and once a minute anyway), pushes waiting.changed to the window, shows one macOS alert per alert line,
  never the same line twice across an app restart, and opens the window on that alert's work unit when the alert or
  a keel://wu/<id> link is clicked; it writes only in the app's own folder and runs no command that writes.
maps-to: >-
  Epic E-APPLIST, its W5 summary (wu-maps-to: local-app.html 'Two sources', 'The shape'; UC-APP-1, new; K12). UC-APP-1
  (something waits on you, and the app alerts you at your desk), its app side; K12's app side (the keel:// link
  opens the item); local-app.html 'The stack' rows Reader, Watcher and Alerter, 'Locked-down git', 'Two sources'
  (Applying a line, Refetch, Defaults). Carries W7's follow-up (which app owns keel:), W8's (a fake handler and
  fixture per new contract name), W1's N5 and W3's (the link handler refuses every form but keel://wu/<id>).
expected:
  - "A line written by the real scripts/router-app.sh is in the view, and waiting.changed reaches the window, within about a second; an app restart rebuilds the same view from git and state.json."
  - "A router restart (start) drops every router value: each field shows its default and the view says which values are defaults; a missing number makes the app read state.json once; a half-written line waits for its end; a line with an unknown key is skipped."
  - "15 minutes after the newest line's time (three watchdog ticks), the view says the router is not heard; the next line clears it."
  - "A commit on a branch, a git notes add, a merge or a new worktree in the project is in the view within about a second of the change, or at the next minute's re-read if the file watch missed it."
  - "Each alert line shows one macOS alert, recorded in the app's folder by run and number; an app restart or a re-read never shows it again; a click opens the window with that work unit in the view's focus."
  - "keel://wu/E-APPLIST.W2 opens the window on that work unit; any other keel:// form (keel://../.., an unknown kind, a malformed id) is refused and opens nothing; only the packaged app claims the scheme, and the view says which app owns it."
  - "The fake bridge answers waiting.get and lists waiting.changed (W8's coverage test); the contract snapshot names the new request and event. No step builds or packages the app."
test-plan:
  unit: >-
    node --test (app/test/unit/*.test.ts), each a top-level test( so keel check runs it and keel's ts adapter counts
    it, red first, the red run noted in the result. The apply step: a generated-input property test (seeded, as
    test/support/seeded.ts) - any sequence of contract lines, applied with lines dropped, duplicated or cut, then the
    state read on each gap, folds to the same values as state.json folded by router-app.sh's rules; a new run drops
    every value; a seen number is skipped; an unknown key, a line that is not one JSON object, a run or n of the wrong
    type are skipped; the defaults (no run, no stage, no workers). The heard rule against an injected clock (14:59 heard,
    15:00 not; an unparseable at falls back to the file's time). The line splitter (only whole lines; a trailing half
    line kept for the next read; a log shorter than the offset or a new file read from its start). The git parsers
    (for-each-ref with upstream and track, notes list, worktree list --porcelain, each on fabricated output, odd bytes
    blanked). The new fixed commands (their lines start with the locked flags; each slot checked; a ref slot refuses a
    name outside keel's naming). The debounce and minute re-read with injected timers. The alert record (shown by run
    and n; a new run starts afresh; a broken file renamed aside, as store.ts). The link parse (property: only
    keel://wu/E-<CODE>.W<m> passes; every other generated string, .. and %2e%2e included, is refused). The scheme
    owner text. The unpackaged-only seams refused when packaged.
  integration: >-
    node --test (app/test/integration/*.test.ts), red first, hermetic: a temp git repo set up as a keel project (main,
    an epic, a WU and a task branch, a worktree, notes), a temp app folder, and the update log written by the real
    scripts/router-app.sh (sh and jq, as the Rust suite needs them); no Electron, the shell's parts faked as W7's
    handlers tests do. (1) The view: start, stage, set worker, alert and del lines appear; waiting.get through the real
    dispatcher returns them with every string through plain(). (2) An app restart (a new reader on the same folders)
    gives the same view and shows no second alert. (3) A router restart (start) gives every router field its default.
    (4) A gap (a line removed from a copy of the log) reads state.json once; a half line appended in two writes is
    applied once, after its end; an unknown-key line is skipped. (5) Silence past 15 minutes on the injected clock
    sets not heard, a new line clears it. (6) The watcher on real fs.watch: a commit, a notes add, a merge and a new
    worktree each push waiting.changed once within the debounce (a bounded wait on the push, never a sleep); with the
    watch off, the minute's re-read finds them. (7) An alert line reaches the alert sink once; its click sets the focus
    and pushes waiting.changed; a keel://wu/<id> link does the same; a refused link pushes nothing. (8) The contract
    snapshot (test/integration/bridge.test.ts) names waiting.get and waiting.changed. The window side, by hand on
    Vitest (DEC-73), recorded in the result: fake.test.ts green with the new handler and fixtures. Recorded in the
    result: the commands, the counts, the red-first runs.
  e2e: >-
    none: a WU's level is integration; the epic test (Playwright on the unpackaged app, DEC-75) is W9's and drives a
    router line to the screen through this WU's seams (details.seams-for-w9). What no test reaches here - the real
    macOS alert and its click, Launch Services' owner of keel: - is the owner's live check (details.live-checks) on
    npm start, with no build; the link on the signed build is W9's.
details:
  base: "wu/E-APPLIST/w5-reader-watcher off epic/E-APPLIST at 7a5d00a (W1, W2, W3, W7 and W8 merged)"
  inner-loop: >-
    The owner: "we shouldn't build it all the times just for testing". W5 never runs npm run package or make. Its loop
    is npm run test:main (node --test from source, seconds; keel check runs the same), npm run typecheck, npm run
    test:window and npm run lint only when src/window/fake changes, and npm start (electron-forge start, unpackaged)
    only for the live check. Electron stays out of every test: src/main/index.ts keeps only wiring, every rule lives
    in a pure module with its parts injected (clock, timers, file watch, alert sink, git runner).
  layout:
    new:
      - "app/src/main/reader/log.ts: the line splitter, the apply step, the defaults, the heard rule; reads .router/app/log.jsonl and state.json of the project's main checkout, never writes there"
      - "app/src/main/reader/git.ts: the git facts from the new fixed commands, and their parsers"
      - "app/src/main/reader/view.ts: the view (git facts + router values + heard + alerts + focus + scheme owner), rebuilt on each read"
      - "app/src/main/watcher/watch.ts: fs.watch on the git common dir's refs, packed-refs, notes and worktrees and on .router/app/, a 1 s debounce, a 60 s re-read, the push"
      - "app/src/main/alerter/alerts.ts: one alert per unseen alert line, the shown record (alerts.json in the app's folder, by run and n), the click"
      - "app/src/main/alerter/link.ts: parse keel:// (only keel://wu/<id>), and the scheme owner's text"
    changed:
      - "app/src/shared/contract.ts: request waiting.get (no slots), push event waiting.changed, the View types"
      - "app/src/main/commands.ts: the read commands below"
      - "app/src/main/handlers.ts: waiting.get; Parts gains the reader's handle"
      - "app/src/main/index.ts: wiring only - start the reader and watcher on the listed project, Notification as the alert sink, open-url and second-instance for keel://, setAsDefaultProtocolClient('keel') only when packaged, getApplicationNameForProtocol for the owner"
      - "app/src/window/fake/fake.ts and fixtures.ts: waiting.get's handler and view fixtures (no-run, live, not-heard, defaults-after-restart, focus)"
      - "app/test/integration/bridge.test.ts: the snapshot"
  git-commands:
    rule: "Each a named shape in COMMANDS with typed slots, the locked flags first, no shell, the login PATH, no GIT_*; reads only, no fetch."
    add:
      - "refs: -C <project> for-each-ref --format=%(refname)%00%(objectname)%00%(upstream)%00%(upstream:track) refs/heads/"
      - "notes-list: -C <project> notes --ref=<kind> list, kind one of mr, cr, dod"
      - "merged: -C <project> for-each-ref --merged=<ref> --format=%(refname) refs/heads/, ref one of main, an epic/* or a wu/* branch the refs read just listed (keel's naming, git check-ref-format)"
      - "worktrees: -C <project> worktree list --porcelain"
    not: "No note bodies (W6 reads one if an item needs it), no diff, no log -p, no fetch."
  view:
    request: "waiting.get, no arguments, returns View"
    fields: >-
      project (id, name) or none; git: branches (name, tip, upstream, ahead/behind), notes (which tips carry mr, cr,
      dod), merged (per target: the branches it holds), worktrees (path, branch, tip); router: run or none, values by
      key (stages, questions, workers, router, the other keys kept as they came), defaulted (true until the run's state
      is read), heard (true/false) and last line's time; alerts (the state's last 20, each with shown); focus (a work
      unit id and a sequence number, or none); scheme (which app owns keel:, or unknown). W6 adds the items.
    push: "waiting.changed, no payload: the window calls waiting.get again (as state.changed)"
  apply-rules: >-
    local-app.html 'Applying a line', as built by W1: on start read git, then state.json once, then follow log.jsonl by
    whole lines from the end of what the state holds. A new run: drop every router value, read the state. The next
    number: apply it. A number seen: skip. A missing number: read the state once. A half line or an unknown key: skip.
    A log shorter than the offset, or a new file (W1 replaces it by a rename past 2,000 lines, and at start): read from
    its start. Heard: the newest line's at (or the state's at) is under 15 minutes old on the app's clock; an
    unparseable at counts as the file's modified time.
  alerts:
    rule: "One macOS alert per alert line not recorded as shown; recorded before it is shown (a crash never shows it twice); the record is alerts.json in the app's folder, written atomically by store.ts, keyed by run and n, kept to the state's 20."
    at-start: "Open point 1: unseen lines written while the app was closed make one summary alert, each recorded shown."
    text: "Title Keel, body the headline and the lines, every string through plain(); a line naming a work unit sets the focus on click; one without opens the window."
  link:
    rule: >-
      keel://wu/E-<CODE>.W<m> only (the wu grammar of router-app.sh); everything else refused with no window change
      (W1's N5, W3's follow-up). The app claims keel only when packaged (setAsDefaultProtocolClient), so a dev run never
      makes Electron.app the handler. The view carries app.getApplicationNameForProtocol('keel://') so the owner sees
      which app owns it (W7's follow-up); the packaged check is W9's.
  seams-for-w9:
    - "An alert sink that appends each alert as one JSON line to a file named by KEEL_APP_ALERT_SINK, read only when the app is not packaged; packaged, the variable is ignored (a unit test)."
    - "KEEL_APP_SILENCE_MS shortens the 15 minutes, read only when not packaged (a unit test)."
  live-checks:
    by: "the owner on his Mac, about five minutes, after the result is committed and before the sign-off; npm start only, no package or make"
    steps:
      - "1. cd app && npm ci && npm start, with this repo as the listed project and the router's log started."
      - "2. In a terminal at the project: scripts/router-app.sh alert '{\"headline\":\"W5 live check\",\"lines\":[\"one alert\"],\"wu\":\"E-APPLIST.W5\"}' - one macOS alert shows (named Electron, unpackaged)."
      - "3. Click it: the window opens. Quit and npm start again: no second alert."
      - "4. Make a commit on a scratch branch: the app reads it (the log shows the push; W6 draws it)."
    worker-tries-first: "The worker runs npm start in its sandbox first; a refused Electron launch goes to the router with the exact command, and the owner's run stands as the check."
  leaves-to:
    E-APPLIST.W6: "The items (which kinds enter and leave, from the view's facts), screens 1 and 2 on the view, the window following focus, Open, Mark sent, screen 6's counts and last change, the Telegram link test."
    E-APPLIST.W9: "The Playwright epic test through seams-for-w9; the alert, its click and keel:// on the signed build; the scheme owner seen there; the apply rules and the link scheme into docs/local-app.html."
  commit-order:
    - "1. docs: this plan pair, and the W8 lint follow-up in docs/backlog/local-app.yaml row A3."
    - "2. feat: the contract - waiting.get, waiting.changed, the View types, the snapshot; the fake's handler and fixtures; waiting.get answering an empty view (red first: the snapshot, fake.test.ts by hand)."
    - "3. feat: the log reader - splitter, apply step, defaults, heard (red first: the property test, then integration on router-app.sh)."
    - "4. feat: the git reader - the four commands, parsers, the git facts (red first: units, then the temp repo)."
    - "5. feat: the watcher - file watch, debounce, minute re-read, the push (red first: injected timers, then real fs.watch)."
    - "6. feat: the alerter and the link - the shown record, the sink, the focus, keel:// parse, the scheme owner, the W9 seams (red first)."
    - "7. feat: the shell's wiring in index.ts (no test: Electron; the live check)."
    - "8. docs: the W5 result pair - the runs, the live check."
  sandbox:
    - "node --test and fs.watch run in-process: no port. npm start launches Electron and may be refused: report it."
    - "No new npm package is planned; if one is needed, per call through registry.npmjs.org with npm_config_cache under $TMPDIR."
  follow-ups-carried:
    - "W7: W5's link handling checks which app owns keel: - the view's scheme field; seen live at W9."
    - "W8: each new contract name gets a fake handler and fixture - commit 2."
    - "W1 N5 and W3: the link handler refuses every form but keel://wu/<id> - details.link."
    - "W3: a retried send writes a second alert line - open point 3, default not folded."
    - "W8 review cap (cr note on 796fb29): the lint helper follow-up is recorded in docs/backlog/local-app.yaml row A3, not scheduled in W5 (open point 4)."
  open-points:
    - "1. Alerts written while the app was closed? One summary alert ('3 alerts while Keel was closed'), its click opening the window; each line recorded shown. Options: (a) one summary, recommended: no burst of twenty; (b) each line its own alert; (c) none, the list shows them."
    - "2. Run records and the inbox listing (the epic's W5 summary names them)? Not read in W5: no item kind in this epic uses them; the fleet and worker screens (A5) do. Options: (a) leave to A5, recommended; (b) read them now as a listing nobody shows."
    - "3. Fold two equal alert lines (a retried Telegram send writes the alert twice)? No: one alert per line, as the epic's expected says. Options: (a) no fold, recommended; (b) fold equal headline, lines and work unit within 10 minutes."
    - "4. The W8 lint follow-up: in W5? No: W5 writes no window markup, only the fake's data; it goes to the backlog row A3. W6 is the first WU to write screens and may take it if the helper refuses its honest code. Options: (a) backlog row A3, W6 may take it, recommended; (b) a commit in W5; (c) W9."
    - "5. Does a dev run claim keel://? No: only the packaged app registers it, so Electron.app never becomes the handler on your Mac."
    - "6. 'Router not heard' counts from the newest line's own time, 15 minutes, any line (the watchdog writes a heartbeat each tick)."
  sources:
    - "docs/work/2026-11-20-e-applist-plan.yaml (W5's summary, the files row, the e2e-plan's seams)"
    - "docs/local-app.html ('The stack: Electron', 'Two sources', 'The hand-off')"
    - "docs/decisions/app.html (DEC-71 - DEC-77)"
    - "docs/work/2026-11-20-e-applist-w1-result.yaml (the line, N5), -w2-result.yaml (worker values, heartbeat), -w3-result.yaml (alert and question lines, keel://wu/<id>), -w7-result.yaml (contract, commands, the scheme follow-up), 2026-11-22-e-applist-w8-result.yaml (the fake's coverage follow-up)"
    - "scripts/router-app.sh, scripts/router-worker.sh (app_lines), scripts/notify-owner.py (question_value, alert_value)"
    - "git log -1 --notes=cr --format=%N 796fb29 (W8's round-5 findings)"
  htmldoc:
    id: 6b02ade99f34851f0dfb2ba7
