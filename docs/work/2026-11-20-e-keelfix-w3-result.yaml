outcome: >-
  Delivered. keel knows three signer tiers (email, username, key). parse_roster refuses a line of any other tier
  by its line number, before the policy filter, so every reader of a committed or working roster refuses the
  `github: <user id> <login>` line: keel mr setup, commit, confirm, the commit-msg hook and check 8. `[mr] tiers`
  naming github is refused as "unknown mr tier 'github'" (validate reads KNOWN_TIERS). GITHUB, signs_tier,
  signs, valid_login, valid_user_id, github_only and typed_refusal are gone; unlisted stays. A known tier the
  policy leaves out still authorises nothing. An old github-tier sign-off is red at check 8 with "does not
  list". cargo test is green: 152 unit, 367 suite, 10 ignored.
deviations:
  - >-
    The plan's expected "git grep -n -i github -- src/ is empty" does not hold to the letter, and could not: the
    plan's own untouched list keeps src/main.rs's and src/init.rs's github.com install URLs, and its test plan puts
    the github line and the "github" tier into the new unit tests (src/mr.rs tests module, src/main.rs's
    validate test). What holds: no non-test code in src/ names the github tier; the remaining hits are the
    install URLs and the tests that refuse the tier.
  - >-
    The plan says the three new integration tests are red on the old code. Two are (the roster test and the
    policy test). an_old_sign_off_under_the_github_tier_is_red_at_check_8 is green on the old code too: on a clean
    roster (no github line) the old check 8 already said "does not list"; "github tier only" came only when the
    roster listed the id under github, which W3 now refuses outright. The test stays as a guard on the new
    wording.
  - >-
    tests/suite/ghrevert_e2e.rs: the two github refusals are dropped as planned; the "nothing written" assert
    that followed the WU's refusal is kept, unchanged (the plan says "the rest unchanged"). It now checks that
    no mr note exists before the typed sign-off.
  - >-
    The unknown-tier refusal is caught by the unit layer only. Mutant 1 (the KNOWN_TIERS check in parse_roster
    removed) is red on the unit a_roster_line_of_a_tier_keel_does_not_know_is_refused_with_its_line_number and
    green on the suite: the plan's two-field `github: 5499546 lesslucifer` line still fails the identity-tier
    shape check without it. The one-field `github: 5499546` and `usrname: vu` lines, which only that check
    refuses, are in the unit test. Levels compose; noted, not changed.
  - >-
    The page's example comes from the integration-test run, not a by-hand run: a by-hand keel mr demo in a
    scratch repo was denied by the sandbox (the brief forbids keel mr), and not routed around.
