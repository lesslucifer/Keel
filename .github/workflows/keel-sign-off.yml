# The sign-off writer (E-GHFLOW2.W3): an approval of a pull request by a signer the base's roster
# lists under the github tier, on its head commit, becomes the mr/v1 note. It runs on workflow_run,
# which GitHub takes from the default branch, so no pull request can change it. It trusts nothing from
# the run that started it: scripts/ci-sign-off.sh re-reads the pull request and its reviews from the
# API and builds keel from main, this checkout; the base and the head are git data only, never
# built or checked out (the token can write). One group per head commit: a later review of another
# commit never cancels or waits on this one. Event values reach the script only through env.
name: Keel sign-off

on:
  workflow_run:
    workflows:
      - Keel sign-off request
    types:
      - completed

permissions:
  contents: write
  statuses: write
  pull-requests: read

concurrency:
  group: keel-sign-off-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  sign-off:
    if: github.event.workflow_run.event == 'pull_request_review'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      - run: scripts/ci-sign-off.sh
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_EVENT: ${{ github.event.workflow_run.event }}
