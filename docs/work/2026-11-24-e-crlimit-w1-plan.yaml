artifact: wu-plan
status: ready
id: E-CRLIMIT.W1
epic: E-CRLIMIT
title: "E-CRLIMIT.W1 · The review schedule, set by three settings"
date: "2026-11-24"
page: 2026-11-24-e-crlimit-w1-plan.html
requirement: >-
  keel preflight, keel notes write cr and the sign-off's review history run the code-review schedule that the
  target's committed .keel/config.toml [review] sets - max_rounds, whole_range_rounds, fix_importants_from - and
  nothing else: round n is followed by round n+1 exactly when n < max_rounds and (n < fix_importants_from or round
  n found a blocker); a round n > whole_range_rounds reviews only the change since round n-1; a blocker in round
  max_rounds ends in the cap's waiver 'review cap: <max_rounds> rounds, <b> blockers open'; a set key that is not a
  whole number of 1 or more fitting u32, an explicit whole_range_rounds or fix_importants_from above max_rounds, or
  an unknown [review] key is refused (red 0·review-cap at preflight, refused by the cr writer, refused staged by the
  pre-commit hook and keel mr commit); a key left out takes its default value, lowered to max_rounds when above it.
maps-to: >-
  Epic E-CRLIMIT, W1 of its plan (wu-summaries E-CRLIMIT.W1); the owner's rulings of 2026-11-24 (the schedule is
  the project's [review] settings, not constants); UC-REV-3 and UC-GATE-1 amended; DEC-50 amended in place.
expected:
  - "For any schedule (max_rounds, whole_range_rounds, fix_importants_from) the target commits, preflight announces 'review round n of <max_rounds>', scoped to the whole range while n <= whole_range_rounds and to the last fix after it, and the writer records the same round and scope."
  - "After a round n that found a blocker, round n+1 runs while n < max_rounds; after round max_rounds the writer says the cap is reached and the cap's waiver reads 'review cap: <max_rounds> rounds, <b> blockers open'; no round max_rounds+1 runs."
  - "After a round n that found only importants: round n+1 runs while n < fix_importants_from; from fix_importants_from on, preflight is red 0·review-cap naming why, the writer refuses the round, and a fix-PASS answering round n is written and the merge check reads it as a PASS."
  - "The branch's own settings never apply; a target that sets no key gets the default values; the sign-off history tags each round by the target's settings."
  - "Each bad value (0, -1, a string, a float, a too-large integer, a key above max_rounds, a misspelt key) is refused naming its key: at preflight, by the writer, and staged by the pre-commit hook and keel mr commit. A bad schedule already on the target blocks the review, never the sign-off."
  - "Rounds recorded under another schedule stay valid and are counted on the target's current settings."
test-plan:
  unit: >-
    src/review.rs: every expectation computed from the Policy over six schedules, the default values among them
    (next_round, then, fixable, fix_pass, cap, next_step, tags); the reader's refusals and the lowering of a default
    above a set cap, for each schedule; an exhaustive check over 1..6 x 1..7 x 1..7 that a schedule is accepted
    exactly when its keys fit the cap and that no round breaks it. src/main.rs: the staged check refuses a bad
    schedule.
  integration: >-
    tests/suite/verify_dod.rs: each behaviour test runs four schedules - the default values (no key) and three the
    target sets (5/2/4, 2/1/2, 4/3/3) - with expectations computed from the schedule: rounds to the cap with
    blockers (scope, cap waiver, history tags, no round past the cap, the branch's own settings ignored); rounds
    with importants to fix_importants_from (no further round, fix-PASS, second fix refused); the fix lines, the
    code-fix rule, back-merge scope and old-schedule notes. Bad values on the target and staged; max_rounds alone.
  e2e: >-
    tests/suite/review.rs, through the real hooks: a WU with importants and a WU with blockers on the default
    values, a bad staged [review] refused, then the same two WUs on a schedule the epic commits (4/2/3), expectations
    computed from each schedule, and the epic merged into main.
details:
  default-values: "max_rounds 3, whole_range_rounds 1, fix_importants_from 2: review::Policy::DEFAULT, the only place in the code; tests name them once (DEFAULTS)."
  design:
    policy: "review::Policy read by review::policy from the target's committed config; review::policy_in is the one rule, shared with main::staged_config_refusal."
    callers: "Schedule::read carries the Policy; next_round, then, fixable, fix_pass, cap, next_step and tags take it; gate.rs preflight and notes.rs write_cr use Schedule; mr.rs review_history reads the target's Policy and falls back to the default values, with a line, when it is refused."
  files: [src/review.rs, src/main.rs, src/mr.rs, src/notes.rs, src/gate.rs, tests/suite/verify_dod.rs, tests/suite/review.rs, tests/suite/mr.rs, docs/use-cases/workflow.yaml, docs/decisions/review-docs.html, docs/decisions/decisions-index.yaml, docs/use-cases/use-cases-index.yaml]
  not-touched: "No rule-bearing file: skills/, .claude/, templates/, .keel/, AGENTS.md, docs/*.html are W2's."
  own-review: "The installed keel still runs the old schedule; this WU's review follows the settings' default values by hand."
