artifact: epic-plan
status: ready
id: E-CRLIMIT
title: "E-CRLIMIT · A code review stops after 3 rounds"
date: "2026-11-24"
page: 2026-11-24-e-crlimit-plan.html
intent: >-
  The owner's ruling of 2026-11-24 lowers the code-review round limit. Today (E-CRCAP, DEC-50, UC-REV-3) a review
  may run 5 rounds: rounds 1-2 read the whole range, rounds 3-5 only the last fix, importants earn a new round up to
  round 3, and only a blocker earns round 5. After this epic: round 1 reads the whole range; round 2 reads only the
  fix of round 1's findings; round 3 runs only when round 2 found a blocker, and nothing else earns it; the cap is 3,
  and a blocker still open in round 3 ends in the cap's waiver, which the owner accepts or not at sign-off, as today.
  The owner's standing table stays: a nit (low) is a follow-up or fixed under a fix-PASS; an important (medium) gets
  a fix round inside this schedule. Now, because the 5-round schedule costs two whole-range rounds on every WU that
  fails once, and the owner ruled.
owner-changes:
  - {when: "Round 1 fails", today: "Round 2 reads the whole work again", after: "Round 2 reads only the fix"}
  - {when: "Round 2 finds only medium findings", today: "Rounds 3 and 4 may follow", after: "No round 3: they are fixed and recorded, and the review is done"}
  - {when: "Round 2 finds a blocker", today: "Round 3 reads only the fix", after: "The same: round 3 reads only the fix"}
  - {when: "A blocker is still open", today: "At round 5, the review stops and you decide at sign-off", after: "At round 3, the same"}
  - {when: "Reviews the router runs on non-code files", today: "Follow the same 5 rounds by hand", after: "Follow the same 3 rounds"}
use-cases:
  - "UC-REV-3, amended: the 3-round schedule - round 1 the whole range, round 2 the last fix, round 3 only after a round-2 blocker, cap 3 (W1)"
  - "UC-REV-2 and UC-REV-1 unchanged: the cap's waiver and the nit cases keep their rules; only the round numbers they name move (W1, W2)"
expected:
  - "keel preflight on a WU with no earlier review prints 'review round 1 of 3 - scope: the whole range'."
  - "After a round-1 FAIL, preflight prints 'review round 2 of 3 - scope: the last fix, <round-1 commit>..<tip>'."
  - "After a round 2 with importants and no blocker, preflight is red 0·review-cap ('review round 3 runs only after round 2 found a blocker'), keel notes write cr refuses a round-3 verdict, and a fix-PASS answering round 2 is accepted and merges."
  - "After a round-2 blocker, round 3 runs on the last fix; a round-3 blocker prints 'review cap reached', the cap's waiver reads 'review cap: 3 rounds, <b> blockers open', and the owner's --accept-waiver signs it."
  - "A target whose committed config sets [review] max_rounds still moves the cap; from round 2 only a blocker earns another round, whatever the cap."
  - "cr notes written under the 5-round schedule still pass checks 3-5 and the walk; no note is rewritten."
  - "The epic test (tests/suite/review.rs) passes through the real hooks of a repo keel init set up."
non-goals:
  - "What reviewers look for (the rubric), the finders, the verifiers and the severities."
  - "The fix-PASS, the waivers and the sign-off: their rules stay, only the rounds they name move."
  - "A change to cr/v1's fields, a schedule version on notes, or a migration of old notes."
  - "Making the round-2 scope or the blocker-only rule configurable: only [review] max_rounds moves, as today."
  - "Re-signing or re-reviewing anything already merged."
wu-summaries:
  - wu: E-CRLIMIT.W1
    wu-summary: >-
      The tool's 3-round schedule. src/review.rs: DEFAULT_MAX_ROUNDS 5 -> 3, WHOLE_RANGE_ROUNDS 2 -> 1 (round 2 is
      'since <round-1 commit>'), FIX_IMPORTANTS_FROM 4 -> 2 (from round 2 importants with no blocker are fixed under
      a fix-PASS and only a blocker earns another round); the doc comments and fix lines that name rounds 3, 4 and 5
      reworded to the constants. Preflight's 0·review-cap and the cr writer already share review::Schedule, so both
      refuse round 3 after a round 2 with no blocker with no new code path. The unit tests in src/review.rs, the
      schedule tests in tests/suite/verify_dod.rs, and the epic e2e tests/suite/review.rs move to the 3-round table.
      Distilled in the same WU: UC-REV-3 (docs/use-cases/workflow.yaml), DEC-50 amended in place
      (docs/decisions/review-docs.html), the decision and use-case indexes' scope lines. No rule-bearing file.
    wu-maps-to: "The owner's ruling of 2026-11-24; UC-REV-3 (amended); DEC-50 (amended)."
    wu-expected: >-
      Integration (tests/suite/verify_dod.rs, red first): round 2 announces 'the last fix, <round-1>..<tip>' and its
      note records scope 'since <round-1>'; after a round 2 with importants only, preflight is red 0·review-cap
      naming round 3 and the round-2 blocker rule, the writer refuses --verdict FAIL, and --verdict PASS --fixes
      <round-2> is written and passes verify-dod; after a round-2 blocker round 3 runs, and its blocker ends in
      'review cap: 3 rounds, 1 blockers open'; a target with max_rounds = 5 announces 'of 5' and still refuses round 3
      after a round 2 with no blocker; a branch carrying three 5-schedule rounds gets no round 4 and its fix line
      names the owner's waiver. Unit (src/review.rs): next_round, then, fixable, fix_pass, cap, next_step and tags on
      the new table; the default cap is 3. E2E: tests/suite/review.rs (the epic e2e, below).
    wu-deps: none
  - wu: E-CRLIMIT.W2
    wu-summary: >-
      The rules say 3 rounds. Rule-bearing text only, no code path: skills/keel-code-review/SKILL.md (section 1 'from
      round 2 the round reviews only the last fix', section 2's 0·review-cap and announce lines, section 3's scope
      line, section 5's schedule table and the max_rounds, fix-PASS and cap paragraphs), skills/keel-workflow/SKILL.md
      (the cr/v1 row and the 0·review-cap row), skills/keel-router/SKILL.md (the independent-review table and its
      '5-round' sentence), skills/keel-router/references/messages.md (the independent-review prompt's 'Round <n> of at
      most 5' and its scope line), skills/keel-router/references/brief-skeleton.md (the review-worker and
      review-fix-round rows), the same files under .claude/skills/, templates/config.toml (the max_rounds comment), and
      docs/architecture.html (the max_rounds default). Each commit stages only rule-bearing files and is the owner's
      keel mr commit, then a fresh worker re-gates the new tip (project-router 'WU with a rule-bearing file'). An
      independent read-only review on opus at high effort reads the text against W1's tool before the sign-off.
    wu-maps-to: "The owner's ruling of 2026-11-24; the keel-code-review, keel-workflow and keel-router skills; UC-REV-3 as W1 amends it."
    wu-expected: >-
      Integration: waived - the WU changes no code path (exempt, never from the sign-off). Unit: waived, same reason.
      Checked by: git grep finds no '5-round', 'rounds 3-5', 'round 5', 'from round 3' or 'default 5' left in the
      shipped skills, their .claude copies, templates/ or docs/architecture.html; skills/ and .claude/skills/ match
      (diff -r, project-router aside); the independent review passes; keel check stays green (skills are embedded by
      include_str!).
    wu-deps: [E-CRLIMIT.W1]
e2e-plan: >-
  tests/suite/review.rs becomes this epic's e2e (it is E-CRCAP's today, on the 5-round table; W1 changes it, so the
  epic's test note names it). A scratch repo keel init set up, its real hooks, no network: WU A - round 1 finds only
  nits, a fix-PASS answers them, the WU merges. WU B - round 1 fails with a blocker; round 2 reads only the fix and
  finds importants with no blocker; preflight refuses round 3 and the writer refuses its verdict; a fix-PASS answers
  round 2 and the WU merges. WU C - round 1 and round 2 fail with blockers; round 3 reads only the last fix and
  fails with a blocker; the cap's waiver 'review cap: 3 rounds, 1 blockers open' is written; sign-off without
  --accept-waiver is refused, with it the WU merges. The epic: its own round 1, the walk shows WU C waived, and it
  merges into main. No waiver of the e2e layer.
distillation-plan:
  - "docs/use-cases/workflow.yaml: UC-REV-3 amended to the 3-round table (W1); UC-REV-2 names no round number and stays."
  - "docs/decisions/review-docs.html: DEC-50 amended in place - its title, choice and why name 3 rounds, with the owner's ruling of 2026-11-24 as the amendment's reason (W1)."
  - "docs/decisions/decisions-index.yaml and docs/use-cases/use-cases-index.yaml: the '5-round schedule' scope lines and DEC-50's title (W1)."
  - "T1, rule-bearing: docs/architecture.html's max_rounds default (W2); the skills are T0-like shipped rules, edited in W2, not distilled."
  - "At the epic close: the plan and result pairs archived to docs/.archive/ with keel notes write doc --distill naming the docs above."
open-questions:
  - "What happens to medium findings in round 2? They are fixed and recorded with a fix-PASS, and the review is done. Your ruling gives round 3 to a blocker only; a fix-PASS is today's way to fix without a round."
  - "Does [review] max_rounds stay? Yes, default 3. A project may move the cap, but from round 2 only a blocker earns another round whatever the cap: the ruling's shape holds everywhere."
  - "Do the router's reviews of non-code files (skills, scripts) follow the same 3 rounds? Yes. Today they mirror the 5-round table by hand; one schedule is easier to follow."
  - "Do notes written under the 5-round schedule stay valid? Yes. The merge check reads the verdict and the code binding, never the round; a branch in review when the new keel lands counts its rounds on the new table, and its old round-2 note shows 'the note records full' in the sign-off history, which is true."
  - "How do this epic's own reviews count rounds? On the new table, by hand, until you reinstall keel from main: the installed keel allows 5, so 3 by hand stays inside it. A round-3 blocker then goes to your --waive-review, since the installed keel writes the cap's waiver only at round 5."
  - "Is DEC-50 replaced or amended? Amended in place: it holds the fix-PASS and back-merge rules too, which stay; a new record would split one decision in two."
  - "A round 2 that fails with nothing counted (keel check red): what follows? Your waiver at sign-off, as from round 4 today: no round 3 without a blocker, and a fix-PASS answers only counted findings. Preflight already refuses a red keel check, so this is rare."
details:
  ruling: >-
    Owner ruling 2026-11-24 (router keel-1c's brief e-crlimit-plan): round 1 the full range; round 2 the last changes
    only (the fix of round 1's findings); round 3 only if round 2 found a blocker, no other finding earns it; cap 3; at
    the cap a still-open finding is waived and the owner decides at sign-off. Standing table: low -> follow-up; medium
    -> a fix round inside this schedule.
  new-table: |
    round | reviews        | only nits                     | importants, no blocker       | a blocker
    1     | the whole range| PASS; nits under a fix-PASS   | fix, round 2                 | fix, round 2
    2     | the last fix   | same                          | fix under a fix-PASS, done   | fix, round 3
    3 cap | the last fix   | same                          | fix under a fix-PASS, done   | the cap's WAIVED; the owner decides
  gate-check: >-
    The rule 'round 3 only after a round-2 blocker' is review::round_follows(note, round, max) = round < max && (round
    < FIX_IMPORTANTS_FROM || note.blockers > 0); with FIX_IMPORTANTS_FROM = 2 it is false after a round 2 with no
    blocker. review::next_round turns that into the 0·review-cap failure of keel preflight (src/gate.rs preflight,
    'review round 3 runs only after round 2 found a blocker, and round 2 on <c> found none', fix line: the fix-PASS
    --fixes <round-2 commit>, or the owner's waiver when nothing was counted), and keel notes write cr refuses the
    same round through the same review::Schedule (src/notes.rs). verify-dod does not count rounds, as since DEC-50
    (checks 3-5 read verdict, base and code_diff_hash; a fix-PASS reads as PASS); a hand-written round-3 note is a
    bypass the sign-off history shows (round tags). W1's tests pin preflight, the writer and the fix line.
  old-notes: >-
    Valid as written. cr/v1 is unchanged; round and scope are stamped facts the gate does not read. Merged branches
    are never re-scheduled (the walk re-runs checks 1-7, none of which reads round or scope). A branch in review when
    the new keel lands counts its rounds from its notes on the new table: 3 or more recorded rounds mean no new round
    (a fix-PASS where allowed, else the owner's waiver), and review::tags marks an old round-2 'full' note with 'the
    note records full'. A cap waiver written as 'review cap: 5 rounds, ...' stays as signed: waiver_hash covers the
    note's own reason, never a recomputed one.
