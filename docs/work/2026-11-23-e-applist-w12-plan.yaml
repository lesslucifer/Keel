artifact: wu-plan
status: ready
id: E-APPLIST.W12
epic: E-APPLIST
title: "E-APPLIST.W12 · Fix the epic review's round-1 findings"
date: "2026-11-23"
page: 2026-11-23-e-applist-w12-plan.html
requirement: >-
  Each of the ten findings of the E-APPLIST epic review, round 1 (cr note on 7d8d346: 3 blockers, 7
  importants), is fixed in the app and pinned by a test that fails without its fix: Open works with a
  git 2.15-2.44 on a project that is no partial clone; item.mark holds the handlers' queue only for its
  write, never for the watcher's read; two loads of one app-folder file never race (one at a time per
  file, a vanished file read as missing); each branch, id and router-key grammar has one source; the
  app reads a data file's roles as keel verify-doc does, on one shared case table; the sort order is
  tied to the contract's kinds; and an unchanged notes ref or unchanged heads cost no note-of or
  --merged run.
maps-to: >-
  Epic E-APPLIST, the epic review's fix round (keel-code-review §5), after W11 closed the epic. No use
  case changes; local-app.html's queue rule ("nothing slow holds that queue") and its Open rule are
  restored where the code broke them. The 8 refuted items and the W5/W8 owner waivers are not reopened.
expected:
  - "B1: with a git that refuses --no-lazy-fetch (exit 129), Open copies and opens a plan or result of a project with no promisor setting, after one config read, as the git reader does."
  - "B2: while the watcher's read after a mark hangs, state.get, settings.reset and projects.remove answer; the mark's answer still comes after that read."
  - "B3: two loads of one broken file give the defaults both times with one file set aside and no ENOENT; a write started during a load lands after it, so a just-saved project is never set aside."
  - "I4-I6: shared/names.ts holds the epic-of-unit rule, the work unit id pattern and the router key grammar; git.ts, items.ts and log.ts import them and keep no copy (a guard test reads the sources)."
  - "I7: open/docs.ts gives a data file the roles keel verify-doc's data_roles gives (BOM, block list, space-split text, the document holding artifact, unknown or mixed roles none), checked on one case file by a Rust test and a node test."
  - "I8: the sort order lists every contract kind exactly once, checked by the type system and a test."
  - "I9-I10: a second read with no ref moved runs no note-of and no --merged; a moved notes ref or head reads again."
test-plan:
  unit: >-
    node --test: store.test.ts (controlled promises: a second load waits; a vanished file is missing),
    names/items/log tests for the one grammar, doc-find.test.ts on the shared case table, items.test.ts
    on the kinds, guards.test.ts for one source per grammar, git-read.test.ts for the memo keys; cargo
    test: verify_doc.rs reads the same case table through data_roles.
  integration: >-
    node --test: open.test.ts (Open with an old git on a real temp project), handlers.test.ts (a mark
    whose read is held leaves the queue free; controlled promise, no sleep), git-facts.test.ts (a
    counting git: a steady second read runs no note-of and no --merged; a new note or a moved head is
    read), store race through the real files.
  e2e: >-
    none: a WU's level is integration, and this worktree cannot bind a port. The changes touch app/, so
    the owner reruns the epic e2e before the epic merges.
details:
  base: "wu/E-APPLIST/epic-review-fix off epic/E-APPLIST at 7d8d346"
  findings:
    - "B1 app/src/main/open/open.ts:131 - Open always runs --no-lazy-fetch: fix by one old-git runner (commands.ts) used by GitReader and Open"
    - "B2 app/src/main/index.ts:266 - item.mark awaits watcher.kick inside the queue: the handler writes in the queue and rereads after it (Parts.reread)"
    - "B3 app/src/main/store.ts:82 - concurrent load/set-aside: one job at a time per file for load and writeAtomic; rename's ENOENT is a missing file"
    - "I4 app/src/main/reader/git.ts:106 - epic/unit rule written six times: epicOfUnit and unitPrefix in shared/names.ts"
    - "I5 app/src/shared/items.ts:30 - WU id grammar repeated: WU_SOURCE and its pieces move to shared/names.ts"
    - "I6 app/src/shared/items.ts:172 - router keys parsed by own regexes: routerKey() in shared/names.ts over log.ts's KEY"
    - "I7 app/src/main/open/docs.ts:79 - role reading differs from verify_doc.rs data_roles: rewrite dataHead, shared case file tests/data/data-roles.json"
    - "I8 app/src/shared/items.ts:61 - KINDS beside ITEM_KINDS: a Record<ItemKind, number> order"
    - "I9 app/src/main/reader/git.ts:323 - note-of unmemoized: keep each notes ref's tip, memo per kind by it"
    - "I10 app/src/main/reader/git.ts:315 - --merged unmemoized: memo per target by its tip and the held branches' tips"
  not-reopened: "the 8 refuted items of the cr note, and the W5/W8 owner waivers"
  open-points:
    - q: "Does a mark still wait for the read before it answers?"
      a: "Yes, outside the queue: the window gets the new list with the answer, and nothing else waits."
    - q: "Does the window's code change?"
      a: "No: shared/ changes are pure functions the node suite tests; Vitest is not needed."
