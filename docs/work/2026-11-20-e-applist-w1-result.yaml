  review-round-1: >-
    FAIL on 3509e4c (cr note): 0 blockers, 6 importants, 4 nits (waived), 1 refuted (the INT/TERM trap, equivalent
    under bash 3.2's sh). Every important was a test that did not pin a contract clause; the reviewer's mutants
    survived. Fixed in 17c505f, tests/ only, each new assertion red against its mutant in a scratch copy and green on
    the shipped script: I1 rotation at 1,999 lines (kills -ge 1999, -ge 1000); I2 a 1,024-byte line taken, 1,025
    refused (kills cap 1300, cap 1000, measuring the value only); I3 an inherited GIT_DIR, GIT_WORK_TREE and
    GIT_COMMON_DIR naming a decoy repo (kills dropping the GIT_* unset); I4 a mv shim failing a writer between its
    writes: no line ahead of the state, no repeated number (kills log-first); I5 a sleep shim counting 99-100 polls
    of 0.05 s (kills a 10 s wait, a 0.1 s poll); I6 state.json's inode changes on every verb (kills writing it in
    place). The four nits were taken too: a symlinked .router, the shebang and mode, umask 077 (dirs 0700, files
    0600 under a caller's umask 022), router.md's set and alert sentence (each killed its mutant). Round 2 reviews
    the fix.
  review-round-2: >-
    FAIL on 282f7f1 (cr note): 0 blockers, 3 importants, 3 nits (waived), 2 refuted (the empty dirs a refused call
    before start makes; the guard-parity loop's 2 s). Every round-1 fix held. Fixed in 34308bb, tests/ only, each
    pin red against its mutant in a scratch copy (and the same mutant green on the round-1 tests), green on the
    shipped script: I1 log.jsonl's inode changes on start and on the restart past 2,000 lines, a reader holding the
    old log reads it whole (kills A1, start writing the log in place, and R1, the restart in place); I2 a start whose
    state rename fails changes neither file, one whose log rename fails leaves the new run's state and the old log
    (kills M29c, start placing the log first); I3 a writer paused inside the lock (a date shim on a fifo) holds
    .lock/<its pid>; the owner replaces the lock, bare or with another pid's mark, and the writer leaves it (kills
    B1, B1b rm -rf, B1c and B1d, traps that ignore the mark). The three nits were taken: no real sleep in the lock
    test (a sleep shim frees the lock on its third poll), the took < 4 s check dropped, and a link made while a
    writer waits refused under the lock (kills S05). The sweep (236 mutants: each statement of
    scripts/router-app.sh deleted, each bound, code, message and branch of the words, start, the verbs, the lock
    and the traps changed; 212 killed) added these pins, each red against its mutant: a writer stopped by TERM, INT
    or HUP inside the lock exits 1, writes nothing and leaves no lock (the plan's trap clause); a copy outside any
    checkout exits 1 and makes nothing (without the check it wrote .router in the caller's directory); a log or
    state that is a directory exits 1; a state of the wrong shape exits 1 until a start; a first start whose log
    rename fails is followed by a writer that makes the log (kills deleting lines=0); refusals go to stderr alone;
    start's OK line n=1, its state's key order and the local offset of at; the wu id's literal dot; the 512-byte
    value cap counted in bytes. 24 survivors left, none a plan clause: unreachable failure paths (a jq or a temp
    write failing, a mark mkdir failing, jq printing two lines or two values, the app dir not a dir after mkdir
    -p); equivalent (set -eu, the jq-on-PATH check, the pre-lock link check that the post-lock one repeats, stage
    with one word refused either way, the start line measured with its name, 100 polls instead of 99: 5.0 s is
    still "up to 5 s"); no clause (LC_ALL=C, as round 2 found; the state's trailing newline; key order inside a
    state alert; the unknown-verb wording). Round 3 reviews the fix.
  re-gate: >-
    A fresh read-only worker (opus, high effort) on 83b393d: GREEN. The four files read against the review checklists
    (security path for router-app.sh and router-guard.jq: one lock, every value through jq, writes only .router/app,
    symlinks refused, fail-closed guard admitting only the four shapes, the guard and the script agreeing; settings
    entries equal to the guard's shapes; router.md's tools line equal to the guard's). No blocker, no important
    finding; six nits (follow-ups below), none re-committed.
  by-hand-run: >-
    The script copied into a scratch git repo under TMPDIR: start keel-1c -> OK n=1; stage E-APPLIST.W1 plan-to-read
    83b393d -> OK n=2, line {"run":"keel-1c.20261120-123337.46108","n":2,"at":"2026-11-20T12:33:38+08:00","op":"set",
    "key":"wu/E-APPLIST.W1/stage","value":{"stage":"plan to read","tip":"83b393d"}}; del question/q1 -> OK n=3;
    stage E-APPLIST.W1 shipped -> exit 2 "the stage must be ...", nothing written; state.json n 3 holding the stage;
    .router/app holds only log.jsonl and state.json. The guard, fed router PreToolUse events: the stage and del
