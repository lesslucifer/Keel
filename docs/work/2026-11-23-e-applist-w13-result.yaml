outcome: >-
  Delivered. All three findings of the epic review's round 2 (cr note on 96207aa: 1 blocker, 2 importants) are
  fixed, each pinned by a test that failed on the old code. Open asks keel doc-roles about every data file the copy
  takes, whatever its size: HEAD_CAP is gone, keel judges the size, and the copy's own read cap (OUTPUT_CAP, 1 MiB)
  equals keel's MAX_DATA_BYTES, held together by a test with a 1 MiB data file against the real keel. The head files
  go to keel in batches (headBatches) whose temp folder holds at most HEADS_DISK_CAP (4 MiB) at a time, each removed
  before the next. The git reader takes the tips of its notes and times reads, and the epics and units it reads for
  tasks, from openSets, the one open rule (openUnits is gone); main and the epics come first in the times read, which
  now says when it passes TIME_TIPS. A unit's tasks are named by names.ts isTaskBranch and unitOfTask alone. keel check
  and tsc and eslint are green on the fix commits. The CSS lint step and the window tests could not run in this
  sandbox. No Rust code changed, so keel needs no reinstall. The window's code is unchanged.
deviations:
  - >-
    The plan had no problem line for the times read. One was added: a times read past TIME_TIPS says so, as the notes
    read already did past NOTE_TIPS. The finding named the unreported cut at git.ts:370.
  - >-
    A data file's text is kept for the copy loop only while the kept texts stay within COPY_CAP (8 MiB), so the head
    pass's memory stays bounded now that files up to 1 MiB are read. A data file past that is read again from git if
    it is the page's own, or if the copy reaches it. Below 8 MiB of data files nothing is read twice (round-3 nit test
    unchanged).
  - >-
    pnpm typecheck, pnpm lint and pnpm test:window were run as their own binaries (node_modules/.bin/tsc, eslint,
    vitest) through a symlink to the sibling worktree's app/node_modules (package.json, pnpm-lock.yaml and
    pnpm-workspace.yaml identical). The first pnpm typecheck started pnpm's dependency check, which tried pnpm install
    and stopped for want of a TTY. pnpm was not run again, and the 8 KiB .pnpm-store it left in this worktree was removed.
  - >-
    eslint-rules/check-css.js (lint's second step) and vitest both write a bundled config into node_modules/.vite-temp,
    which is in the sibling worktree, so the sandbox refused them (EPERM). They were not retried. Neither the window
    nor its CSS changed. The owner runs pnpm lint and pnpm test:window.
