    architecture:
      shape: "220; the tier paragraph becomes one line (keel-distill §1, DEC-27)"
      cli: "420; one line per command, the Notes column goes (keel-workflow §4 - §6, keel --help)"
      init: "420; one line per installed file; the lock becomes a pointer (DEC in distribution.html, UC-INIT, install §4); the notes-refspec section becomes one line (DEC-19, backlog B24)"
