artifact: wu-plan
status: ready
id: E-DOCSPLIT.W6
epic: E-DOCSPLIT
title: Slim architecture and install
date: "2026-11-19"
page: 2026-11-19-e-docsplit-w6-plan.html
requirement: >-
  After W6, docs/architecture.html has at most 3,000 words and docs/install.html
  at most 1,500, each counted as keel verify-doc counts a page but without the
  GitHub parts listed under details.github-parts, which stay unchanged in words
  for E-GHREVERT to remove (owner comment 2026-11-19: GitHub retires soon, in
  E-GHREVERT); every rule they drop is still held by a skill, a decision, a use case, a
  backlog row or the code; every link into them still resolves; the backlog
  page local-app.html is a data file; keel verify-doc over all docs is green.
maps-to: >-
  E-DOCSPLIT.W6 (epic plan, W6 block; W1's caps: architecture 3,000, install
  1,500, "drop history and rules the skills hold"); DEC-69; the owner's ruling
  of 2026-11-19 (start W6; E-GHSETUP closed by DEC-70, so its install edits
  never come; E-GHREVERT removes the GitHub parts, W6 leaves them); the
  owner's plan comments of 2026-11-19 (the GitHub parts do not count, one
  commit). No use case changes.
owner-changes:
  - when: You open architecture or install
    today: 5,917 and 1,920 words, with build history and rules the skills repeat
    after: Under 3,000 and 1,500, current shape only, each rule in one place
  - when: A later edit makes either page long again
    today: Nothing counts their words
    after: Once E-GHREVERT lands and adds the two caps, the doc check refuses a page over its cap
expected:
  - keel verify-doc (installed and built from this branch) is green over all docs.
  - A one-off count (keel verify-doc's rule, the GitHub parts removed from a scratch copy) gives architecture at most 3,000 words and install at most 1,500.
  - The GitHub parts listed under details.github-parts are unchanged in words (a word diff of each against the W6 base shows no change but the one link to the backlog page).
  - Every id (DEC, UC, backlog row) the two pages cite at the base is still found in the repository at the tip, and every link into the two pages from docs, skills, src, templates and tests resolves (anchors github and github-app kept).
  - docs/backlog/local-app.html is gone, docs/backlog/local-app.yaml holds A1 - A5 and L1 - L5, and no doc links the old page.
test-plan:
  unit: "none: no code changes (docs and config only; the range touches no code_paths)"
  integration: "none: no code changes; keel verify-doc and a word count without the GitHub parts are the checks"
  e2e: "none: no code changes; the epic's e2e (tests/suite/docsplit_e2e.rs) is unchanged"
  checks:
    - keel verify-doc, installed and built from the W6 tip, over all docs, green
    - a one-off count of each page by keel verify-doc's rule with the GitHub parts cut from a scratch copy - architecture at most 3,000, install at most 1,500
    - a one-off script lists every DEC-, UC- and backlog id in both pages at the base and greps the tip for each; none lost
    - git grep for architecture.html# and install.html# - each anchor still exists
    - a word diff of the GitHub parts against the base
