# Keel use-case index: data only, no page (DEC-69). Per use case: id, title, the file that holds it.
# Read it first, then open only the file you need. Ids are never reused or renumbered.
removed: >-
  Never reused: UC-GATE-7, UC-MR-3, UC-ROUTE-7 and UC-DOC-5 were GitHub's flow (E-GHFLOW, E-GHFLOW2). E-GHREVERT
  removed them with the flow (the owner's ruling of 2026-11-19, DEC-70, amended); git history keeps their text.
areas:
  - area: UC-INIT
    file: workflow.yaml
    scope: >-
      keel init: config, T0, skills, the shared skill root, settings hooks, git hooks
  - area: UC-GATE
    file: workflow.yaml
    scope: >-
      main merge-only, merge gate, epic walk, keel check, docs/infra exemption, Keel's hooks are the ones git runs
  - area: UC-NOTE
    file: workflow.yaml
    scope: >-
      keel notes write: derived evidence, refusals
  - area: UC-MR
    file: workflow.yaml
    scope: >-
      human sign-off (mr/v1), Reviewed-By trailers
  - area: UC-DOC
    file: workflow.yaml
    scope: >-
      verify-doc on a page and its data file: the role's fields, links, epic doc layout and pairs archived whole,
      quoted diagram labels, word caps and the epic plan's 300-word top, the write-time check on any host
  - area: UC-REV
    file: workflow.yaml
    scope: >-
      code review bound to the code diff, a waived review says so, the review schedule per level from the target's [review] settings
  - area: UC-ROUTE
    file: router.yaml
    scope: >-
      router: owner/worker split, epic branch first, substance from workers, shipped skill, worker modes and
      launcher, enforced posture on Claude Code, an unenforced posture on DSH, the moment-of-action checklists, the
      report channel and the owner sender, the update log the local app reads
  - area: UC-APP
    file: app.yaml
    scope: >-
      the local app: an alert at your desk, your list of what waits on you and Open (E-APPLIST); UC-APP-3 to
      UC-APP-6 come with A4, A5 and L1
  - area: UC-DSH
    file: dsh.yaml
    scope: >-
      DeepSeek Harness: the skills through one shared root, the doc check at the write, a router's workers and
      transcripts, the permissions of an unattended session
