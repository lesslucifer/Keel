outcome: >-
  Delivered. scripts/router-app.sh is the one writer of <main checkout>/.router/app/log.jsonl and state.json: start
  wipes both and begins a new run (run id <router-name>.<YYYYMMDD-HHMMSS>.<pid>); stage, set, del and alert each
  write one numbered line, keys in the contract's order (run, n, at, op, key, value), and fold it into the state
  under one mkdir lock; sixteen writers at once keep the numbers whole; past 2,000 lines a file holding only the
  new line replaces the log; a refused call exits 2 and writes nothing. scripts/router-guard.jq admits exactly the
  router's plain-word shapes (start <name>, stage <wu> <stage> [<tip>], del question/<id>, del wu/<wu>/stage) and
  denies set, alert and every other form; .claude/settings.json allows the same three shapes; .claude/agents/router.md
  names them. The four rule files landed in the owner's one typed commit 83b393d. An independent re-gate on 83b393d
  was GREEN: cargo test 137 unit and 361 suite pass (10 ignored), fmt, clippy and keel check green, no blocker, no
  important finding, six nits. Code review round 1 on 3509e4c FAILED (0 blockers, 6 importants, 4 nits waived, 1
  refuted): six contract clauses the tests did not pin, the script right. The fix commit 17c505f adds the tests that
  pin them (scripts/ unchanged): unit 137, suite 367 pass (10 ignored). Code review round 2 on 282f7f1 FAILED (0
  blockers, 3 importants, 3 nits waived, 2 refuted): three more clauses unpinned (start replacing the log by a
  rename, start writing the state first, the lock's pid mark), the script right again. The fix commit 34308bb pins
  them and every survivor of a sweep of 236 mutants over the whole script that is a contract clause (scripts/
  unchanged): unit 137, suite 372 pass (10 ignored).
deviations:
  - >-
    Write order: the state first, then the log. The plan's details.order and details.rotation say the log is written
    before the state. The script renames the new state into place and then appends (or rotates) the log. Why: a
    writer killed between the two then leaves a gap (the state ahead of the log), which the app already handles by
    reading the state once (docs/local-app.html "Applying a line"); log-first would leave a line the state lacks, and
    the next writer would read the old n and repeat that number. start also writes the state first. The re-gate
    judged this departure right. The plan YAML's order and rotation text are left as written (a T3 plan, archived at
    the close); this entry records the change.
  - >-
    The tests took two commits, not one: d46a271 (the tests, red first) and 09f5cf4 (a refused call before start
    once left an empty .state.* temp file behind; the refused calls and the sixteen writers now assert .router/app
    holds only log.jsonl and state.json). The script creates its temp files only once nothing can refuse the change.
  - >-
    The worker could not write .claude/settings.json or .claude/agents/router.md in its worktree (the sandbox denies
    them); their intended diff went to the router as a file and the owner applied it in the typed commit. Before
    that, the worker's tree was green except the two tests that read those files (settings entries, router.md's
    posture): suite 359 passed, 2 failed.
  - >-
    docs/local-app.html "Where it travels" lists start, set, del and alert, not stage: a T1/T2 doc, changed at the
    epic close by distillation, not in this WU.
