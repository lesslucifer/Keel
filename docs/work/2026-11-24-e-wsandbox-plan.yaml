artifact: epic-plan
status: ready
id: E-WSANDBOX
title: "What a worker may do, and when it is reused: ruled ports, packages and sites, one commit, and the router's and watchdog's bounds"
date: "2026-11-24"
page: 2026-11-24-e-wsandbox-plan.html
intent: >-
  Background workers stop on their own limits, and the owner does the step by hand. W1 settled the facts and on
  2026-11-26 the owner ruled every point: workers get local ports (allowLocalBinding, with its known cost), workers
  add packages with pnpm or cargo, no pinned site list and no strictAllowlist (the auto reviewer decides each site;
  W4 owns how the launcher's allowedDomains changes and what an empty list does), scratch work is allowed through one
  fixed helper, the 14 #[ignore] notify_owner tests are deleted, and parts 2 - 4 land in one owner commit. This epic
  builds that shape, plus worker resume and the reuse rules (W5), and - the owner's scope note of the same day -
  the router's and the watchdog's own bounds (W7), since W1 found neither runs in a sandbox; on 2026-11-28 the owner
  merged the old W5 and W6 into W5, and the old W7 and W8 into W7. The owner's effort ruling of 2026-11-26 joins as
  W9: later workers low, planner workers high, one policy both hosts read, because DSH and the Claude Code launcher
  name effort differently. Why now: the app makes ports and packages routine, and every app WU so far needed an owner
  run.
owner-changes:
  - {when: "A worker's work needs a local port (the app's end-to-end test, a test server)", today: "Refused; you run it and send the log", after: "The worker serves and connects on any port; it binds every interface and reaches every local listener"}
  - {when: "A WU changes the app's packages", today: "You install them by hand", after: "The worker adds them with pnpm or cargo; a package that ships a blocked folder is installed through a store outside its worktree"}
  - {when: "The 14 switched-off notify_owner tests", today: "Carry #[ignore] and never run", after: "Deleted"}
  - {when: "A worker makes a scratch repository or similar harmless setup", today: "The auto reviewer may refuse it; the step comes to you", after: "One fixed helper on the grant; the reviewer no longer judges that shape"}
  - {when: "A worker wants a website", today: "The auto reviewer may allow it for one command", after: "The reviewer decides every site; there is no list for you to keep"}
  - {when: "You want to know what a worker may do", today: "Spread over a script, a guard and two decisions", after: "One table: each limit, why, and what a widening exposes"}
  - {when: "A stopped worker's WU needs it again", today: "Never revived; a fresh worker re-reads everything without the work history", after: "The router brings it back by name, with its history and every limit rebuilt from the committed rules"}
  - {when: "A follow-up or a fix is due", today: "The skills disagree: the live author, or a fresh worker", after: "The router reuses a worker when the task is related and its context is under your ceilings, else starts fresh; it can read each worker's context size and cache state"}
  - {when: "A later worker's effort", today: "medium by default; high only for design, review and debugging", after: "low for a worker, high for a planner, from one policy both hosts read"}
  - {when: "You ask what the router or the watchdog may do", today: "Unwritten; both run outside any sandbox", after: "One table each, pinned by a test, with the one fork named for you"}
use-cases:
  - "UC-ROUTE-5, amended (W2 - W4, as ruled): the worker's environment - local ports on any address, the auto reviewer deciding each site (the host base kept or emptied), the fixed scratch helper, package installs, and what its shell writes."
  - "UC-ROUTE-5 and UC-ROUTE-6, amended (W5, resume part): a stopped worker is resumed by name with every launch flag rebuilt; its 'a stopped worker revived' failure is replaced by 'a worker resumed with any flag or guard missing, or into a drifted worktree'; the guard admits the resume shape."
  - "UC-ROUTE-1 and UC-ROUTE-6, amended (W5, reuse part): the router picks reuse or a fresh worker by the owner's locked rule and reads each worker's context and cache state; the guard admits the status shape."
  - "UC-ROUTE-1 and UC-ROUTE-6, amended (W7): the router's and the watchdog's bounds, each written in one table and pinned by the guard test; neither gains a sandbox."
  - "UC-ROUTE-5, amended (W9): the spawn's effort comes from the one policy by role - low for a worker, high for a planner - and each host gets it explicitly (Claude Code --effort, DSH worker_spawn effort). UC-ROUTE-1 names no effort; it is unchanged."
  - "No other use case. W1 changes none (a findings report)."
expected:
  - "A findings page (W1) answered every point this plan marked unverified, each with raw probe output or the file:line that settles it (merged)."
  - "Each ruling is recorded in DEC-37, DEC-46 or a new decision as an Amended row naming what it exposes and its bound: ports bind every interface; the reviewer decides each site and may let it receive what the worker read; a worker adds packages; scratch goes through one helper."
  - "A fresh worker spawned after the last change runs the ruled probes (bind 127.0.0.1:0 and 0.0.0.0:0, connect to a local listener, a frozen pnpm install of xmlbuilder 15.1.1, a pnpm add, a site the reviewer allows and one it refuses, a scratch keel init through the helper, a Write outside the worktree, a Read of ~/.ssh) and each result matches the ruling."
  - "No #[ignore] attribute remains in tests/suite/notify_owner.rs, and no replacement test was invented for the 14 deleted ones."
  - "Parts 2, 3 and 4 are one WU branch, one review, one signature and one owner commit, in one --no-ff merge; so is W5 (resume and reuse) and so is W7 (the router's and the watchdog's bounds); the parts land one at a time."
  - "No change gives a worker the owner's keys, the router's powers or an unbounded network; the epic review checks every widening against its stated bound."
  - "W5 (resume and reuse, one branch): a worker stopped by the launcher and resumed with it keeps its earlier conversation and session id, carries every launch flag a spawn carries, and is still refused a Write outside its worktree; no skill or instruction text still contradicts the locked reuse rules, and the status read prints each live worker's context, peak, idle minutes and warm or cold from usage records alone."
  - "W7 (router and watchdog, one branch): the router and the watchdog each have one table of their bounds (tools, Bash shapes, writes, mode, the scripts it may run unsandboxed), a guard test pins each admitted shape, and neither gains a sandbox."
  - "W9: one effort policy is the only wording - worker low, planner high - the launcher refuses an effort outside it, the router passes it on both hosts (Claude Code --effort; DSH worker_spawn effort always given, never omitted), and no skill still says medium as the default."
non-goals:
  - "The shared git dir's allow list (backlog R51) and the other residuals of DEC-37 (R31 - R39, R41) unless a ruling here touches them."
  - "A rule for workers changing other worktrees of the same repo: open, not built here (open-questions; it would change DEC-37 and the worker file guard)."
  - "gh in a worker (backlog R21)."
  - "The DSH host's preset (Always Auto Review) and its worker plugin's cold resume (backlog D3): W9 only records the policy the router follows on DSH, not the preset; the launcher built here is Claude Code's."
  - "Reviewer independence: a review worker stays fresh every round and the author never reviews its own diff; W5 changes neither."
  - "Packaging, signing or notarising the app."
  - "Any grant of the owner's keys, tokens, push or sign-off to a worker."
wu-summaries:
  - wu: E-WSANDBOX.W1
    wu-summary: >-
      Findings, no rule change (merged). A fresh worker (opus, high) re-read the limits and ran the probes the plan
      could not: why the W9 worktree's settings.local.json allowLocalBinding did not take, whether a loopback-only
      bind exists, whether Unix sockets are allowed, whether Claude Code's own write denies can be changed, whether
      per-call host widening under auto can be switched off, whether the classifier takes project guidance, and the
      state of backlog R40. Output: a findings pair under docs/work/ whose details.rulings is the owner's six rulings.
    wu-maps-to: "The owner's request of 2026-11-24 (review the worker sandbox on three points); no use case."
    wu-expected: >-
      Integration and e2e: none (no code). The findings pair passes keel verify-doc; every 'unverified' line in this
      plan's details is confirmed or corrected with raw output; each open question has a sharpened default.
    wu-deps: none
  - wu: E-WSANDBOX.W2
    wu-summary: >-
      Ports, and the 14 tests deleted, as ruled (q1, q2). Owns the one branch that carries parts 2 - 4 (details.one-commit).
      allowLocalBinding true in the launcher's --settings sandbox; serve on any port and address, connect to any local
      service on any port. The known cost stands: it binds every interface and reaches every local listener, other
      sessions' filtering proxies included. Deletes the 14 #[ignore] tests in tests/suite/notify_owner.rs completely,
      with no replacement. Rule-bearing: scripts/router-worker.sh and tests/suite/router.rs (the sandbox pin); the
      owner's one keel mr commit covers parts 2 - 4.
    wu-maps-to: "Point 1 of the owner's request; the q1 and q2 rulings; UC-ROUTE-5 (amended)."
    wu-expected: >-
      Integration: the launcher's sandbox pin test shows allowLocalBinding and every other network key unchanged, and
      no #[ignore] test remains in tests/suite/notify_owner.rs. E2e: a live worker binds 127.0.0.1:0 and 0.0.0.0:0 and
      connects to a local listener.
    wu-deps: none
  - wu: E-WSANDBOX.W3
    wu-summary: >-
      Packages, as ruled (q3). Part 3 of the one ruled change, on W2's branch (no branch of its own). A worker may add
      packages with pnpm or cargo. registry.npmjs.org is reachable: it joins the launcher's host base if W4 keeps one;
      if W4 empties the list, the auto reviewer decides the site and W3's e2e proves the install. pnpm's store moves
      outside the worktree to a folder the launcher may write, so a package that ships a denied path (xmlbuilder
      15.1.1's .vscode/launch.json) unpacks outside it - or another way W3 proves. cargo works today. A dependency's
      build script stays the app's allowBuilds list (code, gated). Rule-bearing: scripts/router-worker.sh (the store
      allowWrite), docs/install.html; app/ config (code).
    wu-maps-to: "Point 2 of the owner's request; the q3 ruling; UC-ROUTE-5 (amended)."
    wu-expected: >-
      Integration: the sandbox pin test shows the ruled store path and host state and nothing wider. E2e: a live
      worker's frozen install of xmlbuilder 15.1.1 succeeds and writes nothing under its worktree's .vscode; a pnpm add
      and a cargo add succeed.
    wu-deps: [E-WSANDBOX.W4]
  - wu: E-WSANDBOX.W4
    wu-summary: >-
      Sites and scratch, as ruled (q4, q5). Part 2 of the one ruled change, after W2 and before W3. No pinned site list
      and no strictAllowlist: the auto reviewer decides each site; accepted cost, a site it allows can receive what the
      worker read. W4 owns how the launcher's allowedDomains changes (kept as a base, emptied) and what an empty list
      does (W1 could not verify it; if empty refuses every host, the five stay as the base and the reviewer widens each
      call). One fixed scratch helper on the grant for a temp repo under $TMPDIR (keel init in it), so the reviewer no
      longer judges that shape; mode stays auto. WebFetch stays with the reviewer and is recorded (R41) or denied.
      Rule-bearing: scripts/router-worker.sh, a new scripts/ helper (added to rule_bearing), .claude/agents/worker.md,
      the keel-router skill and its mirrors, .keel/config.toml.
    wu-maps-to: "Point 3 of the owner's request; the q4 and q5 rulings; UC-ROUTE-5 (amended)."
    wu-expected: >-
      Integration: the sandbox pin test shows no strictAllowlist, the ruled allowedDomains state and the helper's two
      shapes and nothing wider; the helper refuses any path outside a fresh mktemp dir. E2e: a live worker's scratch
      keel init through the helper is not denied; a site the reviewer allows is reached and one it refuses is refused
      by the reviewer, not by a list.
    wu-deps: [E-WSANDBOX.W2]
  - wu: E-WSANDBOX.W5
    wu-summary: >-
      Worker resume and the reuse rules, one WU (owner ruling 2026-11-28 merged the old W5 and W6; one branch,
      wu/E-WSANDBOX/w5-resume-reuse). Part a, resume (owner request 2026-11-26; details.w5-resume): a launcher mode
      resume <name> brings back the worker's last stopped session (its id in the newest run dir of that name) with
      claude --bg -n <name> --resume <session-id> and the spawn's whole flag set rebuilt from the committed policy at
      the router checkout's HEAD by the code spawn uses (one flag builder), plus a fixed resume prompt that repeats the
      first check. It refuses a live session of that name, a missing transcript, a worktree off the spawn's branch or
      with an unlinked .git or no persona, a brief snapshot whose sha256 changed, and a model, effort or mode the
      policy no longer admits; it copies the brief back (stop removed it). It never uses claude respawn or the saved
      job state. stop as the open question decides. Part b, reuse (owner rulings 2026-11-26, locked; details.w5-reuse),
      built after part a on the same branch: the router decides; reuse wins when the task is related to or a follow-up
      of the worker's last one and its context is under 200k with a cold cache or 400k with a warm one; a fix is not
      forced fresh; every conflict between skill and instruction texts on reuse, resume, retirement and fixes is
      resolved; a read-only launcher mode, status (or a line in the watchdog's facts), reads each worker's context and
      cache state from usage records and timestamps only. Reviewers stay fresh every round. One review, one owner keel
      mr commit for both parts' rule-bearing files (details.rule-bearing-by-wu.W5), one sign-off, one --no-ff merge;
      the cost: a part cannot be dropped alone at sign-off (details.merged-wus).
    wu-maps-to: "The owner's request of 2026-11-26 (worker resume) and rulings of 2026-11-26 (worker reuse policy); the merge ruling of 2026-11-28; UC-ROUTE-1, UC-ROUTE-5 and UC-ROUTE-6 (amended); backlog R23 and R53."
    wu-expected: >-
      Integration: the launcher's pin test (stub claude) shows the resume command line holds every flag a spawn of the
      same worker holds - the same --settings sandbox and file guard, grant, deny list, persona, setting sources, mode,
      model, effort - plus --resume <the recorded id>, and each refusal fires; status on a recorded fixture transcript
      (usage and timestamps only) at a fixed clock prints the expected context, peak, idle minutes, warm or cold and the
      two ceilings; the guard test admits resume <name> and the status shape and no other shape; a text test finds no
      rule left that forbids resume or contradicts the locked reuse rules. E2e: in the probe clone a haiku worker is
      spawned, told a word, stopped and resumed by the launcher; it answers the word under the same session id, is
      still refused a Write outside its worktree, and status of it live and resumed matches its transcript.
    wu-deps: [E-WSANDBOX.W9]
  - wu: E-WSANDBOX.W7
    wu-summary: >-
      The router's and the watchdog's bounds, one WU (owner scope note 2026-11-26; owner ruling 2026-11-28 merged the
      old W7 and W8; one branch, wu/E-WSANDBOX/w7-bounds; facts in details.w7-router-bounds and
      details.w7-watchdog-bounds). W1 found no Bash sandbox for either. The router's bound is the fail-closed PreToolUse
      guard (scripts/router-guard.jq): the 11 tools of .claude/agents/router.md (no Agent, no Edit), Bash only
      plain-word whitelisted shapes, Write only .router/briefs/<name>.md and .router/notify/owner.md, five inline
      skills, mode auto, and the scripts it may run unsandboxed with the owner's rights. The watchdog starts with
      --setting-sources local and a --settings holding only hooks; the guard with watchdog_to admits only CronCreate
      of the */5 tick and a SendMessage to its router; its facts hook checks each worktree's .git link before any git
      there. W7 writes each bound in one table, keeps the guard the single source, pins each admitted shape in the
      guard test, and surfaces the one fork for both: keep them unsandboxed (default) or sandbox them, which would stop
      the router running the launcher. It adds no power. One review, one owner keel mr commit for the rule-bearing
      files (details.rule-bearing-by-wu.W7), one sign-off, one --no-ff merge; the cost: the router's table cannot be
      signed without the watchdog's (details.merged-wus).
    wu-maps-to: "The owner's scope note of 2026-11-26 (the router's and the watchdog's own parts); the merge ruling of 2026-11-28; UC-ROUTE-1 and UC-ROUTE-6 (amended)."
    wu-expected: >-
      Integration: a guard test allows each ruled router shape and refuses an Edit, an Agent and a Bash word outside
      the whitelist; it admits the watchdog's CronCreate of the */5 tick and a SendMessage to the named router and
      refuses any other tool; the agent file, settings and guard name the same set; the launcher's watchdog start
      carries only the hook settings; the facts hook checks the .git link first; the page's two tables match the test.
      E2e: none live (both bounds are the guard, proven by the fixture test).
    wu-deps: [E-WSANDBOX.W5]
  - wu: E-WSANDBOX.W9
    wu-summary: >-
      One effort policy for both hosts (owner ruling 2026-11-26: later workers use low effort, planner workers high;
      the DSH route exposes off | low | high (default) | max, the Claude Code launcher's committed [router] says
      worker_efforts ["medium","high"] and worker_default_effort "medium"; the owner: "it's different wording between
      DSH & claude"). W9 writes one host-neutral policy with an explicit per-host mapping: the [router] keys' shape
      (recommended: keep worker_default_effort = "low", add planner_effort = "high", worker_efforts = ["low","high"];
      the alternative is one worker_effort policy string), the launcher's validation against it (its parser must learn
      the new key: an unknown [router] line refuses the whole policy today), the router's use on DSH (worker_spawn's
      effort, always passed explicitly: omitting it takes the route's high default) and on Claude Code (--effort), the
      facts (project-router, both keel-router copies and their references, docs/architecture.html, DEC-39), and the
      tests (the launcher pin tests in tests/suite/router.rs, a text test that the skill wording names the same keys).
      Rule-bearing: .keel/config.toml, scripts/router-worker.sh, the skills, docs/architecture.html and
      docs/decisions/router.html (DEC-39 Amended); one owner keel mr commit.
    wu-maps-to: "The owner's ruling of 2026-11-26 (effort for later workers and planners); UC-ROUTE-5 (amended); DEC-39."
    wu-expected: >-
      Integration: the launcher's pin tests show the policy's keys, the worker role's default, and that a spawn's
      effort outside worker_efforts is refused; a text test finds one wording in the skills, the same key names, and no
      skill still naming medium as the worker default. E2e: in the probe clone a worker spawn carries --effort low and
      a planner's carries --effort high; on DSH the skill's dispatch row names worker_spawn's effort as always given
      (a live DSH spawn is the host preset's, a non-goal).
    wu-deps: [E-WSANDBOX.W3]
  - wu: E-WSANDBOX.W10
    wu-summary: >-
      Fixes from the epic e2e of 2026-11-28 (plan docs/work/2026-11-28-e-wsandbox-w10-plan.yaml): the worker's pnpm
      env goes through the launcher's --settings env object (claude --bg drops the caller's env) and the launcher
      creates and checks the modules dir; bare sh, bash and zsh denied (owner q1); pnpm install, add, run and test on
      the grant (owner q2); the router stays an interactive session (owner q3); the e2e harness reports raw output, a
      worker judges it, and the red-doc check counts only Stop-hook records. Rule-bearing: scripts/router-worker.sh and
      the project-router skill; one owner keel mr commit.
    wu-maps-to: "The e2e-plan's frozen install, pnpm add, refused site and red-doc probes; E-WSANDBOX.W3 (owner q3) and W4 (q4); UC-ROUTE-5."
    wu-expected: >-
      Integration: the launcher test whose stub takes env only from --settings shows the three pnpm settings and a
      real modules dir; the pin test shows the q1 deny and the q2 grant. E2e: the re-run's probe 2 install succeeds
      with a clean worktree, and the finish step's red-doc check passes.
    wu-deps: [E-WSANDBOX.W3, E-WSANDBOX.W4, E-WSANDBOX.W5]
e2e-plan: >-
  After the last change WU, a fresh worker spawned by the launcher in this epic's worktree runs the ruled probe list
  and reports raw output; each line must match the ruling: bind 127.0.0.1:0 and 0.0.0.0:0 (both succeed, every
  interface), a connect to a local listener, a frozen pnpm install of xmlbuilder 15.1.1 (succeeds, nothing written
  under the worktree's .vscode), a pnpm add of a small package (succeeds), a curl with a 10 s timeout to a site the
  reviewer allows (reached) and one it refuses (refused by the reviewer, not by a list), a scratch keel init through
  the helper (allowed), a Write outside the worktree (refused by the file guard), a Read of ~/.ssh (refused). Then,
  in the probe clone (project-router recipe; an owner step), for W5: the launcher stops that worker and resumes it; it answers
  a word it was told before the stop, keeps its session id, is refused a Write outside its worktree, and the router's
  status read shows its context, peak, idle minutes and cold cache, matching the transcript. For W7 no live
  probe exists: both bounds are the guard, and the epic's e2e for them is the guard test that admits each ruled shape
  and refuses the rest. For W9: in the probe clone a worker spawn carries --effort low and a planner's carries
  --effort high in its command line; on DSH the skill's dispatch row names worker_spawn's effort and says it is always
  given, proven by the text test (a live DSH spawn is the host preset's, a non-goal).
distillation-plan:
  - "docs/decisions/router.html: DEC-37 (grants, the file guard) and DEC-46 (point 9, the sandbox: ports, hosts, writes) take Amended rows, one per ruling, each with what it exposes and its bound."
  - "docs/use-cases/router.yaml: UC-ROUTE-5's environment and resume sentences; UC-ROUTE-1 and UC-ROUTE-6 for reuse, status and the two new bounds."
  - "The project-router skill's Workers section and the keel-router skill's brief skeleton: the ruled environment and who no longer runs the port and package steps."
  - "docs/install.html and docs/local-app.html (the three test loops): the worker runs the port and install steps; the owner-run lanes are gone."
  - "docs/backlog/e-router-v2.yaml: R40 closes as run (W1 finding g); R41's per-call widening is the ruled cost; R42's local-settings cause is ruled out; R49's ignored tests close; R23 and R53 close; docs/backlog/local-app.yaml if an app row changes."
  - "DEC-37 and DEC-46 lose W1's corrected sentence (a worktree's own settings.local.json cannot widen hosts or loopback under the launcher)."
  - "W5, resume part: DEC-30, DEC-44 and DEC-46 take Amended rows (resume by name with every flag rebuilt; stop as the open question decides); UC-ROUTE-5 and UC-ROUTE-6; the keel-router skill's worker tables and worker-ops 'No resume' item and the project-router Workers section; backlog R23 closed."
  - "W5, reuse part: DEC-43 and DEC-44 take Amended rows (the locked reuse rules, the status read), or one new decision citing both; UC-ROUTE-1; the keel-router skill's 'One live session per WU' and review table, worker-ops and checklists; backlog R53 closed."
  - "W7: DEC-37, DEC-45 and DEC-46 take Amended rows for the router's and the watchdog's bounds, or one new decision citing both; UC-ROUTE-1 and UC-ROUTE-6; the keel-router skill's router posture section; a backlog row if the sandbox fork is deferred."
  - "W9: DEC-39 takes an Amended row (the low/high policy and its per-host mapping); UC-ROUTE-5's effort sentence; the project-router Workers section (the spawn recipe and the review row), both keel-router copies (the spawn advice and the host dispatch table) and their references; docs/architecture.html's [router] keys row."
open-questions:
  - "Should a worker be able to open a local port? RULED (owner, 2026-11-26): yes - allowLocalBinding true in the launcher, serve and connect on any port. Recorded with its cost: it binds every interface and reaches every local listener."
  - "What happens to the 14 ignored notify_owner tests? RULED: delete them completely, in W2."
  - "Should a worker install the app's packages? RULED: yes, with pnpm or cargo; registry.npmjs.org on the launcher's hosts and the store outside the worktree for a package that ships a denied path (xmlbuilder's .vscode), or another way W3 proves."
  - "May the auto reviewer open a website for one command? RULED: no pinned list and no strictAllowlist; the reviewer decides each site. Accepted cost: a site it allows can receive what the worker read. How the launcher's allowedDomains changes (kept as a base, emptied) and what an empty list does are W4's; if empty refuses every host, the base stays and the reviewer widens each call."
  - "How do we stop harmless scratch work being refused? RULED: scratch is allowed, through one fixed helper on the grant. The mode stays auto."
  - "Do changes land in one owner commit or one per part? RULED: W2, W3 and W4 in one owner commit. Structure (recommended): one WU branch with three parts - one review, one signature, one commit, one merge. Three WU branches with a joint commit is not buildable: each tip would need its own rule-bearing commit, and a joint commit after the merges would bind no WU's signed tip."
  - "What effort do later workers use? RULED (owner, 2026-11-26): low for later workers, high for planner workers. The DSH route exposes off | low | high (default) | max; the Claude Code launcher's committed [router] says worker_efforts [\"medium\",\"high\"], worker_default_effort \"medium\"; the owner: 'it's different wording between DSH & claude. Maybe we can have a WU to resolve that.' W9 resolves it; the key shape and the planner role are the two design questions below."
  - "May a worker change another worktree of the same repo? RULED (owner, 2026-11-28): stays open with its default, no - not built here; backlog R57 carries it. Owner comment 2026-11-26. Recommended default: no - a worker edits only its own worktree, and another worktree stays an owner step. It would change DEC-37 (the write boundary) and scripts/router-file-guard.sh (which worktrees, which files) and their tests; it needs its own bound before it is granted."
  - "Do the router and the watchdog stay outside a sandbox? OPEN. Recommended default: yes - their guard is the bound, and a sandbox would stop the router running the launcher. W7 (the merged router and watchdog WU) records both bounds and surfaces the fork once; a sandbox is a widening of the guard, not of a worker's sandbox."
  - "How does a stopped worker come back, and what does stop keep? OPEN, W5 (resume part). Default: a launcher command, resume <name>, that rebuilds every flag from the committed rules and refuses a changed worktree or brief; never Claude Code's own claude respawn, which reuses flags the session itself can change. stop stays 'claude stop, then claude rm' if your probe (details.w5-resume.owner-probe) shows a resume after rm keeps the history; if not, stop keeps the session and a new retire removes it. The router still stops a worker once its WU is merged; W5's reuse ceilings decide whether a resume or a fresh worker is cheaper."
  - "Are the two context ceilings settings? OPEN, W5 (reuse part). Default: yes, [router] keys in .keel/config.toml (reuse_max_context_cold = 200000, reuse_max_context_warm = 400000) read by the launcher's status, which prints them; the numbers are written in that one place only, and the skills name the keys, not the numbers."
  - "When is a worker's cache warm? OPEN, for W5 to confirm before its reuse part builds. Default: warm while less time has passed since its last turn than the lifetime its last cache write used (1 hour for a 1-hour write, which every launcher worker shows; else 5 minutes), cold otherwise. Claude Code's code holds both lifetimes and labels each write by them; whether a cache read extends the lifetime is W5's to confirm."
  - "Who decides that a fix goes to a fresh worker? OPEN, W5 (reuse part). Default: the router applies rule 1 (same WU or a follow-up, under the ceiling: the live author); the author may decline in its report ('take it fresh') and the router then starts a fresh one; past a ceiling the fix goes fresh. Owner fork: whether 'up to the worker' also lets the author keep a fix past a ceiling."
  - "How do the committed [router] keys name the effort policy? RULED (owner, 2026-11-26; built by W9): the flat grammar, one key per role - worker_default_effort = \"low\", a new planner_effort = \"high\" and worker_efforts = [\"low\",\"high\"]. The launcher's parser accepts only key = \"word\" or a list, so one policy string would need a new grammar and still a second role. Both role efforts must sit in worker_efforts, checked like the default; a policy missing planner_effort is refused whole, so no host can omit the planner level."
  - "Which workers take the planner role? RULED (owner, 2026-11-26): a planner authors a plan or a design; reviews, builds, fixes and checks are workers. A review worker is therefore low, and the old 'design, review and debugging' set is dropped, because a review is not planning."
  - "What happens to a worker that asks for medium after W9? RULED (owner, 2026-11-26): the launcher refuses it by name, because medium leaves worker_efforts; the ruling is enforced, not advised, and an owner commit can widen the list again."
  - "Should W5 and W6, and W7 and W8, each be one WU? RULED (owner, 2026-11-28): yes. W5 is resume and reuse (wu/E-WSANDBOX/w5-resume-reuse), W7 is the router's and the watchdog's bounds (wu/E-WSANDBOX/w7-bounds); the ids W6 and W8 are retired, not reused. Each merged WU is one branch, one review, one owner keel mr commit, one sign-off and one --no-ff merge (details.merged-wus)."
  - "What effort policy holds when this epic reaches main? RULED (owner, 2026-11-28): (a) - keep W9's low/high policy; medium was for this epic's workers only, and it ends when the epic lands; no policy change. The question as asked: owner ruling 2026-11-28 vs W9. The owner ruled that this epic's remaining workers run on opus at effort medium; the merged W9 policy on this branch (.keel/config.toml [router]: worker_efforts [\"low\",\"high\"], worker_default_effort \"low\") refuses medium by name. The launcher reads main's HEAD, where medium is still allowed, so the ruling works for W5, W7 and the epic e2e until the epic merges; the policy is not changed here. Options: (a) keep W9's low/high as merged, and read the medium ruling as this epic's remaining workers only - it ends when the epic lands; (b) widen worker_efforts to [\"low\",\"medium\",\"high\"] with the default still low, an owner keel mr commit on .keel/config.toml and an Amended DEC-39 row before the epic merges, so medium stays askable; (c) make medium the worker default again, which reverses W9's ruling. Recommended default: (a), because W9's ruling was explicit that medium is refused and the medium ruling names this epic's work; the router passes --effort medium explicitly for each remaining spawn while main allows it (details.effort-for-remaining-workers)."
details:
  status-of-this-plan: "Written by worker e-wsandbox-plan (opus, high) on epic/E-WSANDBOX off main 39d9a5c; amended 2026-11-26 by e-wsandbox-plan2 at 956ba9d (W5, W6). Rewritten 2026-11-26 by worker e-wsandbox-plan3 at cab0968f, folding in the owner's W1 rulings (docs/work/2026-11-26-e-wsandbox-w1-findings.yaml, details.rulings) and the owner's three scope notes below. Facts come from that pair's details, this worktree's files and git history. Amended again 2026-11-26 by e-wsandbox-plan3 at 4843f8df with W9 (the owner's effort ruling; facts from .keel/config.toml, scripts/router-worker.sh, the skills and the DSH route's model listing). Amended 2026-11-28 at 5e51656f (W1, W2 - W4 and W9 merged; W5 - W8 not started) with the owner's three rulings of that day: the old W5 and W6 merged into W5 (w5-resume-reuse), the old W7 and W8 merged into W7 (w7-bounds), the ids W6 and W8 retired; and this epic's remaining workers on opus at effort medium, whose conflict with W9's policy is an open question. Two WUs remain, W5 then W7."
  rulings-source: "docs/work/2026-11-26-e-wsandbox-w1-findings.yaml, details.rulings (owner, 2026-11-26): q1 ports, q1-ports-detail, q2 ignored tests, q3 packages, q4 websites, q5 scratch, q6 commits. The owner's exact words there are the ruling; this plan records their build shape, not a wider reading."
  one-commit: |-
    The structural answer q6 forces (owner: 'All at once: one owner commit for W2, W3 and W4').
    RECOMMENDED: ONE WU BRANCH WITH THREE PARTS. Parts 2, 3 and 4 are built in that order on one branch
    (wu/E-WSANDBOX/environment), with one WU plan/result pair naming the three parts and one tip. The worker commits
    what is not rule-bearing (docs, app config, the 14-test deletion) and stages the rule-bearing launcher/settings
    edits; the owner makes the one keel mr commit for the three parts' rule-bearing files; one review covers the
    range, one result report, one keel mr confirm wu, one --no-ff merge into the epic. Trade-off: one review and one
    signature cover all three parts, so a part cannot be dropped alone at sign-off - acceptable, because the owner
    ruled all three yes.
    REJECTED: three WU branches with a joint commit. Each WU tip would need its own rule-bearing commit to be
    signable, and a joint commit made after the three merges would bind no WU's signed tip; so the one commit is
    buildable only on a single branch.
  owner-steps-gates: |-
    W1 owed live confirmations in the probe clone (its details.owner-steps), before W2 or W4 relies on them. With the
    rulings:
    - Owner step 2 (the port proof: allowLocalBinding true, then binds on 127.0.0.1:0 and 0.0.0.0:0). W2 waits on
      it: the ruling is yes, but the live proof that the key takes effect under the launcher's --settings is what W2
      ships against.
    - Owner step 1 (the hosts/socket proof): its strictAllowlist half is moot (q4 rules no strictAllowlist) and its
      socket half is moot (q1 opens ports; q2 deletes the socket need). What W4 still needs is the shape W1 could
      not verify: what an EMPTY allowedDomains does. W4's build waits on a probe with allowedDomains emptied and no
      strictAllowlist (a curl to registry.npmjs.org): if an empty list refuses every host, the five stay as the base
      and the reviewer widens each call; if it admits the reviewer, the list is emptied.
    - W3 waits on W4's empty-list answer for the registry; W3's store proof is not an owner step, W3 runs it.
  facts:
    point-1-local-ports:
      today: >-
        Ruled yes (q1, q1-ports-detail). allowLocalBinding: true goes in the launcher's --settings sandbox. No finer
        bound exists in Claude Code 2.1.288 (W1 finding b): the key makes the macOS profile allow network-bind and
        network-inbound on "*:*" and outbound to localhost:*; no key narrows the bind to 127.0.0.1 or to named ports.
        The owner accepted the cost: a worker listens on every interface and reaches every local listener, other
        sessions' filtering proxies included. Serve on any port; connect to a local service on any port.
      history:
        - "E-LOOPBIND.W1 (83f434a, owner-signed) added the key; an independent review found the exposure; the owner dropped it 2026-11-15 (wu/E-LOOPBIND/w1-local-bind never merged). The ruling reverses that for good, with the cost named."
        - "E-LOOPBIND.W2 (0d901e6): the ten loopback tests in tests/suite/notify_owner.rs got #[ignore]; 14 carry it at this tip (tests/suite/notify_owner.rs:216, 231, 246, 263, 279, 305, 325, 364, 388, 401, 435, 458, 518, 568). W2 deletes them (q2)."
        - "E-APPLIST.W9: the worktree's own settings.local.json could not set the key. Cause settled (W1 finding a): the launcher's --settings allowUnsandboxedCommands false makes the sandbox an admin mandate, and project/local values are dropped."
      incidents:
        - "Playwright reached Electron through a debugging port; the W9 epic test ran on the owner's Mac. After W2 the worker runs it."
        - "E-APPLIST.W6, W12 and W13 checks went to the owner for want of a port; after W2 they do not."
    point-2-npm-registry:
      today: >-
        Ruled yes (q3): a worker may add packages with pnpm or cargo. cargo works today (crates.io, index.crates.io,
        static.crates.io on the host base; ~/.cargo caches writable). pnpm needs registry.npmjs.org reachable: it joins
        the launcher's host base if W4 keeps one; if W4 empties the list, the auto reviewer decides the site and W3's
        e2e proves the install. The blocked path: W10's pnpm install failed unpacking xmlbuilder 15.1.1's
        .vscode/launch.json, because Claude Code's sandbox denies every .vscode under the working directory,
        hard-coded (W1 finding d, anchored at the cwd; the same path under $TMPDIR is writable). W3 moves pnpm's store
        outside the worktree to a folder the launcher may write, or proves another way.
      history:
        - "The global ~/Library/pnpm/store is not writable (probe 2026-11-24) and was rejected: a worker could change packages the owner's installs use. pnpm put a 190 MB store in the worktree (W10) and ignored npm_config_store_dir."
        - "pnpm test:main / typecheck first run pnpm's dependency check, which starts an install when node_modules is missing or differs (W10; a node_modules symlink from a sibling worktree started one that stopped for want of a TTY)."
        - "E-APPLIST W10, W12, W13 and the epic close (and W9's pnpm add) had the owner install. After W3 the worker does."
      what-still-blocks: "The store location and the .vscode deny; W3 owns both, with the store outside the worktree as the named route."
    point-3-writes-hosts-guard-mode:
      shell-writes: >-
        scripts/router-worker.sh:534-541, in the launcher's --settings. allowWrite: the shared git dir, ~/.cargo
        registry and caches; the worktree is writable and $TMPDIR by Claude Code's defaults. denyWrite as before. W1
        finding d: the hard-coded denies (a worktree's .vscode, .idea, .claude/skills, .claude/hooks, .claude/agents,
        .mcp.json, shell rc files, .git/config) are anchored at the working directory and no settings key lifts them;
        the same file under $TMPDIR is writable.
      hosts: "Five fixed at scripts/router-worker.sh:542 (htmldoc.wfomobile.com, crates.io, index.crates.io, static.crates.io, github.com). Ruled (q4): no pinned list, no strictAllowlist; the auto reviewer decides each site. A worktree's own .claude/settings.local.json cannot widen them (W1 finding e correction: the admin mandate drops project/local allowedDomains and WebFetch(domain:) entries), which DEC-37's sentence had wrong."
      file-guard: "scripts/router-file-guard.sh, a fail-closed PreToolUse hook on every tool: Edit, Write, MultiEdit, NotebookEdit only under the resolved worktree, never its .git or the two settings files, never a multi-link file; Read, Grep, Glob denied ~/.ssh and ~/.claude/channels; every other tool passes. The open git-cross-worktree question would change this file and DEC-37."
      grant-and-deny: "--allowedTools cargo build|test|check|clippy|fmt, keel preflight|verify-doc|verify-dod|notes write|lint|check; --disallowedTools DEC-46 point 10 plus scripts/router-app.sh, Read(~/.ssh/**), Read(~/.claude/channels/**), and the cr note for authors or edit tools and git add/commit for a review worker. W4 adds the scratch helper."
      mode: "worker_permission_mode = \"auto\" (.keel/config.toml:57), read from the router checkout's HEAD, only narrowed by --permission-mode. Stays auto (q5)."
      classifier-denials: "36 denials by 'the Claude Code auto mode classifier' in 34 sessions, 2026-11-08 to 2026-11-24; labels where parsed: Undermining Oversight 18, Auto-Mode Bypass 4, Unauthorized Access 2, Credential Exploration 1, Irreversible Local Destruction 1, Create Public Surface 1. Examples: a scratch repo with git init and keel init under $TMPDIR, a scratch git init, a long compound mktemp-and-loop line. The helper (W4) ends the scratch class; each denial remains final by the briefs' rule."
      open-backlog: "R21 (gh), R22 (a worker editing its worktree's settings), R40 (now closed: ran 2026-11-12), R41 (residuals; the per-call widening is the ruled cost), R42 (npm host), R48 (a worker cannot post to the inbox), R51 (git dir deny list)."
    point-4-router-watchdog:
      router: "No Bash sandbox (W1 details.router-watchdog): no sandbox key in ~/.claude/settings.json, the project's .claude/settings.json or a local file, no managed settings. Its bound is the fail-closed router guard (scripts/router-guard.jq): the 11 tools of .claude/agents/router.md (no Agent, no Edit), Bash only plain-word whitelisted shapes (git and gh pr reads, ps, the router scripts), Write only .router/briefs/<name>.md and .router/notify/owner.md, five inline skills; mode auto from user settings. The scripts it may run (the launcher, router-watch.sh with git fetch, notify-owner.py) run unsandboxed with the owner's rights."
      watchdog: "No Bash sandbox: the launcher starts it with --setting-sources local and a --settings holding only hooks (scripts/router-worker.sh, watchdog mode). Tools SendMessage and CronCreate only; the guard with watchdog_to admits only CronCreate of the */5 tick and a SendMessage to its router. Its facts hook runs the launcher unsandboxed and checks each worktree's .git link before any git there (linked_ok)."
      scope: "Owner, 2026-11-26: W1 covered workers only; the router and the watchdog get their own WUs, W7 and W8. Owner, 2026-11-28: those two are one WU, W7."
