  - id: R47
    title: "The inbox reader's four lows, and the idle wakes nobody ruled on"
    status: "open: L3 wanted soon"
    problem: >-
      What the inbox channel (DEC-58, `scripts/router-inbox.sh`) left open when E-RGUARD closed on 2026-11-15. R47
      holds the four lows of E-RGUARD.W3's independent review, five script observations from the epic's code review,
      and one judgment the owner has not made; L3 is wanted soon. The ten sub-items are in `items`. E-APPLIST.W3 added
      three lows of `scripts/notify-owner.py`'s header parse and message (W3-1 to W3-3) and found S3 again.
    source: >-
      E-RGUARD.W3 independent review (L1 - L4 and the judgment it raised); the E-RGUARD epic code review round 1,
      outside its code scope (S1 - S5); E-RGUARD close. W3-1 to W3-3: E-APPLIST.W3's independent reviews (round 3 of
      its skill and sender fixes; rule commit H, 7f91553).
    taken-by: "unowned"
    items:
      - >-
        L1 (a huge header line defeats the read bound): The reader takes the body with `tail -n +6` before it caps
        the bytes (`scripts/router-inbox.sh` `show`), so a file whose `when:` or `---` line is huge makes `tail`
        read the whole file. DEC-58 says only a header's first 512 bytes and a body's first 4,002 are read. Fix
        direction: cap the bytes before finding line 6.
      - >-
        L2 (header lines 4 and 5 are never checked): `message_ok` checks the `id:`, `from:` and kind lines only, so a
        file `post` did not write is delivered with those two lines dropped instead of being judged junk. Fix
        direction: check them as `post` writes them.
      - >-
        L3 (the cleaner passes hidden characters; wanted soon): `clean` turns C0, DEL, C1, U+200B - 200F, U+FEFF,
        U+2028 - 202E and U+2066 - 2069 into `?`, but passes U+2060 - 2064, U+00AD, U+180E, U+FFF9 - FFFB and the tag
        block U+E0000 - E007F. A post can carry text the router reads and a person does not see. Fix direction:
        print those as `?` too, with a test per range.
      - >-
        L4 (one wake step orders the inbox unconditionally): `worker-ops.md` "Wake" step 3 says to re-arm
        `<inbox> watch 6600` on DSH without "where the project ships one", which every other mention carries. Fix
        direction: add the clause, both skill trees.
      - >-
        S1 (the sender reads a response with no size cap): `scripts/notify-owner.py` `request` reads the whole
        response body, and the error body too, with no byte cap. Fix direction: read at most a bound, as the inbox
        reader does.
      - >-
        S2 (a dry run fails on a read-only body): the check that the body can be cleared runs before the dry-run
        branch, so `--dry-run` refuses a body it would never clear. Fix direction: run that check for `--send` only.
      - >-
        S3 (the length cap counts the wrong unit): `MAX_TEXT` counts code points; Telegram counts UTF-16 code units,
        so a message with characters outside the Basic Multilingual Plane (emoji) can pass the check and still be
        refused by the API. Fix direction: count UTF-16 units.
      - >-
        S4 (GNU `expr` refuses keyword ids): `scripts/router-inbox.sh` `id_ok` and `name_ok` run `expr "$1" : ...`;
        under GNU `expr` an id such as `length` or `match` is read as an operator and refused, while the guard
        admits it. BSD `expr` (macOS) is unaffected. Fix direction: match with `case` or put a fixed prefix before
        the operand.
      - >-
        S5 (the guard's id pattern leans on other rules): the guard's `consume` pattern has no `..` clause and no
        length bound of its own. It refuses `a..b` only through its general rule that no `scripts/` command holds
        `..`, and neither the guard nor the script bounds an id's length; the shared-probe test ties the two today.
        Fix direction: state both in the pattern.
      - >-
        Owner judgment (the watcher's idle wakes): while armed, the watcher's 6,600 s bound wakes the router about 13
        times a day with no news. The owner approved the channel on 2026-11-14; no ruling accepts those idle wakes
        beyond that approval. The owner rules: accept them, or ask for a longer bound or a wake on a worker's turn
        end (dsh D2 item 3).
      - >-
        W3-1 (a short headline read as a mistyped header): the sender refuses a first line whose key is one slip from
        `question` when the word after the colon fits the id grammar, so `Questions: 2`, `Question: yes` and
        `Question: none` are refused as mistyped headers (nothing sent; the refusal quotes the text, so it fails
        safe). Fix direction, one of the review's two: (a) a sentence in the keel-router skill's commands.md, both
        copies: "`Questions: 2` (one lowercase word) is read as a mistyped header: write `2 questions`"; or (b) in
        `mistyped_header`, refuse the plural `questions` only when the line ends in an id holding a `-` or a digit.
      - >-
        W3-2 (a format character hides a header): a format character such as U+202E or U+200B before `wu:` makes the
        line pass as body text, since the header parse reads the raw line and only the alert lines are blanked. Fix
        direction: blank format characters in a leading line before it is judged a header, with a test per character
        range (beside L3).
      - >-
        W3-3 (the raw bound's wording): the refusal of a body past 65,536 characters says "at most 65536 are read",
        but the body was read and is refused before it is parsed. Fix direction: say "accepted" (or "parsed").
        Found with it: S3 again (Telegram's 4,096 may count UTF-16 code units while the sender counts code points);
        fix direction unchanged, `len(text.encode('utf-16-le')) // 2` on the message after its link.
  - id: R48
    title: "A Claude Code worker cannot post"
    status: "open: owner change"
