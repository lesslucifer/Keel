    - docs/work/2026-11-20-e-applist-w1-plan.yaml and -w1-result.yaml (the contract as built)
    - docs/local-app.html ("Two sources": Refetch, Defaults; K15)
    - scripts/router-worker.sh (facts, the deny list), scripts/router-app.sh (verbs, keys, exits, caps)
    - tests/suite/router.rs (stub_claude, launcher fixture, worker_row, the facts tests, WORKER_DENIES)
