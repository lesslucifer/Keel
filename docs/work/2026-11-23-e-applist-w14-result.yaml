follow-ups:
  - "The owner reinstalls keel from this tip (cargo install --path .) before this WU's review: a cr or mr written by the new keel is red under the old one (it hashes git's short form); the old keel's notes are accepted by the new one. Taken by: the owner, at E-APPLIST.W14's sign-off (router keel-1c stages it)."
  - "A legacy hash is rebuilt against today's store: an object that became ambiguous at N characters since the note was written makes git print it longer, and that note turns red (re-record it). Accepted limit, no row: no binding a keel writes from now on depends on it."
details:
  design:
    stable: "--full-index, not --abbrev=40: git's documented flag for full names in index lines, the hash algorithm's own length (64 in a SHA-256 repository, where --abbrev=40 would cut it)"
    legacy-bound: "7 is git's floor for the automatic length; each character covers a store four times larger; 12 covers 2^24 (16.7M) objects"
    cost: "a binding a current keel wrote costs one git diff; a legacy or red one up to seven"
  owner-reinstall: "cargo install --path . from the tip, before the review runs or anything is signed or merged after it"
